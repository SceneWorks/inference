[package]
name = "candle-audio-yue"
version = "0.0.0"
edition = "2021"
description = "YuE lyrics2song provider for the SceneWorks Candle audio lane (epic sc-19373) — a segment-by-segment song engine: mm tokenizer/prompt builder → 7B Llama stage-1 (codebook-0 vocal/instrumental tokens) → 1B Llama stage-2 (8-codebook upsample) → xcodec decode → Vocos 44.1 kHz upsampler → low-band splice, returning a mix plus vocal and instrumental stems (Apache-2.0 weights)."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"
keywords = ["candle", "audio", "music", "lyrics", "llama"]
categories = ["science"]

[dependencies]
# Shared candle audio commons (device seam, WAV encode, DSP, `AudioError → gen_core::Error` bridge).
# Re-exports `gen_core` and `candle_core`, so this crate resolves the SAME candle build + gen-core
# rev as the catalog it registers into.
candle-audio = { path = "../candle-audio" }
# The two YuE language models are plain `LlamaForCausalLM` checkpoints, so the stage engines drive
# candle-llm's primitives (Llama decoder, GQA, KV caches, sampler, q8/q4 tiers produced by
# `prepare_snapshot`) — "gen consumes llm" (epic sc-19373 R4). The custom loops (CFG batch-of-2,
# allow-range sampling, teacher-forced stage 2) live in this crate.
candle-llm = { workspace = true }
# candle-nn at the workspace's pinned candle revision (the xcodec / Vocos convnets).
candle-nn = { workspace = true }

[dev-dependencies]
# The backend-neutral generator conformance suite (progress contract, typed cancellation, seed
# determinism, component load gate) the end-to-end seam test runs against the engine.
sceneworks-gen-core-testkit = { workspace = true }
# RAII fixture roots for the load-gate tests.
tempfile = { workspace = true }
# Reads the committed parity fixtures (stage 1: scripts/reference/yue_stage1_reference.py; stage 2:
# tests/fixtures) and writes synthetic snapshot configs.
serde_json = { workspace = true }

[features]
default = []
# Apple Metal GPU backend — forwarded to the audio commons and candle-llm so both LMs and the
# convnets run on the selected device. Not in `default` (see docs/architecture/audio-backend-strategy.md).
metal = ["candle-audio/metal", "candle-llm/metal", "candle-nn/metal"]
# NVIDIA CUDA backend — forwarded likewise. Not in `default`.
cuda = ["candle-audio/cuda", "candle-llm/cuda", "candle-nn/cuda"]
