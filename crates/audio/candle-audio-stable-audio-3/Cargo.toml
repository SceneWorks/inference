[package]
name = "candle-audio-stable-audio-3"
version = "0.0.0"
edition = "2021"
description = "Unregistered Stable Audio 3 Candle provider primitives and snapshot loading."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"
keywords = ["candle", "audio", "diffusion", "stable-audio"]
categories = ["science"]

[dependencies]
# Shared audio DSP/mel/ops/WAV, validation harness, device policy, gen-core identity, and the
# workspace's exact candle-core build. In particular, resampling is consumed from
# `candle_audio::dsp::resample`; this crate does not carry a second implementation.
candle-audio = { path = "../candle-audio" }
candle-nn = { workspace = true }
# The audio-lane snapshot-preparer contracts. This crate remains unregistered until the later
# catalog story, but owns a composable prepare probe now.
core-llm = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[features]
default = []
# Keep candle-core (through candle-audio) and candle-nn on the same backend.
metal = ["candle-audio/metal", "candle-nn/metal"]
cuda = ["candle-audio/cuda", "candle-nn/cuda"]
