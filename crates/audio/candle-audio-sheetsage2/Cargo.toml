[package]
name = "candle-audio-sheetsage2"
version = "0.0.0"
edition = "2021"
description = "Native Candle port of SheetSage2 + MERT-v2-FullSong recording-to-score transcription (epic sc-22988, story sc-22996): MERT2 encoder, SheetSage2 grammar-constrained decoder, ABC/MIDI/LAB exports, the review artifact, and the YuE2 zero-shot cover path. NONCOMMERCIAL: the code is derived from the SheetSage2 / MERT2 remote Python, which carries no code licence inside CC BY-NC 4.0 model repositories, so this crate is treated as CC BY-NC 4.0 (sc-22989 license::CODE_TERMS) and is never relicensed."
# NOT Apache-2.0. The port derives from the remote Python published inside m-a-p/SheetSage2 and
# m-a-p/MERT-v2-FullSong, which carries no code licence; both repositories declare cc-by-nc-4.0, so
# code derived from it is treated as CC BY-NC 4.0 (the sc-22989 disposition recorded in
# `candle_audio_yue2::license::CODE_TERMS`). It is kept out of the Apache-2.0 `candle-audio-yue2`
# crate for that reason. `deny.toml` carries the one scoped exception that admits this crate.
license = "CC-BY-NC-4.0"
publish = false
repository = "https://github.com/SceneWorks/inference"
keywords = ["candle", "audio", "music", "transcription", "yue2"]
categories = ["science"]

[dependencies]
# Shared candle audio commons: re-exports `candle_core` and `gen_core`, so this crate resolves the
# same candle build as every other audio provider.
candle-audio = { path = "../candle-audio" }
# The pinned cover closure (inventory + offline snapshot verification, sc-22989), the licence gate,
# and the YuE2 request/plan protocol and cover-request construction (sc-22990 / this story). A
# one-way dependency: the Apache-2.0 YuE2 crate never depends on this one.
candle-audio-yue2 = { path = "../candle-audio-yue2" }
# LayerNorm / softmax / conv helpers at the workspace's pinned candle revision.
candle-nn = { workspace = true }
# Source identity and artifact digests.
sha2 = { workspace = true }
# config.json parsing and the review manifest.
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# RAII roots for persistence / replay / synthetic snapshot tests.
tempfile = { workspace = true }

[features]
default = []
# Apple Metal / NVIDIA CUDA backends, forwarded to the audio commons. Not in `default`; the lane
# this story ran on is CPU-only.
metal = ["candle-audio/metal", "candle-nn/metal", "candle-audio-yue2/metal"]
cuda = ["candle-audio/cuda", "candle-nn/cuda", "candle-audio-yue2/cuda"]
