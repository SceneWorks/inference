[package]
name = "runtime-cuda"
version = "0.0.0"
edition = "2021"
description = "Supported SceneWorks Candle CUDA media and LLM runtime composition."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"

[dependencies]
runtime-catalog = { workspace = true }
candle-gen-catalog = { workspace = true, features = ["cuda"], optional = true }
candle-audio-catalog = { workspace = true, features = ["cuda"], optional = true }
candle-llm = { workspace = true, features = ["cuda"] }

[features]
default = ["media", "audio", "media-flash-attn"]
# SceneWorks consumes the complete bundle. LLM-only products can disable default features while
# retaining the explicitly composed CUDA LLM catalog.
media = ["dep:candle-gen-catalog"]
# The Candle audio lane (sc-12835, docs/architecture/audio-backend-strategy.md). A separate
# additive feature — NOT folded into `media` — so an LLM-only product (ChatWorks) can compose
# text + TTS via `--no-default-features --features audio` without the image/video provider graph.
audio = ["dep:candle-audio-catalog"]
flash-attn = ["candle-llm/flash-attn"]
# FlashAttention-2 for the media lane (sc-26691), ON BY DEFAULT: it is the shipped attention path
# for long-sequence MiniMax-H3 renders (without it they run the materialized, query-chunked
# fallback, ~10x slower). Separate from the LLM `flash-attn` above because a candle-llm flash build
# refuses the CUDA-graph runner (`flash_attn_stream`), which the media lane must not impose. The
# kernels are the vendored multi-arch fatbin (vendor/candle-flash-attn), and candle-gen dispatches
# to them only on a device that fatbin covers.
media-flash-attn = ["media", "candle-gen-catalog?/flash-attn"]

[dev-dependencies]
# The registry-wide memory-contract facts walk (sc-22661): the bundle's own acceptance test for
# epic SC-22657 E1/E2 over every generator this platform registers.
gen-core-testkit = { package = "sceneworks-gen-core-testkit", path = "../../contracts/gen-core-testkit" }
