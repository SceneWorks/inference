[package]
name = "runtime-ios"
version = "0.0.0"
edition = "2021"
description = "Supported SceneWorks MLX LLM runtime composition for iOS (iPhone/iPad)."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"

[dependencies]
runtime-catalog = { workspace = true }
mlx-llm = { workspace = true }

# The iOS image lane (E5). NOT `mlx-gen-catalog`: that composes 32 provider crates including the
# video families (wan, ltx, mochi, svd), none validated on iOS and none shaped for a device with a
# hard per-app memory cap — depending on it to obtain one small generator would compile a graph
# the platform cannot run. `mlx-gen-ios-catalog` is the narrow, reviewable subset instead.
mlx-gen-ios-catalog = { path = "../../media/mlx-gen/mlx-gen-ios-catalog", optional = true }

[features]
# Off by default: an LLM-only product (the text lane ships first) should not compile the image
# graph at all. Enable with `--features media`.
media = ["dep:mlx-gen-ios-catalog"]

# NOTE: no `audio` feature, and that is deliberate rather than an omission.
#
# The Candle `audio` lane is likewise out of scope until an audio story exists for iOS; the
# lane's cross-backend seam (sc-12835) is a deliberate architectural exception and should not be
# extended to a new platform incidentally.
#
# `mlx-gen-sensenova` (the unified AR-LLM-plus-image model) is E6 and registers in the iOS
# catalog beside SANA when it lands.
