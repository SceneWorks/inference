[package]
name = "runtime-ios"
version = "0.0.0"
edition = "2021"
description = "Supported SceneWorks MLX image and LLM runtime composition for iOS (iPhone/iPad)."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"

[dependencies]
runtime-catalog = { workspace = true }
mlx-llm = { workspace = true }
# For `bound_mlx_to_platform_limits`. This bundle is the only place that knows BOTH that the backend
# is MLX and that the platform caps a process well below device RAM, so it is the only place that can
# reconcile the two — and doing so needs MLX's memory API directly, not through an engine crate.
mlx-rs = { workspace = true }

# The iOS image lane. NOT `mlx-gen-catalog`: that composes every provider crate including the video
# families (wan, ltx, mochi, svd), none validated on iOS and none shaped for a device with a hard
# per-app memory cap — depending on it to obtain one small generator would compile a graph the
# platform cannot run. `mlx-gen-ios-catalog` is the narrow, reviewable subset instead.
mlx-gen-ios-catalog = { workspace = true, optional = true }

[dev-dependencies]
# Test-only, so an LLM-only (`--no-default-features`) build still compiles no image graph: lets the
# non-media cap literal be asserted equal to the catalog's single cap constant.
mlx-gen-ios-catalog = { workspace = true }

[features]
# The iOS product is the image lane, so it is on by default, as `media` is on runtime-macos. An
# LLM-only product disables default features and does not compile the image graph at all.
default = ["media"]
media = ["dep:mlx-gen-ios-catalog"]

# NOTE: no `audio` feature, and that is deliberate rather than an omission: the Candle audio lane's
# cross-backend seam (sc-12835) is a sanctioned exception for the platforms that ship it and is not
# extended to a new platform incidentally.
