[package]
name = "candle-gen-mochi"
version = "0.0.0"
edition = "2021"
description = "Mochi 1 (genmo/mochi-1-preview) text-to-video provider crate for candle-gen — the Windows/CUDA sibling of mlx-gen-mochi."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/candle-gen"
keywords = ["candle", "cuda", "video", "mochi", "inference"]
categories = ["science"]
autotests = false

[dependencies]
sceneworks-gen-core-family = { workspace = true }
candle-gen = { path = "../candle-gen" }
# The vendored fast-tokenizer JSON (google t5-v1.1-xxl) is loaded from memory.
tokenizers = { workspace = true }
# Read the T5 `model.safetensors.index.json` weight_map (the index-filtered shard load) + `vae/config.json`.
serde_json = { workspace = true }
# Deterministic CPU-seeded initial noise (sc-3673 parity; the same StdRng draw the LTX/wan crates use).
rand = { workspace = true }
# Frame → RGB `Image` conversion at the pipeline tail.
image = { workspace = true }

[features]
model-inference-proof = ["candle-gen/model-inference-proof"]
default = []
# Forward backend selection to Candle's shared media crate.
metal = ["candle-gen/metal"]
cuda = ["candle-gen/cuda"]

[dev-dependencies]
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
# Load the A1 real-weight goldens (gitignored under ../../mlx-gen/tools/golden) in the CUDA parity tier.
candle-gen = { path = "../candle-gen", features = ["testkit"] }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
