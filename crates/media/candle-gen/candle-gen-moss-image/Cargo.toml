[package]
name = "candle-gen-moss-image"
version = "0.0.0"
edition = "2021"
description = "Native MOSS-Image Base/SFT and published optional DMD execution."
license = "Apache-2.0"
autotests = false

[dependencies]
# Opt-in cross-crate development fixtures; no runtime bundle enables this feature.
sceneworks-gen-core-testkit = { workspace = true, optional = true }
sceneworks-gen-core-moss-image = { workspace = true }
sceneworks-gen-core-tokenizer = { workspace = true }
sceneworks-gen-core-train = { workspace = true }
candle-gen = { path = "../candle-gen" }
candle-gen-flux2 = { path = "../candle-gen-flux2" }
candle-llm = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Match candle-core's Tensor/View trait, not gen-core's neutral 0.4 header reader.
safetensors = "0.7"
rand = { workspace = true }
image = { workspace = true }

[features]
model-inference-proof = ["candle-gen/model-inference-proof", "sceneworks-gen-core-tokenizer/model-inference-proof", "sceneworks-gen-core-train/model-inference-proof"]
default = []
test-support = ["dep:sceneworks-gen-core-testkit", "candle-gen-flux2/test-support", "candle-llm/test-support"]
cuda = ["candle-gen/cuda", "candle-gen-flux2/cuda", "candle-llm/cuda"]
metal = ["candle-gen/metal", "candle-gen-flux2/metal", "candle-llm/metal"]

[dev-dependencies]
# Bounded integration proofs use the shared sampler/output helpers independently of sibling crates.
candle-gen = { path = "../candle-gen", features = ["testkit"] }
tempfile = { workspace = true }

[[test]]
name = "integration"
path = "tests/main.rs"
