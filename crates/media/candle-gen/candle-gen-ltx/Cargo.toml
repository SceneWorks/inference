[package]
name = "candle-gen-ltx"
version = "0.0.0"
edition = "2021"
description = "LTX-2.3 (distilled 22B) text-to-video provider crate for candle-gen — the Windows/CUDA sibling of mlx-gen-ltx."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/candle-gen"
keywords = ["candle", "cuda", "video", "ltx", "inference"]
categories = ["science"]
autotests = false

[dependencies]
candle-gen = { path = "../candle-gen" }
# sc-18770: the candle twin of `mlx-gen-ltx → mlx-llm`. LTX-2.5's text encoder is a Gemma 4 unified
# decoder, which lives in `candle-llm` alongside every other decoder architecture rather than being
# duplicated inside a media crate. Only `gemma4_te.rs` uses it; LTX-2.3's Gemma 3 path (`gemma.rs`)
# is untouched. Both crates take `candle-core`/`candle-nn` from `[workspace.dependencies]` at one
# pinned git rev, so the graph resolves a single candle and both halves share one `Tensor` type.
candle-llm = { path = "../../../llm/candle-llm" }
# LTX-2.3 has NO candle-transformers reference: the AVTransformer3DModel video DiT, the
# CausalVideoAutoencoder temporal VAE, the Gemma-3-12B text encoder + per-token-RMS aggregation +
# 8-layer learnable-register connector, and the rectified-flow distilled scheduler are all written
# here on candle-core/candle-nn (candle ships no conv3d — see `conv3d`). First slice is txt2video,
# video-only (the audio stack, 2-stage latent upsampler, I2V, prompt-enhance, IC-LoRA, and fp8/quant
# paths are deferred to follow-up Shortcut stories).
tokenizers = { workspace = true }
# Deterministic CPU-seeded initial noise (sc-3673 parity).
rand = { workspace = true }
rand_distr = { workspace = true }
# Parse the packed tier's `quantize_config.json` group_size (sc-9545 tier ingestion).
serde_json = { workspace = true }
# I2V conditioning-image CRF re-compression (sc-18759 `image_crf`) — JPEG encode/decode as the
# lossy re-compression step (see `image_crf` module docs for the H.264-parity caveat).
image = { workspace = true }

[features]
default = []
# The LLM crate's backend features must move in lock-step with candle-gen's, or the Gemma 4 decoder
# would be built for a different device than the rest of the pipeline.
metal = ["candle-gen/metal", "candle-llm/metal"]
cuda = ["candle-gen/cuda", "candle-llm/cuda"]

[dev-dependencies]
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
sceneworks-gen-core-testkit = { workspace = true }
# Shared test-support helpers (sc-9055 / F-069: candle_gen::testkit gpu_peak sampler).
candle-gen = { path = "../candle-gen", features = ["testkit"] }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
