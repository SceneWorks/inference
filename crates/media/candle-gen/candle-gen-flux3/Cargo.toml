[package]
name = "candle-gen-flux3"
version = "0.0.0"
edition = "2021"
description = "FLUX 3 Image Klein (distilled flow-map DiT, Qwen3-VL conditioned) provider crate for candle-gen — the Windows/Linux CUDA sibling of mlx-gen-flux3."
# The Rust port is Apache-2.0 like every sibling provider crate; the weights it loads are under the
# FLUX Kommunity License (see UPSTREAM.md and the catalog's licence rows).
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"
keywords = ["candle", "cuda", "diffusion", "flux", "inference"]
categories = ["science"]
autotests = false

[dependencies]
# Core crate — re-exports gen_core + candle, so this provider links exactly one gen-core / candle
# build (single resolution; see scripts/check-gen-core-skew.sh).
candle-gen = { path = "../candle-gen" }
# The Qwen3-VL-4B language tower is the shared generic decoder (`candle_llm::CausalLm`, which reads
# the `qwen3_vl` VLM-nested layout and returns HF-ordered hidden states at explicit positions) —
# the same reuse the MLX twin makes of `mlx_llm::CausalLm`. The `candle-gen-* -> candle-llm`
# direction is the documented one (see `candle-gen-iris`); the pin lives in the root workspace so
# cargo unifies ONE candle-llm across the worker graph.
candle-llm = { workspace = true }
# FLUX3 publisher-format (FP8R / static NVFP4) kernels and their bit-level CPU mirrors (sc-26241);
# the same workspace pin candle-gen resolves, so ONE kernel crate links.
candle-quant-kernels = { workspace = true }
# Deterministic CPU-seeded initial noise (the shared launch-portable `candle_gen::seed` draw) — NOT
# candle's device RNG.
rand = { workspace = true }
# Native training snapshots/adapters use Candle's tensor View version, with strict metadata/digests.
safetensors = "0.7"
serde_json = { workspace = true }
sha2 = { workspace = true }
sceneworks-gen-core-flux3 = { workspace = true }
sceneworks-gen-core-tokenizer = { workspace = true }
sceneworks-gen-core-train = { workspace = true }

[features]
# Pass the backend selection through to the core crate so a downstream `--features metal`/`cuda` on
# this provider crate selects the matching candle backend everywhere.
default = []
metal = ["candle-gen/metal", "candle-llm/metal"]
cuda = ["candle-gen/cuda", "candle-llm/cuda", "candle-quant-kernels/cuda"]

[dev-dependencies]
# gen-core conformance suite: drives this provider through the public Generator contract
# (cancel / progress / seed-determinism / capability honesty) on the committed miniature package.
sceneworks-gen-core-testkit = { workspace = true }
# Shared test-support helpers (`candle_gen::testkit`): the real-weight render's `VramProbe`. The
# `testkit` feature stays scoped to this crate's test builds.
candle-gen = { path = "../candle-gen", features = ["testkit"] }
# PNG dump of the real-weight render for the evidence artifact.
image = { workspace = true }
tempfile = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
