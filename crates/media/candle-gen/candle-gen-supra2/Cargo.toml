[package]
name = "candle-gen-supra2"
version = "0.0.0"
edition = "2021"
description = "Native Supra2-IMG (SupraDiT + Flan-T5-Base + SD VAE ft-MSE) text-to-image for Candle (CUDA/CPU)."
license = "Apache-2.0"
autotests = false

[dependencies]
# Core crate — re-exports gen_core + candle, so this provider links exactly one gen-core / candle build.
candle-gen = { path = "../candle-gen" }
# The ported SD/SDXL AutoencoderKL decoder (sd-vae-ft-mse shares its block structure; scale 0.18215).
candle-gen-sdxl = { path = "../candle-gen-sdxl" }
# The T5 v1.1 encoder (Flan-T5-Base: 12 blocks / 12 heads, gated-GELU).
candle-transformers = { workspace = true }
# Flan-T5 `config.json` → candle's T5 `Config`.
serde_json = { workspace = true }
sceneworks-gen-core-checkpoint = { workspace = true }

[features]
default = []
cuda = ["candle-gen/cuda", "candle-gen-sdxl/cuda", "candle-transformers/cuda"]
metal = ["candle-gen/metal", "candle-gen-sdxl/metal", "candle-transformers/metal"]

[dev-dependencies]
image = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# One integration-test binary per crate (sc-21383): `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py.
[[test]]
name = "integration"
path = "tests/main.rs"
