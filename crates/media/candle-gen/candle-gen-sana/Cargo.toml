[package]
name = "candle-gen-sana"
version = "0.0.0"
edition = "2021"
description = "SANA (NVlabs) provider crate for candle-gen — gating spike sc-11777: the DC-AE f32 deep-compression image decoder + the EfficientViT GLU ReLU-linear-attention block (the shared hard primitive the SANA Linear-DiT trunk reuses). Windows/CUDA + Linux sibling of mlx-gen-sana (mlx-gen #612)."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/candle-gen"
keywords = ["candle", "cuda", "diffusion", "sana", "autoencoder"]
categories = ["science"]
autotests = false

[dependencies]
# The shared candle backend + commons (device/dtype seam, `Weights`, `CandleError → gen_core::Error`
# bridge). Re-exports `candle_core` / `candle_nn` / `gen_core`, so the SANA modules resolve the SAME
# candle build + gen-core rev the provider crates they wire into resolve.
candle-gen = { path = "../candle-gen" }
# SANA text conditioning REUSES PiD's native gemma-2-2b-it CHI caption encoder (`CaptionEncoder`,
# `Gemma2`) — SANA and PiD share the exact same text-conditioning lineage (sc-11779, mirrors
# mlx-gen #614). Only the CHI prompt text differs; the Gemma-2 forward + token-selection policy live
# once in candle-gen-pid and are wired here via `CaptionEncoder::with_chi_prompt`. No encoder body is
# copied.
candle-gen-pid = { path = "../candle-gen-pid" }
# Launch-portable seeded latent noise draw (the same CPU `StdRng` the shared `candle_gen::seed`
# helpers use) — the pipeline seeds the DC-AE latent here.
rand = { workspace = true }
sha2 = { workspace = true }
safetensors = { workspace = true }

[dev-dependencies]
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
# Shared test-support helpers (PPM IO / cosine / GPU peak-VRAM probe) behind candle-gen's `testkit`
# feature (mirrors candle-gen-pid / candle-gen-krea test IO). The txt2img examples take an explicit
# pre-downloaded snapshot dir (--snapshot / SANA_SNAPSHOT); inference never self-fetches (epic 13657).
candle-gen = { path = "../candle-gen", features = ["testkit"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Shared memory-contract conformance assertions (epic SC-22657): the architecture-facts honesty
# rules live once in gen-core-testkit, so this crate's published axes are checked by the same gate
# every other adopting provider runs.
sceneworks-gen-core-testkit = { workspace = true }
# sc-16959 preview provenance: hash each snapshot's `vae/` file and walk the two DC-AE containers
# tensor by tensor. Base and Sprint reuse two DIFFERENT epic-16624 fits, and the two autoencoders are
# the same architecture at exactly the same byte size — so the reuse is grounded in tensor bytes
# (repo / revision / SHA-256), never in a size or a channel count. Test-only; nothing in the engine
# hashes or re-parses weights.

[features]
default = []
# Apple Metal GPU backend (Mac) — forwarded to the candle backend. Not in `default`.
metal = ["candle-gen/metal"]
# NVIDIA CUDA backend (Windows/Linux target) — forwarded to the candle backend. Not in `default`.
cuda = ["candle-gen/cuda"]

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
