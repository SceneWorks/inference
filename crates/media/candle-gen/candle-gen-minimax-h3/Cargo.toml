[package]
name = "candle-gen-minimax-h3"
version = "0.0.0"
edition = "2021"
description = "MiniMax-H3 (Hailuo 3.0) joint audio+video provider crate for candle-gen — the Windows/CUDA sibling of mlx-gen-minimax-h3: Qwen3-VL-32B context extraction, the 33 B joint audio+video DiT, and the two VAE paths."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/candle-gen"
keywords = ["candle", "cuda", "video", "minimax", "inference"]
categories = ["science"]

[dependencies]
candle-gen = { path = "../candle-gen" }
# The Qwen3-VL vision tower is genuinely shared, not forked: H3's `vision_config` is identical to
# boogu's in every field but `out_hidden_size` (5120 vs 4096), so the parity-critical tower is
# consumed rather than duplicated — the same call `candle-gen-krea` and `candle-gen-mage` already
# make. `boogu::loader::Weights` comes with it: `VisionTower::load` takes that type, and its
# header-only mmap is what keeps the 351 `model.visual.*` tensors from dragging in the rest of
# shard 14 (layers 50-63 and `lm_head`, ~15 GB no render ever executes).
candle-gen-boogu = { path = "../candle-gen-boogu" }
# `RgbImage` + `Lanczos3` for the `fl2va` keyframe fit, and the RGB8 round-trip the video VAE's
# pixel normalization runs on. The reference resizes with PIL's Lanczos; this is the same a=3
# windowed sinc, and the parity boundary is drawn AFTER the resize (see `keyframe`).
image = { workspace = true }
# The condition tokenizer loads `tokenizer.json` DIRECTLY rather than through
# `candle_gen::gen_core::tokenizer::TextTokenizer`, because H3 needs `add_special_tokens` and that
# wrapper exposes no way to register added tokens. MiniMax's seven extra specials (`<d>`, `</d>`,
# `<|cutoff|>`, the lyrics/caption pairs) exist ONLY in `tokenizer_config.json`; without registering
# them `<d>` BPE-splits to `[90707, 29]` instead of the single id 151669 that `transformers`
# produces. See `text_encoder::tokenizer`.
tokenizers = { workspace = true }
# The seeded initial-latent draw. `candle_gen::seed::seeded_normal_vec` takes an `StdRng`, and the
# draw is done on the CPU stream on purpose (sc-3673): the sample sequence stays device- and
# launch-independent, so a q4 render and a bf16 one start from the same noise.
rand = { workspace = true }
# MiniMax-H3 has NO candle-transformers reference: the 36-layer transformer video-VAE decoder, its
# 3-D partial rotary, the DAC-lineage BigVGAN audio decoder and the Kaiser-sinc alias-free
# resamplers are all written here on candle-core/candle-nn.
# Parses `vae/config.json` and the audio VAE's `config.json` + `config.yaml` + `metadata.json`
# source triple (the three documents the Apache-2.0 reference's `from_pretrained` reads).
serde_json = { workspace = true }

[features]
default = []
metal = ["candle-gen/metal"]
cuda = ["candle-gen/cuda"]

[dev-dependencies]
# RAII fixture roots for the real-weight helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test.
tempfile = { workspace = true }
# Shared test-support helpers (`candle_gen::testkit`).
candle-gen = { path = "../candle-gen", features = ["testkit"] }
# The shared weights-free memory-contract conformance checks (sc-18659). This is the same
# `check_memory_strategy_contract` the registry path calls, so this crate's contract is held to the
# catalog's standard even though it has no generator to register against yet.
sceneworks-gen-core-testkit = { workspace = true }
