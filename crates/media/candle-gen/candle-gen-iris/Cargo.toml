[package]
name = "candle-gen-iris"
version = "0.0.0"
edition = "2021"
description = "Iris-3B (pixel-space DiT, Qwen3-VL conditioned) provider crate for candle-gen — the Windows/Linux CUDA sibling of mlx-gen-iris."
# Iris-3B code and weights are Apache-2.0, as is the Qwen3-VL-4B-Instruct text encoder.
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/candle-gen"
keywords = ["candle", "cuda", "diffusion", "iris", "inference"]
categories = ["science"]
autotests = false

[dependencies]
# Core crate — re-exports gen_core + candle, so this provider links exactly one gen-core / candle
# build (single resolution; see scripts/check-gen-core-skew.sh).
candle-gen = { path = "../candle-gen" }
# The Qwen3-VL-4B language tower is the shared generic decoder (`candle_llm::CausalLm`, which already
# reads the `qwen3_vl` VLM-nested layout and returns HF-ordered hidden states) — the same reuse the
# MLX twin makes of `mlx_llm::CausalLm`. The `candle-gen-* -> candle-llm` direction is the
# documented one (see `candle-gen-ltx`); the pin lives in the root workspace so cargo unifies ONE
# candle-llm across the worker graph.
candle-llm = { workspace = true }
# Deterministic CPU-seeded initial noise (sc-3673 parity) — NOT candle's device RNG.
rand = { workspace = true }
# The backbone checkpoint's safetensors header (its key list) is read so a leftover key is named;
# also the training checkpoints' state.json and the adapter metadata lists (sc-25686).
serde_json = { workspace = true }
# Training (sc-25686): the artifacts and checkpoint members carry safetensors metadata, which
# candle-core's own `save` cannot write — candle's own `safetensors` version (0.7) so the `View`
# impl applies.
safetensors = "0.7"
# Header-only image validation in the training dataset pass (decode lives in gen_core::iris::train).
image = { workspace = true }

[features]
# Pass the backend selection through to the core crate so a downstream `--features metal`/`cuda` on
# this provider crate selects the matching candle backend everywhere.
default = []
metal = ["candle-gen/metal", "candle-llm/metal"]
cuda = ["candle-gen/cuda", "candle-llm/cuda"]

[dev-dependencies]
# gen-core conformance suite: drives this provider through the public Generator contract
# (cancel / progress / seed-determinism / capability honesty) on the committed tiny snapshot.
sceneworks-gen-core-testkit = { workspace = true }
# Shared test-support helpers (`candle_gen::testkit`): the real-weight render's `VramProbe`. The
# `testkit` feature stays scoped to this crate's test builds.
candle-gen = { path = "../candle-gen", features = ["testkit"] }
tempfile = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
