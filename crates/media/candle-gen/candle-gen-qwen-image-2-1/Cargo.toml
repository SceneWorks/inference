[package]
name = "candle-gen-qwen-image-2-1"
version = "0.0.0"
edition = "2021"
description = "Qwen-Image 2.1 (unified T2I + RGBA, Qwen3-VL conditioned single-stream DiT) provider crate for candle-gen — the Windows/CUDA sibling of mlx-gen-qwen-image-2-1."
# The Rust port is Apache-2.0 like every sibling provider crate; the WEIGHTS it loads are under the
# Qwen Research License (research/evaluation only) — see NOTICE and UPSTREAM.md.
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/candle-gen"
keywords = ["candle", "cuda", "diffusion", "qwen-image", "inference"]
categories = ["science"]
autotests = false

[dependencies]
# Core crate — re-exports gen_core + candle, so this provider links exactly one gen-core / candle
# build (single resolution; see scripts/check-gen-core-skew.sh).
candle-gen = { path = "../candle-gen" }
# Direct candle deps for the ported DiT / VAE / Qwen3-VL tower. Same workspace pin candle-gen uses,
# so cargo unifies to one candle build (no skew).
candle-core = { workspace = true }
candle-nn = { workspace = true }
# `config.json` readers for the four snapshot components (transformer / text_encoder / vae /
# scheduler): the loader is config-driven so the tiny parity snapshot and the production snapshot
# go through one code path.
serde_json = { workspace = true }
# Deterministic CPU-seeded initial noise (sc-3673 parity) — NOT candle's device RNG.
rand = { workspace = true }

[features]
# Pass the backend selection through to the core crate so a downstream `--features metal`/`cuda` on
# this provider crate selects the matching candle backend everywhere.
default = []
metal = ["candle-gen/metal"]
cuda = ["candle-gen/cuda"]

[dev-dependencies]
# gen-core conformance suite: drives this provider through the public Generator contract
# (cancel / progress / seed-determinism / capability honesty) on the committed tiny snapshot.
sceneworks-gen-core-testkit = { workspace = true }
# Shared test-support helpers (`candle_gen::testkit`). Cargo unifies this with the `[dependencies]`
# `candle-gen` entry; the `testkit` feature stays scoped to this crate's test/example builds.
candle-gen = { path = "../candle-gen", features = ["testkit"] }
# Reading the committed `.safetensors` parity fixtures shared with `mlx-gen-qwen-image-2-1`.
safetensors = "0.7"
# sc-24112: temp trees for the packed-tier layout / reload tests and the dense-guard fixtures.
tempfile = { workspace = true }
# sc-24112: SHA-256 over a converted tier, proving the shared artefact is the one this backend loads.
sha2 = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
