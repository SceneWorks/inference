[package]
name = "candle-gen-wan"
version = "0.0.0"
edition = "2021"
description = "Wan2.2 video provider crate for candle-gen — the Windows/CUDA sibling of mlx-gen-wan."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/candle-gen"
keywords = ["candle", "cuda", "video", "wan", "inference"]
categories = ["science"]
autotests = false

[dependencies]
candle-gen = { path = "../candle-gen" }
# Wan has NO candle-transformers reference: the WanTransformer3DModel DiT, the causal-Conv3d
# AutoencoderKLWan temporal VAE, the UMT5-XXL text encoder, and the UniPC flow-match scheduler are
# all written here on candle-core/candle-nn (candle ships no conv3d — see `conv3d`).
tokenizers = { workspace = true }
# Deterministic CPU-seeded initial noise (sc-3673 parity).
rand = { workspace = true }
rand_distr = { workspace = true }
# Read a trained adapter `.safetensors`' `__metadata__` (the LoKr `networkType`/`rank`/`alpha`), which
# candle's own `safetensors::load` drops — the inference-side adapter merge (sc-5167, `adapters`).
safetensors = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
# Only the SC-20686 campaign observer hashes, so it is optional behind `campaign-observer` (sc-27296).
sha2 = { workspace = true, optional = true }
# The shared epic-2123 aux-loss builder (sc-24830): config -> PerceptualPath (depth anchoring
# through the TAEHV tiny video decoder).
candle-gen-perceptual = { path = "../candle-gen-perceptual" }
sceneworks-gen-core-tokenizer = { workspace = true }
sceneworks-gen-core-train = { workspace = true }
sceneworks-gen-core-memory-wan = { workspace = true }

[features]
model-inference-proof = ["candle-gen-depth/model-inference-proof", "candle-gen-perceptual/model-inference-proof", "candle-gen/model-inference-proof", "sceneworks-gen-core-tokenizer/model-inference-proof", "sceneworks-gen-core-train/model-inference-proof"]
default = []
metal = ["candle-gen/metal", "candle-gen-perceptual/metal"]
cuda = ["candle-gen/cuda", "candle-gen-perceptual/cuda"]
# SC-20686 K/V campaign observer (epic 20669 measurement tooling, sc-27296). Off by default: the
# production build compiles an inert hook stub (`src/sc20686_observer_off.rs`). The candle-cuda
# campaign builds the Wan campaign examples with this feature; never selected by runtime bundles.
campaign-observer = ["dep:sha2"]

[dev-dependencies]
# The real SC-20686 observer also compiles into this crate's own unit-test build (sc-27296).
sha2 = { workspace = true }
image = { workspace = true }
sceneworks-gen-core-testkit = { workspace = true }
# Shared test-support helpers (sc-9055 / F-069: candle_gen::testkit gpu_peak sampler).
candle-gen = { path = "../candle-gen", features = ["testkit"] }
# Self-removing fixture roots for the text-encode tests (sc-17704).
tempfile = { workspace = true }
# Tiny random-init Depth-Anything-V2 for the depth-anchoring step tests (sc-24830).
candle-gen-depth = { path = "../candle-gen-depth" }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
