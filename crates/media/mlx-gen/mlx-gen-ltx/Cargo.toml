[package]
name = "mlx-gen-ltx"
version = "0.0.0"
edition = "2021"
description = "LTX-2.3 video (text-to-video) provider crate for mlx-gen."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "video", "ltx", "inference"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
# sc-18770: the FIRST `mlx-gen-* → mlx-llm` edge, and the documented direction of the inversion —
# `mlx-llm/Cargo.toml` has said "the inversion: mlx-gen will consume mlx-llm" since the crate was
# created. LTX-2.5's text encoder is a Gemma 4 unified decoder, which lives in `mlx-llm` alongside
# every other decoder architecture rather than being duplicated a fourth time inside a media crate.
# Only `gemma4_te.rs` uses it; LTX-2.3's Gemma 3 path (`gemma.rs`) is untouched.
#
# The edge is sound only because both crates take `mlx-rs` from `[workspace.dependencies]`, so the
# graph resolves ONE `mlx-rs` and both halves share a single `Array` type. Two copies would not be
# a clean failure — they would surface as `expected Array, found Array`. Proof:
#   cargo tree --target aarch64-apple-darwin -p mlx-gen-ltx -i mlx-rs
# must report a single package. Never give either crate its own `mlx-rs` pin.
mlx-llm = { path = "../../../llm/mlx-llm" }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# Link-time self-registration into mlx-gen's model registry.
# embedded_config.json / config.json / split_model.json reading (config-driven loader).
serde_json = { workspace = true }
# Fail-closed content identity for the separately rehosted stock Gemma-4 enhancer snapshot.
sha2 = { workspace = true }
# Decode training-dataset images (LoRA training, sc-3047). PNG + JPEG cover the SceneWorks dataset
# formats; the trainer center-crops + hands the Image to the VAE preprocess.
image = { workspace = true }

[dev-dependencies]
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
sceneworks-gen-core-testkit = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
