[package]
name = "mlx-gen-moss-image"
version = "0.0.0"
edition = "2021"
description = "Native MOSS-Image Base/SFT and explicitly selected data-space DMD for MLX."
license = "Apache-2.0"
autotests = false

[dependencies]
# Opt-in cross-crate development fixtures; no runtime bundle enables this feature.
sceneworks-gen-core-testkit = { workspace = true, optional = true }
sceneworks-gen-core-moss-image = { workspace = true }
sceneworks-gen-core-train = { workspace = true }
image = { workspace = true }
mlx-gen = { path = ".." }
mlx-rs = { workspace = true }
mlx-llm = { workspace = true }
mlx-gen-flux2 = { path = "../mlx-gen-flux2" }
serde_json = { workspace = true }
sha2 = { workspace = true }

[features]
default = []
test-support = ["dep:sceneworks-gen-core-testkit", "mlx-gen-flux2/test-support"]

[dev-dependencies]
tempfile = { workspace = true }
sceneworks-gen-core-testkit = { workspace = true }

[[test]]
name = "integration"
path = "tests/main.rs"
