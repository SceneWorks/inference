[package]
name = "mlx-gen-iris"
version = "0.0.0"
edition = "2021"
description = "Iris-3B (pixel-space DiT, Qwen3-VL conditioned) native MLX provider crate for mlx-gen."
# Iris-3B code and weights are Apache-2.0, as is the Qwen3-VL-4B-Instruct text encoder.
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "diffusion", "iris", "inference"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# The Qwen3-VL-4B language tower is the shared generic decoder (`mlx_llm::CausalLm`, which already
# reads the `qwen3_vl` VLM-nested layout and returns HF-ordered hidden states). The
# `mlx-gen-* -> mlx-llm` direction is the documented one (see `mlx-gen-ltx`); the pin lives in the
# root workspace so cargo unifies ONE mlx-llm across the worker graph.
mlx-llm = { workspace = true }
# state.json of the durable training checkpoints and the adapter metadata lists (sc-25685); the
# text encoder's shard index (only the language tower's shards are opened) and the packed-tier
# converter's config (inference, so not optional).
serde_json = { workspace = true }
serde = { workspace = true }
# MLX's distributed layer (`mlx::core::distributed`: ring / jaccl / mpi) for data-parallel
# training (sc-25689) — the C bindings mlx-rs does not wrap. Same pin as mlx-rs (workspace).
mlx-sys = { workspace = true, optional = true }
# Header-only image validation in the training dataset pass (decode lives in gen_core::iris::train).
image = { workspace = true, optional = true }

[features]
model-inference-proof = ["mlx-gen/model-inference-proof", "mlx-llm/model-inference-proof"]
# The three trainers (`training`: generation, depth, restoration) and their training-only deps —
# MLX distributed + the JACCL link (`build.rs`), dataset image validation, checkpoint state.
# Default-on, so every existing consumer is unchanged; an inference-only graph (the iOS bundle)
# depends with `default-features = false` and compiles and links no trainer (sc-26265).
default = ["training"]
training = ["dep:cc", "dep:image", "dep:mlx-sys"]

[build-dependencies]
# build.rs links MLX's libjaccl.a (or compiles the JACCL-absent shim for a prebuilt MLX without it)
# so `mlx::core::distributed::init` links (sc-25689).
cc = { workspace = true, optional = true }

[dev-dependencies]
# Shared test comparison helpers (`mlx_gen::testing`, sc-27323).
mlx-gen = { path = "..", features = ["test-support"] }
# Pin CPU native streams in inference-only test builds too (training's binding is optional).
mlx-sys = { workspace = true }
sceneworks-gen-core-testkit = { workspace = true }
# The weights-free memory-contract fixtures write a safetensors header (`memory_strategy` tests).
serde_json = { workspace = true }
tempfile = { workspace = true }
# The restoration fixture pins upstream's PIL-Lanczos budget resize by the sha256 of its bytes.
sha2 = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
# The binary carries the trainer tests and the training-only deps (`image`), so it needs the
# default-on `training` feature; `--no-default-features` skips it rather than failing (sc-26265).
required-features = ["training"]
