[package]
name = "mlx-gen-ideogram"
version = "0.0.0"
edition = "2021"
description = "Ideogram 4.0 provider crate for mlx-gen (sc-5984 / epic 4725)."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "diffusion", "ideogram", "inference"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
# Reuse the AutoencoderKLFlux2 VAE: Ideogram 4's VAE is the same architecture as FLUX.2's
# (model_index `AutoencoderKLFlux2`), so `Flux2Vae` loads Ideogram's converted weights directly.
mlx-gen-flux2 = { path = "../mlx-gen-flux2" }
# Optional PiD super-resolving decoder overlay (epic 7840, sc-7847) — the `flux2` student (Ideogram 4
# is the FLUX.2 VAE latent space). Depends only on mlx-gen core (acyclic).
mlx-gen-pid = { path = "../mlx-gen-pid" }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# Link-time self-registration into mlx-gen's model registry.
# Read safetensors JSON headers (keys + shapes) for converter/loader validation guards.
serde_json = { workspace = true }

[dev-dependencies]
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
# sc-22732: the shared memory-strategy registry conformance walk.
sceneworks-gen-core-testkit = { workspace = true }
# PNG dump of the Rust render for visual inspection in the e2e parity tests (later slices).
image = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
