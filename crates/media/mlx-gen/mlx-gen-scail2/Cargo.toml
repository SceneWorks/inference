[package]
name = "mlx-gen-scail2"
version = "0.0.0"
edition = "2021"
description = "zai-org SCAIL-2 (Wan2.1-14B I2V end-to-end character animation / cross-identity replacement) provider crate for mlx-gen."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "video", "character-animation", "inference"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
# SCAIL-2 is Wan2.1-14B I2V: the DiT blocks, z16 VAE, UMT5, RoPE table, flow/UniPC scheduler, and
# patchify all come from mlx-gen-wan. The SCAIL-2 deltas (3 patch-embed stems + additive mask/pose
# embeds, per-source RoPE shifts, Wan-I2V image cross-attn, CLIP encoder) layer on top.
mlx-gen-wan = { path = "../mlx-gen-wan" }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# Link-time self-registration into mlx-gen's model registry.
# config.json (mask_dim / dims) sidecar reading.
serde_json = { workspace = true }

[dev-dependencies]
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
# Real-weight typed-cancellation conformance gate (story 6883): drives the registered scail2_14b
# Generator through the testkit cancellation check. Weight-gated (#[ignore]).
sceneworks-gen-core-testkit = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
