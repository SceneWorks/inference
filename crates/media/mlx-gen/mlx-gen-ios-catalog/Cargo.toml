[package]
name = "mlx-gen-ios-catalog"
version = "0.0.0"
edition = "2021"
description = "Explicit narrow media provider catalog for iOS: the image generators that fit a phone."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"

[dependencies]
sha2 = { workspace = true }
# The reviewed device-evidence table (`evidence/ios_device_evidence.json`) is parsed at runtime.
serde = { workspace = true }
serde_json = { workspace = true }
mlx-gen = { path = ".." }
# SANA, Anima Turbo, the SDXL family, all Iris inference tasks and Z-Image Turbo only. This is deliberately NOT mlx-gen-catalog: that composes every provider crate including
# the video families (wan, ltx, mochi, svd), none of it validated on iOS and none of it shaped for
# a device with a hard per-app memory cap. Depending on the whole catalog to obtain one small
# generator would compile a graph the platform cannot run.
#
# `mlx-gen-sana` pulls `mlx-gen-pid` transitively for the Gemma-2 CHI caption encoder (epic 8485 /
# sc-8488) -- SANA's text conditioning IS Gemma-2-2b-it, reused rather than duplicated.
mlx-gen-sana = { path = "../mlx-gen-sana" }
# Anima Turbo (`anima_turbo`, sc-26265), inference only: `default-features = false` drops the crate's
# `training` feature, so neither its trainers nor `mlx-gen-perceptual` (and the depth/face/body
# perceptors behind it) are compiled for iOS. The Qwen-Image VAE and z-image's Qwen3 encoder block it
# reuses arrive the same way, each without its own trainers.
mlx-gen-anima = { path = "../mlx-gen-anima", default-features = false }
# All Iris inference modes; no trainer/JACCL training shim in the iOS graph.
mlx-gen-iris = { path = "../mlx-gen-iris", default-features = false }
# The complete SDXL family shares one generator; never compile its trainer on iOS.
mlx-gen-sdxl = { path = "../mlx-gen-sdxl", default-features = false }
# Z-Image Turbo (`z_image_turbo` and its `z_image_turbo_control` route, sc-26433), inference only:
# `default-features = false` drops the crate's `training` feature (trainer, perceptual/depth aux
# losses, dataset decode). The base `z_image` variants are not registered here.
mlx-gen-z-image = { path = "../mlx-gen-z-image", default-features = false }

[features]
# The labelled bounded DEVICE CAPTURE permit (`capture_permit`). Never in a product build: only
# `runtime-ios/device-capture`, which only the device harness (`ios-host/smoke`) enables, turns it on.
device-capture = []

[dev-dependencies]
# CPU-native stream pinning before the Metal-trapped admission fixtures.
mlx-sys = { workspace = true }
tempfile = { workspace = true }
# The shared weights-free memory-strategy oracle, run over this catalog's exact registrations.
sceneworks-gen-core-testkit = { workspace = true }
# The image_budget example reads MLX's allocator accounting directly (get_active_memory /
# get_peak_memory), which the gen-core contract deliberately does not expose -- it is tensor-free.
mlx-rs = { workspace = true }
# The tiling_fidelity / compare_renders examples write and read PNGs so a difference that survives
# the numeric thresholds can still be looked at.
image = { workspace = true }
