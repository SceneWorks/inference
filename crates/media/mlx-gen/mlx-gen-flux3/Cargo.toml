[package]
name = "mlx-gen-flux3"
version = "0.0.0"
edition = "2021"
description = "FLUX 3 Image Klein (distilled flow-map DiT, Qwen3-VL conditioned) native MLX provider crate for mlx-gen."
# The Rust port is Apache-2.0 like every sibling provider crate; the weights it loads are under the
# FLUX Kommunity License (see NOTICE / UPSTREAM.md and the catalog's licence rows).
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"
keywords = ["mlx", "apple-silicon", "diffusion", "flux", "inference"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# The Qwen3-VL-4B language tower is the shared generic decoder (`mlx_llm::CausalLm`, the
# `qwen3_vl` architecture with HF-ordered hidden states). The `mlx-gen-* -> mlx-llm` direction is
# the documented one (see `mlx-gen-iris`); the pin lives in the root workspace so cargo unifies ONE
# mlx-llm across the worker graph.
mlx-llm = { workspace = true }

[dev-dependencies]
sceneworks-gen-core-testkit = { workspace = true }
tempfile = { workspace = true }
# PNG dump of the real-weight render for the evidence artifact.
image = { workspace = true }
serde_json = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
