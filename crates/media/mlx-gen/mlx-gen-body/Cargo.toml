[package]
name = "mlx-gen-body"
version = "0.0.0"
edition = "2021"
description = "Body perceptual losses for mlx-gen trainers (epic 2123, sc-24832): ViTPose+ bone-length proportions, HybrIK SMPL-beta shape and Sapiens surface normals as frozen, differentiable models on the shared decoded-x0 perceptual path."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"

[dependencies]
mlx-gen = { path = ".." }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
