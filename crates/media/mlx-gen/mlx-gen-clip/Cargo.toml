[package]
name = "mlx-gen-clip"
version = "0.0.0"
edition = "2021"
description = "CLIP ViT-L/14 image-embedding provider crate for mlx-gen (Dataset Doctor, sc-6535)."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "clip", "embedding", "inference"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
# Reuse the CLIP ViT body + preprocessing (same crate-reuse pattern as mlx-gen-flux → mlx-gen-sdxl;
# no dependency cycle). The visual_projection head is local (it's the only piece that differs).
mlx-gen-sdxl = { path = "../mlx-gen-sdxl" }
mlx-rs = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
