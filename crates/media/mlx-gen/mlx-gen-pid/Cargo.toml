[package]
name = "mlx-gen-pid"
version = "0.0.0"
edition = "2021"
description = "NVIDIA PiD (Pixel Diffusion Decoder) — optional latent→pixel super-resolving decoder for mlx-gen (epic 7840)."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "diffusion", "pixel-decoder", "super-resolution"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# Parse the PiD checkpoint's sidecar config (channels / latent-norm / scale) at load time.
serde_json = { workspace = true }
# Encode the e2e real-weight smoke output to PNG (mirrors mlx-gen-krea / mlx-gen-z-image).
image = { workspace = true }

# No dev-dependency on the gen-core testkit (sc-9098, F-102): PiD is a struct-API decoder overlay
# (no registered `Generator`), so the registered-id conformance suite cannot apply to it.

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
