[package]
name = "mlx-gen-mage"
version = "0.0.0"
edition = "2021"
description = "Mage-Flow (microsoft/Mage) provider crate for mlx-gen — 4B NR-MMDiT + Mage-VAE + Qwen3-VL text encoder."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "image", "mage-flow", "inference"]
categories = ["science"]

[dependencies]
mlx-gen = { path = ".." }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
# Declared by the scaffold (sc-14037) rather than by each porting story so the text-encoder
# (sc-14038), VAE (sc-14039) and DiT (sc-14040) ports — which land in parallel — never contend
# over this manifest.
mlx-rs = { workspace = true }
# `transformer/config.json` / `vae/config.json` / `scheduler/scheduler_config.json` parsing
# (matches the sdxl/wan/ltx/flux2/lens provider convention: `serde_json::Value`, no derive).
serde_json = { workspace = true }

[dev-dependencies]
# Byte tripwire for the committed config fixtures: they must stay identical to the published
# `microsoft/Mage-Flow*` files the constants in `config.rs` are transcribed from (sc-14037).
sha2 = { workspace = true }
