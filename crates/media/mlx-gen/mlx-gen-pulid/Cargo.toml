[package]
name = "mlx-gen-pulid"
version = "0.0.0"
edition = "2021"
description = "PuLID-FLUX face-identity provider for mlx-gen (EVA-CLIP ViT + IDFormer + FLUX cross-attn injection)."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "pulid", "flux", "face"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
mlx-gen-flux = { path = "../mlx-gen-flux" }
mlx-gen-face = { path = "../mlx-gen-face" }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The shared weights-free conformance suite (epic SC-22657): the crate's contract tests assert
# the provider-declared architecture axes against it.
sceneworks-gen-core-testkit = { workspace = true }
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
image = { workspace = true }
# Link-time self-registration into mlx-gen's model registry (the `pulid_flux` target, sc-3074).

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
