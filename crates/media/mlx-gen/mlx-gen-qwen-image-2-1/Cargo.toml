[package]
name = "mlx-gen-qwen-image-2-1"
version = "0.0.0"
edition = "2021"
description = "Qwen-Image 2.1 (unified T2I + RGBA, Qwen3-VL conditioned single-stream DiT) provider crate for mlx-gen."
# The Rust port is Apache-2.0 like every sibling provider crate; the WEIGHTS it loads are under the
# Qwen Research License (research/evaluation only) — see NOTICE and UPSTREAM.md.
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "diffusion", "qwen-image", "inference"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# The Qwen3-VL-8B text encoder's language tower is a plain Qwen3 decoder for text-only prompts
# (identical mRoPE positions on all three axes collapse to 1-D RoPE), so the pre-norm decoder
# block is REUSED from Z-Image's parity-proven Qwen3 port (`text_encoder::EncoderLayer`) rather
# than ported a third time. Same lane, dimension-parametric, packed-detect Q4/Q8 for free.
mlx-gen-z-image = { path = "../mlx-gen-z-image" }
# sc-24110: the reference/edit route runs condition images through the Qwen3-VL VISION tower and
# DeepStack, which the worker graph already carries — `models::Qwen3VLVisionModel`, the shared
# `models::deepstack` splice/M-RoPE helpers and `image::Qwen35ImageProcessor` (the same
# patch-16/merge-2 processor geometry `Qwen/Qwen-Image-2.1`'s `processor/` declares). The
# `mlx-gen-* -> mlx-llm` direction is the documented one (see `mlx-gen-ltx`); the pin lives in the
# root workspace so cargo unifies ONE mlx-llm across the worker graph.
mlx-llm = { workspace = true }
# `config.json` readers for the four snapshot components (transformer / text_encoder / vae /
# scheduler): the loader is config-driven so the tiny parity snapshot and the production snapshot
# go through one code path.
serde_json = { workspace = true }
# sc-24114: the converter itself writes each tier's `SHA256SUMS` manifest (`convert::write_sha256sums`),
# so the digest is a production dependency, not only the tests' hash pin over a converted tier.
sha2 = { workspace = true }

[dev-dependencies]
sceneworks-gen-core-testkit = { workspace = true }
tempfile = { workspace = true }
# PNG output for the ignored real-weight validation render.
image = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
