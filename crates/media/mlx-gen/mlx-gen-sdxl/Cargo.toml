[package]
name = "mlx-gen-sdxl"
version = "0.0.0"
edition = "2021"
description = "Stable Diffusion XL (SDXL) U-Net provider crate for mlx-gen."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "diffusion", "sdxl", "inference"]
categories = ["science"]
autotests = false

[dependencies]
# Epic 2123 auxiliary perceptual losses (sc-24830): the shared builder every trainer calls
# (depth anchoring today). Depends only on core + the aux-model crates (acyclic).
mlx-gen-perceptual = { path = "../mlx-gen-perceptual", optional = true }
mlx-gen = { path = ".." }
# Optional PiD super-resolving decoder overlay (epic 7840, sc-7848): the `sdxl` PiD student as an
# opt-in 4× decode replacement for the SDXL-family VAE. `mlx-gen-pid` depends only on the mlx-gen
# core (not on any provider), so this edge is acyclic.
mlx-gen-pid = { path = "../mlx-gen-pid" }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# Link-time self-registration into mlx-gen's model registry.
# SDXL ships a CLIP tokenizer as vocab.json + merges.txt (no tokenizer.json), and the vendored
# reference uses Apple's simplified CLIP BPE with `\p{L}`/`\p{N}` unicode-class splitting. We port
# that tokenizer to match the reference IDs exactly; `regex` provides the unicode-property pattern.
regex = { version = "=1.13.0", features = ["clip-source-certificate"] }
# Parse vocab.json (a flat {token: id} object) without pulling a heavy dep.
serde_json = { workspace = true }
serde = { workspace = true }
# Decode training-dataset images (LoRA/LoKr training, sc-3045) and save the e2e render for
# inspection. PNG + JPEG cover the SceneWorks dataset formats; the trainer center-crops + hands the
# Image to the VAE preprocess.
image = { workspace = true, optional = true }

[features]
model-inference-proof = ["mlx-gen-perceptual?/model-inference-proof", "mlx-gen/model-inference-proof", "mlx-gen-pid/model-inference-proof"]
# The LoRA/LoKr trainer (`training`) and its training-only deps (perceptual aux losses, dataset
# image decode). Default-on, so every existing consumer is unchanged; an inference-only graph (the
# iOS bundle) depends with `default-features = false` and compiles no trainer (sc-26265).
default = ["training"]
training = ["dep:image", "dep:mlx-gen-perceptual"]

[dev-dependencies]
# Explicit native CPU stream pinning in the Metal-trapped quantum proofs.
mlx-sys = { workspace = true }
sha2 = { workspace = true }
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
# Weights-free memory-strategy conformance for the shared ladder (SC-15525).
sceneworks-gen-core-testkit = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
# The binary carries the trainer tests and the training-only deps (`image`), so it needs the
# default-on `training` feature; `--no-default-features` skips it rather than failing (sc-26265).
required-features = ["training"]
