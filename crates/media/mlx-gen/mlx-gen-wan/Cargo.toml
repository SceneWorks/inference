[package]
name = "mlx-gen-wan"
version = "0.0.0"
edition = "2021"
description = "Wan2.2 video (text-to-video + image-conditioned) provider crate for mlx-gen."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "video", "wan", "inference"]
categories = ["science"]
autotests = false

[dependencies]
mlx-gen = { path = ".." }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# Link-time self-registration into mlx-gen's model registry.
# config.json reading (config-driven loader).
serde_json = { workspace = true }
# UMT5 prompt cleaning (`_clean_text`): NFC + block-scoped fullwidth/halfwidth fold (the
# `ftfy.fix_character_width` transform that maps the Chinese negative prompt's fullwidth commas
# to ASCII — load-bearing for correct tokenization). See `text_encoder::clean_text`.
unicode-normalization = "0.1"
# Decode training-dataset images (LoRA/LoKr training, sc-3046). PNG + JPEG cover the SceneWorks
# dataset formats; the trainer center-crops + hands the Image to the VAE preprocess.
image = { workspace = true, optional = true }
# The shared epic-2123 aux-loss builder (sc-24830): config -> PerceptualPath (depth anchoring
# through the TAEHV tiny video decoder).
mlx-gen-perceptual = { path = "../mlx-gen-perceptual", optional = true }
sceneworks-gen-core-train = { workspace = true }
sceneworks-gen-core-memory-wan = { workspace = true }

[features]
model-inference-proof = ["mlx-gen/model-inference-proof", "mlx-gen-perceptual?/model-inference-proof", "sceneworks-gen-core-train/model-inference-proof"]
# The LoRA/LoKr trainers (`training`) and their training-only deps. Default-on, so every existing
# consumer is unchanged; an inference-only graph (the iOS bundle reaches this crate through
# `mlx-gen-qwen-image`) depends with `default-features = false` and compiles no trainer (sc-26265).
default = ["training"]
training = ["dep:image", "dep:mlx-gen-perceptual"]

[dev-dependencies]
# Tiny random-init Depth-Anything-V2 for the depth-anchoring step tests (sc-24830).
mlx-gen-depth = { path = "../mlx-gen-depth" }
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
sceneworks-gen-core-testkit = { workspace = true }
# The `sc20686_wan` example reads and writes frames whether or not `training` is on.
image = { workspace = true }

# sc-21383: one integration-test binary per crate. `tests/main.rs` is generated by
# scripts/ci/consolidate_integration_tests.py; add a `tests/<name>.rs` file and run
# `python3 scripts/ci/consolidate_integration_tests.py regen`. `cargo test --test integration
# -- <name>::` selects one former per-file target.
[[test]]
name = "integration"
path = "tests/main.rs"
# The binary carries the trainer tests and the training-only deps (`image`), so it needs the
# default-on `training` feature; `--no-default-features` skips it rather than failing (sc-26265).
required-features = ["training"]

# SC-20686: the campaign entrypoint's route load settings are unit-tested against the product's.
[[example]]
name = "sc20686_wan"
test = true
