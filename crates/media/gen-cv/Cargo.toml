[package]
name = "sceneworks-gen-cv"
version = "0.1.0"
edition = "2021"
description = "YOLO11, DWPose and Real-ESRGAN native CV engines"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SceneWorks/inference"

[dependencies]
image = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
sceneworks-gen-core = { workspace = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "tracing", "load-dynamic", "api-26"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }
mlx-rs = { workspace = true, optional = true }
mlx-gen = { path = "../mlx-gen", default-features = false, optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["cuda"] }

[features]
default = []
mlx = ["dep:mlx-rs", "dep:mlx-gen"]

# Retain intermediate references only for explicitly compiled parity instruments.
parity-captures = []
