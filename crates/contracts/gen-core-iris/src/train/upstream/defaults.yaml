# speridlabs/iris-3b @ a8d15239dea469aba042cfa56ca3bb4e450d5ebc — src/iris3b/config.py structured
# defaults (OmegaConf.structured(Config)), dumped by crates/media/mlx-gen/tools/dump_iris_train.py.
name: iris-3b
work_dir: output/run
wandb_project: iris
report_to: wandb
tags: []
model:
  block: single_stream
  dual_depth: 8
  final_block_text: keep
  hidden_size: 2560
  depth: 24
  num_heads: 20
  num_kv_heads: 5
  gated_attention: true
  sandwich_norm: true
  patch_size: 16
  in_channels: 3
  mlp_ratio: 4.0
  qkv_bias: false
  qk_norm: true
  norm_eps: 1.0e-06
  attn_backend: sdpa
  modulation: shared_bias
  modulation_rank: 64
  timestep_max_period: 10.0
  adaln_zero_init: true
  rope_theta: 10000.0
  rope_scale: 16.0
  rope_aspect: isotropic
  rope_frame_pairs: 0
  rope_frame_theta: 10.0
  text_rope: true
  text_rope_theta: 10000.0
  text_abs_pos_embed: true
  text_dim: 2560
  text_len: 300
  text_adapter: lap_blocks2
  text_lap_num_layers: 12
  text_lap_num_heads: 32
  text_lap_mlp_ratio: 1.3
  repa_layer: 10
  pixel:
    enabled: true
    depth: 4
    hidden_size: 16
    attn_hidden_size: 1280
    num_heads: 10
    mlp_ratio: 4.0
    modulation: post
    abs_pos_embed: true
flow:
  num_train_timesteps: 1000
  shift: 4.0
  timestep_sampler: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  prediction: v
  x_pred_sigma_min: 0.05
  shift_law: none
  shift_base_tokens: 256
text_encoder:
  name: qwen3_vl
  pretrained: Qwen/Qwen3-VL-4B-Instruct
  dim: 2560
  max_length: 300
  dtype: bfloat16
  attn_implementation: sdpa
  hidden_layers:
  - 2
  - 5
  - 8
  - 11
  - 14
  - 17
  - 20
  - 23
  - 26
  - 29
  - 32
  - 35
  null_embed_dir: output/pretrained_models
  compile: false
  on_caption_overflow: warn
repa:
  weight: 0.0
  variant: repa
  spatial_norm_gamma: 1.0
  teacher_source: hub
  teacher_hub: facebookresearch/dinov2
  teacher: dinov2_vitb14
  teacher_weights: ''
  teacher_dim: 768
  proj_hidden_dim: 2048
  teacher_image_size: 224
  teacher_patch_size: 14
  teacher_match_student: false
data:
  data_dirs: []
  type: pixel
  image_size: 512
  shape_policy: ''
  aspect_ratio_bucket: shared21-512
  shape_align: 32
  shape_max_ratio: 4.0
  caption_field: caption
  caption_fields: []
  val_data_dirs: []
  num_workers: 10
train:
  batch_size: 8
  grad_accum_steps: 1
  expected_global_batch: null
  num_epochs: 100
  max_steps: 0
  mixed_precision: bf16
  activation_checkpointing: none
  ac_selective_every: 2
  gradient_clip: 0.5
  text_dropout: 0.1
  seed: 1
  optimizer:
    name: muon
    lr: 0.0001
    betas:
    - 0.9
    - 0.95
    weight_decay: 0.0
    muon_momentum: 0.95
    muon_nesterov: true
    muon_adjust_lr: rms_norm
    auto_lr: none
    base_batch_size: 256
    schedule: constant
    warmup_steps: 2000
    scale_warmup_by_world: true
  ema:
    enabled: true
    decay: 0.9999
  dist:
    strategy: ddp
    sharding: full
    mesh:
      dp_shard: 0
      dp_replicate: 0
    param_dtype: bf16
    reduce_dtype: fp32
    reshard_after_forward: true
    checkpoint_io: auto
    ddp:
      find_unused_parameters: auto
      gradient_as_bucket_view: false
      batched_grad_copy: false
      skip_all_reduce_unused_params: false
      bucket_cap_mb: 0
      forward_sync_buffers: true
  load_from: null
  resume_from: null
  resume_data_world_size: null
  resume_data_policy: exact
  resume_optimizer: full
  override_lr_on_resume: false
  save_every_steps: 500
  save_every_epochs: 5
  keep_last_checkpoints: 0
  milestone_steps: []
  log_every: 20
  log_block_grad_norms: false
  sample_every_steps: 500
  val_every_steps: 0
  val_samples: 8192
  validation_prompts:
  - a golden retriever puppy sitting in a field of tall grass at sunset
  - close-up portrait of an elderly fisherman with a weathered face, soft window light, shallow depth of field
  - a cozy reading nook with a window seat and rain on the glass, warm lamp light, watercolor illustration
  - an astronaut tending a vegetable garden inside a glass dome on the moon, cinematic lighting
  - a snow-covered mountain village at dawn with smoke rising from the chimneys, highly detailed
  - a neon sign above a small night-market stall that reads “OPEN LATE”
  - a hand-painted wooden sign in a flower shop window that says “Fresh Tulips Today”
  nan_loss_tolerance: 20
  perf:
    foreach_ema: false
    fused_adamw: false
    skip_dropped_text: false
    lazy_sync: false
    compile: false
    compile_mode: max-autotune
    compile_scope: block
    compile_dynamic: auto
    compile_fullgraph: false
    recompile_limit: 64
sample:
  steps: 100
  order: 2
  cfg_scale: 3.0
  cfg_interval:
  - 0.0
  - 1.0
  negative_prompt: ''

