[package]
name = "sceneworks-gen-core"
version = "0.1.0"
edition = "2021"
description = "Backend-neutral generative-model contract layer (zero tensor deps) shared by mlx-gen and candle-gen."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"
keywords = ["diffusion", "inference", "generative", "contract"]
categories = ["science"]

[lib]
# Neutral import path: `use gen_core::…` regardless of the (unique, publishable) package name.
name = "gen_core"

[features]
# Manual source-bound model input receipts; no ordinary runtime/read behavior changes.
model-inference-proof = ["core-llm/model-inference-proof"]

[dependencies]
sceneworks-load-progress = { workspace = true }
# Shared pins live in the workspace root [workspace.dependencies] (F-151). gen-core deliberately
# depends on NOTHING tensor-related — thiserror (error) and core-llm. Text tokenization, image/EXR
# decode and the `.pth` zip reader moved to the sibling `gen-core-*` crates with the code that uses
# them (sc-27316).
thiserror = { workspace = true }
# Neutral safetensors header/byte-view reader for the weights-metadata layer (sc-3722). NOT a tensor
# dep — exposes keys/dtypes/shapes/raw bytes only.
safetensors = { workspace = true }
# JSON parse for the PEFT/diffusers `lora_adapter_metadata` header blob in weightsmeta (sc-5513).
serde_json = { workspace = true }
serde = { workspace = true }
# Canonical production-latent tiled-decode quality receipts (SC-18325). This hashes semantic
# fixture/output bytes only and does not introduce tensor, timing, or memory-measurement code.
# Canonical semantic fingerprints bind complete alternate snapshots to the retained tokenizer.
sha2 = { workspace = true }
# The independent LLM-serving contract (epic 7153, sc-7189). gen-core re-exports it as
# `gen_core::core_llm` so the gen-ai side consumes the unified `core_llm::TextLlm` engine. core-llm is
# itself tensor-free, so depending on it keeps gen-core's zero-tensor invariant intact.
core-llm = { workspace = true }
# Volume identity for prepared-file seals (`runtime::seal`) and bounded filesystem reads.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Stable std does not expose durable Windows file IDs/change time. Prepared File identities use the
# same handle metadata as candle-gen's sidecar cache so same-size replacement cannot alias a pin.
# The Iris TCP transport sockets and the opt-in H3 process RSS telemetry moved to the sibling
# `sceneworks-gen-core-dist` / `sceneworks-gen-core-telemetry` crates with their FFI (sc-27316).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Self-removing fixture roots for the test suites (sc-17755).
tempfile = { workspace = true }
