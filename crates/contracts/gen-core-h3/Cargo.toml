[package]
name = "sceneworks-gen-core-h3"
version = "0.1.0"
edition = "2021"
description = "Tensor-free MiniMax-H3 memory planners, Veda sparse-attention predictor/workspace pricing and reference/schedule policy on top of gen-core."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"
keywords = ["minimax", "veda", "memory", "generative"]
categories = ["science"]

[lib]
# Neutral import path: `use gen_core_h3::…`, mirroring the `gen_core` lib-name convention.
name = "gen_core_h3"

[features]
# Manual source-bound model input receipts on the reader sites this crate owns; no ordinary
# runtime/read behavior changes.
model-inference-proof = ["sceneworks-gen-core/model-inference-proof"]

[dependencies]
# The backend-neutral contract this crate builds on. Sibling crates depend on gen-core; gen-core
# never depends on them (sc-27316). Tensor-free, like gen-core.
sceneworks-gen-core = { workspace = true }
# Keyframe resize in `h3_keyframe`.
image = { workspace = true, features = ["bmp", "gif", "tiff", "webp"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
