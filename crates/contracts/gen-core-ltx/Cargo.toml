[package]
name = "sceneworks-gen-core-ltx"
version = "0.1.0"
edition = "2021"
description = "Tensor-free LTX split-checkpoint resolution, Gemma encoder assets, DFR keyframe policy and the duration head on top of gen-core."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"
keywords = ["ltx", "checkpoint", "generative"]
categories = ["science"]

[lib]
# Neutral import path: `use gen_core_ltx::…`, mirroring the `gen_core` lib-name convention.
name = "gen_core_ltx"

[features]
# Manual source-bound model input receipts on the reader sites this crate owns; no ordinary
# runtime/read behavior changes.
model-inference-proof = ["sceneworks-gen-core/model-inference-proof", "sceneworks-gen-core-tokenizer/model-inference-proof"]

[dependencies]
# The backend-neutral contract this crate builds on. Sibling crates depend on gen-core; gen-core
# never depends on them (sc-27316). Tensor-free, like gen-core.
sceneworks-gen-core = { workspace = true }
sceneworks-gen-core-tokenizer = { workspace = true }
safetensors = { workspace = true }
serde_json = { workspace = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = { workspace = true }
