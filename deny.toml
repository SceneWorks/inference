[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
yanked = "warn"
ignore = [
    # Every ignored advisory must have current, expiring governance metadata in
    # advisory-ignores.toml. scripts/ci/check_advisory_policy.py enforces the pairing.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

# WTFPL (FSF-approved, no-conditions permissive) is accepted ONLY for `language-tokenizer`, a
# dependency of the audio lane's pure-Rust misaki G2P engine (`misaki-rs`, sc-12836). The crate
# ships its license as a LICENSE.md file rather than an SPDX `license` field; cargo-deny
# synthesizes the WTFPL expression from that file. Scoped per-crate so a future WTFPL crate
# still needs a deliberate policy edit.
[[licenses.exceptions]]
name = "language-tokenizer"
allow = ["WTFPL"]

# CC-BY-NC-4.0 (noncommercial) is accepted ONLY for the workspace crate `candle-audio-sheetsage2`,
# the native SheetSage2 / MERT-v2-FullSong transcription port (sc-22996, epic sc-22988). Upstream
# licenses only the model weights (the "MERT2 model-weight license", CC BY-NC 4.0 for
# model.safetensors, which "does not replace separately applicable licenses for code"); the remote
# Python the crate reimplements has NO upstream licence grant. The crate's CC-BY-NC-4.0 field is the
# provisional disposition sc-22989 recorded (`CODE_TERMS` / `COVER_PORT` in
# crates/audio/candle-audio-yue2/src/license.rs, kept Gated) pending an owner decision — not an
# upstream grant. It stays out of the Apache-2.0 `candle-audio-yue2`, the audio catalog and every
# runtime bundle; see the crate's NOTICE. Scoped per-crate so any other noncommercial licence in the
# graph still fails.
[[licenses.exceptions]]
name = "candle-audio-sheetsage2"
allow = ["CC-BY-NC-4.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Defense in depth for the epic-13657 self-fetch boundary (the primary enforcement is
# scripts/check-workspace.py, which bans these from the resolved graph and is unit-tested).
# Inference receives every model component as a caller-provisioned local path and never fetches
# weights or derives a download-cache location, so no network/HTTP client belongs in the graph.
# All nine are confirmed absent on the clean tree; extend this list, never trim it.
deny = [
    { crate = "hf-hub" },
    { crate = "reqwest" },
    { crate = "ureq" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "git2" },
    { crate = "isahc" },
    { crate = "attohttpc" },
    { crate = "hyper" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/huggingface/candle",
    "https://github.com/michaeltrefry/mlx-rs",
]
