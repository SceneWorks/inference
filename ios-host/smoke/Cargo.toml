[package]
name = "ios-smoke"
version = "0.0.0"
edition = "2021"
description = "On-device MLX smoke test: proves the bundled metallib resolves and its kernels compute correctly on iOS."
license = "Apache-2.0"
publish = false

# Build the file-backed device harness in the SAME root workspace as runtime-ios. Cargo's
# compiled dependency identity is then stable across root SDK/capture builds and relocated
# checkouts. Separate external Cargo compositions conservatively require their own evidence.
# This test harness remains an explicit package; product bundles do not depend on it.

[lib]
# staticlib for linking into the .app; rlib so `cargo test` can exercise the same code on macOS.
crate-type = ["staticlib", "rlib"]

[[example]]
name = "campaign_catalog"
required-features = ["media"]

[features]
model-inference-proof = ["runtime-ios/model-inference-proof", "mlx-gen-sana?/model-inference-proof", "mlx-gen?/model-inference-proof"]
# E5's image-generation checks. Off by default so the LLM smoke stays the small, fast binary that
# E3/E4 ship, and so a media compile break can never block the text lane's device runs.
media = ["runtime-ios/media", "runtime-ios/device-capture", "dep:image", "dep:mlx-gen", "dep:mlx-gen-sana"]
# Simulator packaging/runtime-boundary check only. The report is target-abi gated and returns
# unsupported before MLX device use; it never changes physical-iOS admission or quantum guards.
simulator-functional = ["media", "runtime-ios/simulator-functional"]
# The Z-Image Turbo lane (`run_smoke.sh --zimage`): Z-Image Turbo is in the iOS catalog (sc-26433),
# so this lane is a bounded device CAPTURE of one Z-Image campaign case through
# `runtime_ios::media::capture_permit` — the same admitted/capture path every other model runs, no
# separate unadmitted loader.
zimage = ["media"]

[dependencies]
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "355e2ae4e81c13032233a4244e956bc3547f49e4" }
# Deliberately the BUNDLE, not mlx-llm directly: the point of an on-device test is to exercise the
# composition a product actually consumes (registry, capability descriptor, provider selection),
# not just the engine underneath it.
runtime-ios = { path = "../../crates/bundles/runtime-ios" }
# The backend-neutral conformance suite (S3.5). Running the SAME suite the macOS lane runs is the
# point: it makes "conformant on iOS" mean exactly what it means on every other platform, rather
# than whatever a bespoke on-device check happened to assert.
core-llm-testkit = { path = "../../crates/contracts/core-llm/core-llm-testkit" }
# getrusage for the peak-RSS number the memory story (E4) needs.
libc = "0.2"
serde_json = "1"
# PNG encoding for the E5 image check, so a device-generated render can be pulled off the phone and
# LOOKED at. A pixel-range assertion proves the decode produced content; only the image proves it
# produced the right content, and "SANA runs on iPhone" is a claim worth being able to see.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# For `pipeline::resolved_decode_plan` — reading back which of env/request/residency actually chose
# the decode geometry. The GENERATOR still comes from the catalog registry, so this changes nothing
# about what ships; it reaches a diagnostic the catalog does not re-export.
mlx-gen-sana = { path = "../../crates/media/mlx-gen/mlx-gen-sana", optional = true }
# For `memory_probe::FootprintProbe` — the shared MLX `active + cache` sampler, the footprint term
# `get_peak_memory` omits. Same path crate the provider already links, so this adds no code to the
# binary, only a name to read it by.
mlx-gen = { path = "../../crates/media/mlx-gen", optional = true }

[dev-dependencies]
# Only HOST tests enable compact validated Z-Image sources; normal media/iOS builds do not.
mlx-gen-z-image = { path = "../../crates/media/mlx-gen/mlx-gen-z-image", default-features = false, features = ["test-support"] }
tempfile = "3"
# The production Qwen3-4B encoder contract fixture a Z-Image Turbo campaign case validates.
sceneworks-gen-core-testkit = { path = "../../crates/contracts/gen-core-testkit" }
