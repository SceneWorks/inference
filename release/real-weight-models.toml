[[models]]
# sc-17284 — what `mlx-gen-qwen-image` ACTUALLY loads. The engine never reads `Qwen/Qwen-Image`
# above: every real-weight test takes a tier directory of this SceneWorks MLX re-host, whose q4/q8
# READMEs carry the upstream Qwen-Image-2512 card. Each tier subdir is a complete diffusers-layout
# snapshot, so tests are pointed one level in (`/bf16`, `/q8`) — the same shape as
# krea-realtime-14b-mlx.
#
# BOTH tiers are required and neither is redundant. `bf16` is the only dense tier, so it is what the
# on-the-fly `LoadSpec::with_quant` paths and the dense control/sampler forwards need; `q8` is a
# pre-quantized tier and is what `block_residency_real_weights` measures against (`QWEN_RUNG4_TIER`).
# `q4` is not fetched — no test in the wired lane selects it.
#
# COVERAGE THIS VARIABLE ACTUALLY BUYS, because one name gates 45 tests and "wired" is per-name.
# The 45 account for exactly, and the arithmetic is the point — 21 + 20 + 4 = 45:
#
# WIRED, 20: 16 in `mlx-qwen-image` on the schedule (control x4, unified sampler x2, sequential
# residency x4, rung-4 block residency, Lightning render x2, golden-free adapter x3), 3 in
# `mlx-qwen-image-pid`, 1 in the dispatch-only `mlx-qwen-image-producers`. All measured passing on
# nax-macos — 19 of them 2026-08-04, `lightning_loras_apply_cleanly` 2026-08-06 (sc-17518).
#
# BLOCKED ON THE ORACLE BUNDLE, 21: adapter 6, e2e 7, img2img 6, text_encoder 2 read
# `tools/golden/`, which is gitignored by design and minted by the frozen `mflux` fork against the
# ~60 GB torch original — a Mage-shaped operator seed bundle, sc-17503. It is 21 and not "all 9 of
# adapter_real_weights": three of that file's tests resolve no golden at all.
#
# EXCLUDED WITH A MEASUREMENT, 4. A lane that is red every week is ignored within a month
# (sc-16981), so each of these is recorded here rather than wired red or quietly dropped:
#   * `perf.rs` x2 — FAIL on real weights, and always have. sc-17284 ran them for the first time
#     and measured max|D| 1.897e-3 / 1.475e-3 / 9.739e-3 (T2I 256/512/1024 px) and 1.345e-3 (Edit)
#     against an `assert_eq!(max_diff, 0.0)`. sc-17513 owns the bound. Their silent-skip shape was
#     removed in the same pass, so they now fail loudly instead of reporting 1 passed.
#   * `fit_preview_rgb_factors` x1 — FAILS: R^2 = 0.0114 against its own 0.90 floor. sc-17515.
#   * `edit_lightning_user_lora_reference_repro` x1 — needs a user LoRA and a reference PPM that
#     exist in no repository and on no Hub.
#
# `lightning_loras_apply_cleanly` was the fifth exclusion until sc-17518 and is now WIRED above. It
# asserted `applied == 840` — the HOST map's 60 x 14 target count, never a measured application.
# Both pinned lightx2v files apply 60 x 12 = 720 with zero unmatched; no published Lightning release
# has ever trained `img_mod.1`/`txt_mod.1`. Evidence and the per-class assertion that replaced the
# raw count are in the test's doc comment.
key = "qwen-image-mlx"
repository = "SceneWorks/qwen-image-mlx"
revision = "8080a4171f1c8b7fca6c30491eafbe6ffab754bf"
license = "Apache-2.0"
size_class = "very-large"
profiles = ["media-macos"]
# QWEN_CONTROL_BASE_SNAPSHOT is the same artifact under a second name: the control engine takes the
# base transformer separately from the control branch. Both are wired by the `mlx-qwen-image` job.
environment = [
    "QWEN_IMAGE_MLX_SNAPSHOT",
    "MLX_GEN_QWEN_SNAPSHOT",
    "QWEN_CONTROL_BASE_SNAPSHOT",
]
download_files = ["bf16/*", "q8/*"]
expected_files = [
    "bf16/model_index.json",
    "bf16/tokenizer/tokenizer.json",
    "bf16/text_encoder/config.json",
    "bf16/text_encoder/model.safetensors.index.json",
    "bf16/transformer/config.json",
    "bf16/transformer/diffusion_pytorch_model.safetensors.index.json",
    "bf16/vae/config.json",
    "bf16/vae/diffusion_pytorch_model.safetensors",
    "q8/model_index.json",
    "q8/tokenizer/tokenizer.json",
    "q8/text_encoder/model.safetensors.index.json",
    "q8/transformer/config.json",
    "q8/transformer/model.safetensors",
    "q8/vae/diffusion_pytorch_model.safetensors",
]

