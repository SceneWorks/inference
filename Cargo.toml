[workspace]
resolver = "2"
members = [
    "crates/audio/candle-audio",
    "crates/audio/candle-audio-acestep",
    "crates/audio/candle-audio-catalog",
    "crates/audio/candle-audio-chatterbox",
    "crates/audio/candle-audio-chatterbox-ve",
    "crates/audio/candle-audio-clap",
    "crates/audio/candle-audio-kokoro",
    "crates/audio/candle-audio-mmaudio",
    "crates/audio/candle-audio-moss-sfx",
    "crates/audio/candle-audio-moss-tts",
    "crates/audio/candle-audio-moss-tts-realtime",
    "crates/audio/candle-audio-openvoice",
    "crates/audio/candle-audio-sheetsage2",
    "crates/audio/candle-audio-stable-audio-3",
    "crates/audio/candle-audio-whisper",
    "crates/audio/candle-audio-yue",
    "crates/audio/candle-audio-yue2",
    "crates/contracts/core-llm",
    "crates/contracts/core-llm/core-llm-testkit",
    "crates/contracts/gen-core",
    "crates/contracts/gen-core-testkit",
    "crates/kernels/candle-quant-kernels",
    "crates/bundles/*",
    "crates/llm/candle-llm",
    "crates/llm/mlx-llm",
    "crates/llm/mlx-llm/server",
    "crates/media/mlx-gen",
    "crates/media/mlx-gen/mlx-gen-*",
    "crates/media/candle-gen/candle-gen*",
]
exclude = [
    # iOS host-app scaffolding (epic 16774, sc-16780): the on-device smoke harness. Own Cargo.lock;
    # kept out so workspace builds and the single-lockfile invariant describe the product surface.
    "ios-host/smoke",
    "crates/media/candle-gen/vendor/candle-core",
    "crates/media/candle-gen/vendor/candle-kernels",
    "crates/media/candle-gen/vendor/candle-metal-kernels",
    "vendor/clip-regex/regex",
    "vendor/clip-regex/regex-automata",
    "vendor/clip-regex/regex-syntax",
]

# Internal packages are paths so a checkout has one contract package, one
# provider registry, and no dependency on unpublished repository state.
[workspace.dependencies]
core-llm = { path = "crates/contracts/core-llm" }
core-llm-testkit = { path = "crates/contracts/core-llm/core-llm-testkit" }
mlx-llm = { path = "crates/llm/mlx-llm" }
candle-llm = { path = "crates/llm/candle-llm" }
# The shared low-precision kernels (NVFP4 codec + cuBLASLt wrapper) both Candle engines serve
# from (sc-24135): one implementation, consumed by candle-gen (media) and candle-llm (LLM).
candle-quant-kernels = { path = "crates/kernels/candle-quant-kernels" }
sceneworks-gen-core = { path = "crates/contracts/gen-core" }
sceneworks-gen-core-testkit = { path = "crates/contracts/gen-core-testkit" }
runtime-catalog = { path = "crates/bundles/runtime-catalog" }
mlx-gen-catalog = { path = "crates/media/mlx-gen/mlx-gen-catalog" }
mlx-gen-ios-catalog = { path = "crates/media/mlx-gen/mlx-gen-ios-catalog" }
candle-gen-catalog = { path = "crates/media/candle-gen/candle-gen-catalog" }
candle-audio-catalog = { path = "crates/audio/candle-audio-catalog" }

# MLX fork pinned by commit SHA. fe22998b = 48ff5e78 + sc-25688's cpu-conv-border-clamp.patch
# (mlx-rs#34, upstream ml-explore/mlx af9a5924): MLX's CPU direct conv (grouped / depthwise /
# dilated) clamps its border loops to the output — with padding taller than the output (a 7x7
# depthwise conv on a 2x2 map, or its VJP) it wrote rows past the output buffer. Only those
# out-of-bounds writes change: Metal and every in-bounds CPU result are byte-identical.
# 48ff5e78 adds sc-24245's eval_pending_loads (mlx-rs#32: read a lazy
# graph's pending safetensors loads on the CPU stream) and cpu-stream-wait-error (mlx-rs#33: a GPU
# error seen by a CPU-stream wait reaches the host as Err instead of aborting); no kernel/numeric
# path moved. Its base
# 105a72fd adds sc-24245's sticky-command-buffer-error patch: a
# command buffer that fails mid-eval (e.g. a GPU-watchdog timeout) now fails that eval instead of
# returning corrupted arrays as Ok. Its parent d5a7fc01 adds sc-23053 recoverable async read errors,
# EINTR/partial-read handling, and per-array failure isolation. d5a7fc01's parent bd8f0e3c
# is 7151a9b2 + the sc-21382 prebuilt
# seam (build.rs links a prebuilt libmlx from PMETAL_MLX_PREBUILT_DIR after verifying its
# manifest key, declares rerun-if-env-changed on the deployment target, and the fork's
# prebuilt-mlx workflow publishes per-commit `prebuilt-<sha12>` releases —
# scripts/fetch-prebuilt-mlx.sh here consumes them; libmlx bytes are unchanged). 7151a9b2 was
# a858aaa1 + three tier-3 Apple cross-build fixes (mlx-sys bindgen stops binding the SDK's libc
# malloc/realloc, which nightly build-std rejects under suspicious_runtime_symbol_definitions;
# the cross-apple workflow asserts the emitted metallib triples and selects the completed build
# output). Rust API and MLX core are
# unchanged from a858aaa1, which adds P3's exact phase-1 epilogues, complete
# Metal, CUDA, and no-GPU backend definitions, and fail-closed Metal ABI/index/dispatch admission on top of the
# collision-free retained compiler leases and safe TLS teardown while preserving MLX 0.32.0.
# See mlx-gen/Cargo.toml for lineage.
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "fe22998bf73e5e785d7659beb2f24d624b785bda" }
mlx-sys = { package = "pmetal-mlx-sys", git = "https://github.com/michaeltrefry/mlx-rs", rev = "fe22998bf73e5e785d7659beb2f24d624b785bda" }

# Candle pins are shared by media and LLM providers.
# Upstream PR #3531 removes O(groups) launches from unit-stride depthwise convs (sc-12111).
candle-core = { git = "https://github.com/huggingface/candle", rev = "1e6aa85e867eb007cba1b8bae517a10d1aaf0c0d" }
candle-nn = { git = "https://github.com/huggingface/candle", rev = "1e6aa85e867eb007cba1b8bae517a10d1aaf0c0d" }
candle-transformers = { git = "https://github.com/huggingface/candle", rev = "1e6aa85e867eb007cba1b8bae517a10d1aaf0c0d" }
candle-flash-attn = { git = "https://github.com/huggingface/candle", rev = "1e6aa85e867eb007cba1b8bae517a10d1aaf0c0d" }

thiserror = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
safetensors = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Pure-Rust OpenEXR for the LTX-2.5 HDR lane (sc-18790). Scene-linear HDR frames are the render's
# real output and EXR is the interchange format every compositor reads, so the codec belongs in the
# tensor-free contract layer beside the colour math. Pure Rust (no OpenEXR/Imath C++ build) keeps
# the Windows candle lane and the CUDA images buildable; BSD-3-Clause is already on the deny.toml
# allow-list. A hand-rolled reader was rejected: conditioning EXRs come from third-party tools
# (Nuke/Blender/Houdini) and may be tiled, PIZ- or DWA-compressed, or multi-part.
exr = "1.74"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
# YuE's lyric section split (sc-19376) ports Python's `\[(\w+)\]` over Unicode text; Python's `\w`
# is exactly `[\p{L}\p{N}_]`, which needs the Unicode general-category tables `regex` carries.
# Already in the resolved graph transitively.
regex = "1"
rand = "0.9"
rand_distr = "0.5"
# Audio validation harness (sc-12854): repeatability hash over PCM bytes.
sha2 = "0.10"
# Audio validation harness (sc-12854): `getrusage(RUSAGE_SELF)` peak-RSS on macOS/Linux.
# Already in the resolved graph transitively.
libc = "0.2"
# Test-only RAII temp directories (sc-17704). Test helpers that built their own
# `env::temp_dir().join(format!("...-{pid}-{n}"))` fixture roots leaked one directory per call
# forever; a `TempDir` guard removes the tree on `Drop`, including out of a panicking test, and
# draws its uniqueness from OS randomness rather than a recyclable PID.
tempfile = "3"
# Build scripts that compile a C/C++ shim (mlx-gen-iris's JACCL-absent stub, sc-25689). Already in
# the resolved graph transitively (mlx-sys, candle).
cc = "1"

# Preserve Candle's dependency optimization for debug/test parity suites.
[profile.dev.package."*"]
opt-level = 3

# Preserve the vendored multi-architecture CUDA kernel override, the vendored candle-core:
# upstream 1e6aa85e plus the CUDA-graph parameter cache (#3564 + #3598) the decode graph runner
# needs (sc-24441; provenance and the eager-behaviour argument in
# crates/media/candle-gen/vendor/candle-core/VENDORED.md), and the vendored candle-metal-kernels:
# upstream 1e6aa85e plus the rank > 4 strided-reduce indexing fix (#3873; its VENDORED.md). A
# [patch] only applies to the top-level workspace: a consumer that builds these crates by git must
# carry the same three entries.
[patch."https://github.com/huggingface/candle"]
candle-core = { path = "crates/media/candle-gen/vendor/candle-core" }
candle-kernels = { path = "crates/media/candle-gen/vendor/candle-kernels" }
candle-metal-kernels = { path = "crates/media/candle-gen/vendor/candle-metal-kernels" }

# Source-bound CLIP allocation facts, same matcher versions and default behavior.
[patch.crates-io]
regex = { path = "vendor/clip-regex/regex" }
regex-automata = { path = "vendor/clip-regex/regex-automata" }
regex-syntax = { path = "vendor/clip-regex/regex-syntax" }
