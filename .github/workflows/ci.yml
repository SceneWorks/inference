name: Diagnostic Windows CPU architecture baseline (never merge)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sc-23935-windows-cpu-baseline
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: [self-hosted, windows, cuda]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
      CANDLE_LLM_DEVICE: cpu
      CUDA_COMPUTE_CAP: '80'
      CUDA_PATH: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9'
      VCVARS: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0
      - name: Compare immutable baseline and candidate (CPU tensors only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "E:\Codex-diagnostics\sc-23935\$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $logs = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-artifacts'
          New-Item -ItemType Directory -Force $root,$logs | Out-Null
          $env:CARGO_TARGET_DIR = Join-Path $root 'target'
          $env:TEMP = Join-Path $root 'tmp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          $results = @()
          foreach ($case in @(@{name='base';ref='0b084cbf'}, @{name='head';ref='62dab79527efc8263793243c82cfaa61a203fd69'})) {
            $name = $case.name
            $tree = Join-Path $root $name
            git worktree add --detach $tree $case.ref
            if ($LASTEXITCODE -ne 0) { throw "worktree failed for $name" }
            $sha = git -C $tree rev-parse HEAD
            $source = Join-Path $tree 'crates/llm/candle-llm/tests/architecture_forward.rs'
            Copy-Item $source (Join-Path $logs "$name-architecture_forward.rs")
            Copy-Item (Join-Path $tree 'Cargo.lock') (Join-Path $logs "$name-Cargo.lock")
            $text = Get-Content $source -Raw
            if (-not $text.Contains('Weights::from_map(case.weights.clone(), Device::Cpu)') -or -not $text.Contains('input_ids(&PROMPT, &Device::Cpu)')) { throw 'CPU fixture provenance changed' }
            $cmd = Join-Path $root "$name.cmd"
            @"
          @echo off
          call "%VCVARS%"
          if errorlevel 1 exit /b 90
          cd /d "$tree"
          rustc -Vv
          cargo -V
          nvcc --version
          cargo tree --locked -p candle-llm --features cuda -e features > "$logs\$name-dependencies.txt" 2>&1
          if errorlevel 1 exit /b 91
          cargo test --locked -p candle-llm --features cuda --test architecture_forward every_architecture_forward_is_bit_identical_to_the_base_branch -- --exact --nocapture
          exit /b %errorlevel%
          "@ | Set-Content $cmd
            $process = Start-Process cmd.exe -ArgumentList @('/d','/c', $cmd) -PassThru -RedirectStandardOutput "$logs\$name-stdout.log" -RedirectStandardError "$logs\$name-stderr.log"
            $timedOut = -not $process.WaitForExit(1500000)
            if ($timedOut) {
              taskkill /PID $process.Id /T /F | Out-File "$logs\$name-cancellation.log"
              $process.WaitForExit()
              $code = 124
            } else {
              $process.Refresh()
              $code = $process.ExitCode
            }
            $results += @{name=$name;sha="$sha";exit_code=$code;timed_out=$timedOut;device='CPU';cuda_feature=$true;build_jobs=4;target=$env:CARGO_TARGET_DIR}
            $results | ConvertTo-Json -Depth 4 | Set-Content "$logs\results.json"
          }
          # Diagnostic failures remain failures; both refs ran before adjudication.
          if (@($results | Where-Object { $_.exit_code -ne 0 }).Count -gt 0) { throw 'At least one immutable CPU golden probe failed; inspect both logs and raw float bits.' }
      - name: Preserve diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-cpu-architecture-baseline
          path: diagnostic-artifacts/
          if-no-files-found: error
