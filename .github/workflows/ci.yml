# NEVER MERGE: SC-23935 one-shot Windows CUDA signed-index diagnostic.
# This temporarily replaces the existing CI workflow only because GitHub cannot reliably dispatch a
# newly added workflow from a non-default branch. It has no automatic trigger and downloads no model.
name: SC-23935 CUDA attention diagnostic (NEVER MERGE)

on:
  workflow_dispatch:

permissions:
  contents: read

# This prevents duplicate copies of this one diagnostic. Physical GPU ownership is enforced
# separately by qwen38_bonsai_terminal.py and rechecked immediately before every probe.
concurrency:
  group: sc23935-cuda-attention-diagnostic
  cancel-in-progress: false

jobs:
  signed-index-boundary:
    name: Signed-index boundary and fixed Qwen3-VL geometry
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "12"
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_LAUNCH_BLOCKING: "1"
      RUST_BACKTRACE: "full"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Provenance verifies every integrated repair back to RC2. A shallow checkout contains
          # only the diagnostic head and makes `merge-base --is-ancestor` fail on valid history.
          fetch-depth: 0

      # dtolnay/rust-toolchain invokes Git Bash internally on Windows. Put the reviewed installation
      # first on PATH before the action starts; do not rely on a runner-specific shell association.
      - name: Select Git Bash before Rust setup
        shell: powershell
        run: |
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "required Git Bash is missing: $gitBash"
          }
          'C:\Program Files\Git\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0

      - name: Cache Cargo and CUDA objects
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Install reviewed CPython and initialize evidence
        shell: powershell
        run: |
          uv python install 3.12.10 --managed-python --no-registry --no-bin --no-config
          if ($LASTEXITCODE -ne 0) { throw "uv failed to install reviewed CPython" }
          $reviewedPython = (& uv python find 3.12.10 --managed-python --no-project --no-config).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $reviewedPython -PathType Leaf)) {
            throw "reviewed CPython 3.12.10 is unavailable"
          }
          & $reviewedPython -c 'import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version'
          if ($LASTEXITCODE -ne 0) { throw "reviewed CPython version check failed" }

          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'sc23935-cuda-attention'
          if (Test-Path -LiteralPath $evidenceRoot) {
            Remove-Item -LiteralPath $evidenceRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $evidenceRoot | Out-Null
          [ordered]@{
            schema_version = 1
            github_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            initialized_utc = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceRoot 'initialization.json') -Encoding utf8
          $reservation = Join-Path $env:LOCALAPPDATA 'SceneWorks\inference-reservations\cuda-device-0.json'
          $token = "sc23935-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "REVIEWED_PYTHON=$reviewedPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SC23935_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SC23935_GPU_RESERVATION=$reservation" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SC23935_RESERVATION_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # GitHub materializes each `run:` block separately, so a syntax error late in the workflow
      # would otherwise be discovered only after the cold CUDA build. Use a real YAML parser to
      # extract every PowerShell body, then parse each exact body with Windows PowerShell 5.
      - name: Parse every embedded Windows PowerShell script
        shell: powershell
        run: |
          $extractor = Join-Path $env:RUNNER_TEMP 'sc23935-extract-powershell.py'
          $scriptsJson = Join-Path $env:RUNNER_TEMP 'sc23935-powershell-scripts.json'
          @'
          import json
          import pathlib
          import sys
          import yaml

          workflow = yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          scripts = [
              step["run"]
              for job in workflow["jobs"].values()
              for step in job.get("steps", [])
              if step.get("shell") == "powershell"
          ]
          if not scripts or not all(isinstance(script, str) and script.strip() for script in scripts):
              raise SystemExit("workflow has a missing or empty PowerShell run block")
          pathlib.Path(sys.argv[2]).write_text(json.dumps(scripts), encoding="utf-8")
          '@ | Set-Content -LiteralPath $extractor -Encoding utf8
          uv run --no-project --no-config --python 3.12.10 --with pyyaml==6.0.3 `
            python $extractor '.github/workflows/ci.yml' $scriptsJson
          if ($LASTEXITCODE -ne 0) { throw 'failed to extract embedded PowerShell scripts' }
          $scripts = @(Get-Content -LiteralPath $scriptsJson -Raw | ConvertFrom-Json)
          for ($scriptIndex = 0; $scriptIndex -lt $scripts.Count; $scriptIndex++) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $scripts[$scriptIndex], [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "embedded PowerShell script $($scriptIndex + 1) has parser errors"
            }
          }
          Write-Host "SC23935_POWERSHELL_PARSE scripts=$($scripts.Count) passed=true"

      - name: Record source, lockfile, and hardware provenance
        shell: powershell
        run: |
          $status = @(git status --porcelain=v1)
          $requiredCommits = [ordered]@{
            rc2_runtime = '1468d5d0b04fd986d88876ca1eae5a07a76bcf9b'
            metadata_encodings = '3f7d162b3d9f388f815fa58c7e942ce02a2819ee'
            cuda_memory_domains = '9ec345efff1ce86bfc0c78622fc6464eeba222a6'
            campaign_acceptance = 'dffae93a62d73351dece31b8cc7d182da2869245'
            chunked_admission = '5951b55a737026070a0e4208697796606afd5061'
            bounded_attention = 'bedb4f9f82674b9296ce6659cdcf3e622eb2864d'
          }
          foreach ($commit in $requiredCommits.Values) {
            git merge-base --is-ancestor $commit HEAD
            if ($LASTEXITCODE -ne 0) { throw "required integrated commit is not an ancestor: $commit" }
          }
          $provenance = [ordered]@{
            schema_version = 1
            github_sha = $env:GITHUB_SHA
            checked_out_sha = (git rev-parse HEAD).Trim()
            clean_tree = ($status.Count -eq 0)
            status_porcelain = $status
            recent_commits = @(git log -6 --format='%H %s')
            required_integrated_commits = $requiredCommits
            cargo_lock_sha256 = (Get-FileHash -Algorithm SHA256 Cargo.lock).Hash.ToLowerInvariant()
            pinned_candle_revision = '1e6aa85e867eb007cba1b8bae517a10d1aaf0c0d'
            cuda_visible_devices = $env:CUDA_VISIBLE_DEVICES
            cuda_launch_blocking = $env:CUDA_LAUNCH_BLOCKING
          }
          if (-not $provenance.clean_tree) { throw "diagnostic checkout is not clean" }
          $cargo = Get-Content -LiteralPath Cargo.toml -Raw
          if ($cargo -notmatch [regex]::Escape($provenance.pinned_candle_revision)) {
            throw "Cargo.toml does not contain the expected pinned Candle revision"
          }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'provenance.json') -Encoding utf8
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py hardware --output (Join-Path $env:SC23935_EVIDENCE_ROOT 'hardware-before.json')
          if ($LASTEXITCODE -ne 0) { throw "hardware inventory failed" }

      - name: Build the one Candle CUDA library test executable
        shell: powershell
        run: |
          cmd /c "call `"$env:VCVARS`" && set" |
            ForEach-Object {
              if ($_ -match '^(.*?)=(.*)$') { Set-Item -Force "env:$($matches[1])" $matches[2] }
            }
          $env:PATH = "$(Join-Path $env:CUDA_PATH 'bin');$env:PATH"
          @(
            "rustc: $(rustc -Vv)",
            "cargo: $(cargo -V)",
            "nvcc: $(nvcc --version)"
          ) | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'build-toolchain.txt') -Encoding utf8
          $buildJson = Join-Path $env:SC23935_EVIDENCE_ROOT 'build.jsonl'
          $buildStderr = Join-Path $env:SC23935_EVIDENCE_ROOT 'build.stderr.log'
          $arguments = @(
            'test', '--locked', '-p', 'candle-llm', '--features', 'cuda', '--lib', '--no-run',
            '--message-format=json'
          )
          $build = Start-Process -FilePath cargo -ArgumentList $arguments -PassThru -Wait `
            -RedirectStandardOutput $buildJson -RedirectStandardError $buildStderr
          if ($build.ExitCode -ne 0) {
            Get-Content -LiteralPath $buildStderr
            throw "Candle CUDA test build failed with exit code $($build.ExitCode)"
          }
          $artifacts = @(
            Get-Content -LiteralPath $buildJson | ForEach-Object {
              try { $_ | ConvertFrom-Json } catch { $null }
            } | Where-Object {
              $_.reason -eq 'compiler-artifact' -and
              $_.target.name -eq 'candle_llm' -and
              $_.profile.test -eq $true -and
              $_.executable
            }
          )
          if ($artifacts.Count -ne 1) {
            throw "expected exactly one candle_llm library test executable, found $($artifacts.Count)"
          }
          $testBinary = [string]$artifacts[0].executable
          if (-not (Test-Path -LiteralPath $testBinary -PathType Leaf)) {
            throw "resolved test executable does not exist: $testBinary"
          }
          $binary = Get-Item -LiteralPath $testBinary
          [ordered]@{
            path = $binary.FullName
            size_bytes = $binary.Length
            sha256 = (Get-FileHash -Algorithm SHA256 $binary.FullName).Hash.ToLowerInvariant()
            cargo_arguments = $arguments
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'test-binary.json') -Encoding utf8
          "SC23935_TEST_BINARY=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Compilation creates no CUDA context. Acquire physical ownership only after the binary is
      # ready, then retain it across all three short fresh-process probes.
      - name: Reserve physical CUDA device 0
        shell: powershell
        run: |
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py reserve-gpu `
            --gpu-index 0 `
            --reservation $env:SC23935_GPU_RESERVATION `
            --evidence (Join-Path $env:SC23935_EVIDENCE_ROOT 'gpu-reservation.json') `
            --token $env:SC23935_RESERVATION_TOKEN
          if ($LASTEXITCODE -ne 0) {
            throw "CUDA device 0 is already reserved, changed identity, or has an active compute tenant"
          }

      - name: Run three fresh-process CUDA probes and verify their exact outcomes
        shell: powershell
        run: |
          cmd /c "call `"$env:VCVARS`" && set" |
            ForEach-Object {
              if ($_ -match '^(.*?)=(.*)$') { Set-Item -Force "env:$($matches[1])" $matches[2] }
            }
          $env:PATH = "$(Join-Path $env:CUDA_PATH 'bin');$env:PATH"

          function Confirm-Reservation([string]$label) {
            $output = Join-Path $env:SC23935_EVIDENCE_ROOT "$label-reservation-recheck.json"
            & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py check-gpu-reservation `
              --gpu-index 0 `
              --reservation $env:SC23935_GPU_RESERVATION `
              --token $env:SC23935_RESERVATION_TOKEN `
              --required-bytes 34359738368 `
              --output $output
            if ($LASTEXITCODE -ne 0) {
              throw "reservation recheck failed before ${label}: device changed, has a co-tenant, or has less than 32 GiB free"
            }
          }

          function Invoke-FreshProbe([string]$label, [string]$testName) {
            Confirm-Reservation $label
            $stdout = Join-Path $env:SC23935_EVIDENCE_ROOT "$label.stdout.log"
            $stderr = Join-Path $env:SC23935_EVIDENCE_ROOT "$label.stderr.log"
            $exitCodePath = Join-Path $env:SC23935_EVIDENCE_ROOT "$label.exit-code.txt"
            $arguments = @($testName, '--exact', '--ignored', '--nocapture', '--test-threads=1')
            [ordered]@{
              executable = $env:SC23935_TEST_BINARY
              arguments = $arguments
              timeout_seconds = 600
              reservation_recheck = "$label-reservation-recheck.json"
              environment = [ordered]@{
                CUDA_VISIBLE_DEVICES = $env:CUDA_VISIBLE_DEVICES
                CUDA_LAUNCH_BLOCKING = $env:CUDA_LAUNCH_BLOCKING
                RUST_BACKTRACE = $env:RUST_BACKTRACE
                RUST_TEST_THREADS = $env:RUST_TEST_THREADS
              }
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT "$label-command.json") -Encoding utf8

            # Start exactly the resolved test executable. A timeout kills only this owned PID; no
            # process-tree sweep can terminate another runner's processes.
            $process = Start-Process -FilePath $env:SC23935_TEST_BINARY -ArgumentList $arguments -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(600000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
              'timed-out-after-600-seconds' | Set-Content -LiteralPath $exitCodePath -Encoding ascii
              throw "$label exceeded its 10-minute process limit"
            }
            $process.Refresh()
            [string]$process.ExitCode | Set-Content -LiteralPath $exitCodePath -Encoding ascii
            Write-Host "SC23935_PROCESS label=$label pid=$($process.Id) exit_code=$($process.ExitCode)"
            Get-Content -LiteralPath $stdout
            Get-Content -LiteralPath $stderr
          }

          Invoke-FreshProbe 'softmax-8192-control' 'primitives::attention::tests::cuda_softmax_signed_index_boundary_8192_control'
          Invoke-FreshProbe 'softmax-8193-fault' 'primitives::attention::tests::cuda_softmax_signed_index_boundary_8193_fault_probe'
          Invoke-FreshProbe 'qwen3vl-9247-fixed' 'primitives::attention::tests::cuda_qwen3vl_context_512_shape_uses_bounded_eager_attention'

          $errors = New-Object System.Collections.Generic.List[string]
          function Require([bool]$condition, [string]$message) {
            if (-not $condition) { $errors.Add($message) }
          }
          function Combined([string]$label) {
            (Get-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT "$label.stdout.log") -Raw) + "`n" +
              (Get-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT "$label.stderr.log") -Raw)
          }
          function Require-Markers([string]$text, [string[]]$markers, [string]$label) {
            $last = -1
            foreach ($marker in $markers) {
              $position = $text.IndexOf($marker, [StringComparison]::Ordinal)
              Require ($position -ge 0) "$label is missing marker $marker"
              Require ($position -gt $last) "$label marker is out of order: $marker"
              $last = $position
            }
          }

          $controlExit = [int](Get-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'softmax-8192-control.exit-code.txt') -Raw)
          $faultExit = [int](Get-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'softmax-8193-fault.exit-code.txt') -Raw)
          $fixedExit = [int](Get-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'qwen3vl-9247-fixed.exit-code.txt') -Raw)
          $control = Combined 'softmax-8192-control'
          $fault = Combined 'softmax-8193-fault'
          $fixed = Combined 'qwen3vl-9247-fixed'

          Require ($controlExit -eq 0) "8192 control exited $controlExit, expected 0"
          Require ($control -match '(?m)^running 1 test\s*$') '8192 control did not execute exactly one selected test'
          Require ($control -match 'test result: ok\. 1 passed') '8192 control lacks a one-test passing summary'
          Require-Markers $control @(
            'SC23935_STAGE=softmax-8192-allocation-start',
            'SC23935_STAGE=softmax-8192-allocation-synchronized',
            'SC23935_STAGE=softmax-8192-launch',
            'SC23935_STAGE=softmax-8192-synchronized',
            'SC23935_STAGE=softmax-8192-readback-passed'
          ) '8192 control'
          Require ($control -match 'SC23935_READBACK sequence=8192 output_shape=\[1,32,8192,8192\].*finite=true') '8192 control lacks exact-shape finite readback proof'

          Require ($faultExit -ne 0) '8193 fault probe exited 0, expected a CUDA illegal-address failure'
          Require ($fault -match '(?m)^running 1 test\s*$') '8193 fault probe did not execute exactly one selected test'
          Require-Markers $fault @(
            'SC23935_STAGE=softmax-8193-allocation-start',
            'SC23935_STAGE=softmax-8193-allocation-synchronized',
            'SC23935_STAGE=softmax-8193-launch'
          ) '8193 fault probe'
          Require ($fault -match 'CUDA_ERROR_ILLEGAL_ADDRESS') '8193 fault probe did not fail with CUDA_ERROR_ILLEGAL_ADDRESS'
          Require (-not $fault.Contains('SC23935_STAGE=softmax-8193-synchronized')) '8193 fault probe reached the post-softmax synchronization marker'
          Require (-not $fault.Contains('SC23935_STAGE=softmax-8193-readback-passed')) '8193 fault probe reached the readback marker'

          Require ($fixedExit -eq 0) "9247 fixed production probe exited $fixedExit, expected 0"
          Require ($fixed -match '(?m)^running 1 test\s*$') '9247 fixed probe did not execute exactly one selected test'
          Require ($fixed -match 'test result: ok\. 1 passed') '9247 fixed probe lacks a one-test passing summary'
          Require-Markers $fixed @(
            'SC23935_STAGE=qwen3vl-9247-qkv-allocation-start',
            'SC23935_STAGE=qwen3vl-9247-qkv-synchronized',
            'SC23935_STAGE=qwen3vl-9247-production-sdpa-start',
            'SC23935_STAGE=qwen3vl-9247-production-sdpa-synchronized',
            'SC23935_STAGE=qwen3vl-9247-readback-passed'
          ) '9247 fixed probe'
          Require ($fixed -match 'SC23935_READBACK output_shape=\[1,32,9247,128\] sum=0.*finite=true expected=0 max_score_tile_elements=75751424') '9247 fixed probe lacks exact-shape finite bounded readback proof'

          $result = [ordered]@{
            schema_version = 1
            passed = ($errors.Count -eq 0)
            process_exit_codes = [ordered]@{
              softmax_8192_control = $controlExit
              softmax_8193_fault = $faultExit
              qwen3vl_9247_fixed = $fixedExit
            }
            errors = @($errors)
          }
          $result | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'verification.json') -Encoding utf8
          $result | ConvertTo-Json -Depth 5
          if ($errors.Count -ne 0) {
            throw "SC-23935 diagnostic verification failed: $($errors -join '; ')"
          }

      - name: Release physical CUDA device 0
        if: always()
        shell: powershell
        run: |
          if ($env:SC23935_GPU_RESERVATION -and (Test-Path -LiteralPath $env:SC23935_GPU_RESERVATION)) {
            & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py release-gpu `
              --gpu-index 0 `
              --reservation $env:SC23935_GPU_RESERVATION `
              --token $env:SC23935_RESERVATION_TOKEN
            if ($LASTEXITCODE -ne 0) { throw "failed to release the SC-23935 CUDA reservation" }
          }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc23935-cuda-attention-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\sc23935-cuda-attention
          if-no-files-found: error
          retention-days: 14
