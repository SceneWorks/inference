# NEVER MERGE: SC-23935 bounded Windows CPU parent context_64 diagnostic.
# This temporarily replaces CI because GitHub cannot dispatch a newly added workflow from a
# non-default branch. It has no automatic trigger and must be deleted with this branch.
name: SC-23935 CPU parent context_64 probe (NEVER MERGE)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc23935-cpu-context64-probe
  cancel-in-progress: false

jobs:
  cpu-parent-context64:
    name: Frozen CPU parent context_64 scale probe
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 165
    env:
      BONSAI_QWEN38_SNAPSHOT: ${{ vars.CANDLE_BONSAI_QWEN38_SNAPSHOT }}
      CARGO_BUILD_JOBS: "12"
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
      CUDA_VISIBLE_DEVICES: "0"
      EXPECTED_GPU_UUID: "GPU-b1a31911-c7b4-2901-3d8b-9a62e228bfc0"
      RUST_BACKTRACE: "full"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Initialize evidence and select Git Bash
        timeout-minutes: 2
        shell: powershell
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "sc23935-cpu-context64-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $evidenceRoot) { throw 'diagnostic evidence root already exists' }
          New-Item -ItemType Directory -Path $evidenceRoot | Out-Null
          [ordered]@{
            schema_version = 1
            github_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            initialized_utc = [DateTime]::UtcNow.ToString('o')
            scope = 'NEVER MERGE bounded diagnosis; full 19-cell campaign remains required'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceRoot 'initialization.json') -Encoding utf8
          $reservation = Join-Path $env:LOCALAPPDATA 'SceneWorks\inference-reservations\cuda-device-0.json'
          $token = "sc23935-cpu-context64-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "SC23935_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SC23935_GPU_RESERVATION=$reservation" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SC23935_RESERVATION_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "required Git Bash is missing: $gitBash"
          }
          'C:\Program Files\Git\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        timeout-minutes: 5
        with:
          toolchain: 1.96.0

      - name: Cache Cargo and CUDA objects
        timeout-minutes: 5
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        timeout-minutes: 5
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Install reviewed CPython and snapshot verifier dependencies
        timeout-minutes: 8
        shell: powershell
        run: |
          uv python install 3.12.10 --managed-python --no-registry --no-bin --no-config
          if ($LASTEXITCODE -ne 0) { throw 'uv failed to install reviewed CPython' }
          $reviewedPython = (& uv python find 3.12.10 --managed-python --no-project --no-config).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $reviewedPython -PathType Leaf)) {
            throw 'reviewed CPython 3.12.10 is unavailable'
          }
          & $reviewedPython -c 'import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version'
          if ($LASTEXITCODE -ne 0) { throw 'reviewed CPython version check failed' }
          $pythonPath = Join-Path $env:RUNNER_TEMP 'sc23935-python'
          & $reviewedPython -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes `
            --target $pythonPath -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt
          if ($LASTEXITCODE -ne 0) { throw 'snapshot verifier dependency installation failed' }
          "REVIEWED_PYTHON=$reviewedPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$pythonPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Parse every exact run block before the build or reservation. This catches Windows
      # PowerShell 5 syntax errors that a Linux YAML check cannot see.
      - name: Parse every embedded Windows PowerShell script
        timeout-minutes: 3
        shell: powershell
        run: |
          $extractor = Join-Path $env:RUNNER_TEMP 'sc23935-extract-powershell.py'
          $scriptsJson = Join-Path $env:RUNNER_TEMP 'sc23935-powershell-scripts.json'
          @'
          import json
          import pathlib
          import sys
          import yaml

          workflow = yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          scripts = [
              step["run"]
              for job in workflow["jobs"].values()
              for step in job.get("steps", [])
              if step.get("shell") == "powershell"
          ]
          if not scripts or not all(isinstance(script, str) and script.strip() for script in scripts):
              raise SystemExit("workflow has a missing or empty PowerShell run block")
          pathlib.Path(sys.argv[2]).write_text(json.dumps(scripts), encoding="utf-8")
          '@ | Set-Content -LiteralPath $extractor -Encoding utf8
          uv run --no-project --no-config --python 3.12.10 --with pyyaml==6.0.3 `
            python $extractor '.github/workflows/ci.yml' $scriptsJson
          if ($LASTEXITCODE -ne 0) { throw 'failed to extract embedded PowerShell scripts' }
          $scripts = @(Get-Content -LiteralPath $scriptsJson -Raw | ConvertFrom-Json)
          for ($scriptIndex = 0; $scriptIndex -lt $scripts.Count; $scriptIndex++) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $scripts[$scriptIndex], [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "embedded PowerShell script $($scriptIndex + 1) has parser errors"
            }
          }
          Write-Host "SC23935_POWERSHELL_PARSE scripts=$($scripts.Count) passed=true"

      - name: Prove Windows live and exited PID checks before model work
        timeout-minutes: 1
        shell: powershell
        run: |
          & $env:REVIEWED_PYTHON scripts/ci/sc23935_bounded_probe.py self-check-process-exit
          if ($LASTEXITCODE -ne 0) { throw 'Windows process-exit proof failed' }

      # One-time recovery for the exact failed diagnostic run. Its completed CPU
      # receipt and launch record were inspected before this source change. Never
      # remove another owner's reservation or kill a PID based on its number.
      - name: Release only the quiescent reservation from run 35589659377
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $oldToken = 'sc23935-cpu-bonsai-35589659377-1'
          $oldTokenSha = 'b2d9e461330ba896465d97cf4924e7099b6630735f5ee7166ccac12a9c96485f'
          $oldRunEnd = [DateTime]::Parse('2026-09-21T10:42:31Z', [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
          $reservationPath = $env:SC23935_GPU_RESERVATION
          $priorReservationPath = 'C:\Users\Michael\AppData\Local\SceneWorks\inference-reservations\cuda-device-0.json'
          $recovery = [ordered]@{
            schema_version = 1
            prior_run_id = '35589659377'
            prior_run_attempt = 1
            prior_runtime_sha = 'aa2400b74cc6560ba7b3a6c61b0aa39f3802205b'
            prior_token_sha256 = $oldTokenSha
            expected_gpu_uuid = $env:EXPECTED_GPU_UUID
            reservation_path = $reservationPath
            pid_checks = @()
            reservation_present = $false
            gpu_recheck_passed = $false
            release_attempted = $false
            release_succeeded = $false
            reservation_absent_after = $false
          }
          try {
            if (-not [string]::Equals([IO.Path]::GetFullPath($reservationPath), [IO.Path]::GetFullPath($priorReservationPath), [StringComparison]::OrdinalIgnoreCase)) {
              throw 'current runner reservation path differs from the exact prior Windows path'
            }
            foreach ($ownedPid in @(33712, 27036)) {
              $process = Get-CimInstance Win32_Process -Filter "ProcessId = $ownedPid"
              if ($null -ne $process) {
                $createdUtc = ([DateTime]$process.CreationDate).ToUniversalTime()
                $reused = $createdUtc -gt $oldRunEnd
                $recovery.pid_checks += [ordered]@{ pid = $ownedPid; status = $(if ($reused) { 'reused_after_prior_run' } else { 'could_be_prior_run' }); creation_utc = $createdUtc.ToString('o') }
                if (-not $reused) {
                  throw "prior diagnostic PID $ownedPid may still be alive; retain reservation"
                }
                Write-Host "PID $ownedPid was reused after the prior diagnostic ended; no process was killed"
              } else {
                $recovery.pid_checks += [ordered]@{ pid = $ownedPid; status = 'absent'; creation_utc = $null }
              }
            }
            $recovery.reservation_present = Test-Path -LiteralPath $reservationPath -PathType Leaf
            if ($recovery.reservation_present) {
              $record = Get-Content -LiteralPath $reservationPath -Raw | ConvertFrom-Json
              if ($record.schema_version -ne 1 -or $record.gpu_index -ne 0 -or
                  $record.gpu_uuid -ne $env:EXPECTED_GPU_UUID -or $record.token_sha256 -ne $oldTokenSha) {
                throw 'GPU0 reservation differs from the exact prior diagnostic owner'
              }
              $recheckPath = Join-Path $env:SC23935_EVIDENCE_ROOT 'prior-reservation-recheck.json'
              & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py check-gpu-reservation --gpu-index 0 --reservation $reservationPath --token $oldToken --output $recheckPath
              if ($LASTEXITCODE -ne 0) { throw 'GPU0 identity or no-tenant recovery check failed' }
              $recheck = Get-Content -LiteralPath $recheckPath -Raw | ConvertFrom-Json
              if ($recheck.selected_gpu_uuid -ne $env:EXPECTED_GPU_UUID -or $recheck.selected_gpu_compute_processes.Count -ne 0) {
                throw 'GPU0 recovery recheck does not prove the selected device is idle'
              }
              $recovery.gpu_recheck_passed = $true
              $recovery.release_attempted = $true
              & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py release-gpu --gpu-index 0 --reservation $reservationPath --token $oldToken
              if ($LASTEXITCODE -ne 0) { throw 'exact prior diagnostic reservation release failed' }
              $recovery.release_succeeded = $true
              $recovery.reservation_absent_after = -not (Test-Path -LiteralPath $reservationPath)
              if (-not $recovery.reservation_absent_after) { throw 'prior reservation still exists after owner-token release' }
              Write-Host 'Released exact quiescent reservation from run 35589659377'
            } else {
              $recovery.reservation_absent_after = $true
              Write-Host 'Exact prior reservation is already absent; no reservation was removed'
            }
          } catch {
            $recovery['failure'] = $_.Exception.Message
            throw
          } finally {
            $json = $recovery | ConvertTo-Json -Depth 5
            [IO.File]::WriteAllText((Join-Path $env:SC23935_EVIDENCE_ROOT 'prior-reservation-recovery.json'), $json, [Text.UTF8Encoding]::new($false))
          }


      - name: Record exact source, model, and hardware provenance
        timeout-minutes: 7
        shell: powershell
        run: |
          $status = @(git status --porcelain=v1)
          $base = '7b7730a1a06a231ce337352dbc5b525eb3f8cc78'
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'probe does not descend from exact RC4 source' }
          if ($status.Count -ne 0) { throw 'diagnostic checkout is not clean' }
          $candleRevision = '1e6aa85e867eb007cba1b8bae517a10d1aaf0c0d'
          if ((Get-Content -LiteralPath Cargo.toml -Raw) -notmatch [regex]::Escape($candleRevision)) {
            throw 'Cargo.toml lost the expected pinned Candle revision'
          }
          [ordered]@{
            schema_version = 1
            github_sha = $env:GITHUB_SHA
            checked_out_sha = (git rev-parse HEAD).Trim()
            rc4_base_sha = $base
            diagnostic_changed_paths = @(git diff --name-only "$base..HEAD")
            clean_tree = $true
            cargo_lock_sha256 = (Get-FileHash -Algorithm SHA256 Cargo.lock).Hash.ToLowerInvariant()
            pinned_candle_revision = $candleRevision
            expected_parent_revision = '1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0'
            parent_snapshot = $env:BONSAI_QWEN38_SNAPSHOT
            expected_gpu_index = 0
            expected_gpu_uuid = $env:EXPECTED_GPU_UUID
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'provenance.json') -Encoding utf8
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py hardware `
            --output (Join-Path $env:SC23935_EVIDENCE_ROOT 'hardware-before.json')
          if ($LASTEXITCODE -ne 0) { throw 'hardware inventory failed' }
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py qualify-snapshots `
            --platform windows `
            --binding BONSAI_QWEN38_SNAPSHOT=bonsai-qwen38-parent `
            --output (Join-Path $env:SC23935_EVIDENCE_ROOT 'snapshot-metadata.json')
          if ($LASTEXITCODE -ne 0) { throw 'frozen parent snapshot identity check failed' }

      - name: Build the existing native Candle comparison executable
        timeout-minutes: 45
        shell: powershell
        run: |
          cmd /c "call `"$env:VCVARS`" && set" |
            ForEach-Object {
              if ($_ -match '^(.*?)=(.*)$') { Set-Item -Force "env:$($matches[1])" $matches[2] }
            }
          $env:PATH = "$(Join-Path $env:CUDA_PATH 'bin');$env:PATH"
          @(
            "rustc: $(rustc -Vv)",
            "cargo: $(cargo -V)",
            "nvcc: $(nvcc --version)"
          ) | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'build-toolchain.txt') -Encoding utf8
          $runner = Join-Path $env:RUNNER_TEMP 'sc23935-run-process.py'
          @'
          import json
          import pathlib
          import subprocess
          import sys
          import time

          stdout_path, stderr_path, receipt_path, *command = sys.argv[1:]
          started = time.time()
          with open(stdout_path, "wb") as stdout, open(stderr_path, "wb") as stderr:
              completed = subprocess.run(command, stdout=stdout, stderr=stderr, check=False)
          pathlib.Path(receipt_path).write_text(json.dumps({
              "command": command,
              "returncode": completed.returncode,
              "elapsed_seconds": time.time() - started,
          }, indent=2), encoding="utf-8")
          raise SystemExit(completed.returncode)
          '@ | Set-Content -LiteralPath $runner -Encoding utf8
          $buildJson = Join-Path $env:SC23935_EVIDENCE_ROOT 'build.jsonl'
          $buildStderr = Join-Path $env:SC23935_EVIDENCE_ROOT 'build.stderr.log'
          $buildReceipt = Join-Path $env:SC23935_EVIDENCE_ROOT 'build-process.json'
          & $env:REVIEWED_PYTHON $runner $buildJson $buildStderr $buildReceipt cargo `
            test --locked --release -p candle-llm --features cuda --test qwen38_bonsai --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath $buildStderr
            throw 'Candle CUDA comparison build failed'
          }
          $binaryPath = Join-Path $env:SC23935_EVIDENCE_ROOT 'binary.txt'
          Get-Content -LiteralPath $buildJson | & $env:REVIEWED_PYTHON `
            scripts/release/qwen38_bonsai_terminal.py resolve-binary --target qwen38_bonsai |
            Set-Content -LiteralPath $binaryPath -Encoding ascii
          if ($LASTEXITCODE -ne 0) { throw 'comparison binary resolution failed' }
          $binary = (Get-Content -LiteralPath $binaryPath -Raw).Trim()
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "resolved comparison binary is missing: $binary"
          }
          [ordered]@{
            path = $binary
            size_bytes = (Get-Item -LiteralPath $binary).Length
            sha256 = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'binary.json') -Encoding utf8
          "SC23935_TEST_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Reserve GPU0 to keep this shared Windows host exclusive during the CPU probe.
      - name: Reserve GPU0 and preflight the exact CPU profile
        timeout-minutes: 5
        shell: powershell
        run: |
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py reserve-gpu --gpu-index 0 --reservation $env:SC23935_GPU_RESERVATION --evidence (Join-Path $env:SC23935_EVIDENCE_ROOT 'gpu-reservation.json') --token $env:SC23935_RESERVATION_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'GPU0 is unavailable, co-tenanted, or already reserved' }
          'SC23935_RESERVATION_ACQUIRED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $reservation = Get-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'gpu-reservation.json') -Raw | ConvertFrom-Json
          if ($reservation.gpu_index -ne 0 -or $reservation.gpu_uuid -ne $env:EXPECTED_GPU_UUID) { throw 'wrong physical GPU0 identity' }
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py preflight --model-key bonsai-qwen38-parent --load-profile candle-dense-cpu --output (Join-Path $env:SC23935_EVIDENCE_ROOT 'cpu-preflight.json')
          if ($LASTEXITCODE -ne 0) { throw 'dense CPU parent preflight failed' }
          $preflight = Get-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'cpu-preflight.json') -Raw | ConvertFrom-Json
          if ($preflight.admitted -ne $true) { throw 'CPU preflight did not admit the frozen parent' }

      - name: Run CPU parent context_64 with the 1200-second native watchdog
        id: cpu_probe
        timeout-minutes: 30
        continue-on-error: true
        shell: powershell
        run: |
          $binary = (Get-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'binary.txt') -Raw).Trim()
          $root = $env:SC23935_EVIDENCE_ROOT
          & $env:REVIEWED_PYTHON scripts/ci/sc23935_bounded_probe.py --row (Join-Path $root 'cpu-parent') --record (Join-Path $root 'cpu-launch.json') --timeout-seconds 1500 -- $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py run --diagnostic-timeout-seconds 1200 --candle-device cpu --binary $binary --test-name native_comparison --model-id candle-cpu-qwen38-parent-context64-probe --model-key bonsai-qwen38-parent --model-revision 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0 --snapshot $env:BONSAI_QWEN38_SNAPSHOT --model-path $env:BONSAI_QWEN38_SNAPSHOT --runtime-sha $env:GITHUB_SHA --cases context_64 --preflight (Join-Path $root 'cpu-preflight.json') --output (Join-Path $root 'cpu-parent')
          if ($LASTEXITCODE -ne 0) { throw "CPU probe status $LASTEXITCODE; inspect partial receipt and stages" }

      - name: Prove the CPU child tree is absent
        timeout-minutes: 2
        id: cpu_cleanup
        if: always() && env.SC23935_RESERVATION_ACQUIRED == '1'
        shell: powershell
        run: |
          $path = Join-Path $env:SC23935_EVIDENCE_ROOT 'cpu-launch.json'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'missing CPU launch cleanup proof' }
          $proof = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($proof.safe_to_continue -ne $true -or $proof.native_pids.Count -lt 1) { throw 'CPU child cleanup is unproven' }
          foreach ($nativePid in $proof.native_pids) {
            if (Get-CimInstance Win32_Process -Filter "ProcessId = $nativePid") { throw "CPU native PID $nativePid is alive" }
          }
          'safe=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Release only a quiescent owned GPU0 reservation
        timeout-minutes: 2
        id: release
        if: always() && env.SC23935_RESERVATION_ACQUIRED == '1'
        shell: powershell
        run: |
          if ('${{ steps.cpu_cleanup.outputs.safe }}' -ne 'true') {
            throw 'native cleanup unproven; retain owned reservation for coordinator cleanup'
          }
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py check-gpu-reservation --gpu-index 0 --reservation $env:SC23935_GPU_RESERVATION --token $env:SC23935_RESERVATION_TOKEN --output (Join-Path $env:SC23935_EVIDENCE_ROOT 'gpu-recheck.json')
          if ($LASTEXITCODE -ne 0) { throw 'GPU0 ownership or no-co-tenant release recheck failed' }
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py release-gpu --gpu-index 0 --reservation $env:SC23935_GPU_RESERVATION --token $env:SC23935_RESERVATION_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'owned GPU0 reservation release failed' }
          'released=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate and seal bounded diagnostic evidence
        timeout-minutes: 5
        if: always()
        shell: powershell
        run: |
          & $env:REVIEWED_PYTHON scripts/ci/sc23935_bounded_probe.py validate --root $env:SC23935_EVIDENCE_ROOT --runtime-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'diagnostic evidence failed validation; full campaign remains required' }

      - name: Upload diagnostic evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc23935-cpu-context64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\sc23935-cpu-context64-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
