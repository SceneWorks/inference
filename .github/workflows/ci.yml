name: Diagnostic Metal Toolchain provisioning (never merge)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sc-23935-metal-toolchain-repair
  cancel-in-progress: false
jobs:
  provision-metal:
    runs-on: [self-hosted, macOS, ARM64, rw-llm]
    timeout-minutes: 30
    steps:
      - name: Inspect and provision only the missing selected Metal Toolchain
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/metal-toolchain-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence"
          echo "METAL_REPAIR_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          exec > >(tee "$evidence/provision.log") 2>&1
          echo "runner=$RUNNER_NAME"
          hostname
          sw_vers
          developer_dir="$(xcode-select -p)"
          echo "selected_developer_dir=$developer_dir"
          xcodebuild -version | tee "$evidence/xcode-version.txt"
          df -Pk "$developer_dir" "$HOME" "$RUNNER_TEMP"
          test "$RUNNER_NAME" = nax-macos-2
          test "$(hostname -s)" = Michael-MBP
          grep -Fx 'Xcode 27.0' "$evidence/xcode-version.txt"
          grep -Fx 'Build version 27A266a' "$evidence/xcode-version.txt"
          # Apple's xcrun help documents --no-cache and --kill-cache. Only invalidate
          # lookup entries when bypassing them proves the installed tool can run.
          xcodebuild -showComponent MetalToolchain -json > "$evidence/component-before.json" 2>&1 || true
          xcrun --find metal > "$evidence/metal-path.txt" 2>&1 || true
          hdiutil info > "$evidence/mounted-images.txt"
          if xcrun metal --version > "$evidence/metal-before.txt" 2>&1; then
            cat "$evidence/metal-before.txt"
            echo 'Metal Toolchain already available; no activation performed.'
          elif xcrun --no-cache metal --version > "$evidence/metal-no-cache.txt" 2>&1; then
            cat "$evidence/metal-no-cache.txt"
            xcrun --kill-cache
          else
            cat "$evidence/metal-before.txt" "$evidence/metal-no-cache.txt"
            grep -F 'missing Metal Toolchain' "$evidence/metal-before.txt"
            # Download completed in run35458077207. Apple documents importing a
            # downloaded component; use the installed xcodebuild help's -importPath syntax.
            asset='/System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/389a215aea89fda945178f9fb8bcdc6aa0e20570.asset/AssetData/Restore/022-20184-410.dmg'
            test -r "$asset"
            ls -l "$asset"
            xcodebuild -help > "$evidence/xcodebuild-help.txt" 2>&1
            grep -F -- '-importComponent <componenttype> -importPath <bundlepath>' "$evidence/xcodebuild-help.txt"
            for volume_path in "$developer_dir" "$HOME" "$RUNNER_TEMP"; do
              free_kib="$(df -Pk "$volume_path" | awk 'NR == 2 { print $4 }')"
              case "$free_kib" in ''|*[!0-9]*) echo 'Cannot establish free disk'; exit 1;; esac
              test "$free_kib" -ge 15728640
            done
            xcodebuild -importComponent MetalToolchain -importPath "$asset" < /dev/null
            xcodebuild -showComponent MetalToolchain -json > "$evidence/component-after.json" 2>&1
          fi
          # No compiler invocation, model load, or GPU execution: version query only.
          xcrun metal --version | tee "$evidence/metal-after.txt"
          test "$(xcode-select -p)" = "$developer_dir"
          echo 'Selected Metal Toolchain verified.'
      - name: Preserve provisioning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metal-toolchain-provisioning
          path: ${{ env.METAL_REPAIR_EVIDENCE }}/
          if-no-files-found: error
