          grep -Fq "test dit_parity::reading_the_ffn_halves_gate_first_breaks_parity ..." "$log"
          grep -Fq "test dit_parity::the_modality_term_of_the_adaln_index_is_load_bearing ..." "$log"
          grep -Fq "test dit_parity::the_adaln_table_is_reshaped_before_it_is_chunked ..." "$log"
          grep -Fq "test dit_parity::every_block_weight_is_load_bearing ..." "$log"
