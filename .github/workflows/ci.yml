      - name: Prove H3 full DitBlock model-block parity on Metal
        env:
          HF_HOME: ${{ runner.temp }}/h3-dit-parity-${{ github.run_id }}-${{ github.run_attempt }}/hf-home
          HF_HUB_CACHE: ${{ runner.temp }}/h3-dit-parity-${{ github.run_id }}-${{ github.run_attempt }}/hub
          HUGGINGFACE_HUB_CACHE: ${{ runner.temp }}/h3-dit-parity-${{ github.run_id }}-${{ github.run_attempt }}/hub
          HF_HUB_OFFLINE: "1"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/h3-dit-parity-mlx.log"
          # Full DitBlock (attention + FFN) executions. Individual linear/AdaLN/packing
