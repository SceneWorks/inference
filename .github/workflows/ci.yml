# NEVER MERGE: read-only SC-23935 evidence from the active RC3 Candle campaign.
# No checkout, build, model execution, CUDA context, process signal, or service mutation is permitted.
name: SC-23935 RC3 active Candle health diagnostic (NEVER MERGE)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc23935-rc3-active-candle-health
  cancel-in-progress: false

jobs:
  collect-windows:
    name: Read-only active Candle process and GPU metadata
    runs-on: [self-hosted, Windows, X64, cuda, real-weights]
    timeout-minutes: 5
    steps:
      - name: Assert idle peer and collect two bounded snapshots
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceName = "sc23935-rc3-cuda-active-health-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidence = Join-Path $env:RUNNER_TEMP $evidenceName
          New-Item -ItemType Directory -Path $evidence | Out-Null

          [ordered]@{
            github_sha = $env:GITHUB_SHA
            github_run_id = $env:GITHUB_RUN_ID
            github_run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            captured_utc = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'identity.json') -Encoding utf8

          if ($env:RUNNER_NAME -ne 'cuda-windows') {
            "refused_runner=$env:RUNNER_NAME expected=cuda-windows" |
              Set-Content -LiteralPath (Join-Path $evidence 'refused-runner.txt') -Encoding ascii
            exit 64
          }

          function Write-ProcessSnapshot {
            param([string]$Destination)
            $capturedTime = [DateTime]::UtcNow
            $processes = @(Get-CimInstance Win32_Process | ForEach-Object {
              $started = $null
              $elapsed = $null
              try { $started = $_.CreationDate.ToUniversalTime().ToString('o') } catch {}
              try { $elapsed = ($capturedTime - $_.CreationDate.ToUniversalTime()).TotalSeconds } catch {}
              [ordered]@{
                pid = $_.ProcessId
                parent_pid = $_.ParentProcessId
                process_name = $_.Name
                rss_bytes = [uint64]$_.WorkingSetSize
                cpu_seconds = ([uint64]$_.KernelModeTime + [uint64]$_.UserModeTime) / 10000000.0
                started_utc = $started
                elapsed_seconds = $elapsed
              }
            })
            $operatingSystem = Get-CimInstance Win32_OperatingSystem
            [ordered]@{
              captured_utc = $capturedTime.ToString('o')
              host_memory = [ordered]@{
                total_visible_kib = [uint64]$operatingSystem.TotalVisibleMemorySize
                free_physical_kib = [uint64]$operatingSystem.FreePhysicalMemory
                total_virtual_kib = [uint64]$operatingSystem.TotalVirtualMemorySize
                free_virtual_kib = [uint64]$operatingSystem.FreeVirtualMemory
              }
              processes = $processes
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $Destination -Encoding utf8
          }

          function Write-GpuSnapshot {
            param([string]$Prefix)
            $timestamp = [DateTime]::UtcNow.ToString('o')
            $gpuOutput = & nvidia-smi --id=0 --query-gpu=index,uuid,memory.total,memory.free,memory.used,utilization.gpu --format=csv,noheader,nounits 2>&1
            $gpuExit = $LASTEXITCODE
            $computeOutput = & nvidia-smi --id=0 --query-compute-apps=gpu_uuid,pid,used_memory --format=csv,noheader,nounits 2>&1
            $computeExit = $LASTEXITCODE
            [ordered]@{
              captured_utc = $timestamp
              gpu_query_exit_code = $gpuExit
              compute_query_exit_code = $computeExit
              gpu_query = @($gpuOutput | ForEach-Object { $_.ToString() })
              compute_apps_query = @($computeOutput | ForEach-Object { $_.ToString() })
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "$Prefix.json" -Encoding utf8
            if ($gpuExit -ne 0 -or $computeExit -ne 0) {
              throw "nvidia-smi read-only metadata query failed: gpu=$gpuExit compute=$computeExit"
            }
          }

          function Copy-BoundedTail {
            param(
              [string]$Source,
              [string]$Destination,
              [int64]$MaximumBytes = 65536
            )
            if (-not (Test-Path -LiteralPath $Source -PathType Leaf)) {
              return [ordered]@{ path = $Source; exists = $false }
            }
            $item = Get-Item -LiteralPath $Source
            $take = [Math]::Min($MaximumBytes, $item.Length)
            $buffer = New-Object byte[] ([int]$take)
            $stream = [System.IO.File]::Open($Source, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
            try {
              if ($take -gt 0) {
                [void]$stream.Seek(-$take, [System.IO.SeekOrigin]::End)
                $read = 0
                while ($read -lt $take) {
                  $count = $stream.Read($buffer, $read, [int]($take - $read))
                  if ($count -eq 0) { break }
                  $read += $count
                }
                if ($read -gt 0) {
                  [System.IO.File]::WriteAllBytes($Destination, $buffer[0..($read - 1)])
                } else {
                  [System.IO.File]::WriteAllBytes($Destination, [byte[]]@())
                }
              } else {
                $read = 0
                [System.IO.File]::WriteAllBytes($Destination, [byte[]]@())
              }
            } finally {
              $stream.Dispose()
            }
            return [ordered]@{
              path = $Source
              exists = $true
              length_bytes = $item.Length
              copied_tail_bytes = $read
              last_write_utc = $item.LastWriteTimeUtc.ToString('o')
              tail_sha256 = (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }

          Write-ProcessSnapshot -Destination (Join-Path $evidence 'processes-1.json')
          Write-GpuSnapshot -Prefix (Join-Path $evidence 'gpu-1')
          Start-Sleep -Seconds 10
          Write-ProcessSnapshot -Destination (Join-Path $evidence 'processes-2.json')
          Write-GpuSnapshot -Prefix (Join-Path $evidence 'gpu-2')

          $campaign = 'D:\actions-runner-2\_work\_temp\qwen38-bonsai-candle'
          $row = Join-Path $campaign 'candle-cuda-bonsai-gguf'
          $stdout = Join-Path $row 'stdout.log'
          $stderr = Join-Path $row 'stderr.log'
          $tailRecords = @(
            Copy-BoundedTail -Source $stdout -Destination (Join-Path $evidence 'active-row-stdout.tail.log')
            Copy-BoundedTail -Source $stderr -Destination (Join-Path $evidence 'active-row-stderr.tail.log')
          )
          [ordered]@{
            campaign_root = $campaign
            row = 'candle-cuda-bonsai-gguf'
            row_path = $row
            row_exists = (Test-Path -LiteralPath $row -PathType Container)
            files = $tailRecords
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence 'active-row-metadata.json') -Encoding utf8

          Get-ChildItem -LiteralPath $evidence -File |
            Select-Object Name,Length,LastWriteTimeUtc |
            ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $evidence 'file-list.json') -Encoding utf8

      - name: Upload bounded read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc23935-rc3-cuda-active-health-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\sc23935-rc3-cuda-active-health-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
