          grep -Fq "test dit_parity::weight_mapping_is_exhaustive_over_the_block_stack ..." "$log"

  # Non-executing gate for the CUDA feature (compile, lint, docs) — runs on every PR/push that touches
  # the lane.
  #
  # This exists because `--features cuda` code is invisible to every other lane: macOS cannot build it
  # (no CUDA toolkit) and the CPU/Linux lanes do not enable the feature, so a `#[cfg(feature = "cuda")]`
  # file can be merged in a state that does not compile, does not lint, or has broken docs, and nothing
  # notices. That is not hypothetical —
  # `candle-gen-mochi`'s `tier_parity.rs` shipped with three E0308s and was only caught by hand on the
  # CUDA box (sc-11990). `--tests` is load-bearing here: the break was in a test target, so a bare
  # `cargo build` would still have missed it.
  #
  # The broad package build remains deliberately `--no-run`: compiling needs nvcc + MSVC but never
  # creates a CUDA context or allocates VRAM, so this is safe to run on every PR on the shared
  # self-hosted rig without competing for the GPU. One weights-free catalog conformance test executes
  # below because it needs the CUDA-gated registration graph but never touches a device; executing the
  # rest of the CUDA tests stays in the manual `windows-cuda` lane.
  windows-cuda-check:
    name: Candle CUDA compile check (Windows)
    needs: changes
    # This persistent runner may execute repository build scripts, so a public-fork PR must never
    # reach it. Pushes, manual dispatches, and PRs whose head belongs to this repository remain
    # eligible; hosted jobs continue to validate fork PRs. merge_group is trusted for the same
    # reason a push is: `gh-readonly-queue/main/**` is a ref in THIS repository, created by the
    # queue from already-reviewed heads, so fork code cannot arrive by that path. Keep the guard
    # keyed on `!= 'pull_request'` rather than an allowlist of trusted events, so a new trusted
    # event does not silently lose CUDA coverage.
    if: >-
      needs.changes.outputs.windows_cuda == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows, cuda]
    env:
      # Two listeners share this 48-thread host. Leaving Cargo at its per-process default lets
      # overlapping CI runs launch roughly 96 compilers and trigger Windows DLL-init failures.
      # Twelve jobs per listener leaves headroom for sccache, linkers, nvcc, and the runner itself.
      CARGO_BUILD_JOBS: "12"
      # 80 IS CORRECT ON A BLACKWELL BOX, AND RAISING IT TO 120 IS A REGRESSION (sc-19545).
      #
      # This pool is `MICHAEL-TRX50`: 2x RTX PRO 6000, 97887 MiB each, driver 596.36. "80 is
      # Ampere, the box is Blackwell" therefore reads as an obvious bug, and is not one.
      # `CUDA_COMPUTE_CAP` names the BOTTOM RUNG of an architecture ladder, never the hardware. It
      # seeds one cudaforge `-gencode`; `vendor/candle-kernels/build.rs` appends sm_90, sm_120 and
      # `compute_120` PTX on top (sc-7544), so the shipped `libmoe.a` is a fatbin that runs Ampere
      # -> Ada -> Hopper -> Blackwell from one binary. Set this to 120 and the bottom rung
      # disappears: quantized models stop working on every pre-Blackwell customer GPU, and the
      # dense PTX floor rises to `compute_120` so even dense models stop loading there.
      #
      # The hazard the number LOOKS like -- quantized matmuls silently returning zeros -- is real,
      # was sc-7544, and is fixed. What must actually hold is that the runner's arch is served by
      # SOME rung, which is a different claim from "the cap matches the GPU". Concretely, the
      # ladder is sm_80 (this value) + sm_90 + sm_120 SASS + `compute_120` PTX, so this pool's
      # cards are covered natively.
      #
      # KNOWN GAP, recorded so it is not rediscovered: **datacenter Blackwell sm_100 (B100/B200) is
      # NOT covered** on the quant path. Major 10 is served neither by the sm_9x/sm_12x cubins
      # (SASS is compatible only upward WITHIN one major) nor by the `compute_120` PTX floor (120 >
      # 100). build.rs states this is deliberate. If such a card ever joins this pool, quantized
      # matmuls return zeros silently -- add `code=sm_100` to build.rs, do NOT touch this value.
      #
      # sm_120 for the current cards is a SPEC fact, not a CI measurement: no lane has ever queried
      # `compute_cap`, and nothing in this repository does. `nvidia-smi` here reports only the
      # truncated model name and memory.
      #
      # NOTHING ENFORCES ANY OF THIS. sc-19545 verified it by hand and wrote it down; a drift guard
      # was explicitly scoped out. If someone edits this value, the first symptom is black
      # renders on customer GPUs, not a red build.
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Verify native MOSS transport guards without GPU execution
        shell: powershell
        run: ./scripts/ci/moss-native-terminal.ps1 -SelfTest
      - name: Install pinned uv for Windows supervisor smoke
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12 for Windows supervisor smoke
        shell: cmd
        run: call scripts\ci\real-weights\candle-llm\install-reviewed-cpython-3-12.cmd
      - name: Exercise Windows media supervisor process tree (no GPU)
        shell: cmd
        run: '"%REVIEWED_PYTHON%" -m unittest scripts.tests.test_media_campaign_supervisor.WindowsSupervisorTests -v'
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Cache Cargo and CUDA objects
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Persistent self-hosted box: rust-cache's post step deletes rustup.exe from
          # %CARGO_HOME%\bin (see the macos-nax job for the full mechanism), leaving the
          # proxies dangling. This is the real cause of the breakage that
          # scripts/win/use-real-rust-toolchain.cmd works around in the app repo.
          cache-bin: "false"
          # Save only on `main` — see the note on the `workspace` job's cache step. Unlike the
          # `windows-cuda` lane below, this one runs on every PR that touches the CUDA paths, so it
          # is one of the lanes that was writing a PR-scoped cache nothing else could read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile Candle CUDA packages and test binaries (no GPU required)
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --lib --tests -p candle-llm -p candle-quant-kernels -p "candle-gen*" -p "candle-audio*" -p runtime-cuda --features cuda --no-run
      - name: Execute weights-free CUDA catalog conformance (no GPU required)
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked -p candle-gen-catalog --features cuda tests::every_registered_memory_strategy_rejects_cross_route_decode_geometry -- --exact
      # The lint twin of the compile check above. The `candle-cpu` lane already Clippies this same
      # package set with --all-targets, but it has no CUDA toolkit and so cannot pass --features cuda:
      # every `#[cfg(feature = "cuda")]` target is invisible to it and reaches main unlinted. That is
      # not hypothetical either — a `print_literal` in candle-gen-krea's cuda-gated
      # `nvfp4_krea_dit_gpu.rs` sat red on main until it was found by hand (sc-12379). Keep this Clippy
      # package set aligned with the compile check above.
      #
      # No GPU required, same as the steps around it: Clippy type-checks the crate graph (hence vcvars
      # + nvcc for the candle-kernels build script) but creates no CUDA context and allocates no VRAM.
      - name: Clippy Candle CUDA packages (no GPU required)
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo clippy --locked --all-targets -p candle-llm -p candle-quant-kernels -p "candle-gen*" -p "candle-audio*" -p runtime-cuda --features cuda -- -D warnings
      # The doc twin of the compile check above. The hosted rustdoc gate cannot pass --features cuda
      # (no CUDA toolkit), so `#[cfg(feature = "cuda")]` docs need this lane. Keep this doc package
      # set aligned with the compile check above; together with the hosted gate, the CPU and CUDA
      # doc graphs are each covered (sc-12275, sc-12284).
      #
      # No GPU required, same as the compile step: rustdoc builds the dep graph (hence vcvars + nvcc)
      # but creates no CUDA context and allocates no VRAM, so it is safe on the shared self-hosted rig.
      - name: Rustdoc Candle CUDA packages (no GPU required)
        shell: cmd
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          call "%VCVARS%"
          cargo doc --locked --no-deps -p candle-llm -p candle-quant-kernels -p "candle-gen*" -p "candle-audio*" -p runtime-cuda --features cuda

  windows-cuda:
    name: Candle CUDA packages (Windows, manual)
    needs: changes
    # A `synthetic_w4a8` dispatch replaces the heavy manual lanes with the synthetic suite; see
    # `synthetic-w4a8-cuda` below.
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.windows_cuda == 'true' && inputs.synthetic_w4a8 == 'none'
    runs-on: [self-hosted, windows, cuda]
    env:
      # Keep manual runs inside the same per-listener budget as the automatic compile check.
      CARGO_BUILD_JOBS: "12"
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Isolate persistent-runner HF caches
        shell: cmd
        run: |
          set "HF_OUTER=%RUNNER_TEMP%\inference-ci-h3-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if not exist "%HF_OUTER%" mkdir "%HF_OUTER%"
          if errorlevel 1 exit /b 1
          echo HF_HOME=%HF_OUTER%\hf-home>>"%GITHUB_ENV%"
          echo HF_HUB_CACHE=%HF_OUTER%\hub>>"%GITHUB_ENV%"
          echo HUGGINGFACE_HUB_CACHE=%HF_OUTER%\hub>>"%GITHUB_ENV%"
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      # DELIBERATELY NO `save-if: main`, unlike the PR lanes (see the note on the `workspace` job's
      # cache step). This lane is manual — `windows-cuda` runs only on `workflow_dispatch` — so its
      # runs are operator iterations on whatever ref they dispatch, where a ref-scoped cache is the
      # point. It never runs on `main`, so a main-only save would leave it nothing to restore and
      # cold on every dispatch, and it contributed no entry to the 2026-08-15 cache inventory that
      # was starving the PR lanes. Do not re-symmetrise it with `windows-cuda-check` above.
      - name: Cache Cargo and CUDA objects
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Persistent self-hosted box: rust-cache's post step deletes rustup.exe from
          # %CARGO_HOME%\bin (see the macos-nax job for the full mechanism), leaving the
          # proxies dangling. This is the real cause of the breakage that
          # scripts/win/use-real-rust-toolchain.cmd works around in the app repo.
          cache-bin: "false"
      - name: Build Candle CUDA packages
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo build --locked -p candle-llm -p candle-quant-kernels -p "candle-gen*" -p "candle-audio*" -p runtime-cuda --features cuda
      # H3 complete-model/model-stack execution is reachable ONLY from this manual
      # `workflow_dispatch` lane (and the MLX twin `synthetic-w4a8-mlx`); ordinary PR/main CI only
      # compiles the bodies. Each step fails on Cargo's own status and then asserts the exact
      # executed-test summary plus every printed test-name prefix, so a renamed, deleted, or
      # filtered-away case reds the route instead of passing with zero tests.
      - name: Prove H3 ConvRot INT8 native projections against pinned Kitchen oracle
        shell: cmd
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\h3-convrot-cuda.log"
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --test integration convrot_int8:: -- --ignored --nocapture --test-threads=1 >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 1 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test convrot_int8::native_projections_match_pinned_kitchen ..." "%LOG%" >nul || exit /b 1
      - name: Prove H3 AdaLN eviction memory release on CUDA
        shell: cmd
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\h3-adaln-evict-cuda.log"
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --test integration adaln_evict_memory:: -- --ignored --nocapture --test-threads=1 >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 2 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test adaln_evict_memory::the_evicted_adaln_weights_leave_memory ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adaln_evict_memory::the_evicted_adaln_weights_leave_the_cuda_pool ..." "%LOG%" >nul || exit /b 1
      - name: Prove H3 cross-backend DiT complete model on CUDA
        shell: cmd
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\h3-cross-backend-cuda.log"
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --test integration cross_backend:: -- --ignored --nocapture --test-threads=1 >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 3 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test cross_backend::dit_agrees_with_the_mlx_lane ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test cross_backend::the_dit_cross_backend_floor_is_also_the_mlx_lanes ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test cross_backend::a_dit_gated_ffn_half_swap_is_loud_against_the_mlx_record ..." "%LOG%" >nul || exit /b 1
      - name: Prove H3 DiT I/O complete model on CUDA
        shell: cmd
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\h3-dit-io-cuda.log"
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --test integration dit_io:: -- --ignored --nocapture --test-threads=1 >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 4 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_io::the_model_embeds_the_context_before_refining_it ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_io::the_whole_model_reproduces_the_reference_velocity ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_io::forward_packed_rejects_an_out_of_range_adaln_index ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_io::the_cached_modulation_path_reproduces_the_resident_one ..." "%LOG%" >nul || exit /b 1
      - name: Prove H3 pruned AdaLN complete model on CUDA
        shell: cmd
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\h3-pruned-cuda.log"
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --test integration pruned_adaln:: -- --ignored --nocapture --test-threads=1 >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 7 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test pruned_adaln::native_pruned_adaln_matches_pinned_reference ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test pruned_adaln::native_blocks_and_final_outputs_match_the_pinned_reference ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test pruned_adaln::the_curve_cache_keys_on_the_schedule_and_the_basis ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test pruned_adaln::a_mixed_basis_block_stack_is_refused_before_any_projection ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test pruned_adaln::the_stock_path_is_untouched_and_refuses_curve_coordinates ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test pruned_adaln::load_from_dir_builds_the_pruned_model_with_its_identity_at_stored_precision ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test pruned_adaln::manual_unit_patch_and_mixed_reference_full_forward_matches_resident_control ..." "%LOG%" >nul || exit /b 1
          findstr /C:"H3_GEOMETRY_AUDIO_FULL_FORWARD backend=cuda cases=11" "%LOG%" >nul || exit /b 1
      - name: Prove H3 adapter topology complete model on CUDA
        shell: cmd
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\h3-adapter-cuda.log"
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --test integration adapter_topology:: -- --ignored --nocapture --test-threads=1 >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 13 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::native_adapter_folds_on_the_pruned_curve ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::body_deltas_are_identical_across_full_and_pruned_topologies ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::full_topology_adaln_targets_are_refused_specifically_per_topology ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::real_but_unaddressable_modules_name_the_exclusion ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::an_adaln_only_file_with_no_body_targets_is_refused_specifically ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::an_excluded_only_file_with_no_body_targets_is_refused_specifically ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::an_adaln_only_lokr_with_no_body_targets_is_refused_specifically ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::turbo_schedule_coordinates_drive_the_pruned_curve_without_a_thousand_scaling ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::a_genuine_lokr_installs_on_the_pruned_curve_with_the_same_delta ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::the_comfyui_converted_qkv_namespace_installs_identically_on_the_pruned_curve ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::the_delta_is_independent_of_the_body_weights_it_folds_onto ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::the_exact_dyadic_corpus_folds_exactly_on_both_topologies ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test adapter_topology::the_exact_lokr_corpus_folds_exactly_on_the_pruned_curve ..." "%LOG%" >nul || exit /b 1
      - name: Prove H3 turbo adapter fold complete model on CUDA
        shell: cmd
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\h3-turbo-cuda.log"
          rem The three real-weight `#[ignore]`s in this module are SKIPPED by name: they need provided
          rem snapshots and belong to real-weights.yml, and `--ignored` alone would conscript them.
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --test integration turbo_lora:: -- --ignored --nocapture --test-threads=1 --skip manual_cuda_fabricated_lokr_install_receipt --skip exact_h3_trainer_file_receipt --skip manual_cuda_exact_h3_trainer_runtime_receipt >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 13 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::every_enumerated_target_resolves_through_the_model_tree ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::adaln_and_the_norms_are_not_addressable ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::the_install_folds_at_the_published_strength ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::the_installed_fold_keeps_the_factor_dtype ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::a_file_that_folds_nothing_is_refused_per_spec_not_in_aggregate ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::an_unmatched_target_is_surfaced_by_name ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::lokr_matches_an_independent_dense_kron_and_rejects_mutant_results ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::fused_qkv_and_mlp_lokr_cover_the_complete_block_surface_numerically ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::lokr_rejects_unknown_partial_unmatched_and_false_kind_claims ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::direct_lokr_reaches_every_trunk_and_token_refiner_adapter_target ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::a_peft_blob_supplies_the_alpha_and_its_rank_is_only_a_cross_check ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::the_conversion_leaves_no_comfyui_module_behind ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test turbo_lora::clay_raw_refiner_header_conversion_preserves_factors_alpha_and_strict_unknowns ..." "%LOG%" >nul || exit /b 1
      - name: Prove H3 native VEDA controls complete model on CUDA
        shell: cmd
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\h3-veda-model-cuda.log"
          rem Unit-test (`--lib`) target, not the integration binary; CPU arithmetic on a complete
          rem synthetic DiT + JointDit built through the production loader.
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --lib dit::model::tests:: -- --ignored --nocapture --test-threads=1 >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 2 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test dit::model::tests::native_controls_capture_every_mode_packed_tier_and_adapter_stack ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit::model::tests::native_base_and_all_published_turbo_steps_reach_attention ..." "%LOG%" >nul || exit /b 1
      - name: Prove H3 full DitBlock model-block parity on CUDA
        shell: cmd
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\h3-dit-parity-cuda.log"
          rem Full DitBlock (attention + FFN) executions. Individual linear/AdaLN/packing
          rem primitives in this module stay ordinary and are not selected by this filter.
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --test integration dit_parity:: -- --ignored --nocapture --test-threads=1 >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 9 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_parity::adaln_modulation_matches_the_reference ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_parity::transformer_block_matches_the_reference ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_parity::every_norm_epsilon_is_wired_through ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_parity::reading_the_ffn_halves_gate_first_breaks_parity ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_parity::the_modality_term_of_the_adaln_index_is_load_bearing ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_parity::the_adaln_table_is_reshaped_before_it_is_chunked ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_parity::every_block_weight_is_load_bearing ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_parity::parity_residuals_bound_the_mutation_floor ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test dit_parity::weight_mapping_is_exhaustive_over_the_block_stack ..." "%LOG%" >nul || exit /b 1
      - name: Test Candle CUDA packages
        shell: cmd
        # The runner is sm_120: an sm_120 test (NVFP4, the indexed NVFP4 MoE kernel) must run
        # here, so `skip_without_sm120` fails instead of skipping silently (sc-24440 review).
        env:
          REQUIRE_SM120: "1"
          # Iris' multi-process fixtures explicitly opt into sharing this lane's one visible card.
          # Without it rank 1 asks for cuda:1, exits InvalidMesh, and peers time out in rendezvous.
          IRIS_DIST_SHARE_DEVICE: "1"
        run: |
          call "%VCVARS%"
          cargo test --locked --lib --tests -p candle-llm -p candle-quant-kernels -p "candle-gen*" -p "candle-audio*" -p runtime-cuda --features cuda --no-fail-fast
      - name: Test LLM-only CUDA bundle
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --no-default-features --lib -p runtime-cuda
      # The decided sc-12835 feature wiring: audio is its own additive bundle feature, so the
      # LLM+audio composition (ChatWorks TTS without the media graph) is a supported profile.
      - name: Test LLM+audio CUDA bundle
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --no-default-features --features audio --lib -p runtime-cuda

  # sc-26685: synthetic W4A8 native arithmetic on CUDA, dispatch-only via `synthetic_w4a8`.
  # Same committed 2.29 MB fixture as the MLX twin -- no weights, no Hub fetch -- driving two
  # production-path cases: the W4A8 forward against the external comfy-kitchen reference, and the
  # mixed W4A8/ConvRot payload. Both are `#[ignore]`d in the test target, so ordinary CI only
  # compiles them.
  synthetic-w4a8-cuda:
    name: Synthetic W4A8 native arithmetic (CUDA, manual)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.windows_cuda == 'true' && (inputs.synthetic_w4a8 == 'cuda' || inputs.synthetic_w4a8 == 'both')
    runs-on: [self-hosted, windows, cuda]
    env:
      CARGO_BUILD_JOBS: "12"
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Record source revision
        shell: cmd
        run: |
          for /f "delims=" %%H in ('git rev-parse HEAD') do set "ACTUAL=%%H"
          echo W4A8 CUDA checked out %ACTUAL% (dispatch ref ${{ github.ref }}, sha ${{ github.sha }})>>"%GITHUB_STEP_SUMMARY%"
          if /i not "%ACTUAL%"=="${{ github.sha }}" exit /b 1
      - name: Isolate persistent-runner HF caches
        shell: cmd
        run: |
          set "HF_OUTER=%RUNNER_TEMP%\inference-ci-w4a8-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if not exist "%HF_OUTER%" mkdir "%HF_OUTER%"
          if errorlevel 1 exit /b 1
          echo HF_HOME=%HF_OUTER%\hf-home>>"%GITHUB_ENV%"
          echo HF_HUB_CACHE=%HF_OUTER%\hub>>"%GITHUB_ENV%"
          echo HUGGINGFACE_HUB_CACHE=%HF_OUTER%\hub>>"%GITHUB_ENV%"
      # A bare `bash` on these runners is WSL's; the toolchain action shells out with bash.
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      # Manual lane: no `save-if: main`; `cache-bin: "false"` per the persistent-box rustup note on
      # `windows-cuda`.
      - name: Cache Cargo and CUDA objects
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
      - name: Prove W4A8 native arithmetic against the external fixture
        shell: cmd
        # Redirect instead of piping (cmd has no pipefail), then fail on Cargo's own status and on
        # the exact executed-test summary/names, so a filtered or skip-as-pass run cannot go green.
        # `--test-threads=1` keeps the device arithmetic deterministic. The identity checks stop at
        # the printed name prefix because `--nocapture` output can split the "<name> ... ok" line.
        run: |
          call "%VCVARS%"
          set "LOG=%RUNNER_TEMP%\w4a8-cuda.log"
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --test integration w4a8_compare:: -- --ignored --nocapture --test-threads=1 >"%LOG%" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%LOG%"
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"test result: ok. 2 passed; 0 failed; 0 ignored" "%LOG%" >nul || exit /b 1
          findstr /C:"test w4a8_compare::native_forward_matches_the_external_reference ..." "%LOG%" >nul || exit /b 1
          findstr /C:"test w4a8_compare::mixed_w4a8_and_convrot_layers_keep_their_own_arithmetic ..." "%LOG%" >nul || exit /b 1

  supply-chain:
    name: dependency policy + advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Cache cargo-deny 0.19.9
        id: cargo-deny-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-deny-0.19.9
          add-rust-environment-hash-key: "false"
          cache-targets: "false"
          cache-bin: "true"
          # Save only on `main` — see the note on the `workspace` job's cache step.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.19.9
      - name: Validate advisory-ignore governance
        run: python3 scripts/ci/check_advisory_policy.py
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked check advisories bans licenses sources

  docs:
    name: repository documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Check local documentation links
        run: python3 scripts/check_docs.py

  release-metadata:
    name: runtime manifest + SPDX SBOM
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Cache Cargo graph
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Save only on `main` — see the note on the `workspace` job's cache step.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build dry-run release metadata
        run: >-
          python3 scripts/release/build_release.py
          --tag runtime-2000.01.0-rc.0 --skip-archive
      - name: Verify manifest, checksums, and SBOM graph
        run: python3 scripts/release/verify_release.py dist/release --skip-smoke

  release-artifacts:
    name: tagged source archive + external smoke
    needs: [changes, release-metadata]
    if: startsWith(github.ref, 'refs/tags/runtime-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Cache Cargo graph
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Save only on `main` — see the note on the `workspace` job's cache step. This lane is
          # tag-gated (`refs/tags/runtime-*`), and a tag-scoped cache is readable from no other ref
          # at all, so saving here only ever consumed budget the PR lanes needed.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tagged source bundle
        run: python3 scripts/release/build_release.py --tag "$GITHUB_REF_NAME"
      - name: Verify and consume source bundle externally
        run: python3 scripts/release/verify_release.py dist/release
      - name: Upload immutable release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.ref_name }}-source
          path: dist/release/
          if-no-files-found: error

  # Single aggregated verdict for branch protection and the merge queue to require. Two reasons
  # this exists rather than naming each lane in the ruleset:
  #
  # 1. A lane skipped by its `if:` reports SUCCESS to a required status check, and a lane skipped
  #    because `needs: changes` FAILED reports the same way. Naming lanes individually therefore
  #    lets a broken `changes` job read green across the whole board. Collapsing to `needs.*.result`
  #    distinguishes them: a failed dependency leaves `failure` in the results, a genuine path-based
  #    skip leaves `skipped`.
  # 2. Required contexts are matched on job *display name*, so per-lane requirements silently stop
  #    enforcing the moment a `name:` is reworded. One context that no one renames cannot rot that
  #    way.
  #
  # `if: always()` is mandatory — the default `success()` would skip this job exactly when an
  # upstream lane failed, which reports success and inverts the gate. Every non-gate job is listed;
  # dispatch- and tag-only lanes are included deliberately, since `skipped` is tolerated and that
  # keeps them covered on the events where they do run. Add new jobs here, or they go ungated.
  gate:
    name: CI gate
    needs:
      - changes
      - resolve
      - format
      - workspace
      - contracts
      - contracts-windows
      - candle-cpu-lint
      - candle-cpu-test
      - candle-cpu-conformance
      - candle-cpu-bundles
      - macos-metal
      - macos-nax
      - synthetic-w4a8-mlx
      - windows-cuda-check
      - windows-cuda
      - synthetic-w4a8-cuda
      - supply-chain
      - docs
      - release-metadata
      - release-artifacts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane to have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::a CI lane reported '$result'; see the failing job above"
                exit 1
                ;;
            esac
          done
