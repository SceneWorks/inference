          grep -Fq "test result: ok. 1 passed; 0 failed; 0 ignored" "$log"
          grep -Fq "test adaln_evict_memory::the_evicted_adaln_weights_leave_device_memory ..." "$log"
      - name: Prove H3 adapter topology complete model on Metal
        env:
          HF_HOME: ${{ runner.temp }}/h3-adapter-${{ github.run_id }}-${{ github.run_attempt }}/hf-home
          HF_HUB_CACHE: ${{ runner.temp }}/h3-adapter-${{ github.run_id }}-${{ github.run_attempt }}/hub
          HUGGINGFACE_HUB_CACHE: ${{ runner.temp }}/h3-adapter-${{ github.run_id }}-${{ github.run_attempt }}/hub
          HF_HUB_OFFLINE: "1"
        run: |
