          cargo test --locked -p mlx-gen-minimax-h3 --test integration adapter_topology:: -- --ignored --nocapture --test-threads=1 2>&1 | tee "$log"
          grep -Fq "test result: ok. 15 passed; 0 failed; 0 ignored" "$log"
          grep -Fq "test adapter_topology::native_pruned_turbo_adapter_residual_matches_reference ..." "$log"
          grep -Fq "test adapter_topology::body_deltas_are_identical_across_full_and_pruned_topologies ..." "$log"
          grep -Fq "test adapter_topology::full_topology_adaln_targets_are_refused_specifically_per_topology ..." "$log"
          grep -Fq "test adapter_topology::real_but_unaddressable_modules_name_the_exclusion ..." "$log"
          grep -Fq "test adapter_topology::an_adaln_only_file_with_no_body_targets_is_refused_specifically ..." "$log"
          grep -Fq "test adapter_topology::an_excluded_only_file_with_no_body_targets_is_refused_specifically ..." "$log"
          grep -Fq "test adapter_topology::an_adaln_only_lokr_with_no_body_targets_is_refused_specifically ..." "$log"
          grep -Fq "test adapter_topology::turbo_schedule_coordinates_drive_the_pruned_curve_without_a_thousand_scaling ..." "$log"
          grep -Fq "test adapter_topology::a_genuine_lokr_installs_on_the_pruned_curve_with_the_same_delta ..." "$log"
          grep -Fq "test adapter_topology::the_comfyui_converted_qkv_namespace_installs_identically_on_the_pruned_curve ..." "$log"
          grep -Fq "test adapter_topology::the_delta_is_independent_of_the_body_weights_it_folds_onto ..." "$log"
          grep -Fq "test adapter_topology::the_same_adapter_installs_on_every_partition_of_the_selected_checkpoint ..." "$log"
          grep -Fq "test adapter_topology::the_exact_dyadic_corpus_folds_exactly_on_both_topologies ..." "$log"
          grep -Fq "test adapter_topology::the_exact_corpus_is_bit_identical_across_partitions ..." "$log"
          grep -Fq "test adapter_topology::the_exact_lokr_corpus_folds_exactly_on_the_pruned_curve ..." "$log"
      - name: Prove H3 windowed block window complete model on Metal
        env:
