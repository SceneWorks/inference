# NEVER MERGE: SC-23935 one-shot Qwen3.8 CUDA request-admission diagnostic.
# This temporarily replaces CI because GitHub cannot dispatch a newly added workflow from a
# non-default branch. It has no automatic trigger and must be deleted with this branch.
name: SC-23935 CUDA admission probe (NEVER MERGE)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc23935-cuda-admission-probe
  cancel-in-progress: false

jobs:
  qwen38-parent-admission:
    name: Frozen Qwen3.8 parent load and one native request
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 120
    env:
      BONSAI_QWEN38_SNAPSHOT: ${{ vars.CANDLE_BONSAI_QWEN38_SNAPSHOT }}
      CARGO_BUILD_JOBS: "12"
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
      CUDA_VISIBLE_DEVICES: "0"
      EXPECTED_GPU_UUID: "GPU-b1a31911-c7b4-2901-3d8b-9a62e228bfc0"
      RUST_BACKTRACE: "full"
      RUST_TEST_THREADS: "1"
      SCENEWORKS_CUDA_ADMISSION_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Initialize evidence and select Git Bash
        shell: powershell
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'sc23935-cuda-admission'
          if (Test-Path -LiteralPath $evidenceRoot) {
            Remove-Item -LiteralPath $evidenceRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $evidenceRoot | Out-Null
          [ordered]@{
            schema_version = 1
            github_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            initialized_utc = [DateTime]::UtcNow.ToString('o')
            scope = 'bounded admission repair probe; full campaign remains required'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceRoot 'initialization.json') -Encoding utf8
          $reservation = Join-Path $env:LOCALAPPDATA 'SceneWorks\inference-reservations\cuda-device-0.json'
          $token = "sc23935-admission-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "SC23935_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SC23935_GPU_RESERVATION=$reservation" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SC23935_RESERVATION_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "required Git Bash is missing: $gitBash"
          }
          'C:\Program Files\Git\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0

      - name: Cache Cargo and CUDA objects
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Install reviewed CPython and snapshot verifier dependencies
        shell: powershell
        run: |
          uv python install 3.12.10 --managed-python --no-registry --no-bin --no-config
          if ($LASTEXITCODE -ne 0) { throw 'uv failed to install reviewed CPython' }
          $reviewedPython = (& uv python find 3.12.10 --managed-python --no-project --no-config).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $reviewedPython -PathType Leaf)) {
            throw 'reviewed CPython 3.12.10 is unavailable'
          }
          & $reviewedPython -c 'import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version'
          if ($LASTEXITCODE -ne 0) { throw 'reviewed CPython version check failed' }
          $pythonPath = Join-Path $env:RUNNER_TEMP 'sc23935-python'
          & $reviewedPython -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes `
            --target $pythonPath -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt
          if ($LASTEXITCODE -ne 0) { throw 'snapshot verifier dependency installation failed' }
          "REVIEWED_PYTHON=$reviewedPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$pythonPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Parse every exact run block before the CUDA build or reservation. This catches Windows
      # PowerShell 5 syntax errors that a Linux YAML check cannot see.
      - name: Parse every embedded Windows PowerShell script
        shell: powershell
        run: |
          $extractor = Join-Path $env:RUNNER_TEMP 'sc23935-extract-powershell.py'
          $scriptsJson = Join-Path $env:RUNNER_TEMP 'sc23935-powershell-scripts.json'
          @'
          import json
          import pathlib
          import sys
          import yaml

          workflow = yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          scripts = [
              step["run"]
              for job in workflow["jobs"].values()
              for step in job.get("steps", [])
              if step.get("shell") == "powershell"
          ]
          if not scripts or not all(isinstance(script, str) and script.strip() for script in scripts):
              raise SystemExit("workflow has a missing or empty PowerShell run block")
          pathlib.Path(sys.argv[2]).write_text(json.dumps(scripts), encoding="utf-8")
          '@ | Set-Content -LiteralPath $extractor -Encoding utf8
          uv run --no-project --no-config --python 3.12.10 --with pyyaml==6.0.3 `
            python $extractor '.github/workflows/ci.yml' $scriptsJson
          if ($LASTEXITCODE -ne 0) { throw 'failed to extract embedded PowerShell scripts' }
          $scripts = @(Get-Content -LiteralPath $scriptsJson -Raw | ConvertFrom-Json)
          for ($scriptIndex = 0; $scriptIndex -lt $scripts.Count; $scriptIndex++) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $scripts[$scriptIndex], [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "embedded PowerShell script $($scriptIndex + 1) has parser errors"
            }
          }
          Write-Host "SC23935_POWERSHELL_PARSE scripts=$($scripts.Count) passed=true"

      - name: Record exact source, model, and hardware provenance
        shell: powershell
        run: |
          $status = @(git status --porcelain=v1)
          $base = '50331db06e0c8f60b107a96280d33b1a3bda0623'
          $parent = (git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0 -or $parent -ne $base) {
            throw "diagnostic head is not the one-commit child of repair base $base"
          }
          if ($status.Count -ne 0) { throw 'diagnostic checkout is not clean' }
          $candleRevision = '1e6aa85e867eb007cba1b8bae517a10d1aaf0c0d'
          if ((Get-Content -LiteralPath Cargo.toml -Raw) -notmatch [regex]::Escape($candleRevision)) {
            throw 'Cargo.toml lost the expected pinned Candle revision'
          }
          [ordered]@{
            schema_version = 1
            github_sha = $env:GITHUB_SHA
            checked_out_sha = (git rev-parse HEAD).Trim()
            parent_sha = $parent
            clean_tree = $true
            cargo_lock_sha256 = (Get-FileHash -Algorithm SHA256 Cargo.lock).Hash.ToLowerInvariant()
            pinned_candle_revision = $candleRevision
            expected_model_revision = '1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0'
            model_path = $env:BONSAI_QWEN38_SNAPSHOT
            expected_gpu_index = 0
            expected_gpu_uuid = $env:EXPECTED_GPU_UUID
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'provenance.json') -Encoding utf8
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py hardware `
            --output (Join-Path $env:SC23935_EVIDENCE_ROOT 'hardware-before.json')
          if ($LASTEXITCODE -ne 0) { throw 'hardware inventory failed' }
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py qualify-snapshots `
            --platform windows `
            --binding BONSAI_QWEN38_SNAPSHOT=bonsai-qwen38-parent `
            --output (Join-Path $env:SC23935_EVIDENCE_ROOT 'snapshot-metadata.json')
          if ($LASTEXITCODE -ne 0) { throw 'frozen parent snapshot identity check failed' }

      - name: Build the existing native Candle CUDA comparison executable
        timeout-minutes: 60
        shell: powershell
        run: |
          cmd /c "call `"$env:VCVARS`" && set" |
            ForEach-Object {
              if ($_ -match '^(.*?)=(.*)$') { Set-Item -Force "env:$($matches[1])" $matches[2] }
            }
          $env:PATH = "$(Join-Path $env:CUDA_PATH 'bin');$env:PATH"
          @(
            "rustc: $(rustc -Vv)",
            "cargo: $(cargo -V)",
            "nvcc: $(nvcc --version)"
          ) | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'build-toolchain.txt') -Encoding utf8
          $runner = Join-Path $env:RUNNER_TEMP 'sc23935-run-process.py'
          @'
          import json
          import pathlib
          import subprocess
          import sys
          import time

          stdout_path, stderr_path, receipt_path, *command = sys.argv[1:]
          started = time.time()
          with open(stdout_path, "wb") as stdout, open(stderr_path, "wb") as stderr:
              completed = subprocess.run(command, stdout=stdout, stderr=stderr, check=False)
          pathlib.Path(receipt_path).write_text(json.dumps({
              "command": command,
              "returncode": completed.returncode,
              "elapsed_seconds": time.time() - started,
          }, indent=2), encoding="utf-8")
          raise SystemExit(completed.returncode)
          '@ | Set-Content -LiteralPath $runner -Encoding utf8
          $buildJson = Join-Path $env:SC23935_EVIDENCE_ROOT 'build.jsonl'
          $buildStderr = Join-Path $env:SC23935_EVIDENCE_ROOT 'build.stderr.log'
          $buildReceipt = Join-Path $env:SC23935_EVIDENCE_ROOT 'build-process.json'
          & $env:REVIEWED_PYTHON $runner $buildJson $buildStderr $buildReceipt cargo `
            test --locked --release -p candle-llm --features cuda --test qwen38_bonsai --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath $buildStderr
            throw 'Candle CUDA comparison build failed'
          }
          $binaryPath = Join-Path $env:SC23935_EVIDENCE_ROOT 'binary.txt'
          Get-Content -LiteralPath $buildJson | & $env:REVIEWED_PYTHON `
            scripts/release/qwen38_bonsai_terminal.py resolve-binary --target qwen38_bonsai |
            Set-Content -LiteralPath $binaryPath -Encoding ascii
          if ($LASTEXITCODE -ne 0) { throw 'comparison binary resolution failed' }
          $binary = (Get-Content -LiteralPath $binaryPath -Raw).Trim()
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "resolved comparison binary is missing: $binary"
          }
          [ordered]@{
            path = $binary
            size_bytes = (Get-Item -LiteralPath $binary).Length
            sha256 = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'binary.json') -Encoding utf8
          "SC23935_TEST_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Compilation creates no CUDA context. Acquire physical ownership only after the binary exists.
      - name: Reserve and preflight physical CUDA device 0
        shell: powershell
        run: |
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py reserve-gpu `
            --gpu-index 0 `
            --reservation $env:SC23935_GPU_RESERVATION `
            --evidence (Join-Path $env:SC23935_EVIDENCE_ROOT 'gpu-reservation.json') `
            --token $env:SC23935_RESERVATION_TOKEN
          if ($LASTEXITCODE -ne 0) {
            throw 'CUDA device 0 is already reserved, unavailable, or has an active compute tenant'
          }
          'SC23935_RESERVATION_ACQUIRED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $reservation = Get-Content -LiteralPath (Join-Path $env:SC23935_EVIDENCE_ROOT 'gpu-reservation.json') -Raw | ConvertFrom-Json
          if ($reservation.gpu_index -ne 0 -or $reservation.gpu_uuid -ne $env:EXPECTED_GPU_UUID) {
            throw "reserved the wrong GPU identity: index=$($reservation.gpu_index) uuid=$($reservation.gpu_uuid)"
          }
          $preflight = Join-Path $env:SC23935_EVIDENCE_ROOT 'parent-preflight.json'
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py preflight `
            --model-key bonsai-qwen38-parent `
            --load-profile candle-dense-cuda `
            --reserve-bytes 17179869184 `
            --reservation $env:SC23935_GPU_RESERVATION `
            --reservation-token $env:SC23935_RESERVATION_TOKEN `
            --output $preflight
          if ($LASTEXITCODE -ne 0) { throw 'dense CUDA parent preflight failed' }
          $admission = Get-Content -LiteralPath $preflight -Raw | ConvertFrom-Json
          if (-not $admission.admitted -or $admission.selected_gpu_uuid -ne $env:EXPECTED_GPU_UUID) {
            throw 'preflight did not admit the exact expected GPU'
          }
          "SC23935_REQUIRED_GPU_BYTES=$($admission.gpu_required_available_bytes)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Recheck GPU and run one fresh-process native request
        timeout-minutes: 30
        shell: powershell
        run: |
          & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py check-gpu-reservation `
            --gpu-index 0 `
            --reservation $env:SC23935_GPU_RESERVATION `
            --token $env:SC23935_RESERVATION_TOKEN `
            --required-bytes $env:SC23935_REQUIRED_GPU_BYTES `
            --output (Join-Path $env:SC23935_EVIDENCE_ROOT 'gpu-recheck.json')
          if ($LASTEXITCODE -ne 0) {
            throw 'GPU changed identity, lost required capacity, or gained an active compute tenant'
          }
          $launcher = Join-Path $env:RUNNER_TEMP 'sc23935-launch-admission-probe.py'
          @'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import time

          root = pathlib.Path(os.environ["SC23935_EVIDENCE_ROOT"])
          command = [
              os.environ["REVIEWED_PYTHON"],
              "scripts/release/qwen38_bonsai_terminal.py", "run",
              "--candle-device", "auto",
              "--binary", os.environ["SC23935_TEST_BINARY"],
              "--test-name", "native_comparison",
              "--model-id", "candle-cuda-qwen38-parent-admission-probe",
              "--model-key", "bonsai-qwen38-parent",
              "--model-revision", "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0",
              "--snapshot", os.environ["BONSAI_QWEN38_SNAPSHOT"],
              "--model-path", os.environ["BONSAI_QWEN38_SNAPSHOT"],
              "--runtime-sha", os.environ["GITHUB_SHA"],
              "--cases", "arithmetic",
              "--preflight", str(root / "parent-preflight.json"),
              "--reservation", os.environ["SC23935_GPU_RESERVATION"],
              "--reservation-token", os.environ["SC23935_RESERVATION_TOKEN"],
              "--output", str(root / "parent-row"),
          ]
          started = time.time()
          completed = subprocess.run(command, check=False)
          (root / "probe-launch.json").write_text(json.dumps({
              "command": command,
              "returncode": completed.returncode,
              "elapsed_seconds": time.time() - started,
          }, indent=2), encoding="utf-8")
          raise SystemExit(completed.returncode)
          '@ | Set-Content -LiteralPath $launcher -Encoding utf8
          & $env:REVIEWED_PYTHON $launcher
          if ($LASTEXITCODE -ne 0) { throw 'native admission probe failed' }

      - name: Validate exact request, rejection, recovery, and allocator evidence
        shell: powershell
        run: |
          $validator = Join-Path $env:RUNNER_TEMP 'sc23935-validate-admission-probe.py'
          @'
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ["SC23935_EVIDENCE_ROOT"])
          row = root / "parent-row"
          receipt = json.loads((row / "receipt.json").read_text(encoding="utf-8"))
          provider = json.loads((row / "provider.json").read_text(encoding="utf-8"))
          launch = json.loads((root / "probe-launch.json").read_text(encoding="utf-8"))
          runtime_sha = os.environ["GITHUB_SHA"].lower()
          revision = "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
          errors = []

          def require(condition, message):
              if not condition:
                  errors.append(message)

          require(launch.get("returncode") == 0, "launcher return code is not zero")
          require(receipt.get("status") == "completed", "wrapper receipt is not completed")
          require(receipt.get("process", {}).get("exit_code") == 0, "model process exit code is not zero")
          require(receipt.get("process", {}).get("interrupted_by") is None, "model process was interrupted")
          require(receipt.get("runtime", {}).get("head_sha") == runtime_sha, "receipt runtime SHA mismatch")
          require(receipt.get("runtime", {}).get("clean_tree") is True, "receipt runtime tree is dirty")
          require(receipt.get("model", {}).get("id") == "candle-cuda-qwen38-parent-admission-probe", "receipt model id mismatch")
          require(receipt.get("model", {}).get("revision") == revision, "receipt model revision mismatch")
          require(receipt.get("model", {}).get("inventory_before", {}).get("inventory_sha256") == receipt.get("model", {}).get("inventory_after", {}).get("inventory_sha256"), "snapshot inventory changed")
          require(receipt.get("command", {}).get("candle_device") == "auto", "wrapper did not select native CUDA")
          require(receipt.get("command", {}).get("load_profile") == "candle-dense-cuda", "wrong load profile")
          require(isinstance(receipt.get("command", {}).get("binary_sha256"), str), "binary identity is missing")
          gpu = receipt.get("gpu", {}).get("admission_recheck", {})
          require(gpu.get("admitted") is True, "receipt GPU recheck was not admitted")
          require(gpu.get("gpu_index") == 0, "receipt selected the wrong GPU index")
          require(gpu.get("selected_gpu_uuid") == os.environ["EXPECTED_GPU_UUID"], "receipt selected the wrong GPU UUID")
          require(gpu.get("selected_gpu_compute_processes") == [], "receipt has a CUDA compute co-tenant")

          require(provider.get("status") == "completed", "provider report is not completed")
          require(provider.get("runtime_sha") == runtime_sha, "provider runtime SHA mismatch")
          require(provider.get("model_revision") == revision, "provider model revision mismatch")
          require(provider.get("case_ids") == ["arithmetic"], "provider executed cases other than arithmetic")
          descriptor = provider.get("provider", {})
          require(descriptor.get("id") == "candle-llama", "unexpected provider id")
          require(descriptor.get("family") == "qwen3_5", "unexpected provider family")
          require(descriptor.get("backend") == "candle", "unexpected provider backend")
          require(provider.get("native_memory_after_load", {}).get("device") == "cuda", "provider did not load on CUDA")
          resource = provider.get("resource_admission", {})
          require(resource.get("evidence_complete") is True, "forced one-byte admission rejection is incomplete")
          require(resource.get("available_memory_override_bytes") == 1, "forced admission budget is not one byte")
          require(resource.get("architecturally_within_context") is True, "forced rejection was not within context")
          low_error = resource.get("record", {}).get("error", "")
          match = re.search(r"estimated (\d+) bytes .* only 1 bytes", low_error)
          require(match is not None, "forced rejection lacks the exact one-byte admission diagnostic")
          required_bytes = int(match.group(1)) if match else None
          cases = provider.get("cases", [])
          require(len(cases) == 1, "provider did not retain exactly one ordinary request record")
          case = cases[0] if cases else {}
          require(case.get("case_id") == "arithmetic", "ordinary request is not arithmetic")
          require(case.get("status") == "completed", "ordinary request did not complete")
          require(case.get("evidence_complete") is True, "ordinary request evidence is incomplete")
          require(case.get("quality_passed") is True, "ordinary request exact-answer oracle failed")
          require(case.get("functional_acceptance_passed") is True, "ordinary request functional acceptance failed")
          require(case.get("stream_contract_passed") is True, "ordinary request stream contract failed")
          require(case.get("output", {}).get("text") == "391", "ordinary request output is not exact 391")
          require(case.get("output", {}).get("prompt_tokens", 0) > 0, "ordinary request lacks prompt usage")
          require(case.get("output", {}).get("generated_tokens", 0) > 0, "ordinary request lacks generated usage")
          require(case.get("prefill_seconds") is not None and case.get("decode_seconds") is not None, "ordinary request lacks native timings")
          require(provider.get("context_admission", {}).get("evidence_complete") is True, "architectural context rejection is incomplete")

          prefix = "SCENEWORKS_CUDA_ADMISSION "
          records = [
              json.loads(line[len(prefix):])
              for line in (row / "stderr.log").read_text(encoding="utf-8").splitlines()
              if line.startswith(prefix)
          ]
          require(len(records) == 3, f"expected three admission diagnostics, found {len(records)}")
          require([record.get("phase") for record in records] == ["load", "request", "request"], "admission diagnostic phases are not load/request/request")
          require(len({record.get("pid") for record in records}) == 1, "admission diagnostics came from multiple processes")
          for index, record in enumerate(records):
              require(record.get("schema_version") == 1, f"diagnostic {index} schema mismatch")
              require(record.get("async_pool") is True, f"diagnostic {index} did not use the async pool")
              require(record.get("pool_query_succeeded") is True, f"diagnostic {index} pool query failed")
              values = [record.get(name) for name in (
                  "driver_free_bytes", "device_total_bytes", "pool_reserved_bytes",
                  "pool_used_bytes", "usable_capacity_bytes", "operational_override_bytes",
                  "effective_capacity_bytes",
              )]
              require(all(isinstance(value, int) and value >= 0 for value in values), f"diagnostic {index} has missing or negative counters")
              if all(isinstance(value, int) for value in values):
                  free, total, reserved, used, usable, override, effective = values
                  require(used <= reserved, f"diagnostic {index} pool used exceeds reserved")
                  require(free + reserved <= total, f"diagnostic {index} free plus reserved exceeds total")
                  require(usable == free + reserved - used, f"diagnostic {index} usable capacity arithmetic mismatch")
                  require(effective == min(usable, override), f"diagnostic {index} effective capacity arithmetic mismatch")
          if len(records) == 3:
              load, rejected, completed = records
              require(rejected.get("operational_override_bytes") == 1, "forced request diagnostic did not use one-byte override")
              require(rejected.get("effective_capacity_bytes") == 1, "forced request effective capacity is not one byte")
              require(completed.get("operational_override_bytes") == load.get("operational_override_bytes"), "ordinary request did not restore launch-time budget")
              require(completed.get("effective_capacity_bytes", 0) > 1, "ordinary request effective capacity did not recover")
              if required_bytes is not None:
                  require(completed.get("effective_capacity_bytes", 0) >= required_bytes, "ordinary request capacity is below its frozen estimate")

          verification = {
              "schema_version": 1,
              "passed": not errors,
              "scope": "bounded CUDA admission repair probe",
              "full_campaign_required": True,
              "runtime_sha": runtime_sha,
              "model_revision": revision,
              "process_exit_code": receipt.get("process", {}).get("exit_code"),
              "admission_diagnostics": records,
              "errors": errors,
          }
          (root / "verification.json").write_text(json.dumps(verification, indent=2), encoding="utf-8")
          if errors:
              raise SystemExit("; ".join(errors))
          print(json.dumps(verification, indent=2))
          '@ | Set-Content -LiteralPath $validator -Encoding utf8
          & $env:REVIEWED_PYTHON $validator
          if ($LASTEXITCODE -ne 0) { throw 'exact diagnostic evidence validation failed' }

      - name: Release owned physical CUDA reservation
        if: always()
        shell: powershell
        run: |
          if ($env:SC23935_RESERVATION_ACQUIRED -eq '1') {
            & $env:REVIEWED_PYTHON scripts/release/qwen38_bonsai_terminal.py release-gpu `
              --gpu-index 0 `
              --reservation $env:SC23935_GPU_RESERVATION `
              --token $env:SC23935_RESERVATION_TOKEN
            if ($LASTEXITCODE -ne 0) { throw 'failed to release the owned SC-23935 CUDA reservation' }
          }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc23935-cuda-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\sc23935-cuda-admission
          if-no-files-found: error
          retention-days: 14
