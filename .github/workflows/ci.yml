# NEVER MERGE: bounded, read-only RC7 GPU 0 availability diagnostic.
name: NEVER MERGE - CUDA availability diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-availability:
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Capture GPU 0 and process identity without changing state
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('rc7-gpu-availability-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $identity = [ordered]@{
            runtime_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            hostname = $env:COMPUTERNAME
            captured_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $identity | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $root 'identity.json')
          function Invoke-Capture([string]$label, [string]$program, [string[]]$commandArgs) {
            $stdout = Join-Path $root ($label + '.stdout.txt')
            $stderr = Join-Path $root ($label + '.stderr.txt')
            $code = 999
            try {
              & $program @commandArgs 1> $stdout 2> $stderr
              $code = $LASTEXITCODE
            } catch {
              $_.Exception.Message | Add-Content -Encoding UTF8 $stderr
            }
            ('exit_code=' + $code) | Set-Content -Encoding ASCII (Join-Path $root ($label + '.exit.txt'))
            return [pscustomobject]@{ exit_code = $code; stdout = $stdout; stderr = $stderr }
          }
          $smi = Get-Command nvidia-smi -CommandType Application -ErrorAction SilentlyContinue
          if (-not $smi) { throw 'nvidia-smi is unavailable; identity.json remains for upload' }
          $gpu = Invoke-Capture 'gpu-csv' $smi.Source @('--query-gpu=index,name,uuid,memory.total,memory.free,memory.used,driver_version', '--format=csv,noheader,nounits')
          $apps = Invoke-Capture 'compute-apps-csv' $smi.Source @('--query-compute-apps=gpu_uuid,pid,process_name,used_memory', '--format=csv,noheader,nounits')
          $table = Invoke-Capture 'nvidia-smi-table' $smi.Source @()
          $xml = Invoke-Capture 'nvidia-smi-xml' $smi.Source @('-q', '-x')
          $sessions = Invoke-Capture 'query-session' 'query.exe' @('session')
          $users = Invoke-Capture 'quser' 'quser.exe' @()
          Get-CimInstance -ClassName Win32_Process -Filter 'ProcessId = 29444' | Select-Object Name,ProcessId,SessionId,CreationDate | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $root 'lmstudio-session.json')
          $gpuRows = @()
          $appRows = @()
          if ($gpu.exit_code -eq 0) {
            $gpuRows = @(Get-Content $gpu.stdout | Where-Object { $_.Trim() } | ConvertFrom-Csv -Header index,name,uuid,total_mib,free_mib,used_mib,driver)
          }
          if ($apps.exit_code -eq 0) {
            $appRows = @(Get-Content $apps.stdout | Where-Object { $_.Trim() } | ConvertFrom-Csv -Header gpu_uuid,pid,process_name,used_memory_mib)
          }
          $gpu0 = @($gpuRows | Where-Object { $_.index.Trim() -eq '0' })
          $processes = @()
          if ($gpu0.Count -eq 1) {
            $gpu0Apps = @($appRows | Where-Object { $_.gpu_uuid.Trim() -eq $gpu0[0].uuid.Trim() })
            # Include the five PIDs reported by the failed RC7 attempt even if they exited.
            foreach ($priorPid in @('10260', '43992', '14072', '13652', '43120')) {
              if ($priorPid -notin @($gpu0Apps | ForEach-Object { $_.pid.Trim() })) {
                $gpu0Apps += [pscustomobject]@{ gpu_uuid = $gpu0[0].uuid; pid = $priorPid; process_name = 'prior_rc7_pid_not_in_current_compute_query'; used_memory_mib = 'n/a' }
              }
            }
            foreach ($entry in $gpu0Apps) {
              $record = [ordered]@{ gpu_uuid = $entry.gpu_uuid.Trim(); pid = $entry.pid.Trim(); nvidia_name = $entry.process_name.Trim(); used_memory_mib = $entry.used_memory_mib.Trim(); current_compute_app = ($entry.process_name -ne 'prior_rc7_pid_not_in_current_compute_query'); state = 'unresolved' }
              if ($record.pid -match '^\d+$') {
                try {
                  $proc = Get-CimInstance -ClassName Win32_Process -Filter ('ProcessId = ' + $record.pid) -ErrorAction Stop
                  if ($null -eq $proc) {
                    $record.state = 'exited_before_cim_query'
                  } else {
                    $record.state = 'present'
                    $record.name = $proc.Name
                    $record.parent_pid = $proc.ParentProcessId
                    $record.session_id = $proc.SessionId
                    $record.created = $proc.CreationDate
                    $record.executable_path = $proc.ExecutablePath
                    try {
                      $owner = Invoke-CimMethod -InputObject $proc -MethodName GetOwner -ErrorAction Stop
                      $record.owner = if ($owner.ReturnValue -eq 0) { $owner.Domain + '\' + $owner.User } else { 'unavailable: ' + $owner.ReturnValue }
                    } catch { $record.owner = 'unavailable: ' + $_.Exception.Message }
                  }
                } catch { $record.state = 'cim_query_failed'; $record.error = $_.Exception.Message }
              } else { $record.state = 'invalid_pid' }
              $processes += [pscustomobject]$record
            }
          }
          [ordered]@{
            gpu_csv_exit = $gpu.exit_code
            compute_csv_exit = $apps.exit_code
            table_exit = $table.exit_code
            xml_exit = $xml.exit_code
            gpu0 = $gpu0
            gpu0_compute_processes = $processes
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 (Join-Path $root 'gpu0-processes.json')
          if ($gpu.exit_code -ne 0 -or $apps.exit_code -ne 0 -or $gpu0.Count -ne 1) {
            throw 'GPU 0 inventory could not be classified; inspect the uploaded raw commands and exit codes'
          }
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: never-merge-rc7-gpu-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\rc7-gpu-availability-${{ github.run_id }}\
          if-no-files-found: error
          retention-days: 7
