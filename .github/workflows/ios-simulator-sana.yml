name: iOS simulator SANA functional image

# E8: never called by PR/push CI. The simulator image is a functional witness only; it does not
# establish physical-iPhone admission, memory fit, timing, or kernel correctness.
# CI_IMPACT: one separately dispatched image job or one metadata-only crash recovery job, no
# added PR/push cost. Cold iOS SDK compile and snapshot transfer cost are host/asset dependent
# (unknown). Pinned job-local XcodeGen adds 4,286,070 download bytes plus a version probe;
# no Homebrew/global install. Image timeout: 240 minutes; recovery timeout: 15 minutes.
on:
  workflow_call:
    inputs:
      simulator:
        required: true
        type: string
      snapshot:
        required: true
        type: string
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      simulator:
        description: Exact iPhone simulator model name available on whichever Mac runner claims the job
        required: true
        type: string
      snapshot:
        description: Runner-local absolute or ~/ path to pinned canonical SANA 1600M MLX snapshot root with BF16
        required: true
        type: string
      source_sha:
        description: Exact 40-hex source SHA bound to this validation
        required: true
        type: string
      diagnostic_run_id:
        description: Prior simulator Actions run ID; set with all diagnostic inputs for metadata-only crash recovery
        required: false
        type: string
      diagnostic_attempt:
        description: Prior simulator Actions attempt number
        required: false
        type: string
      diagnostic_owned_udid:
        description: Prior attempt's disposable simulator UUID from its owned-simulator receipt
        required: false
        type: string
      diagnostic_start_utc:
        description: Narrow crash window start (UTC ISO 8601)
        required: false
        type: string
      diagnostic_end_utc:
        description: Narrow crash window end (UTC ISO 8601; at most five minutes later)
        required: false
        type: string

permissions:
  contents: read

jobs:
  image:
    name: One bounded SANA simulator image
    if: github.event_name == 'workflow_dispatch' && !inputs.diagnostic_run_id && !inputs.diagnostic_attempt && !inputs.diagnostic_owned_udid && !inputs.diagnostic_start_utc && !inputs.diagnostic_end_utc
    runs-on: [self-hosted, macOS, ARM64, nax]
    timeout-minutes: 240
    env:
      SIMULATOR_SELECTOR: ${{ inputs.simulator }}
      SANA_SNAPSHOT: ${{ inputs.snapshot }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SMOKE_BUNDLE_ID: com.michaeltrefry.SceneWorksSmokeSim${{ github.run_id }}a${{ github.run_attempt }}
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: none
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: none
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Require an allowed Mac and exact simulator dispatch identity
        shell: bash
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && ( "$RUNNER_NAME" == nax-macos || "$RUNNER_NAME" == nax-macos-2 ) && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$SIMULATOR_SELECTOR" == iPhone\ * ]]
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Provision the pinned job-local project generator after checkout
        shell: bash
        run: |
          command -v python3.12
          python3.12 -I scripts/ci/provision_simulator_xcodegen.py
      - name: Resolve the pinned snapshot under this runner's own home
        shell: bash
        run: |
          python3.12 scripts/release/resolve_snapshot_paths.py SANA_SNAPSHOT
      - name: Select an available iPhone runtime on the claiming runner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ios-simulator-sana"
          python3.12 -I scripts/ci/ios_simulator_sana_device.py select \
            --selector "$SIMULATOR_SELECTOR" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --receipt "$RUNNER_TEMP/ios-simulator-sana/selected-template.json"
      - name: Verify selected native host SDK and linker before cross build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ios-simulator-sana"
          HOST_LLD="$(rustc --print sysroot)/lib/rustlib/aarch64-apple-darwin/bin/rust-lld"
          test -x "$HOST_LLD"
          export HOST_LLD
          python3.12 -I - "$RUNNER_TEMP/ios-simulator-sana/sdk-preflight.json" <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path.cwd()))
          from scripts.ci.native_darwin_sdk import select_sdk
          linker = os.environ['HOST_LLD']
          # Cargo --target keeps host proc-macro units separate: host RUSTFLAGS do not reach them.
          # The target-specific LINKER setting does; do not set global RUSTFLAGS on the iOS target.
          flags = ['-C', 'linker=' + linker]
          probe_env = dict(os.environ, CARGO_ENCODED_RUSTFLAGS='\x1f'.join(flags))
          sdk, receipt = select_sdk(['rustc'], probe_env, root=pathlib.Path.cwd())
          pathlib.Path(sys.argv[1]).write_text(json.dumps(receipt, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('SDKROOT=' + sdk + '\n')
              output.write('CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=' + linker + '\n')
          print('selected native host SDK:', sdk)
          PY
      - name: Materialize the pinned public snapshot and BF16 projection on this runner
        shell: bash
        run: |
          [[ "$SANA_SNAPSHOT" = /* ]]
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes \
            --target "$RUNNER_TEMP/huggingface-hub" \
            -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py \
            --model sana-1600m-mlx --snapshot "$SANA_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/ci/ios_simulator_sana_inventory.py \
            --materialize-bf16 "$SANA_SNAPSHOT" \
            --output "$RUNNER_TEMP/ios-simulator-sana/bf16-materialization.json"
      - name: Verify immutable input snapshot identity and content
        shell: bash
        run: |
          [[ "$SANA_SNAPSHOT" = /* && -d "$SANA_SNAPSHOT/bf16" ]]
          python3.12 scripts/release/verify_model_snapshot.py --model sana-1600m-mlx \
            --snapshot "$SANA_SNAPSHOT" --inventory-output "$RUNNER_TEMP/ios-simulator-sana/source-inventory.json"
          python3.12 -I scripts/ci/ios_simulator_sana_inventory.py \
            --source-inventory "$RUNNER_TEMP/ios-simulator-sana/source-inventory.json" \
            --source-snapshot "$SANA_SNAPSHOT" \
            --output "$RUNNER_TEMP/ios-simulator-sana/bf16-hub-auth.json"
      - name: Create a disposable simulator from the selected iPhone template
        shell: bash
        run: |
          python3.12 -I scripts/ci/ios_simulator_sana_device.py create \
            --selected "$RUNNER_TEMP/ios-simulator-sana/selected-template.json" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --receipt "$RUNNER_TEMP/ios-simulator-sana/owned-simulator.json"
      - name: Build and install simulator-only host without launching
        shell: bash
        run: |
          rustup target add aarch64-apple-ios-sim
          scripts/ios/run_smoke.sh --simulator "$SIMULATOR_UDID" --simulator-functional --install-only
      - name: Copy exact SANA snapshot and verify installed content
        shell: bash
        run: |
          test -d "$SANA_SNAPSHOT/bf16"
          scripts/ios/push_model.sh "$SANA_SNAPSHOT/bf16" sana --simulator "$SIMULATOR_UDID"
          DATA="$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$SMOKE_BUNDLE_ID" data)"
          python3.12 -I scripts/ci/ios_simulator_sana_inventory.py \
            --source-inventory "$RUNNER_TEMP/ios-simulator-sana/source-inventory.json" \
            --copied "$DATA/Documents/sana" \
            --output "$RUNNER_TEMP/ios-simulator-sana/copied-inventory.json"
      - name: Execute one supervised simulator SANA image
        shell: bash
        run: |
          python3.12 -I scripts/ci/inference_metal_launcher.py --wait-seconds 7200 -- \
            python3.12 -I scripts/ci/ios_simulator_sana.py \
              --simulator "$SIMULATOR_UDID" --bundle-id "$SMOKE_BUNDLE_ID" \
              --source-sha "$SOURCE_SHA" \
              --inventory "$RUNNER_TEMP/ios-simulator-sana/source-inventory.json" \
              --copied-inventory "$RUNNER_TEMP/ios-simulator-sana/copied-inventory.json" \
              --owned-receipt "$RUNNER_TEMP/ios-simulator-sana/owned-simulator.json" \
              --policy scripts/ci/ios-simulator-sana-policy.json \
              --output "$RUNNER_TEMP/ios-simulator-sana/result"
      - name: Retire only this workflow attempt's disposable simulator
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/ios-simulator-sana"
          receipt="$RUNNER_TEMP/ios-simulator-sana/owned-simulator.json"
          output="$RUNNER_TEMP/ios-simulator-sana/simulator-cleanup.json"
          if [[ ! -e "$receipt" ]]; then
            printf '%s\n' '{"status":"no-owned-simulator-receipt","resource_cleanup_performed":false,"model_validation":"not-established"}' > "$output"
          elif [[ "$CHECKOUT_OUTCOME" != success ]]; then
            printf '%s\n' '{"status":"cleanup-refused","reason":"checkout-unavailable","resource_cleanup_performed":false,"model_validation":"not-established"}' > "$output"
            exit 1
          else
            python3.12 -I scripts/ci/ios_simulator_sana_device.py cleanup \
              --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
              --receipt "$receipt" --output "$output"
          fi
      - name: Upload result, source inventory and refusal logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-sana-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-simulator-sana
          if-no-files-found: error

  recover-crash:
    name: Recover one prior simulator crash without launching an app
    if: github.event_name == 'workflow_dispatch' && (inputs.diagnostic_run_id || inputs.diagnostic_attempt || inputs.diagnostic_owned_udid || inputs.diagnostic_start_utc || inputs.diagnostic_end_utc)
    runs-on: [self-hosted, macOS, ARM64, nax, rw-llm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover only the exact prior app crash report
        shell: bash
        env:
          PRIOR_RUN_ID: ${{ inputs.diagnostic_run_id }}
          PRIOR_ATTEMPT: ${{ inputs.diagnostic_attempt }}
          PRIOR_OWNED_UDID: ${{ inputs.diagnostic_owned_udid }}
          PRIOR_START_UTC: ${{ inputs.diagnostic_start_utc }}
          PRIOR_END_UTC: ${{ inputs.diagnostic_end_utc }}
        run: |
          python3.12 -I scripts/ci/ios_simulator_sana_crash.py \
            --run-id "$PRIOR_RUN_ID" --attempt "$PRIOR_ATTEMPT" \
            --owned-udid "$PRIOR_OWNED_UDID" \
            --start-utc "$PRIOR_START_UTC" --end-utc "$PRIOR_END_UTC" \
            --output "$RUNNER_TEMP/ios-simulator-sana-crash"
      - name: Upload exact crash or refusal receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-sana-crash-${{ inputs.diagnostic_run_id }}-a${{ inputs.diagnostic_attempt }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-simulator-sana-crash
          if-no-files-found: error
