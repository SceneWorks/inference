name: FLUX.1 conditional asset inventory (manual CPU only)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Exact provisioned runner to inspect; no model execution
        type: choice
        required: true
        options: [nax-macos-2, cuda-windows, cuda-windows-2]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ${{ inputs.runner == 'nax-macos-2' && fromJSON('["self-hosted","macOS","ARM64","rw-llm"]') || inputs.runner == 'cuda-windows' && fromJSON('["self-hosted","Windows","X64","cuda","real-weights","cuda-windows"]') || fromJSON('["self-hosted","Windows","X64","cuda","real-weights","cuda-windows-2"]') }}
    timeout-minutes: 30
    env:
      FLUX1_HUB: ${{ inputs.runner == 'nax-macos-2' && vars.MLX_GEN_MODELS_ROOT || vars.CANDLE_GEN_MODELS_ROOT }}
      INVENTORY_RUNNER: ${{ inputs.runner }}
    steps:
      - name: Require the exact selected runner before scanning
        shell: bash
        run: |
          if [[ "$RUNNER_NAME" != "$INVENTORY_RUNNER" ]]; then
            echo "::error::Selected runner differs from actual runner"
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require existing reviewed CPython 3.12 on Windows (no provisioning)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\ci\real-weights\moss-edit-cuda\locate-existing-reviewed-python-without-installation.cmd
      - name: Inventory installed assets on macOS (no model load)
        if: runner.os == 'macOS'
        shell: bash
        env:
          INVENTORY_OUTPUT: ${{ runner.temp }}/flux1-conditional-asset-inventory.json
        run: python3.12 -I scripts/ci/flux1_conditional_asset_inventory.py --runner "$INVENTORY_RUNNER" --output "$INVENTORY_OUTPUT"
      - name: Inventory installed assets on Windows (no model load)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          INVENTORY_OUTPUT: ${{ runner.temp }}/flux1-conditional-asset-inventory.json
        run: '"%REVIEWED_PYTHON%" -I scripts\ci\flux1_conditional_asset_inventory.py --runner "%INVENTORY_RUNNER%" --output "%INVENTORY_OUTPUT%"'
      - name: Upload candidate paths and hashes only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flux1-conditional-asset-inventory-${{ inputs.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flux1-conditional-asset-inventory.json
          if-no-files-found: error
