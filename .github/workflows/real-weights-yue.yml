name: YuE real-weight validation

# sc-19387 (epic sc-19373): YuE-v1 lyrics2song through the PRODUCTION registered loader on CUDA.
# Its own file because `real-weights.yml` sits within ~2 KB of GitHub's 500 KB workflow-size limit
# (a run on an oversized file is a `startup_failure` with no jobs). Dispatch-only terminal evidence
# for the epic, not a gate. It runs every test in
# `crates/audio/candle-audio-yue/tests/registered_loader_real_weights.rs`: the worker-shape
# `yue_en_cot` at bf16 (7B stage 1 + 1B stage 2, ~16 GB of weights), the repo-root layout of the
# same case, and `yue_en_icl` at q4 with upstream's `prompt_egs/pop.00001.mp3` as the single-track
# reference. Each asserts a finite, non-silent 44.1 kHz mix plus the `vocals` / `instrumental`
# stems and the progress contract.
#
# The four SceneWorks rehosts are materialized into the persistent hub cache (release/
# real-weight-models.toml, profile `yue`) and hard-linked into the `YUE_SNAPSHOT_ROOT/<repo>` layout
# the test reads. That root is a run-scoped directory beside `CANDLE_GEN_MODELS_ROOT` -- the same
# volume, which is what lets the links succeed (a root under RUNNER_TEMP, on another volume, copied
# ~23 GB per run) -- and is removed at the end of every run. The reference clip is fetched at the pinned YuE commit, SHA-256-verified and
# decoded by `scripts/release/yue_real_weights.py` from its own hash-locked wheel set.
#
# `nvidia-smi` samples device memory every 500 ms around each case. RECORD-ONLY: the box has a
# second listener, so a co-tenant can inflate it, and no VRAM number is asserted.
#
# sc-22995 (epic sc-22988) adds `family: yue2`: the YuE2 (noncommercial, CC BY-NC 4.0) precision-tier
# evidence -- the crate's CUDA lib tests (the FP8 GEMM, bit-exact BF16 restoration, the engine's
# FP8 / acoustic-stage lifecycle) and `quality::tier_quality_against_the_f32_reference`, which
# measures bf16 / fp8 / q8 / q4 on CUDA (and F32 on CUDA) against the F32 CPU reference of the pinned
# upstream originals. The q8 / q4 tier snapshots are derived on the runner from the verified
# originals and removed at the end; nothing is rehosted. The default `family: yue` runs exactly the
# YuE-v1 job above, as before. Both YuE2 decoders (standard and legacy) are materialized, so the
# CUDA lane holds the complete generation closure.
#
# sc-23002 (the epic's terminal story) adds the registry render to `family: yue2`:
# `tests/engine_real_weights.rs::registered_loader_generates_a_song_with_every_artifact` on the
# registry's production device (CUDA, BF16 in a `--features cuda` build) -- the worker's LoadSpec, a
# ~8 s planned song with every artifact, resume, and the legacy decoder over its cached latents --
# then `parity::real_weight_decodes_match_upstream`, every AR mode including the Chinese `cot = full`
# case against the pinned upstream (F32 on the runner's CPU by construction). Each harness prints
# `YUE2_EVIDENCE_SUMMARY {json}` lines (candle_audio_yue2::evidence); the steps copy them into
# `*-summary.txt` in the evidence artifact.
#
# `mode: memory` (sc-19387) replaces the three smokes with the device-memory measurement feeding the
# SceneWorks CUDA admission estimate: `tests/cuda_memory_real_weights.rs::measure_one_case`, one
# process per (case, tier), at the Metal capture's request shapes -- `cot_default`, `icl_default`,
# `cot_worst`, `icl_long` at q4, q8 and bf16 by default. It fetches the remaining tiers of the same
# pinned rehosts plus the upstream song's vocal/instrumental stems, records per-phase device and
# memory-pool peaks and wall time (record-only), and folds them into `memory-summary.{json,md}` in
# the evidence artifact and the job summary. The default dispatch (`mode: smoke`) is unchanged.

on:
  workflow_dispatch:
    inputs:
      family:
        description: "yue = YuE-v1 CUDA; yue2 = YuE2 CUDA; yue2-metal = quality; yue2-app-metal = app proof; resume = q4 profile only"
        type: choice
        required: false
        default: yue
        options: [yue, yue2, yue2-metal, yue2-metal-evidence, yue2-app-metal, yue2-app-metal-profile-resume]
      mode:
        description: "smoke = the three real-weight renders; memory = the device-memory measurement"
        type: choice
        options: [smoke, memory]
        default: smoke
      memory_cases:
        description: "memory mode: space-separated cases (cot_default icl_default cot_worst icl_long)"
        type: string
        default: "cot_default icl_default cot_worst icl_long"
      memory_tiers:
        description: "memory mode: space-separated tiers (q4 q8 bf16)"
        type: string
        default: "q4 q8 bf16"

permissions:
  contents: read

# The Metal quality job has its own physical host; leave the CUDA group unchanged.
concurrency:
  group: ${{ (inputs.family == 'yue2-metal' || inputs.family == 'yue2-app-metal' || inputs.family == 'yue2-app-metal-profile-resume') && 'inference-yue2-metal-nax-macos-2' || 'inference-real-weights-physical-host' }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target

jobs:
  # `timeout-minutes: 180` is a runaway guard for a lane that has never executed: a cold
  # `--features cuda` release build plus a one-time ~24 GB fetch, then three one-segment renders.
  # The memory mode's 600 is the same kind of guard over twelve full songs (the Metal capture of
  # the same shapes took ~3.7 h of render time), plus a one-time ~37 GB fetch of the other tiers.
  candle-audio-yue:
    name: Candle YuE lyrics2song real weights (CUDA)
    if: inputs.family == 'yue'
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: ${{ inputs.mode == 'memory' && 600 || 180 }}
    env:
      YUE_MODE: ${{ inputs.mode || 'smoke' }}
      YUE_MEMORY_CASES: ${{ inputs.memory_cases || 'cot_default icl_default cot_worst icl_long' }}
      YUE_MEMORY_TIERS: ${{ inputs.memory_tiers || 'q4 q8 bf16' }}
      CANDLE_GEN_MODELS_ROOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
      CANDLE_AUDIO_YUE_EN_COT_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--SceneWorks--yue-s1-7b-anneal-en-cot-candle\snapshots\5842b8bc97d2a6dddc427a444920050dd3860949
      CANDLE_AUDIO_YUE_EN_ICL_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--SceneWorks--yue-s1-7b-anneal-en-icl-candle\snapshots\fc8cb3515e654d419c2831dcdaf931b61a050179
      CANDLE_AUDIO_YUE_S2_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--SceneWorks--yue-s2-1b-general-candle\snapshots\3d6a71c7f2af1010983fc9da7bcaba528f083da6
      CANDLE_AUDIO_YUE_XCODEC_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--SceneWorks--xcodec-mini-infer\snapshots\8ca30a19de500892e23a6ee687fca030053db60d
      # The bottom rung of the arch ladder, not the hardware -- see `same-l-cuda` in real-weights.yml.
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: |
          uv python install 3.12.10 --managed-python --no-registry --no-bin --no-config || exit /b 1
          for /f "delims=" %%P in ('uv python find 3.12.10 --managed-python --no-project --no-config') do set "REVIEWED_PYTHON=%%P"
          if not defined REVIEWED_PYTHON exit /b 1
          "%REVIEWED_PYTHON%" -c "import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version" || exit /b 1
          echo REVIEWED_PYTHON=%REVIEWED_PYTHON%>>"%GITHUB_ENV%"
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      # The runner service's global RUSTC_WRAPPER=sccache resets mid-build on heavy Candle/CUDA
      # graphs (see `candle-qwen-image-2-1` in real-weights.yml), so this job clears it.
      - name: Disable unstable sccache wrapper for the heavy Candle lane
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
          Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue
      - name: Require operator-provided models root and initialize evidence
        shell: cmd
        run: |
          if "%CANDLE_GEN_MODELS_ROOT%"=="" (
            echo Missing repository variable CANDLE_GEN_MODELS_ROOT for the Windows CUDA runner.
            exit /b 1
          )
          if exist "%RUNNER_TEMP%\yue-cuda-evidence" rmdir /s /q "%RUNNER_TEMP%\yue-cuda-evidence"
          mkdir "%RUNNER_TEMP%\yue-cuda-evidence" || exit /b 1
          echo YUE_EVIDENCE=%RUNNER_TEMP%\yue-cuda-evidence>>"%GITHUB_ENV%"
          echo YUE_SNAPSHOT_ROOT=%CANDLE_GEN_MODELS_ROOT%\..\yue-snapshot-root-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%>>"%GITHUB_ENV%"
          echo YUE_REF_DIR=%RUNNER_TEMP%\yue-ref>>"%GITHUB_ENV%"
      - name: Record the CUDA device inventory
        continue-on-error: true
        shell: cmd
        run: |
          where nvidia-smi >nul 2>&1 || (echo nvidia-smi not on PATH& exit /b 0)
          nvidia-smi --query-gpu=index,name,memory.total,memory.used,memory.free --format=csv > "%YUE_EVIDENCE%\cuda-device-inventory.csv"
          type "%YUE_EVIDENCE%\cuda-device-inventory.csv"
      - name: Materialize and verify immutable snapshots
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt || exit /b 1
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue-s1-7b-anneal-en-cot-bf16 --snapshot "%CANDLE_AUDIO_YUE_EN_COT_SNAPSHOT%" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue-s1-7b-anneal-en-icl-q4 --snapshot "%CANDLE_AUDIO_YUE_EN_ICL_SNAPSHOT%" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue-s2-1b-general --snapshot "%CANDLE_AUDIO_YUE_S2_SNAPSHOT%" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue-xcodec-mini-infer --snapshot "%CANDLE_AUDIO_YUE_XCODEC_SNAPSHOT%" || exit /b 1
      # Every tier of both stage-1 LMs and of stage 2, into the same pinned snapshots (reuses the
      # hash-locked hub install from the step above).
      - name: Materialize the memory mode's remaining tiers
        if: ${{ env.YUE_MODE == 'memory' }}
        shell: cmd
        run: |
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue-s1-7b-anneal-en-cot-q4 --snapshot "%CANDLE_AUDIO_YUE_EN_COT_SNAPSHOT%" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue-s1-7b-anneal-en-cot-q8 --snapshot "%CANDLE_AUDIO_YUE_EN_COT_SNAPSHOT%" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue-s1-7b-anneal-en-icl-q8 --snapshot "%CANDLE_AUDIO_YUE_EN_ICL_SNAPSHOT%" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue-s1-7b-anneal-en-icl-bf16 --snapshot "%CANDLE_AUDIO_YUE_EN_ICL_SNAPSHOT%" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue-s2-1b-general-q8 --snapshot "%CANDLE_AUDIO_YUE_S2_SNAPSHOT%" || exit /b 1
      # The test reads `YUE_SNAPSHOT_ROOT/<repo>`. Hard links to the resolved blobs, not junctions:
      # hub-cache files are relative symlinks that do not resolve behind a junction (see the script).
      # The links need the root on the cache's volume; the script copies if they ever cannot.
      - name: Lay out the YuE snapshot root
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" scripts/release/yue_real_weights.py stage-root --root "%YUE_SNAPSHOT_ROOT%" --repo "yue-s1-7b-anneal-en-cot-candle=%CANDLE_AUDIO_YUE_EN_COT_SNAPSHOT%" --repo "yue-s1-7b-anneal-en-icl-candle=%CANDLE_AUDIO_YUE_EN_ICL_SNAPSHOT%" --repo "yue-s2-1b-general-candle=%CANDLE_AUDIO_YUE_S2_SNAPSHOT%" --repo "xcodec-mini-infer=%CANDLE_AUDIO_YUE_XCODEC_SNAPSHOT%" || exit /b 1
      - name: Stage the upstream ICL reference clip
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\yue-reference-decode" -r .github/requirements/real-weights-yue-reference-windows-x64-py312.txt || exit /b 1
          set "PYTHONPATH=%RUNNER_TEMP%\yue-reference-decode"
          set "YUE_STEMS="
          if "%YUE_MODE%"=="memory" set "YUE_STEMS=--with-stems"
          "%REVIEWED_PYTHON%" scripts/release/yue_real_weights.py stage-reference --ref-dir "%YUE_REF_DIR%" %YUE_STEMS% > "%YUE_EVIDENCE%\reference-clip.log" 2>&1 || (type "%YUE_EVIDENCE%\reference-clip.log" & exit /b 1)
          type "%YUE_EVIDENCE%\reference-clip.log"
      # Its own step so the cold nvcc/MSVC build reads as build time in the run's step timings.
      - name: Build the YuE CUDA test binary
        shell: cmd
        run: |
          call "%VCVARS%"
          set "YUE_TEST=registered_loader_real_weights"
          if "%YUE_MODE%"=="memory" set "YUE_TEST=cuda_memory_real_weights"
          cargo test --locked --release -p candle-audio-yue --features cuda --test %YUE_TEST% --no-run || exit /b 1
      - name: Run the YuE real-weight renders
        if: ${{ env.YUE_MODE != 'memory' }}
        shell: cmd
        run: |
          call "%VCVARS%"
          set "YUE_FAILED=0"
          call :run_one bf16 en_cot_renders_one_segment_through_the_registered_loader || set "YUE_FAILED=1"
          call :run_one bf16 en_cot_renders_one_segment_from_the_tiered_repo_roots || set "YUE_FAILED=1"
          call :run_one q4 en_icl_renders_one_segment_with_a_single_track_reference || set "YUE_FAILED=1"
          if not "%YUE_FAILED%"=="0" exit /b 1
          exit /b 0

          :run_one
          set "YUE_TIER=%~1"
          set "log=%YUE_EVIDENCE%\%~2-%~1.log"
          set "vram=%YUE_EVIDENCE%\%~2-%~1-vram.csv"
          start "" /b powershell -NoProfile -Command "while (-not (Test-Path '%vram%.stop')) { nvidia-smi --query-gpu=timestamp,index,memory.used --format=csv,noheader,nounits | Add-Content -Path '%vram%'; Start-Sleep -Milliseconds 500 }"
          cargo test --locked --release -p candle-audio-yue --features cuda --test registered_loader_real_weights %~2 -- --ignored --exact --nocapture > "%log%" 2>&1
          set "rc=%ERRORLEVEL%"
          echo stop> "%vram%.stop"
          powershell -NoProfile -Command "Start-Sleep -Seconds 2; Import-Csv -Header t,i,m '%vram%' | Group-Object i | ForEach-Object { 'cuda:' + $_.Name + ' peak ' + ($_.Group | Measure-Object -Property m -Maximum).Maximum + ' MiB' }"
          type "%log%"
          if not "%rc%"=="0" (echo ::error::%~2 at %~1 failed& exit /b 1)
          findstr /C:"test result: ok. 1 passed" "%log%" >nul || (echo ::error::%~2 did not run exactly one passing test& exit /b 1)
          exit /b 0
      # The inputs reach a `for` list in cmd below, so only the known case and tier names pass, and
      # an empty or whitespace-only list fails instead of measuring nothing and going green. The
      # script reads both from the environment, so no shell expands the raw input first.
      - name: Check the memory-mode selection
        if: ${{ env.YUE_MODE == 'memory' }}
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" scripts/release/yue_real_weights.py check-memory-selection || exit /b 1
      # One process per (case, tier): `cuda_memory_real_weights` writes `<case>-<tier>.json` (device
      # and memory-pool peaks per phase, wall time) into the evidence directory; the sampler beside it
      # records every GPU's nvidia-smi `memory.used` every 500 ms from before the process starts, so
      # its first row is the case's baseline. A failed case does not stop the others.
      - name: Measure YuE device memory
        if: ${{ env.YUE_MODE == 'memory' }}
        shell: cmd
        run: |
          call "%VCVARS%"
          set "YUE_FAILED=0"
          set "YUE_MEMORY_OUT=%YUE_EVIDENCE%"
          for %%C in (%YUE_MEMORY_CASES%) do for %%T in (%YUE_MEMORY_TIERS%) do call :measure %%C %%T || set "YUE_FAILED=1"
          if not "%YUE_FAILED%"=="0" exit /b 1
          exit /b 0

          :measure
          set "YUE_MEMORY_CASE=%~1"
          set "YUE_TIER=%~2"
          set "log=%YUE_EVIDENCE%\%~1-%~2.log"
          set "vram=%YUE_EVIDENCE%\%~1-%~2-vram.csv"
          start "" /b powershell -NoProfile -Command "while (-not (Test-Path '%vram%.stop')) { nvidia-smi --query-gpu=timestamp,index,pci.bus_id,memory.used --format=csv,noheader,nounits | Add-Content -Path '%vram%'; Start-Sleep -Milliseconds 500 }"
          powershell -NoProfile -Command "Start-Sleep -Seconds 2"
          cargo test --locked --release -p candle-audio-yue --features cuda --test cuda_memory_real_weights measure_one_case -- --ignored --exact --nocapture > "%log%" 2>&1
          set "rc=%ERRORLEVEL%"
          echo stop> "%vram%.stop"
          powershell -NoProfile -Command "Start-Sleep -Seconds 2"
          type "%log%"
          if not "%rc%"=="0" (echo ::error::%~1 at %~2 failed& exit /b 1)
          findstr /C:"test result: ok. 1 passed" "%log%" >nul || (echo ::error::%~1 at %~2 did not run exactly one passing test& exit /b 1)
          exit /b 0
      - name: Summarize the YuE memory measurement
        if: ${{ !cancelled() && env.YUE_MODE == 'memory' }}
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" scripts/release/yue_real_weights.py summarize-memory --evidence "%YUE_EVIDENCE%" > "%YUE_EVIDENCE%\memory-summary.log" 2>&1
          set "rc=%ERRORLEVEL%"
          type "%YUE_EVIDENCE%\memory-summary.log"
          type "%YUE_EVIDENCE%\memory-summary.log" >> "%GITHUB_STEP_SUMMARY%"
          exit /b %rc%
      - name: Keep the YuE CUDA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue-cuda-evidence
          path: ${{ runner.temp }}/yue-cuda-evidence
          if-no-files-found: error
          retention-days: 30
      # The staged root lives beside the persistent cache, not in RUNNER_TEMP, so nothing else
      # removes it. Deleting the links never touches the cache's blobs.
      - name: Remove the run-scoped YuE snapshot root
        if: always()
        shell: cmd
        run: |
          if not defined YUE_SNAPSHOT_ROOT exit /b 0
          if exist "%YUE_SNAPSHOT_ROOT%" rmdir /s /q "%YUE_SNAPSHOT_ROOT%"
          if exist "%YUE_SNAPSHOT_ROOT%" (echo ::error::could not remove %YUE_SNAPSHOT_ROOT%& exit /b 1)
          exit /b 0

  # sc-22995: YuE2 precision tiers on CUDA (see the header). `timeout-minutes: 240` is a runaway
  # guard for a lane that has never executed: a cold `--features cuda` release build, a one-time
  # ~7.4 GB fetch, the F32 CPU reference (~10 min on the dev Mac), two tier derivations, six
  # measured configurations, one registry render and the CPU AR parity replay (sc-23002).
  candle-audio-yue2:
    name: Candle YuE2 precision tiers real weights (CUDA)
    if: inputs.family == 'yue2'
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 240
    env:
      CANDLE_GEN_MODELS_ROOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
      CANDLE_AUDIO_YUE2_3B_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--m-a-p--YuE2-3B\snapshots\1a96eca688d6ae5d7f0feb88573fec89920fcd19
      CANDLE_AUDIO_YUE2_VAE_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--m-a-p--YuE2-Vae\snapshots\95535e72a97bc0f09b8ada125d26b4009428c0e8
      CANDLE_AUDIO_YUE2_VAE_LEGACY_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--m-a-p--YuE2-Vae-legacy\snapshots\b54118f0fc462f08999d1ec07e88817f4ee3f770
      # The bottom rung of the arch ladder, not the hardware -- see `same-l-cuda` in real-weights.yml.
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: |
          uv python install 3.12.10 --managed-python --no-registry --no-bin --no-config || exit /b 1
          for /f "delims=" %%P in ('uv python find 3.12.10 --managed-python --no-project --no-config') do set "REVIEWED_PYTHON=%%P"
          if not defined REVIEWED_PYTHON exit /b 1
          "%REVIEWED_PYTHON%" -c "import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version" || exit /b 1
          echo REVIEWED_PYTHON=%REVIEWED_PYTHON%>>"%GITHUB_ENV%"
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      # The runner service's global RUSTC_WRAPPER=sccache resets mid-build on heavy Candle/CUDA
      # graphs (see `candle-qwen-image-2-1` in real-weights.yml), so this job clears it.
      - name: Disable unstable sccache wrapper for the heavy Candle lane
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
          Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue
      - name: Require operator-provided models root and initialize evidence
        shell: cmd
        run: |
          if "%CANDLE_GEN_MODELS_ROOT%"=="" (
            echo Missing repository variable CANDLE_GEN_MODELS_ROOT for the Windows CUDA runner.
            exit /b 1
          )
          if exist "%RUNNER_TEMP%\yue2-cuda-evidence" rmdir /s /q "%RUNNER_TEMP%\yue2-cuda-evidence"
          mkdir "%RUNNER_TEMP%\yue2-cuda-evidence" || exit /b 1
          echo YUE2_EVIDENCE=%RUNNER_TEMP%\yue2-cuda-evidence>>"%GITHUB_ENV%"
          echo YUE2_QUALITY_OUT=%RUNNER_TEMP%\yue2-quality>>"%GITHUB_ENV%"
          echo YUE2_TIER_DIR=%CANDLE_GEN_MODELS_ROOT%\..\yue2-tiers-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%>>"%GITHUB_ENV%"
      - name: Record the CUDA device inventory
        continue-on-error: true
        shell: cmd
        run: |
          where nvidia-smi >nul 2>&1 || (echo nvidia-smi not on PATH& exit /b 0)
          nvidia-smi --query-gpu=index,name,compute_cap,driver_version,memory.total,memory.used,memory.free --format=csv > "%YUE2_EVIDENCE%\cuda-device-inventory.csv"
          type "%YUE2_EVIDENCE%\cuda-device-inventory.csv"
      - name: Materialize and verify immutable YuE2 snapshots
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt || exit /b 1
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue2-3b --snapshot "%CANDLE_AUDIO_YUE2_3B_SNAPSHOT%" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue2-vae --snapshot "%CANDLE_AUDIO_YUE2_VAE_SNAPSHOT%" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model yue2-vae-legacy --snapshot "%CANDLE_AUDIO_YUE2_VAE_LEGACY_SNAPSHOT%" || exit /b 1
      # Its own step so the cold nvcc/MSVC build reads as build time in the run's step timings.
      - name: Build the YuE2 CUDA test binary
        id: build-yue2
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-yue2 --features cuda --lib --test engine_real_weights --no-run || exit /b 1
      - name: Run the YuE2 CUDA lib tests
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-yue2 --features cuda --lib -- --nocapture > "%YUE2_EVIDENCE%\cuda-lib-tests.log" 2>&1
          set "rc=%ERRORLEVEL%"
          type "%YUE2_EVIDENCE%\cuda-lib-tests.log"
          if not "%rc%"=="0" (echo ::error::the YuE2 CUDA lib tests failed& exit /b 1)
          rem With --nocapture a test's printed evidence can sit between its name and its "ok", so the
          rem pass is the zero-failure result line and the CUDA tests are proven to have run by name.
          findstr /C:"test result: ok." "%YUE2_EVIDENCE%\cuda-lib-tests.log" >nul || (echo ::error::no passing test result& exit /b 1)
          for %%T in (fp8_gemm_matches_its_dequantized_reference prepare_then_restore_is_bit_exact_and_counted the_public_acoustic_stage_restores_an_active_fp8_mode the_engine_restores_bf16_before_the_acoustic_stage) do (
            findstr /C:"test fp8::tests::cuda::%%T ..." "%YUE2_EVIDENCE%\cuda-lib-tests.log" >nul || (echo ::error::fp8::tests::cuda::%%T did not run& exit /b 1)
          )
          exit /b 0
      - name: Measure the YuE2 tiers against the F32 reference
        shell: cmd
        run: |
          call "%VCVARS%"
          set "YUE2_HF_HUB=%CANDLE_GEN_MODELS_ROOT%"
          set "YUE2_QUALITY_DEVICE=cuda"
          set "YUE2_QUALITY_CONFIGS=f32,f32dev,bf16,fp8,q8,q4"
          set "log=%YUE2_EVIDENCE%\tier-quality.log"
          set "vram=%YUE2_EVIDENCE%\tier-quality-vram.csv"
          start "" /b powershell -NoProfile -Command "while (-not (Test-Path '%vram%.stop')) { nvidia-smi --query-gpu=timestamp,index,memory.used --format=csv,noheader,nounits | Add-Content -Path '%vram%'; Start-Sleep -Milliseconds 500 }"
          cargo test --locked --release -p candle-audio-yue2 --features cuda --lib quality::tier_quality_against_the_f32_reference -- --ignored --exact --nocapture > "%log%" 2>&1
          set "rc=%ERRORLEVEL%"
          echo stop> "%vram%.stop"
          powershell -NoProfile -Command "Start-Sleep -Seconds 2; Import-Csv -Header t,i,m '%vram%' | Group-Object i | ForEach-Object { 'cuda:' + $_.Name + ' peak ' + ($_.Group | Measure-Object -Property m -Maximum).Maximum + ' MiB' }"
          type "%log%"
          if exist "%YUE2_QUALITY_OUT%\quality-*.json" copy /y "%YUE2_QUALITY_OUT%\quality-*.json" "%YUE2_EVIDENCE%\" >nul
          if not "%rc%"=="0" (echo ::error::the YuE2 tier quality measurement failed& exit /b 1)
          findstr /C:"test result: ok. 1 passed" "%log%" >nul || (echo ::error::the quality test did not run exactly once& exit /b 1)
          findstr /C:"YUE2_EVIDENCE_SUMMARY {" "%log%" > "%YUE2_EVIDENCE%\tier-quality-summary.txt" || (echo ::error::the quality test printed no evidence summary& exit /b 1)
          exit /b 0
      # sc-23002: the registered loader on the registry's production device (CUDA, BF16), with the
      # same record-only nvidia-smi sampler as the tier measurement, then the AR parity replay (every
      # mode, the Chinese case included; CPU F32 by construction). Runs even when the tier
      # measurement failed, as long as the test binaries built.
      - name: Render YuE2 through the registered loader and replay the AR parity cases
        if: ${{ !cancelled() && steps.build-yue2.outcome == 'success' }}
        shell: cmd
        run: |
          call "%VCVARS%"
          set "YUE2_HF_HUB=%CANDLE_GEN_MODELS_ROOT%"
          set "YUE2_FAILED=0"
          set "log=%YUE2_EVIDENCE%\registry-render.log"
          set "vram=%YUE2_EVIDENCE%\registry-render-vram.csv"
          start "" /b powershell -NoProfile -Command "while (-not (Test-Path '%vram%.stop')) { nvidia-smi --query-gpu=timestamp,index,memory.used --format=csv,noheader,nounits | Add-Content -Path '%vram%'; Start-Sleep -Milliseconds 500 }"
          cargo test --locked --release -p candle-audio-yue2 --features cuda --test engine_real_weights registered_loader_generates_a_song_with_every_artifact -- --ignored --exact --nocapture > "%log%" 2>&1
          set "rc=%ERRORLEVEL%"
          echo stop> "%vram%.stop"
          powershell -NoProfile -Command "Start-Sleep -Seconds 2; Import-Csv -Header t,i,m '%vram%' | Group-Object i | ForEach-Object { 'cuda:' + $_.Name + ' peak ' + ($_.Group | Measure-Object -Property m -Maximum).Maximum + ' MiB' }"
          type "%log%"
          if not "%rc%"=="0" (echo ::error::the YuE2 registry render failed& set "YUE2_FAILED=1")
          findstr /C:"test result: ok. 1 passed" "%log%" >nul || (echo ::error::the registry render did not run exactly once& set "YUE2_FAILED=1")
          findstr /C:"YUE2_EVIDENCE_SUMMARY {" "%log%" > "%YUE2_EVIDENCE%\registry-render-summary.txt" || (echo ::error::the registry render printed no evidence summary& set "YUE2_FAILED=1")
          set "log=%YUE2_EVIDENCE%\ar-parity.log"
          cargo test --locked --release -p candle-audio-yue2 --features cuda --lib parity::real_weight_decodes_match_upstream -- --ignored --exact --nocapture > "%log%" 2>&1
          set "rc=%ERRORLEVEL%"
          type "%log%"
          if not "%rc%"=="0" (echo ::error::the YuE2 AR parity replay failed& set "YUE2_FAILED=1")
          findstr /C:"test result: ok. 1 passed" "%log%" >nul || (echo ::error::the AR parity replay did not run exactly once& set "YUE2_FAILED=1")
          findstr /C:"zh_full semantic:" "%log%" >nul || (echo ::error::the AR parity replay did not reach the Chinese case& set "YUE2_FAILED=1")
          if not "%YUE2_FAILED%"=="0" exit /b 1
          exit /b 0
      # Metrics and logs only: no weights, no latents, no audio (those derive from CC BY-NC 4.0
      # weights and stay on the runner).
      - name: Keep the YuE2 CUDA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue2-cuda-evidence
          path: ${{ runner.temp }}/yue2-cuda-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Remove the run-scoped YuE2 tiers and reference outputs
        if: always()
        shell: cmd
        run: |
          if defined YUE2_TIER_DIR if exist "%YUE2_TIER_DIR%" rmdir /s /q "%YUE2_TIER_DIR%"
          if defined YUE2_QUALITY_OUT if exist "%YUE2_QUALITY_OUT%" rmdir /s /q "%YUE2_QUALITY_OUT%"
          if defined YUE2_TIER_DIR if exist "%YUE2_TIER_DIR%" (echo ::error::could not remove %YUE2_TIER_DIR%& exit /b 1)
          exit /b 0

  candle-audio-yue2-metal:
    name: Candle YuE2 quality (Metal, nax-macos-2)
    if: inputs.family == 'yue2-metal'
    runs-on: [self-hosted, macOS, ARM64, rw-audio]
    timeout-minutes: 240
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../yue2-metal-target-${{ github.run_id }}-${{ github.run_attempt }}
      YUE2_QUALITY_OUT: ${{ github.workspace }}/../yue2-metal-quality-${{ github.run_id }}-${{ github.run_attempt }}
      YUE2_TIER_DIR: ${{ github.workspace }}/../yue2-metal-tiers-${{ github.run_id }}-${{ github.run_attempt }}
      YUE2_EVIDENCE: ${{ github.workspace }}/../yue2-metal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      RUSTC_WRAPPER: ""
    steps:
      - name: Require the designated physical host before checkout or provisioning
        run: |
          test "$RUNNER_NAME" = nax-macos-2 || { echo "::error::YuE2 Metal quality requires nax-macos-2, got $RUNNER_NAME"; exit 1; }
      # Workflow controls come from the dispatched branch. The engine under test is always M2.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Refuse busy or undersized host
        id: preflight
        run: python3.12 scripts/ci/yue2_metal_preflight.py --evidence "$YUE2_EVIDENCE"
      - name: Check out the immutable M2 engine
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: 99a60541a73706fb67b4e78f44458774423ffb8e
          path: engine
          persist-credentials: false
      - name: Verify engine identity and prepare paths
        run: |
          test "$(git -C engine rev-parse HEAD)" = 99a60541a73706fb67b4e78f44458774423ffb8e
          test -z "$(git -C engine status --porcelain)"
          test -x "$(command -v python3.12)"
          hub="${HF_HUB_CACHE:-${HF_HOME:-$HOME/.cache/huggingface}/hub}"
          mkdir -p "$hub" "$YUE2_QUALITY_OUT" "$YUE2_EVIDENCE"
          echo "YUE2_EVIDENCE=$(cd "$YUE2_EVIDENCE" && pwd -P)" >> "$GITHUB_ENV"
          {
            echo "YUE2_HF_HUB=$hub"
            echo "CANDLE_AUDIO_YUE2_3B_SNAPSHOT=$hub/models--m-a-p--YuE2-3B/snapshots/1a96eca688d6ae5d7f0feb88573fec89920fcd19"
            echo "CANDLE_AUDIO_YUE2_VAE_SNAPSHOT=$hub/models--m-a-p--YuE2-Vae/snapshots/95535e72a97bc0f09b8ada125d26b4009428c0e8"
            echo "CANDLE_AUDIO_YUE2_VAE_LEGACY_SNAPSHOT=$hub/models--m-a-p--YuE2-Vae-legacy/snapshots/b54118f0fc462f08999d1ec07e88817f4ee3f770"
          } >> "$GITHUB_ENV"
          printf 'workflow_sha=%s\nengine_sha=%s\nrunner=%s\n' "$GITHUB_SHA" "$(git -C engine rev-parse HEAD)" "$RUNNER_NAME" > "$YUE2_EVIDENCE/identity.txt"
      - name: Install hash-locked macOS snapshot materializer
        run: |
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/yue2-metal-hub-tools" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
      - name: Materialize and verify pinned generation snapshots
        env:
          PYTHONPATH: ${{ runner.temp }}/yue2-metal-hub-tools
        run: |
          python3.12 scripts/release/ensure_model_snapshot.py --model yue2-3b --snapshot "$CANDLE_AUDIO_YUE2_3B_SNAPSHOT"
          python3.12 scripts/release/ensure_model_snapshot.py --model yue2-vae --snapshot "$CANDLE_AUDIO_YUE2_VAE_SNAPSHOT"
          python3.12 scripts/release/ensure_model_snapshot.py --model yue2-vae-legacy --snapshot "$CANDLE_AUDIO_YUE2_VAE_LEGACY_SNAPSHOT"
      - name: Build exact-M2 release Metal quality binary without running it
        working-directory: engine
        run: |
          cargo test --locked --release -p candle-audio-yue2 --features metal --lib --no-run > "$YUE2_EVIDENCE/build.log" 2>&1 || { cat "$YUE2_EVIDENCE/build.log"; exit 1; }
      - name: Regenerate the exact-M2 CPU F32 reference
        working-directory: engine
        env:
          YUE2_QUALITY_DEVICE: cpu
          YUE2_QUALITY_REFERENCE_DEVICE: cpu
          YUE2_QUALITY_CONFIGS: f32
        run: |
          cargo test --locked --release -p candle-audio-yue2 --features metal --lib quality::tier_quality_against_the_f32_reference -- --ignored --exact --nocapture --test-threads=1 > "$YUE2_EVIDENCE/reference.log" 2>&1 || { cat "$YUE2_EVIDENCE/reference.log"; exit 1; }
          grep -F 'test result: ok. 1 passed' "$YUE2_EVIDENCE/reference.log"
          grep -F 'YUE2_EVIDENCE_SUMMARY {"test":"quality::tier_quality_against_the_f32_reference","config":"f32"' "$YUE2_EVIDENCE/reference.log" > "$YUE2_EVIDENCE/reference-summary.txt"
      - name: Validate reference identity and exact-M2 fixture shapes
        run: |
          python3.12 scripts/ci/yue2_quality_reference.py "$YUE2_QUALITY_OUT/reference-f32-cpu.safetensors" engine/crates/audio/candle-audio-yue2/tests/fixtures/ar_real_weights.json --identity "$YUE2_EVIDENCE/reference-identity.json"
      - name: Recheck host contention before opening Metal
        run: python3.12 scripts/ci/yue2_metal_preflight.py --evidence "$YUE2_EVIDENCE" --label before-metal
      - name: Measure four Metal configurations in order, failing on the first error
        working-directory: engine
        env:
          YUE2_QUALITY_DEVICE: metal
          YUE2_QUALITY_REFERENCE_DEVICE: cpu
          YUE2_QUALITY_CONFIGS: f32dev,bf16,q8,q4
        run: |
          cargo test --locked --release -p candle-audio-yue2 --features metal --lib quality::tier_quality_against_the_f32_reference -- --ignored --exact --nocapture --test-threads=1 > "$YUE2_EVIDENCE/metal-quality.log" 2>&1 || { cat "$YUE2_EVIDENCE/metal-quality.log"; exit 1; }
          grep -F 'test result: ok. 1 passed' "$YUE2_EVIDENCE/metal-quality.log"
          grep -F 'YUE2_EVIDENCE_SUMMARY {' "$YUE2_EVIDENCE/metal-quality.log" > "$YUE2_EVIDENCE/metal-quality-summary.txt"
          for config in f32dev bf16 q8 q4; do
            test -s "$YUE2_QUALITY_OUT/quality-$config-metal.json"
          done
          test "$(wc -l < "$YUE2_EVIDENCE/metal-quality-summary.txt" | tr -d ' ')" = 4
      - name: Copy any completed quality metrics, including on failure
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        run: |
          for config in f32dev bf16 q8 q4; do
            if test -s "$YUE2_QUALITY_OUT/quality-$config-metal.json"; then
              cp "$YUE2_QUALITY_OUT/quality-$config-metal.json" "$YUE2_EVIDENCE/"
            fi
          done
      # Artifact contains only logs/metrics/hashes; never upload the F32 tensor reference or tiers.
      - name: Keep YuE2 Metal quality evidence
        id: upload-metal-evidence
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue2-metal-quality-evidence
          path: ${{ env.YUE2_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove run-owned build, derived tiers, and tensor reference
        if: ${{ always() && steps.upload-metal-evidence.outcome == 'success' }}
        run: |
          rm -rf -- "$CARGO_TARGET_DIR" "$YUE2_TIER_DIR" "$YUE2_QUALITY_OUT" "$RUNNER_TEMP/yue2-metal-hub-tools"

  collect-yue2-metal-evidence:
    name: Collect existing YuE2 Metal evidence (no model execution)
    if: inputs.family == 'yue2-metal-evidence'
    runs-on: [self-hosted, macOS, ARM64, rw-audio]
    timeout-minutes: 10
    steps:
      - name: Locate completed run evidence on its original host
        id: locate
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/../yue2-metal-evidence-36559069894-1
        run: |
          test "$RUNNER_NAME" = nax-macos-2
          EVIDENCE_DIR=$(cd "$EVIDENCE_DIR" && pwd -P)
          test -s "$EVIDENCE_DIR/identity.txt"
          grep -Fx 'engine_sha=99a60541a73706fb67b4e78f44458774423ffb8e' "$EVIDENCE_DIR/identity.txt"
          grep -F 'test result: ok. 1 passed' "$EVIDENCE_DIR/metal-quality.log"
          for config in f32dev bf16 q8 q4; do
            test -s "$EVIDENCE_DIR/quality-$config-metal.json"
          done
          echo "evidence=$EVIDENCE_DIR" >> "$GITHUB_OUTPUT"
      - name: Upload existing logs and metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue2-metal-quality-evidence-36559069894
          path: ${{ steps.locate.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove only the completed run's large temporary files
        env:
          RUN_ROOT: ${{ github.workspace }}
        run: |
          RUN_ROOT=$(dirname "$RUN_ROOT")
          rm -rf -- "$RUN_ROOT/yue2-metal-target-36559069894-1" "$RUN_ROOT/yue2-metal-tiers-36559069894-1" "$RUN_ROOT/yue2-metal-quality-36559069894-1"

  yue2-app-metal:
    name: YuE2 app acceptance and q4-default profile (Metal, nax-macos-2)
    if: inputs.family == 'yue2-app-metal'
    runs-on: [self-hosted, macOS, ARM64, rw-audio]
    timeout-minutes: 600
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../yue2-app-metal-target-${{ github.run_id }}-${{ github.run_attempt }}
      APP_STATE: ${{ github.workspace }}/../yue2-app-metal-state-${{ github.run_id }}-${{ github.run_attempt }}
      APP_OUT: ${{ github.workspace }}/../yue2-app-metal-out-${{ github.run_id }}-${{ github.run_attempt }}
      APP_EVIDENCE: ${{ github.workspace }}/../yue2-app-metal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      APP_TOOLS: ${{ github.workspace }}/../yue2-app-metal-tools-${{ github.run_id }}-${{ github.run_attempt }}
      RUSTC_WRAPPER: ""
    steps:
      - name: Require nax-macos-2 before any checkout or build
        run: |
          test "$RUNNER_NAME" = nax-macos-2 || { echo "::error::YuE2 app Metal proof requires nax-macos-2"; exit 1; }
      # This checkout supplies only the workflow controller and preflight scripts.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Canonicalize the run-owned evidence directory
        run: |
          mkdir -p "$APP_EVIDENCE"
          echo "APP_EVIDENCE=$(cd "$APP_EVIDENCE" && pwd -P)" >> "$GITHUB_ENV"
      - name: Check physical resource and process availability
        id: app-preflight
        run: python3.12 scripts/ci/yue2_metal_preflight.py --evidence "$APP_EVIDENCE"
      - name: Check out exact SceneWorks app revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: SceneWorks/SceneWorks
          ref: 44dc4119fc64c48a38dbd4ca94a3a6c2cd05fbe3
          path: app
          persist-credentials: false
      - name: Check out exact M2 inference source for profile identity
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: 99a60541a73706fb67b4e78f44458774423ffb8e
          path: engine
          persist-credentials: false
      - name: Verify both immutable checkouts and build tools
        run: |
          python3.12 -c 'import sys; sys.path.insert(0, "scripts/ci"); from yue2_app_metal import check_sources; from pathlib import Path; check_sources(Path("app"), Path("engine"))'
          command -v rustc
          command -v cargo
          command -v curl
          command -v zstd
      - name: Stage the app's hash-verified macOS ffmpeg binary
        run: |
          mkdir -p "$APP_TOOLS"
          tools=$(cd "$APP_TOOLS" && pwd -P)
          python3.12 app/apps/desktop/scripts/stage-ffmpeg.py "$tools/ffmpeg"
          test -x "$tools/ffmpeg"
          version=$("$tools/ffmpeg" -version)
          [[ "$version" == "ffmpeg version "* ]] || { echo "::error::staged ffmpeg version probe failed"; exit 1; }
          printf '%s\n' "$version" | sed -n '1p'
          echo "YUE2_FFMPEG_BIN=$tools/ffmpeg" >> "$GITHUB_ENV"
      - name: Set up Node 22 for the acceptance and profile harnesses
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Fetch verified prebuilt release MLX for the exact app pin
        working-directory: app
        run: |
          set +e
          scripts/fetch-prebuilt-mlx.sh --build-type Release --github-env
          rc=$?
          set -e
          if [ "$rc" = 1 ]; then
            echo "::warning::No release prebuilt for the app's MLX pin; building MLX from source"
            {
              echo "PMETAL_MLX_PREBUILT_DIR="
              echo "PMETAL_METALLIB_PATH="
            } >> "$GITHUB_ENV"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Compile release API and targeted profile test without running Metal
        working-directory: app
        run: |
          mkdir -p "$APP_EVIDENCE"
          cargo build --release --locked -p sceneworks-rust-api > "$APP_EVIDENCE/build-api.log" 2>&1 || { tail -100 "$APP_EVIDENCE/build-api.log"; exit 1; }
          cargo test --release --locked -p sceneworks-worker --lib --no-run yue2_memory_profile::capture_case > "$APP_EVIDENCE/build-profile.log" 2>&1 || { tail -100 "$APP_EVIDENCE/build-profile.log"; exit 1; }
          test -x "$CARGO_TARGET_DIR/release/sceneworks-rust-api"
      - name: Recheck host before starting the first app render
        run: python3.12 scripts/ci/yue2_metal_preflight.py --evidence "$APP_EVIDENCE" --label before-metal
      - name: Run full acceptance and one q4-default profile capture
        id: app-proof
        continue-on-error: true
        run: |
          python3.12 scripts/ci/yue2_app_metal.py \
            --app app --engine engine --state "$APP_STATE" --out "$APP_OUT" \
            --evidence "$APP_EVIDENCE" --preflight "$APP_EVIDENCE/preflight-before-metal.json" \
            --api-bin "$CARGO_TARGET_DIR/release/sceneworks-rust-api"
      # The controller copies only JSON/Markdown receipts and logs. Audio and app state remain on host.
      - name: Upload app Metal receipts without audio or tensors
        if: ${{ always() && steps.app-preflight.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue2-app-metal-evidence-${{ github.run_id }}
          path: ${{ env.APP_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
      - name: Enforce app and targeted-profile verdict after upload
        if: ${{ always() && steps.app-preflight.outcome == 'success' }}
        env:
          PROOF_OUTCOME: ${{ steps.app-proof.outcome }}
        run: |
          test "$PROOF_OUTCOME" = success || { echo "::error::YuE2 app Metal proof failed; inspect retained host state and artifact"; exit 1; }
          cat "$APP_EVIDENCE/verdict.json"
          printf 'YuE2 Metal app state for listening: %s\n' "$APP_STATE" >> "$GITHUB_STEP_SUMMARY"

  yue2-app-metal-profile-resume:
    name: YuE2 q4-default profile resume only (Metal, nax-macos-2)
    if: inputs.family == 'yue2-app-metal-profile-resume'
    runs-on: [self-hosted, macOS, ARM64, rw-audio]
    timeout-minutes: 180
    env:
      # Original run 36565987342-1 completed acceptance, but preflight prevented
      # the profile from starting. Keep its app state, model cache and build target.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../yue2-app-metal-target-36565987342-1
      APP_STATE: ${{ github.workspace }}/../yue2-app-metal-state-36565987342-1
      APP_OUT: ${{ github.workspace }}/../yue2-app-metal-out-36565987342-1
      APP_EVIDENCE: ${{ github.workspace }}/../yue2-app-metal-profile-resume-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      RUSTC_WRAPPER: ""
    steps:
      - name: Require nax-macos-2 before any checkout or build
        run: |
          test "$RUNNER_NAME" = nax-macos-2 || { echo "::error::YuE2 Metal profile resume requires nax-macos-2"; exit 1; }
      # The dispatch checkout supplies only the controller and fixed-run verifier.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Canonicalize the new receipts directory
        run: |
          mkdir -p "$APP_EVIDENCE"
          echo "APP_EVIDENCE=$(cd "$APP_EVIDENCE" && pwd -P)" >> "$GITHUB_ENV"
      - name: Check physical resources and process ownership before resuming
        id: resume-preflight
        run: python3.12 scripts/ci/yue2_metal_preflight.py --evidence "$APP_EVIDENCE"
      - name: Check out exact SceneWorks app revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: SceneWorks/SceneWorks
          ref: 44dc4119fc64c48a38dbd4ca94a3a6c2cd05fbe3
          path: app
          persist-credentials: false
      - name: Check out exact M2 inference source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: 99a60541a73706fb67b4e78f44458774423ffb8e
          path: engine
          persist-credentials: false
      - name: Set up Node 22 for original evidence verification and profile
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Fetch verified prebuilt release MLX for the exact app pin
        working-directory: app
        run: |
          set +e
          scripts/fetch-prebuilt-mlx.sh --build-type Release --github-env
          rc=$?
          set -e
          if [ "$rc" = 1 ]; then
            echo "::warning::No release prebuilt for the app's MLX pin; building MLX from source"
            {
              echo "PMETAL_MLX_PREBUILT_DIR="
              echo "PMETAL_METALLIB_PATH="
            } >> "$GITHUB_ENV"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Recheck host immediately before targeted Metal profile
        run: python3.12 scripts/ci/yue2_metal_preflight.py --evidence "$APP_EVIDENCE" --label before-profile
      - name: Verify original receipts and capture only the unstarted q4 profile
        id: resume-proof
        continue-on-error: true
        run: |
          python3.12 scripts/ci/yue2_app_metal_resume.py \
            --app app --engine engine --state "$APP_STATE" --out "$APP_OUT" \
            --target "$CARGO_TARGET_DIR" --evidence "$APP_EVIDENCE" \
            --preflight "$APP_EVIDENCE/preflight-before-profile.json"
      - name: Upload resumed profile receipts without audio or tensors
        if: ${{ always() && steps.resume-preflight.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue2-app-metal-profile-resume-evidence-${{ github.run_id }}
          path: ${{ env.APP_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
      - name: Enforce resumed profile verdict after upload
        if: ${{ always() && steps.resume-preflight.outcome == 'success' }}
        env:
          PROOF_OUTCOME: ${{ steps.resume-proof.outcome }}
        run: |
          test "$PROOF_OUTCOME" = success || { echo "::error::YuE2 resumed q4 profile failed; inspect retained host state and artifact"; exit 1; }
          cat "$APP_EVIDENCE/verdict.json"
          printf 'YuE2 Metal app state for listening: %s\n' "$APP_STATE" >> "$GITHUB_STEP_SUMMARY"
