name: YuE2 bounded BF16 tile diagnosis

# CUDA-only waveform, first-Conv7, or derivative decoder trace for failed M3 comparison; no acceptance, model
# generation, app profile, quality sweep, or Metal dispatch. Numerical gates unchanged.
on:
  workflow_dispatch:
    inputs:
      expected_engine_sha:
        type: string
        required: true
        description: Exact failed M3 source, unchanged production implementation
      expected_control_sha:
        type: string
        required: true
        description: Exact reviewed diagnostic workflow and harness SHA
      diagnostic:
        type: choice
        required: true
        default: waveform
        options: [waveform, first_conv, first_conv_math, decoder_trace, native_convt_columns]
        description: One bounded diagnostic, with waveform preserving the existing default
      reference_run_id:
        type: string
        required: true
        description: Existing M3 CPU reference run, never regenerated
      idle_cuda_context_run_id:
        type: string
        required: false
        default: ""
        description: Reviewed idle desktop context receipt; empty keeps refusal

permissions:
  contents: read
  actions: read

concurrency:
  group: inference-real-weights-physical-host
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target

jobs:
  cuda:
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    env:
      EXPECTED_ENGINE_SHA: ${{ inputs.expected_engine_sha }}
      EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
      YUE2_DIAGNOSTIC_SELECTOR: ${{ inputs.diagnostic }}
      YUE2_IDLE_CONTEXT_RUN_ID: ${{ inputs.idle_cuda_context_run_id }}
      YUE2_HF_HUB: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.expected_engine_sha }}
          path: engine
          persist-credentials: false
      - name: Check out the exact pinned Candle source for native-column observation
        if: inputs.diagnostic == 'native_convt_columns'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: huggingface/candle
          ref: 1e6aa85e867eb007cba1b8bae517a10d1aaf0c0d
          path: candle-upstream
          persist-credentials: false
      - name: Download exact reviewed desktop-context receipt when requested
        if: inputs.idle_cuda_context_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yue2-cuda-diagnostic-engine-4127a675fc8575555e029e01b7f6867488880a8f-control-3391f854565a5f5ea8eea48d4a8d9bad2e68c02d-37073714206-1
          run-id: ${{ inputs.idle_cuda_context_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/yue2-reviewed-idle-context
      - name: Verify exact engine source and fixture run selector
        shell: powershell
        env:
          EXPECTED_ENGINE_SHA: ${{ inputs.expected_engine_sha }}
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          REFERENCE_RUN_ID: ${{ inputs.reference_run_id }}
        run: |
          if ($env:EXPECTED_ENGINE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'expected_engine_sha must be 40 lowercase hex' }
          if ($env:EXPECTED_CONTROL_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'expected_control_sha must be 40 lowercase hex' }
          if ($env:REFERENCE_RUN_ID -notmatch '^[0-9]+$') { throw 'reference_run_id must name a fixture run' }
          if ($env:GITHUB_SHA -cne $env:EXPECTED_CONTROL_SHA -or (git -C ../control rev-parse HEAD).Trim() -cne $env:EXPECTED_CONTROL_SHA) { throw 'workflow control SHA mismatch' }
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_ENGINE_SHA) { throw 'engine SHA mismatch' }
          if (git -C ../control status --porcelain --untracked-files=normal) { throw 'workflow control checkout is dirty' }
          if (git status --porcelain --untracked-files=normal) { throw 'engine checkout is dirty' }
          if (-not (Test-Path $env:YUE2_HF_HUB)) { throw 'YuE2 pinned hub is unavailable' }
          foreach ($repo in @('YuE2-3B', 'YuE2-Vae', 'YuE2-Vae-legacy')) {
            $revision = switch ($repo) { 'YuE2-3B' { '1a96eca688d6ae5d7f0feb88573fec89920fcd19' } 'YuE2-Vae' { '95535e72a97bc0f09b8ada125d26b4009428c0e8' } default { 'b54118f0fc462f08999d1ec07e88817f4ee3f770' } }
            if (-not (Test-Path (Join-Path $env:YUE2_HF_HUB "models--m-a-p--$repo\snapshots\$revision"))) { throw "missing pinned $repo snapshot" }
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\yue2-bf16-tile-diagnostic" | Out-Null
          nvidia-smi --query-gpu=index,name,compute_cap,driver_version,memory.total,memory.used,memory.free --format=csv | Out-File -Encoding utf8 "$env:RUNNER_TEMP\yue2-bf16-tile-diagnostic\hardware-before.csv"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yue2-precision-reference
          run-id: ${{ inputs.reference_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/yue2-precision-reference
      - name: Install reviewed Python 3.12
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Resolve pinned interpreter and verify reference
        shell: cmd
        run: |
          uv python install 3.12.10 --managed-python --no-registry --no-bin --no-config || exit /b 1
          for /f "delims=" %%P in ('uv python find 3.12.10 --managed-python --no-project --no-config') do set "REVIEWED_PYTHON=%%P"
          if not defined REVIEWED_PYTHON exit /b 1
          "%REVIEWED_PYTHON%" ..\control\scripts\ci\yue2_precision_proof.py verify-reference --directory "%RUNNER_TEMP%\yue2-precision-reference" --engine-sha "${{ inputs.expected_engine_sha }}" || exit /b 1
          echo REVIEWED_PYTHON=%REVIEWED_PYTHON%>>"%GITHUB_ENV%"
      - name: Select checked Git Bash before pinned Rust
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
      - name: Build the external M3 VAE diagnostic harness
        shell: cmd
        run: |
          set "RUSTC_WRAPPER="
          call "%VCVARS%" || exit /b 1
          if "%YUE2_DIAGNOSTIC_SELECTOR%"=="native_convt_columns" (
            "%REVIEWED_PYTHON%" ..\control\scripts\ci\yue2_native_convt_overlay.py --engine . --candle ..\candle-upstream --root "%RUNNER_TEMP%\yue2-native-convt-build" --trace-patch ..\control\scripts\ci\yue2_bf16_tile_diagnostic\decoder-trace-vae.patch --weight-patch ..\control\scripts\ci\yue2_bf16_tile_diagnostic\native-convt-vae-weight.patch --backend-patch ..\control\scripts\ci\yue2_bf16_tile_diagnostic\native-convt-candle-core.patch --kernel-path-patch ..\control\scripts\ci\yue2_bf16_tile_diagnostic\native-convt-candle-kernel-path.patch --control-sha "%EXPECTED_CONTROL_SHA%" > "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\overlay.log" 2>&1
            if errorlevel 1 (type "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\overlay.log"& exit /b 1)
            set "TRACE_ROOT=%RUNNER_TEMP%\yue2-native-convt-build\engine-overlay"
            set "CANDLE_ROOT=%RUNNER_TEMP%\yue2-native-convt-build\candle-overlay"
          ) else if "%YUE2_DIAGNOSTIC_SELECTOR%"=="decoder_trace" (
            "%REVIEWED_PYTHON%" ..\control\scripts\ci\yue2_decoder_trace_overlay.py --source . --destination "%RUNNER_TEMP%\yue2-bf16-trace-build\engine-overlay" --patch ..\control\scripts\ci\yue2_bf16_tile_diagnostic\decoder-trace-vae.patch --engine-sha "%EXPECTED_ENGINE_SHA%" --control-sha "%EXPECTED_CONTROL_SHA%" > "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\overlay.log" 2>&1
            if errorlevel 1 (type "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\overlay.log"& exit /b 1)
            set "TRACE_ROOT=%RUNNER_TEMP%\yue2-bf16-trace-build\engine-overlay"
          ) else (
            set "TRACE_ROOT="
          )
          if defined CANDLE_ROOT (
            "%REVIEWED_PYTHON%" ..\control\scripts\ci\yue2_bf16_tile_diagnostic.py prepare-harness --template ..\control\scripts\ci\yue2_bf16_tile_diagnostic --destination "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\harness" --engine-sha "%EXPECTED_ENGINE_SHA%" --control-sha "%EXPECTED_CONTROL_SHA%" --overlay-root "%TRACE_ROOT%" --native-candle-root "%CANDLE_ROOT%" || exit /b 1
          ) else if defined TRACE_ROOT (
            "%REVIEWED_PYTHON%" ..\control\scripts\ci\yue2_bf16_tile_diagnostic.py prepare-harness --template ..\control\scripts\ci\yue2_bf16_tile_diagnostic --destination "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\harness" --engine-sha "%EXPECTED_ENGINE_SHA%" --control-sha "%EXPECTED_CONTROL_SHA%" --overlay-root "%TRACE_ROOT%" || exit /b 1
          ) else (
            "%REVIEWED_PYTHON%" ..\control\scripts\ci\yue2_bf16_tile_diagnostic.py prepare-harness --template ..\control\scripts\ci\yue2_bf16_tile_diagnostic --destination "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\harness" --engine-sha "%EXPECTED_ENGINE_SHA%" --control-sha "%EXPECTED_CONTROL_SHA%" || exit /b 1
          )
          cargo fetch --locked --manifest-path "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\harness\Cargo.toml" --target x86_64-pc-windows-msvc > "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\fetch.log" 2>&1
          if errorlevel 1 (type "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\fetch.log"& exit /b 1)
          if defined CANDLE_ROOT (
            cargo build --locked --offline --release --manifest-path "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\harness\Cargo.toml" --features cuda,native_convt_columns --message-format=json > "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.jsonl" 2> "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.log"
          ) else if not defined TRACE_ROOT (
            cargo build --locked --offline --release --manifest-path "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\harness\Cargo.toml" --features cuda --message-format=json > "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.jsonl" 2> "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.log"
          ) else (
            cargo build --locked --offline --release --manifest-path "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\harness\Cargo.toml" --features cuda,decoder_trace --message-format=json > "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.jsonl" 2> "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.log"
          )
          if errorlevel 1 (type "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.log"& exit /b 1)
          if defined CANDLE_ROOT (
            "%REVIEWED_PYTHON%" ..\control\scripts\ci\yue2_bf16_tile_diagnostic.py resolve-binary --build-json "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.jsonl" --output "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\binary.txt" --overlay-root "%TRACE_ROOT%" --native-candle-root "%CANDLE_ROOT%" || exit /b 1
          ) else if defined TRACE_ROOT (
            "%REVIEWED_PYTHON%" ..\control\scripts\ci\yue2_bf16_tile_diagnostic.py resolve-binary --build-json "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.jsonl" --output "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\binary.txt" --overlay-root "%TRACE_ROOT%" || exit /b 1
          ) else (
            "%REVIEWED_PYTHON%" ..\control\scripts\ci\yue2_bf16_tile_diagnostic.py resolve-binary --build-json "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\build.jsonl" --output "%RUNNER_TEMP%\yue2-bf16-tile-diagnostic\binary.txt" || exit /b 1
          )
      - name: Run only the bounded same-input VAE diagnostic
        shell: powershell
        env:
          EXPECTED_ENGINE_SHA: ${{ inputs.expected_engine_sha }}
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
        run: |
          $binary = (Get-Content "$env:RUNNER_TEMP\yue2-bf16-tile-diagnostic\binary.txt" -Raw).Trim()
          $traceArgs = @()
          if ($env:YUE2_DIAGNOSTIC_SELECTOR -ceq 'decoder_trace') { $traceArgs = @('--overlay-root', "$env:RUNNER_TEMP\yue2-bf16-trace-build\engine-overlay") }
          if ($env:YUE2_DIAGNOSTIC_SELECTOR -ceq 'native_convt_columns') { $traceArgs = @('--overlay-root', "$env:RUNNER_TEMP\yue2-native-convt-build\engine-overlay", '--native-candle-root', "$env:RUNNER_TEMP\yue2-native-convt-build\candle-overlay") }
          & $env:REVIEWED_PYTHON ../control/scripts/ci/yue2_bf16_tile_diagnostic.py run --diagnostic "$env:YUE2_DIAGNOSTIC_SELECTOR" --binary "$binary" --reference "$env:RUNNER_TEMP\yue2-precision-reference" --evidence "$env:RUNNER_TEMP\yue2-bf16-tile-diagnostic" --engine-sha "$env:EXPECTED_ENGINE_SHA" --control-sha "$env:EXPECTED_CONTROL_SHA" @traceArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload immutable diagnostic output and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue2-bf16-tile-diagnostic-engine-${{ inputs.expected_engine_sha }}-control-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yue2-bf16-tile-diagnostic
          if-no-files-found: warn
          retention-days: 30
      - name: Upload exact M3 tracked source and declared trace overlay
        if: always() && inputs.diagnostic == 'decoder_trace'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue2-decoder-trace-source-engine-${{ inputs.expected_engine_sha }}-control-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yue2-bf16-trace-build/m3-tracked-source.tar.gz
            ${{ runner.temp }}/yue2-bf16-trace-build/decoder-trace-vae.patch
            ${{ runner.temp }}/yue2-bf16-trace-build/overlay-provenance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload native-column M3 and Candle source archives and declared patches
        if: always() && inputs.diagnostic == 'native_convt_columns'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue2-native-convt-source-engine-${{ inputs.expected_engine_sha }}-control-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yue2-native-convt-build/m3-tracked-source.tar.gz
            ${{ runner.temp }}/yue2-native-convt-build/decoder-trace-vae.patch
            ${{ runner.temp }}/yue2-native-convt-build/native-convt-vae-weight.patch
            ${{ runner.temp }}/yue2-native-convt-build/pinned-candle-tracked-source.tar.gz
            ${{ runner.temp }}/yue2-native-convt-build/native-convt-candle-core.patch
            ${{ runner.temp }}/yue2-native-convt-build/native-convt-candle-kernel-path.patch
            ${{ runner.temp }}/yue2-native-convt-build/overlay-provenance.json
            ${{ runner.temp }}/yue2-native-convt-build/native-provenance.json
          if-no-files-found: error
          retention-days: 30
