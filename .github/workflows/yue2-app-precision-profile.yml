name: YuE2 read-only Metal disk inventory
on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Exact reviewed 40-hex workflow revision
        type: string
        required: true
permissions: {}
concurrency:
  group: yue2-app-precision-nax-macos-2
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: [self-hosted, macOS, ARM64, rw-audio]
    timeout-minutes: 10
    steps:
      - name: Inventory designated runner filesystem without model work
        shell: bash
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = nax-macos-2
          [[ "$EXPECTED_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_CONTROL_SHA" = "$GITHUB_SHA"
          python3.12 - <<'PY'
          import json, os, plistlib, re, stat, subprocess, time
          from datetime import datetime, timezone
          from pathlib import Path
          started = datetime.now(timezone.utc).isoformat()
          deadline, remaining = time.monotonic() + 180, 500000
          nofollow = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          def safe(path):
              for p in [*reversed(path.parents), path]:
                  if p.is_symlink():
                      return False
              return True
          def total(path):
              global remaining
              result = {"path": str(path), "allocatedBytes": 0, "logicalBytes": 0,
                        "entries": 0, "complete": True, "symlinks": [], "skippedMounts": 0}
              if not safe(path):
                  return {"path": str(path), "symlinkInPath": True, "traversed": False}
              if not path.exists():
                  return {"path": str(path), "present": False}
              seen = set()
              def visit(fd, label, device):
                  global remaining
                  with os.scandir(fd) as entries:
                      for entry in entries:
                          if remaining <= 0 or time.monotonic() >= deadline:
                              result["complete"] = False
                              return
                          remaining -= 1
                          result["entries"] += 1
                          s = os.stat(entry.name, dir_fd=fd, follow_symlinks=False)
                          if stat.S_ISLNK(s.st_mode):
                              if len(result["symlinks"]) < 32:
                                  result["symlinks"].append(str(label / entry.name))
                              continue
                          if s.st_dev != device:
                              result["skippedMounts"] += 1
                              continue
                          key = (s.st_dev, s.st_ino)
                          if key in seen:
                              continue
                          seen.add(key)
                          result["allocatedBytes"] += s.st_blocks * 512
                          result["logicalBytes"] += s.st_size
                          if stat.S_ISDIR(s.st_mode):
                              child = os.open(entry.name, nofollow, dir_fd=fd)
                              try:
                                  visit(child, label / entry.name, device)
                              finally:
                                  os.close(child)
              try:
                  fd = os.open(path, nofollow)
                  try:
                      visit(fd, path, os.fstat(fd).st_dev)
                  finally:
                      os.close(fd)
              except OSError as error:
                  result.update(complete=False, errorType=type(error).__name__)
              return result
          def receipt(path):
              if not safe(path) or not path.is_file():
                  return None
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  if os.fstat(fd).st_size > 32768:
                      return None
                  with os.fdopen(fd, "rb", closefd=False) as f:
                      value = json.load(f)
                  return {k: value[k] for k in ("app_sha", "engine_sha", "control_sha")
                          if isinstance(value.get(k), str) and re.fullmatch(r"[0-9a-f]{40}", value[k])}
              except (ValueError, OSError):
                  return None
              finally:
                  os.close(fd)
          def plist(args):
              raw = subprocess.run(args, capture_output=True, timeout=20, check=False)
              if raw.returncode:
                  return {"unavailable": True, "exitCode": raw.returncode}
              return plistlib.loads(raw.stdout)
          models = Path("/Volumes/Models")
          if not safe(models) or not models.is_dir():
              raise RuntimeError("Models mount absent or symlinked")
          fs = os.statvfs(models)
          info = plist(["/usr/sbin/diskutil", "info", "-plist", str(models)])
          internal_mount = Path("/System/Volumes/Data") if os.path.ismount("/System/Volumes/Data") else Path("/")
          build_info = plist(["/usr/sbin/diskutil", "info", "-plist", str(internal_mount)])
          apfs = plist(["/usr/sbin/diskutil", "apfs", "list", "-plist"])
          containers = [{k: c.get(k) for k in ("ContainerReference", "CapacityCeiling", "CapacityFree")}
                        | {"physicalStores": [p.get("DeviceIdentifier") for p in c.get("PhysicalStores", [])],
                           "selectedVolumes": [{k: v.get(k) for k in ("DeviceIdentifier", "CapacityInUse")}
                                             for v in c.get("Volumes", [])
                                             if v.get("DeviceIdentifier") in (info.get("DeviceIdentifier"), build_info.get("DeviceIdentifier"))]}
                        for c in apfs.get("Containers", [])
                        if c.get("ContainerReference") in (info.get("APFSContainerReference"), build_info.get("APFSContainerReference"))]
          workspace = Path("/Users/MTrefry/actions-runner-nax/_work/inference/inference")
          if Path(os.environ["GITHUB_WORKSPACE"]) != workspace or not safe(workspace.parent):
              raise RuntimeError("expected source-owned build root changed or symlinked")
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          if not safe(runner_temp) or not runner_temp.is_dir():
              raise RuntimeError("runner temp absent or symlinked")
          def capacity(path):
              fs = os.statvfs(path)
              return {"path": str(path), "freeBytes": fs.f_bavail * fs.f_frsize,
                      "totalBytes": fs.f_blocks * fs.f_frsize, "device": path.stat().st_dev}
          internal_capacity = {"workspaceParent": capacity(workspace.parent),
                               "runnerTemp": capacity(runner_temp)}
          builds = []
          # Prior exact app/quality workflow recipes create these private per-run targets.
          for path in sorted(workspace.parent.iterdir(), key=lambda p: p.name):
              if re.fullmatch(r"yue2-(?:app-metal|metal)-target-[0-9]+-[0-9]+", path.name):
                  if len(builds) >= 64:
                      builds.append({"omittedFurtherBuildTargets": True})
                      break
                  builds.append({"role": "source-owned private build target; no cleanup authorized",
                                 **total(path), "cleanupAuthorized": False})
          runs = []
          for root_name in ("yue2-app-precision-profile", "yue2-precision-listening"):
              root = models / root_name
              if not safe(root) or not root.is_dir():
                  runs.append({"root": str(root), "present": root.exists(), "symlinkInPath": not safe(root)})
                  continue
              names = sorted(root.iterdir(), key=lambda p: p.name)
              for path in names[:64]:
                  if path.is_symlink() or not re.fullmatch(r"[0-9]+-[0-9]+", path.name):
                      runs.append({"path": str(path), "traversed": False,
                                   "reason": "symlink" if path.is_symlink() else "outside numeric run layout"})
                      continue
                  item = {"path": str(path), "currentFailedRun": path.name == "37342254495-1",
                          "sourceReceipt": receipt(path / "evidence/sources.json"), "cleanupAuthorized": False}
                  if root_name == "yue2-app-precision-profile":
                      item["totals"] = [{"role": role, **total(path / name)} for name, role in
                          (("target", "private build output"), ("hf-home", "model copies; preserve"),
                           ("evidence", "preserve evidence"), ("profile", "preserve WAV and profile state"),
                           ("install", "preserve install evidence"), ("app-data", "preserve app state"))]
                  else:
                      item["totals"] = [{"role": "preserve prior precision outputs", **total(path)}]
                  runs.append(item)
              if len(names) > 64:
                  runs.append({"root": str(root), "omittedImmediateEntries": len(names) - 64})
          shared = Path("/Users/MTrefry/actions-runner-nax/_work/inference/cargo-target")
          shared_total = total(shared)
          report = {"schema": 1, "purpose": "read-only disk inventory", "startedUtc": started,
                    "completedUtc": datetime.now(timezone.utc).isoformat(),
                    "workflowSha": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
                    "runner": "nax-macos-2", "modelsFreeBytes": fs.f_bavail * fs.f_frsize,
                    "modelsTotalBytes": fs.f_blocks * fs.f_frsize,
                    "volume": {k: info.get(k) for k in ("DeviceIdentifier", "MountPoint", "FilesystemType", "APFSContainerReference")},
                    "internalCapacity": internal_capacity,
                    "privateBuildVolume": {k: build_info.get(k) for k in ("DeviceIdentifier", "MountPoint", "FilesystemType", "APFSContainerReference")},
                    "internalVolumeProbe": {"path": str(internal_mount), "device": internal_mount.stat().st_dev,
                                            "sameDeviceAsWorkspaceParent": internal_mount.stat().st_dev == internal_capacity["workspaceParent"]["device"],
                                            "sameDeviceAsRunnerTemp": internal_mount.stat().st_dev == internal_capacity["runnerTemp"]["device"]},
                    "apfsContainers": containers, "privateBuildTargets": builds, "runDirectories": runs,
                    "sharedCargoTarget": {"role": "shared cache; ownership not exclusive; preserve", **shared_total},
                    "limits": {"scanSeconds": 180, "entries": 500000, "remainingEntries": remaining,
                               "maxImmediateEntriesPerRoot": 64, "symlinksNeverFollowed": True,
                               "allocatedBytesAreInodeTotalsNotAPFSReclaimEstimates": True},
                    "cleanupAuthorized": False}
          out = Path(os.environ["RUNNER_TEMP"]) / ("yue2-disk-inventory-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          out.mkdir(exist_ok=False)
          (out / "inventory.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps({"inventory": str(out / "inventory.json"), "modelsFreeBytes": report["modelsFreeBytes"], "recordCount": len(runs)}))
          PY
      - name: Retain only disk inventory metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yue2-metal-disk-inventory-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yue2-disk-inventory-${{ github.run_id }}-${{ github.run_attempt }}/inventory.json
          if-no-files-found: error
          retention-days: 30
