name: H3-Image training (real weights)

# SW-7097 (feature SW-F363): the MiniMax-H3-Image LoRA trainer on real weights. Dispatch only:
# nothing here runs on a push, a schedule or a pull request, and nothing here can become a
# required check. Its own file because `real-weights.yml` is at its size budget.
#
# mlx-train (the MLX real-weights Mac, the label the `mlx-minimax-h3-image` job uses):
#   1. materialize MiniMaxAI/MiniMax-H3-Image (DiT, VAE, tokenizer) and MiniMax-H3's text encoder
#      and vision tower into the box's task-owned hub, and convert the q4 DiT tier from the dense
#      snapshot (the trainer's default configuration trains over a packed frozen base);
#   2. run the three MLX gates, each built with `model-inference-proof`, run with
#      MODEL_INFERENCE_CASE_FQN set and checked by verify_model_inference_log.py:
#      - training::real_tests::streamed_backward_matches_resident_and_finite_differences_q4
#        (gradient correctness: the streamed backward against the resident one and a finite
#        difference),
#      - h3_image_train_real::h3_image_train_t2i_saves_reproduces_and_resumes_q4 (AC1 t2i at 2048²
#        and AC2: the saved adapter reproduces the trainer's sample, resume makes the same update),
#      - h3_image_train_real::h3_image_train_edit_saves_and_reproduces_q4 (AC1 edit);
#   3. upload the trained t2i adapter as `minimax-h3-image-trained-lora`.
# candle-load (the Windows CUDA host): the H3-Image candle install loads that MLX-trained adapter
#   onto the real image DiT (AC2 "loads on both backends").

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-real-weights-physical-host
  cancel-in-progress: false

jobs:
  mlx-train:
    name: MLX H3-Image trainer gates
    defaults:
      run:
        shell: python3.12 -I scripts/ci/inference_metal_launcher.py --wait-seconds 9000 -- /bin/bash -e {0}
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Materialize the image snapshot and MiniMax-H3's text encoder
        run: |
          set -o pipefail
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          export HF_HUB_DISABLE_XET=1
          lane_root="$HOME/sceneworks-rw-weights"
          if [[ -L "$lane_root" ]]; then
            echo "task-owned weights root must be an internal directory: $lane_root" >&2; exit 1
          fi
          mkdir -p "$lane_root/hub"
          python3.12 scripts/ci/qwen21_weights_root.py "$lane_root"
          image="$lane_root/hub/models--MiniMaxAI--MiniMax-H3-Image/snapshots/492fd8c4eca666f1085f57e30738c1e0d86b3439"
          h3="$lane_root/hub/models--MiniMaxAI--MiniMax-H3/snapshots/939557dc319dd91227e30195a763f272ba7f8765"
          for model in "minimax-h3-image:$image" "minimax-h3-image-dit:$image" "minimax-h3-text-encoder:$h3" "minimax-h3-vision-tower:$h3"; do
            for attempt in 1 2 3; do
              PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py --model "${model%%:*}" --snapshot "${model#*:}" && break
              [[ $attempt == 3 ]] && exit 1
              echo "::warning::${model%%:*} materialization attempt $attempt failed"
              sleep 30
            done
          done
          {
            echo "MINIMAX_H3_IMAGE_SNAPSHOT=$image"
            echo "MINIMAX_H3_SNAPSHOT=$h3"
            echo "MINIMAX_H3_IMAGE_TIERS_ROOT=$lane_root/minimax-h3-image-train-tiers"
          } >> "$GITHUB_ENV"
      - name: Set up the MLX build environment
        run: |
          target="$RUNNER_TEMP/minimax-h3-image-train-cargo-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$target"
          {
            echo "CARGO_TARGET_DIR=$target"
            echo "CARGO_PROFILE_RELEASE_STRIP=none"
            echo "CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP=none"
          } >> "$GITHUB_ENV"
          rc=0
          prebuilt="$(scripts/fetch-prebuilt-mlx.sh --build-type Release --github-env)" || rc=$?
          if (( rc == 0 )); then
            echo "$prebuilt"
          elif (( rc == 1 )); then
            echo "::warning title=prebuilt MLX unavailable::no prebuilt for the pinned mlx-rs rev; building libmlx from source"
            xcrun -sdk macosx metal --version
          else
            exit "$rc"
          fi
      - name: Convert the q4 DiT tier
        run: |
          rm -rf "$MINIMAX_H3_IMAGE_TIERS_ROOT"
          mkdir -p "$MINIMAX_H3_IMAGE_TIERS_ROOT"
          MINIMAX_H3_SRC="$MINIMAX_H3_IMAGE_SNAPSHOT" MINIMAX_H3_OUT="$MINIMAX_H3_IMAGE_TIERS_ROOT/q4" \
            MINIMAX_H3_TIER=q4 MINIMAX_H3_COMPONENT=image_dit \
            cargo run --locked --release -p mlx-gen-minimax-h3 --example minimax_h3_prequant
      - name: Run the trainer gates
        run: |
          set -o pipefail
          export MINIMAX_H3_IMAGE_TRAINED_LORA_OUT="$RUNNER_TEMP/minimax-h3-image-trained-lora"
          logs="$RUNNER_TEMP/minimax-h3-image-train-logs"
          mkdir -p "$logs" "$MINIMAX_H3_IMAGE_TRAINED_LORA_OUT"
          failed=()
          # $1 the cargo test target selector, $2 the test path inside it
          run_gate() {
            local target="$1" name="$2" status=0 log="$logs/${2##*::}.log"
            MODEL_INFERENCE_CASE_FQN="$name" cargo test --locked --release -p mlx-gen-minimax-h3 \
              --features model-inference-proof $target \
              "$name" -- --exact --ignored --nocapture 2>&1 | tee "$log" >&2 || status=$?
            if ((status)) || ! python3.12 -I scripts/ci/verify_model_inference_log.py --package mlx-gen-minimax-h3 \
              --backend mlx --fqn "$name" --log "$log"; then
              echo "::error::'$name' failed or lacks its registered proof evidence (exit $status)" >&2
              failed+=("$name")
            fi
          }
          run_gate --lib training::real_tests::streamed_backward_matches_resident_and_finite_differences_q4
          run_gate "--test integration" h3_image_train_real::h3_image_train_t2i_saves_reproduces_and_resumes_q4
          run_gate "--test integration" h3_image_train_real::h3_image_train_edit_saves_and_reproduces_q4
          rm -rf "${MINIMAX_H3_IMAGE_TIERS_ROOT:?}"
          if ((${#failed[@]})); then
            echo "::error::failed gates: ${failed[*]}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: minimax-h3-image-trained-lora
          path: ${{ runner.temp }}/minimax-h3-image-trained-lora
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: minimax-h3-image-train-mlx-logs
          path: ${{ runner.temp }}/minimax-h3-image-train-logs

  candle-load:
    needs: mlx-train
    name: Candle loads the MLX-trained H3-Image LoRA (CUDA)
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 240
    env:
      CANDLE_GEN_MODELS_ROOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
      CUDA_COMPUTE_CAP: "80"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: |
          uv python install 3.12.10 --managed-python --no-registry --no-bin --no-config || exit /b 1
          for /f "delims=" %%P in ('uv python find 3.12.10 --managed-python --no-project --no-config') do set "REVIEWED_PYTHON=%%P"
          if not defined REVIEWED_PYTHON exit /b 1
          "%REVIEWED_PYTHON%" -c "import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version" || exit /b 1
          echo REVIEWED_PYTHON=%REVIEWED_PYTHON%>>"%GITHUB_ENV%"
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: ./.github/actions/setup-rust
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: minimax-h3-image-trained-lora
          path: ${{ runner.temp }}/minimax-h3-image-trained-lora
      - name: Load the MLX-trained adapter on the real image DiT
        shell: cmd
        run: |
          set "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          set "VCVARS=C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          set "MINIMAX_H3_IMAGE_SNAPSHOT=%CANDLE_GEN_MODELS_ROOT%\models--MiniMaxAI--MiniMax-H3-Image\snapshots\492fd8c4eca666f1085f57e30738c1e0d86b3439"
          set "MINIMAX_H3_IMAGE_TRAINED_LORA=%RUNNER_TEMP%\minimax-h3-image-trained-lora\h3_image_lora.safetensors"
          if not exist "%MINIMAX_H3_IMAGE_TRAINED_LORA%" exit /b 1
          "%REVIEWED_PYTHON%" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt || exit /b 1
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model minimax-h3-image-dit --snapshot "%MINIMAX_H3_IMAGE_SNAPSHOT%" || exit /b 1
          set "PYTHONPATH="
          set "RUSTC_WRAPPER="
          call "%VCVARS%"
          set "MODEL_INFERENCE_CASE_FQN=h3_image_train_lora_load_real::h3_image_mlx_trained_lora_installs_on_the_real_dit_cuda"
          cargo test --locked --release -p candle-gen-minimax-h3 --features cuda,model-inference-proof --test integration "%MODEL_INFERENCE_CASE_FQN%" -- --exact --ignored --nocapture > "%RUNNER_TEMP%\candle-load.log" 2>&1
          set "STATUS=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\candle-load.log"
          if not "%STATUS%"=="0" exit /b 1
          "%REVIEWED_PYTHON%" -I scripts/ci/verify_model_inference_log.py --package candle-gen-minimax-h3 --backend candle-cuda --fqn "%MODEL_INFERENCE_CASE_FQN%" --log "%RUNNER_TEMP%\candle-load.log" || exit /b 1
