  candle-minimax-h3-image-pe-publish:
    name: Publish the H3-Image PE Candle tiers
    if: github.event_name == 'workflow_dispatch' && (inputs.profile == 'minimax-h3-image-publish' || inputs.profile == 'minimax-h3-image-publish-candle')
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 720
    env:
      CANDLE_GEN_MODELS_ROOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
      MINIMAX_PE_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--MiniMaxAI--MiniMax-H3-Image-PE\snapshots\35603d4b63949afa12cb098227fffefedf081afa
      PUBLISH_SCRATCH: D:\sceneworks-terminal\weights\sw-7104-publish-${{ github.run_id }}-${{ github.run_attempt }}
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: call scripts\ci\real-weights\candle-minimax-h3-image-pe-publish\install-reviewed-cpython-3-12.cmd
      - name: Select Git Bash
        shell: cmd
        run: call scripts\ci\real-weights\candle-minimax-h3-image-pe-publish\select-git-bash.cmd
      - name: Prepare the publication
        shell: cmd
        run: call scripts\ci\real-weights\candle-minimax-h3-image-pe-publish\prepare-the-publication.cmd
      - name: Materialize and verify immutable snapshots
        shell: cmd
        run: call scripts\ci\real-weights\candle-minimax-h3-image-pe-publish\materialize-and-verify-immutable-snapshots.cmd
      - uses: ./.github/actions/setup-rust
      - name: Disable unstable sccache wrapper for the heavy Candle lane
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
          Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue
      - name: Convert the PE Candle q8 and q4 tiers
        shell: cmd
        run: call scripts\ci\real-weights\candle-minimax-h3-image-pe-publish\convert-the-pe-candle-tiers.cmd
      - name: Publish the PE Candle tiers
        shell: cmd
        run: call scripts\ci\real-weights\candle-minimax-h3-image-pe-publish\publish-the-pe-candle-tiers.cmd
      - name: Keep the publication reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minimax-h3-image-publication-candle
          path: ${{ runner.temp }}\sw-7104-publication-reports
          if-no-files-found: warn
          retention-days: 90
      - name: Remove this run's scratch
        if: always()
        shell: cmd
        run: call scripts\ci\real-weights\candle-minimax-h3-image-pe-publish\remove-this-runs-scratch.cmd
