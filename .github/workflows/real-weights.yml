  # SC-15520: the Chroma1 memory ladder on real weights.
  #
  # WHY THIS EXISTS. Every number the ladder publishes — the rung peaks, the rung-2 drift verdict,
  # the rung-4 attribution — was measured by hand on a developer Mac and verifiable nowhere else:
  # `CHROMA_LADDER_*` appeared in no workflow, so nothing in CI ever executed these 16 tests. That
  # is not a coverage gap in the abstract. Four separate instrument defects reached `main` through
  # it, and the fourth was a live mutation (`measure()` scaled every peak by `1 + steps/100`) that
  # survived a push and a merge because no lane would have run the test it reddened. A measured
  # claim that CI cannot re-take is a claim nobody can check.
  #
  # MANUAL DISPATCH IS THE POINT, not a limitation. This is hours of Metal time on a shared box;
  # it should be runnable and discoverable on demand, not on every push.
  #
  # SPLITTING. Two axes, both already the house pattern. `chroma_model` picks the entry (the
  # matrix leg, exactly as `chroma-auxiliary` does) and `chroma_ladder_tests` picks tests within
  # one. The entry axis is the intended default split and the matrix runs `max-parallel: 1` —
  # three legs of one entry each, never one leg of three.
  #
  # MEASURED, not estimated (chroma1_base q4 1024², 2026-08-06, this machine). All 16 tests for ONE
  # entry are ~2.96 h, which fits the 360-minute timeout with roughly 2x margin:
  #
  #   identical_requests_reproduce_once_the_allocator_has_settled   44m 06s   <- 8 x 28-step renders
  #   transformer_window_sweep_and_streamed_output_identity         24m 27s
  #   the_window_component_scopes_are_measured_not_inherited        19m 51s
  #   the_rung_two_drift_margin_is_resampled_across_seeds           26m 27s   <- 5 x 28-step renders
  #   decode_tile_mechanism_sweep_on_the_production_latent          ~17m
  #   the_full_ladder_renders_under_a_memory_cap                    13m 58s
  #   the_rung_four_saving_is_inside_the_block_weight_set           10m 03s
  #   staged_residency_bounds_the_request_peak_and_preserves_output  9m 21s
  #   the_request_peak_is_step_independent                           5m 12s
  #   attention_chunking_is_measured_at_the_dit_seam                ~4m
  #   every_cached_entry_and_tier_publishes_its_own_evidence          2m 18s
  #   the six refusal / domain / precondition / phase tests          < 20s each
  #
  # So one ENTRY fits one job, but `chroma_model: all` is ~9 h of wall clock on a box three other
  # lanes queue behind. Dispatch one entry at a time unless a night is genuinely free, and reach
  # for `chroma_ladder_tests` when only part of the ladder is in question — the top four rows are
  # 80% of the cost.
  #
  # EVERY test is named and run with `--exact`, and each is required to report exactly one passing
  # test. A filter that matches nothing makes libtest print "0 passed" and cargo exit 0, which is
  # the silent green this lane exists to prevent — the same guard the qwen-image and krea lanes use.
  mlx-chroma-memory-ladder:
    name: Chroma memory ladder (${{ matrix.model }})
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'chroma-memory-ladder'
    runs-on: [self-hosted, macOS, ARM64, rw-chroma]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # One entry at a time: `rw-chroma` is a single box shared with three other lanes, and two
      # concurrent Metal workloads on one device is the documented SIGSEGV.
      max-parallel: 1
      matrix:
        include:
          - model: chroma1_base
            repository: SceneWorks/chroma1-base-mlx
            source_revision: e7330dda29d00ffdeeb719b28e92ee74cff0884c
          - model: chroma1_hd
            repository: SceneWorks/chroma1-hd-mlx
            source_revision: 9d99afe1ebca67032476756bc70d4a7152bc1bd5
          - model: chroma1_flash
            repository: SceneWorks/chroma1-flash-mlx
            source_revision: 6a9cb6178709559461506bf247f708d0d1008d00
    env:
      CHROMA_MODEL: ${{ matrix.model }}
      CHROMA_REPOSITORY: ${{ matrix.repository }}
      CHROMA_SOURCE_REVISION: ${{ matrix.source_revision }}
      CHROMA_LADDER_TESTS: ${{ inputs.chroma_ladder_tests }}
      CHROMA_LADDER_TIERS: ${{ inputs.chroma_ladder_tiers }}
      # The harness resolves the entry under test through this; `representative()` panics on any
      # value outside the three catalog entries, so a matrix typo fails rather than silently
      # measuring base three times.
      CHROMA_LADDER_ENTRY: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version && python3.12 --version
      # No `report_runner_disk_headroom.sh` step here, deliberately. That script reports on the
      # `~/`-relative snapshot VARIABLES a lane resolves through `resolve_snapshot_paths.py`, and
      # this lane resolves none: like `chroma-auxiliary`, `rw-chroma` stores no Chroma bytes and
      # materializes into `runner.temp` from the Hub per run. Reporting headroom without a
      # resolved path is what `test_every_resolving_lane_reports_what_it_costs` forbids.
      #
      # Validate the dispatch inputs BEFORE the download, so a typo costs seconds rather than a
      # 14 GiB transfer and a runner-hour. Both lists are checked against the real names.
      - name: Validate ladder dispatch inputs
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        run: source scripts/ci/real-weights/mlx-chroma-memory-ladder/validate-ladder-dispatch-inputs.sh
      - name: Materialize the pinned Chroma snapshot
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        env:
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
          # Step-level, not job-level: `runner.temp` in a job `env:` block is refused by
          # `test_mage_media_lane_requires_verified_operator_cpu_oracles`.
          CHROMA_LADDER_ROOT: ${{ runner.temp }}/chroma-ladder-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
        run: source scripts/ci/real-weights/mlx-chroma-memory-ladder/materialize-the-pinned-chroma-snapshot.sh
      - name: Run the memory ladder
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        run: source scripts/ci/real-weights/mlx-chroma-memory-ladder/run-the-memory-ladder.sh
      - name: Upload ladder measurement logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chroma-memory-ladder-${{ matrix.model }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/chroma-ladder-*.log

  # SC-15507: a narrow, independently dispatchable acceptance lane for the request-scoped
  # MLX lifecycle. The broader `media` profile also runs this test, but it requires the complete
  # frozen-Torch Mage oracle bundle before reaching it. This lane intentionally needs only the
  # immutable Mage snapshot consumed by the lifecycle test itself, so an unrelated oracle-cache
  # miss cannot suppress the real-Apple seam gate.
  mlx-request-memory-scope:
    name: MLX request-memory scope real weights
    if: inputs.profile == 'request-memory-scope'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 120
    env:
      MAGE_REQUEST_SCOPE_SNAPSHOT: ${{ vars.MAGE_SNAPSHOT }}
      MAGE_REQUEST_SCOPE_QUANT: bf16
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          MAGE_REQUEST_SCOPE_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          MAGE_REQUEST_SCOPE_SNAPSHOT
      - name: Materialize and verify immutable Mage snapshot
        run: source scripts/ci/real-weights/mlx-request-memory-scope/materialize-and-verify-immutable-mage-snapshot.sh
      - name: Run Mage request-memory lifecycle
        run: >-
          cargo test --locked --release -p mlx-gen-mage
          --test integration request_memory_scope_real_weights:: -- --ignored --nocapture

  # sc-18249: the SANA tiled-decode drift ceiling (`DECODE_TILING_MEAN_ABS_U8 = 6.0`) was enforced
  # only by `#[ignore]` real-weight tests no workflow referenced — the exact sc-17250 shape: a
  # pinned snapshot holding runner disk while the gates it backs ran nowhere. This lane runs the
  # two ceiling-bearing tests. Unlike the Z-Image `mlx-memory-evidence-v1` lane below there is NO
  # out-of-band verifier
  # (`verify_residency_ab.py` re-derives z-image's drift from bound artifacts; no SANA equivalent
  # exists): the ceiling is asserted INSIDE the tests, so the job's contract is `set -o pipefail`
  # plus the test exit code, and the artifacts (full log, model inventory, PPM renders + 8x
  # amplified diffs from `SANA_SWEEP_OUT`) are the reviewable evidence rather than a verdict file.
  # Operator-dispatched, not scheduled: base SANA runs its true 20-step CFG schedule (40 trunk
  # forwards per 1024² render) and the two tests render ~27 images with a fresh model load per
  # measured row, which is hours on `rw-mage` hardware — the sc-16981 head-of-line shape.
  mlx-sana-drift-ceiling:
    name: MLX SANA drift ceiling real weights
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'sana-drift-ceiling'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 360
    env:
      SANA_LADDER_1600M: ${{ vars.SANA_LADDER_1600M }}
      INFERENCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          SANA_LADDER_1600M
      - name: Verify exact clean inference provenance
        run: |
          test "$(git rev-parse HEAD)" = "$INFERENCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Toolchain versions
        run: rustc --version && cargo --version && python3.12 --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          SANA_LADDER_1600M
      - name: Materialize and verify immutable SANA snapshot
        env:
          SANA_MODEL_INVENTORY: ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-mlx-model-inventory.json
        run: source scripts/ci/real-weights/mlx-sana-drift-ceiling/materialize-and-verify-immutable-sana-snapshot.sh
      - name: Run the ceiling-bearing drift tests
        env:
          SANA_DRIFT_OUTPUT_DIR: ${{ runner.temp }}/sana-drift-ceiling
          SANA_DRIFT_LOG: ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-drift.log
          # The sweep dumps every render and its 8x-amplified diff here — the sc-17863 "verdict
          # with eyes on the renders" evidence, preserved per run instead of living on one dev Mac.
          SANA_SWEEP_OUT: ${{ runner.temp }}/sana-drift-ceiling/renders
          SANA_MODEL_INVENTORY: ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-mlx-model-inventory.json
          SANA_MODEL_INVENTORY_AFTER: ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-mlx-model-inventory-after.json
        run: source scripts/ci/real-weights/mlx-sana-drift-ceiling/run-the-ceiling-bearing-drift-tests.sh
      - name: Upload drift log, inventory, and render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sana-drift-ceiling-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-drift.log
            ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-mlx-model-inventory.json
            ${{ runner.temp }}/sana-drift-ceiling/renders

  mlx-memory-evidence-v1:
    name: MLX memory evidence V1 real weights
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'memory-evidence-v1'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 180
    env:
      ZIMAGE_SNAPSHOT: ${{ vars.ZIMAGE_SNAPSHOT }}
      # sc-18149: no ZIMAGE_SEQ_SIZE override. The lane used to pin 512, where the Sequential
      # route's forced tiled decode degenerates to a single tile and reproduces the whole-image
      # decode byte-for-byte (measured drift exactly 0) — which kept Exact green at the cell while
      # the shipping 768²+ configuration drifted uncharacterized. The A/B now runs the test's 768²
      # default, where tiling actually engages, under the declared drift tolerance; the in-test
      # isolator leg (Resident + forced tiled decode) still pins residency staging itself to
      # byte-exactness on every run.
      INFERENCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          ZIMAGE_SNAPSHOT
      - name: Verify exact clean inference provenance
        run: |
          test "$(git rev-parse HEAD)" = "$INFERENCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Resolve and bind exact SceneWorks provenance outside the inference worktree
        env:
          SCENEWORKS_PROVENANCE_ROOT: ${{ runner.temp }}/sceneworks-provenance
        run: |
          git init "$SCENEWORKS_PROVENANCE_ROOT"
          git -C "$SCENEWORKS_PROVENANCE_ROOT" remote add origin https://github.com/SceneWorks/SceneWorks.git
          git -C "$SCENEWORKS_PROVENANCE_ROOT" fetch --depth=1 origin "${{ inputs.sceneworks_revision }}"
          git -C "$SCENEWORKS_PROVENANCE_ROOT" checkout --detach FETCH_HEAD
          resolved="$(git -C "$SCENEWORKS_PROVENANCE_ROOT" rev-parse HEAD)"
          if [[ ! "$resolved" =~ ^[0-9a-f]{40}$ || "$resolved" != "${{ inputs.sceneworks_revision }}" ]]; then
            echo "sceneworks_revision did not resolve to the exact requested commit" >&2
            exit 1
          fi
          test -z "$(git -C "$SCENEWORKS_PROVENANCE_ROOT" status --porcelain --untracked-files=normal)"
          echo "SCENEWORKS_REVISION=$resolved" >> "$GITHUB_ENV"
      - name: Toolchain versions
        run: rustc --version && cargo --version && python3.12 --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          ZIMAGE_SNAPSHOT
      - name: Materialize and verify immutable Z-Image snapshot
        env:
          MEMORY_MODEL_INVENTORY: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory.json
        run: source scripts/ci/real-weights/mlx-memory-evidence-v1/materialize-and-verify-immutable-z-image-snapshot.sh
      - name: Run and verify Z-Image resident versus staged evidence
        env:
          MEMORY_EVIDENCE_OUTPUT_DIR: ${{ runner.temp }}/memory-evidence-v1
          MEMORY_EVIDENCE_LOG: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo.log
          MEMORY_MODEL_INVENTORY: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory.json
          MEMORY_MODEL_INVENTORY_AFTER: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory-after.json
        run: source scripts/ci/real-weights/mlx-memory-evidence-v1/run-and-verify-z-image-resident-versus-staged-evidence.sh
      - name: Upload evidence log and bound output artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-evidence-v1-z-image-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/memory-evidence-v1/z-image-turbo.log
            ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory.json
            ${{ runner.temp }}/memory-evidence-v1/z_image_turbo-resident.rgb
            ${{ runner.temp }}/memory-evidence-v1/z_image_turbo-staged.rgb
            ${{ runner.temp }}/memory-evidence-v1/z_image_turbo-resident-tiled.rgb
            ${{ runner.temp }}/memory-evidence-v1/verifier-result.txt

  # SC-22261's native-provider preflight within the one permanent-pin StarVector campaign. This is
  # deliberately NOT acceptance evidence by itself: SceneWorks owns the paired 120/200/20/60
  # renderer, sanitizer, publication, and metric receipt after the permanent inference pin. These
  # jobs bind the exact native snapshot inventories and four provider hooks that that receipt
  # consumes. They are dispatch-only and serialize Candle after MLX, so shared physical runners
  # cannot overlap an 8B Metal load with authoritative CUDA evidence.
  starvector-terminal-mlx:
    name: StarVector terminal native-provider preflight (MLX)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'starvector-terminal'
    runs-on: [self-hosted, macOS, ARM64, rw-starvector]
    timeout-minutes: 180
    env:
      STARVECTOR_1B_SNAPSHOT: /Users/Shared/SceneWorks/starvector-terminal/weights/models/starvector-1b
      STARVECTOR_8B_SNAPSHOT: /Users/Shared/SceneWorks/starvector-terminal/weights/models/starvector-8b
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate immutable terminal corpus and receipt contract
        run: >-
          node scripts/release/starvector_terminal_evidence.mjs validate-plan
          --corpus release/starvector-terminal-corpus-v1.json
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          STARVECTOR_1B_SNAPSHOT STARVECTOR_8B_SNAPSHOT
      - name: Report runner disk headroom
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          STARVECTOR_1B_SNAPSHOT STARVECTOR_8B_SNAPSHOT
      - name: Verify pre-provisioned exact native snapshots
        env:
          STARVECTOR_TERMINAL_DIR: ${{ runner.temp }}/starvector-terminal-mlx
        run: source scripts/ci/real-weights/starvector-terminal-mlx/verify-pre-provisioned-exact-native-snapshots.sh
      - name: Run exact native MLX StarVector hooks
        env:
          STARVECTOR_TERMINAL_DIR: ${{ runner.temp }}/starvector-terminal-mlx
        run: source scripts/ci/real-weights/starvector-terminal-mlx/run-exact-native-mlx-starvector-hooks.sh
      - name: Upload MLX terminal provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starvector-terminal-mlx-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/starvector-terminal-mlx

  starvector-terminal-candle:
    name: StarVector terminal native-provider preflight (Candle/CUDA)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'starvector-terminal'
    needs: starvector-terminal-mlx
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 180
    env:
      STARVECTOR_1B_SNAPSHOT: D:\\sceneworks-terminal\\weights\\models\\starvector-1b
      STARVECTOR_8B_SNAPSHOT: D:\\sceneworks-terminal\\weights\\models\\starvector-8b
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: starvector-terminal-mlx-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\\starvector-terminal-mlx
      - name: Validate and stage transferred MLX provenance
        shell: cmd
        run: call scripts\ci\real-weights\starvector-terminal-candle\validate-and-stage-transferred-mlx-provenance.cmd
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: call scripts\ci\real-weights\starvector-terminal-candle\install-reviewed-cpython-3-12.cmd
      - name: Verify pre-provisioned exact native snapshots
        shell: cmd
        run: call scripts\ci\real-weights\starvector-terminal-candle\verify-pre-provisioned-exact-native-snapshots.cmd
      - name: Compare MLX and Candle snapshot inventories
        shell: cmd
        run: call scripts\ci\real-weights\starvector-terminal-candle\compare-mlx-and-candle-snapshot-inventories.cmd
      - name: Run exact authoritative Candle/CUDA StarVector hooks
        shell: cmd
        run: call scripts\ci\real-weights\starvector-terminal-candle\run-exact-authoritative-candle-cuda-starvector-hooks.cmd
      - name: Seal exact terminal preflight provenance
        shell: cmd
        run: call scripts\ci\real-weights\starvector-terminal-candle\seal-exact-terminal-preflight-provenance.cmd
      - name: Upload complete terminal preflight provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starvector-terminal-preflight-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}\\starvector-terminal-preflight

  # SC-23942 is dispatch-only. These jobs serialize MLX then CUDA and launch prebuilt native test
  # executables directly, giving the sampler exact process ownership for RSS/GPU evidence.
  qwen38-bonsai-mlx:
    name: Qwen3.8/Bonsai matched diagnostics (MLX)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'qwen38-bonsai'
    runs-on: [self-hosted, macOS, ARM64, nax, real-weights]
    timeout-minutes: 360
    env:
      BONSAI_QWEN38_SNAPSHOT: ${{ vars.BONSAI_QWEN38_SNAPSHOT }}
      BONSAI_MLX_SNAPSHOT: ${{ vars.BONSAI_MLX_SNAPSHOT }}
      BONSAI_GGUF_SNAPSHOT: ${{ vars.BONSAI_GGUF_SNAPSHOT }}
      BONSAI_BASELINE_SNAPSHOT: ${{ vars.BONSAI_BASELINE_SNAPSHOT }}
      BONSAI_CASES: arithmetic,logic,ordering,code,json,tool,multi_turn,image,multi_image,video_forward,video_reverse,context_64,context_512,context_2048
      QWEN38_ACCEPTANCE_CASES: reasoning_low,reasoning_medium,reasoning_xhigh,preserve_thinking,tool_roundtrip,json_thinking,mtp_greedy,mtp_json,mtp_image,mtp_video
      BONSAI_ACCEPTANCE_CASES: reasoning_low,reasoning_medium,reasoning_xhigh,preserve_thinking,tool_roundtrip,json_thinking
      BONSAI_FORMAT_CASES: image,video_forward,video_reverse
      QWEN_BONSAI_RUN_DIR: /Volumes/Models/Codex-builds/sc-23935/ci-${{ github.run_id }}-${{ github.run_attempt }}
      QWEN_BONSAI_OUTPUT_DIR: /Volumes/Models/Codex-builds/sc-23935/ci-${{ github.run_id }}-${{ github.run_attempt }}/evidence
      QWEN_BONSAI_TOOLS_DIR: /Volumes/Models/Codex-builds/sc-23935/ci-${{ github.run_id }}-${{ github.run_attempt }}/tools
      CARGO_TARGET_DIR: /Volumes/Models/Codex-builds/sc-23935/ci-${{ github.run_id }}-${{ github.run_attempt }}/cargo-target
      TMPDIR: /Volumes/Models/Codex-builds/sc-23935/ci-${{ github.run_id }}-${{ github.run_attempt }}/tmp
    steps:
      - name: Prepare external campaign storage
        # A pending macOS volume permission must not consume the model-test budget.
        timeout-minutes: 2
        run: |
          test ! -e "$QWEN_BONSAI_RUN_DIR"
          mkdir -p "$QWEN_BONSAI_OUTPUT_DIR" "$QWEN_BONSAI_TOOLS_DIR" "$CARGO_TARGET_DIR" "$TMPDIR"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate exclusive qualification phase
        run: python3.12 scripts/release/qwen38_bonsai_terminal.py validate-phase --preflight-only "${{ inputs.qwen38_bonsai_preflight_only }}" --provision-only "${{ inputs.qwen38_bonsai_provision_only }}"
      - name: Capture hardware before provisioning or model load
        run: |
          python3.12 scripts/release/qwen38_bonsai_terminal.py hardware --output "$QWEN_BONSAI_OUTPUT_DIR/hardware-before.json"
          cat "$QWEN_BONSAI_OUTPUT_DIR/hardware-before.json"
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          BONSAI_QWEN38_SNAPSHOT BONSAI_MLX_SNAPSHOT BONSAI_GGUF_SNAPSHOT BONSAI_BASELINE_SNAPSHOT
      - name: Select preserved local campaign snapshots
        if: runner.name == 'nax-macos'
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/select-preserved-local-campaign-snapshots.sh
      - name: Qualify configured macOS snapshot metadata without provisioning
        id: mlx_snapshot_metadata
        continue-on-error: true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/qualify-configured-macos-snapshot-metadata-without-provision.sh
      - name: Preflight MLX parent before provisioning
        id: mlx_parent_preflight
        continue-on-error: true
        run: python3.12 scripts/release/qwen38_bonsai_terminal.py preflight --model-key bonsai-qwen38-parent --load-profile mlx-unified --output "$QWEN_BONSAI_OUTPUT_DIR/mlx-qwen38-parent-preflight.json"
      - name: Preflight MLX Bonsai before provisioning
        id: mlx_bonsai_preflight
        continue-on-error: true
        run: python3.12 scripts/release/qwen38_bonsai_terminal.py preflight --model-key bonsai-mlx-2bit --load-profile mlx-unified --output "$QWEN_BONSAI_OUTPUT_DIR/mlx-bonsai-mlx-2bit-preflight.json"
      - name: Preflight MLX baseline before provisioning
        id: mlx_baseline_preflight
        continue-on-error: true
        run: python3.12 scripts/release/qwen38_bonsai_terminal.py preflight --model-key bonsai-qwen3vl-baseline --load-profile mlx-unified --output "$QWEN_BONSAI_OUTPUT_DIR/mlx-qwen3vl-baseline-preflight.json"
      - name: Preflight MLX format routes before provisioning
        id: mlx_format_preflight
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/preflight-mlx-format-routes-before-provisioning.sh
      - name: Report runner disk headroom
        if: inputs.qwen38_bonsai_preflight_only != true
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          BONSAI_QWEN38_SNAPSHOT BONSAI_MLX_SNAPSHOT BONSAI_GGUF_SNAPSHOT BONSAI_BASELINE_SNAPSHOT
      - name: Install pinned snapshot verifier dependencies
        if: inputs.qwen38_bonsai_preflight_only != true
        run: |
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$QWEN_BONSAI_TOOLS_DIR/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
      - name: Provision admitted MLX assets and verify publisher identities
        if: inputs.qwen38_bonsai_preflight_only != true
        run: |
          PYTHONPATH="$QWEN_BONSAI_TOOLS_DIR/huggingface-hub" python3.12 scripts/release/qwen38_bonsai_terminal.py provision-assets --platform macos --runtime-sha "$GITHUB_SHA" --evidence-root "$QWEN_BONSAI_OUTPUT_DIR"
      - name: Build one native MLX comparison executable
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/build-one-native-mlx-comparison-executable.sh
      - name: Run MLX Bonsai row
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.mlx_bonsai_preflight.outcome == 'success')
        continue-on-error: true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/run-mlx-bonsai-row.sh
      - name: Run MLX baseline row
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.mlx_baseline_preflight.outcome == 'success')
        continue-on-error: true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/run-mlx-baseline-row.sh
      - name: Run MLX parent row
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.mlx_parent_preflight.outcome == 'success')
        continue-on-error: true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/run-mlx-parent-row.sh
      - name: Run MLX Bonsai safetensors format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.mlx_format_preflight.outputs.bonsai == 'true')
        continue-on-error: true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/run-mlx-bonsai-safetensors-format-route.sh
      - name: Run MLX PQ2/BF16 format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.mlx_format_preflight.outputs.pq2_bf16 == 'true')
        continue-on-error: true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/run-mlx-pq2-bf16-format-route.sh
      - name: Run MLX PQ2/Q8 format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.mlx_format_preflight.outputs.pq2_q8 == 'true')
        continue-on-error: true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/run-mlx-pq2-q8-format-route.sh
      - name: Run MLX PTQ1/BF16 format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.mlx_format_preflight.outputs.ptq1_bf16 == 'true')
        continue-on-error: true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/run-mlx-ptq1-bf16-format-route.sh
      - name: Run MLX PTQ1/Q8 format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.mlx_format_preflight.outputs.ptq1_q8 == 'true')
        continue-on-error: true
        run: source scripts/ci/real-weights/qwen38-bonsai-mlx/run-mlx-ptq1-q8-format-route.sh
      - name: Upload MLX qualification or sealed row evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qwen38-bonsai-mlx-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QWEN_BONSAI_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
      - name: Require all eight sealed MLX rows
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true
        run: |
          python3.12 scripts/release/qwen38_bonsai_artifacts.py check-partition --role mlx --root "$QWEN_BONSAI_OUTPUT_DIR" --runtime-sha "$GITHUB_SHA"

  qwen38-bonsai-candle:
    name: Qwen3.8/Bonsai matched diagnostics (Candle/CUDA)
    if: ${{ !cancelled() && needs.qwen38-bonsai-mlx.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.profile == 'qwen38-bonsai' }}
    needs: qwen38-bonsai-mlx
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 360
    env:
      BONSAI_GGUF_SNAPSHOT: ${{ vars.CANDLE_BONSAI_GGUF_SNAPSHOT }}
      BONSAI_MLX_SNAPSHOT: ${{ vars.CANDLE_BONSAI_MLX_SNAPSHOT }}
      BONSAI_QWEN38_SNAPSHOT: ${{ vars.CANDLE_BONSAI_QWEN38_SNAPSHOT }}
      BONSAI_BASELINE_SNAPSHOT: ${{ vars.CANDLE_BONSAI_BASELINE_SNAPSHOT }}
      BONSAI_CASES: arithmetic,logic,ordering,code,json,tool,multi_turn,image,multi_image,video_forward,video_reverse,context_64,context_512,context_2048
      QWEN38_ACCEPTANCE_CASES: reasoning_low,reasoning_medium,reasoning_xhigh,preserve_thinking,tool_roundtrip,json_thinking,mtp_greedy,mtp_json,mtp_image,mtp_video
      BONSAI_ACCEPTANCE_CASES: reasoning_low,reasoning_medium,reasoning_xhigh,preserve_thinking,tool_roundtrip,json_thinking
      BONSAI_FORMAT_CASES: image,video_forward,video_reverse
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\install-reviewed-cpython-3-12.cmd
      - name: Validate exclusive qualification phase
        shell: cmd
        run: '"%REVIEWED_PYTHON%" scripts/release/qwen38_bonsai_terminal.py validate-phase --preflight-only "${{ inputs.qwen38_bonsai_preflight_only }}" --provision-only "${{ inputs.qwen38_bonsai_provision_only }}" || exit /b 1'
      - name: Capture hardware before provisioning or model load
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\capture-hardware-before-provisioning-or-model-load.cmd
      - name: Qualify configured Windows snapshot metadata without provisioning
        id: candle_snapshot_metadata
        continue-on-error: true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\qualify-configured-windows-snapshot-metadata-without-provisi.cmd
      - name: Reserve CUDA device 0 for the complete Candle campaign
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\reserve-cuda-device-0-for-the-complete-candle-campaign.cmd
      - name: Preflight Candle CUDA parent before provisioning
        id: candle_cuda_parent_preflight
        continue-on-error: true
        shell: cmd
        run: '"%REVIEWED_PYTHON%" scripts/release/qwen38_bonsai_terminal.py preflight --model-key bonsai-qwen38-parent --load-profile candle-dense-cuda --reservation "%BONSAI_GPU_RESERVATION%" --reservation-token "%BONSAI_RESERVATION_TOKEN%" --output "%RUNNER_TEMP%\qwen38-bonsai-candle\candle-cuda-qwen38-parent-preflight.json"'
      - name: Preflight Candle CUDA Bonsai before provisioning
        id: candle_cuda_bonsai_preflight
        continue-on-error: true
        shell: cmd
        run: '"%REVIEWED_PYTHON%" scripts/release/qwen38_bonsai_terminal.py preflight --model-key bonsai-gguf --language-variant ptq1 --vision-variant q8 --load-profile candle-packed-cuda --reservation "%BONSAI_GPU_RESERVATION%" --reservation-token "%BONSAI_RESERVATION_TOKEN%" --output "%RUNNER_TEMP%\qwen38-bonsai-candle\candle-cuda-bonsai-gguf-preflight.json"'
      - name: Preflight Candle CUDA baseline before provisioning
        id: candle_cuda_baseline_preflight
        continue-on-error: true
        shell: cmd
        run: '"%REVIEWED_PYTHON%" scripts/release/qwen38_bonsai_terminal.py preflight --model-key bonsai-qwen3vl-baseline --load-profile candle-dense-cuda --reservation "%BONSAI_GPU_RESERVATION%" --reservation-token "%BONSAI_RESERVATION_TOKEN%" --output "%RUNNER_TEMP%\qwen38-bonsai-candle\candle-cuda-qwen3vl-baseline-preflight.json"'
      - name: Preflight Candle format routes before provisioning
        id: candle_format_preflight
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\preflight-candle-format-routes-before-provisioning.cmd
      - name: Execute Candle packed CUDA operator oracles before provisioning
        if: inputs.qwen38_bonsai_provision_only != true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\execute-candle-packed-cuda-operator-oracles-before-provision.cmd
      - name: Install pinned snapshot verifier dependencies
        if: inputs.qwen38_bonsai_preflight_only != true
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt || exit /b 1
      - name: Provision admitted Candle assets and verify publisher identities
        if: inputs.qwen38_bonsai_preflight_only != true
        shell: cmd
        run: |
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          "%REVIEWED_PYTHON%" scripts/release/qwen38_bonsai_terminal.py provision-assets --platform windows --runtime-sha "%GITHUB_SHA%" --evidence-root "%RUNNER_TEMP%\qwen38-bonsai-candle" || exit /b 1
      - name: Build one native Candle CUDA comparison executable
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\build-one-native-candle-cuda-comparison-executable.cmd
      - name: Run Candle CUDA parent row
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.candle_cuda_parent_preflight.outcome == 'success')
        continue-on-error: true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\run-candle-cuda-parent-row.cmd
      - name: Run Candle CUDA Bonsai row
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.candle_cuda_bonsai_preflight.outcome == 'success')
        continue-on-error: true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\run-candle-cuda-bonsai-row.cmd
      - name: Run Candle CUDA baseline row
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.candle_cuda_baseline_preflight.outcome == 'success')
        continue-on-error: true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\run-candle-cuda-baseline-row.cmd
      - name: Run Candle Bonsai safetensors format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.candle_format_preflight.outputs.bonsai == 'true')
        continue-on-error: true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\run-candle-bonsai-safetensors-format-route.cmd
      - name: Run Candle PQ2/BF16 format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.candle_format_preflight.outputs.pq2_bf16 == 'true')
        continue-on-error: true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\run-candle-pq2-bf16-format-route.cmd
      - name: Run Candle PQ2/Q8 format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.candle_format_preflight.outputs.pq2_q8 == 'true')
        continue-on-error: true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\run-candle-pq2-q8-format-route.cmd
      - name: Run Candle PTQ1/BF16 format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.candle_format_preflight.outputs.ptq1_bf16 == 'true')
        continue-on-error: true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\run-candle-ptq1-bf16-format-route.cmd
      - name: Run Candle PTQ1/Q8 format route
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true && (steps.candle_format_preflight.outputs.ptq1_q8 == 'true')
        continue-on-error: true
        shell: cmd
        run: call scripts\ci\real-weights\qwen38-bonsai-candle\run-candle-ptq1-q8-format-route.cmd
      - name: Release the Candle campaign CUDA reservation
        if: always()
        shell: cmd
        run: |
          if exist "%BONSAI_GPU_RESERVATION%" "%REVIEWED_PYTHON%" scripts/release/qwen38_bonsai_terminal.py release-gpu --gpu-index 0 --reservation "%BONSAI_GPU_RESERVATION%" --token "%BONSAI_RESERVATION_TOKEN%" || exit /b 1
      - name: Stage the eight CUDA accelerator cells
        if: always() && inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" scripts/release/qwen38_bonsai_artifacts.py stage-cuda --source "%RUNNER_TEMP%\qwen38-bonsai-candle" --output "%RUNNER_TEMP%\qwen38-bonsai-cuda-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%" --runtime-sha "%GITHUB_SHA%" || exit /b 1
      - name: Upload immutable Candle CUDA row evidence
        if: always() && inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qwen38-bonsai-cuda-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\qwen38-bonsai-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
      - name: Require all eight sealed Candle CUDA rows
        if: inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" scripts/release/qwen38_bonsai_artifacts.py check-partition --role cuda --root "%RUNNER_TEMP%\qwen38-bonsai-cuda-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%" --runtime-sha "%GITHUB_SHA%" || exit /b 1
      - name: Upload Candle preflight or provision qualification
        if: always() && (inputs.qwen38_bonsai_preflight_only == true || inputs.qwen38_bonsai_provision_only == true)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qwen38-bonsai-candle-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\qwen38-bonsai-candle
          if-no-files-found: error
          retention-days: 30

  qwen38-bonsai-aggregate:
    name: Qwen3.8/Bonsai exact 16-cell accelerator artifact seal
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.profile == 'qwen38-bonsai' && inputs.qwen38_bonsai_preflight_only != true && inputs.qwen38_bonsai_provision_only != true }}
    needs: [qwen38-bonsai-mlx, qwen38-bonsai-candle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed Python 3.12
        run: |
          uv python install 3.12.10 --managed-python --no-registry --no-bin --no-config
          PYTHON="$(uv python find 3.12.10 --managed-python --no-project --no-config)"
          "$PYTHON" -c 'import sys; assert sys.version_info[:3] == (3, 12, 10)'
          echo "REVIEWED_PYTHON=$PYTHON" >> "$GITHUB_ENV"
      - name: Require both accelerator execution partitions to succeed
        run: |
          test '${{ needs.qwen38-bonsai-mlx.result }}' = success
          test '${{ needs.qwen38-bonsai-candle.result }}' = success
      - name: Select exact immutable artifact IDs across run attempts
        id: selected
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: source scripts/ci/real-weights/qwen38-bonsai-aggregate/select-exact-immutable-artifact-ids-across-run-attempts.sh
      - name: Download only the selected artifact IDs without merging roots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.selected.outputs.artifact_ids }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qwen38-bonsai-aggregate/downloads
          merge-multiple: false
      - name: Validate exact source, physical Windows host, all cases and aggregate seal
        run: source scripts/ci/real-weights/qwen38-bonsai-aggregate/validate-exact-source-physical-windows-host-all-cases-and-ag.sh
      - name: Upload the selected roots and sealed terminal report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qwen38-bonsai-terminal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen38-bonsai-aggregate
          if-no-files-found: error
          retention-days: 30

  mlx-llm:
    name: MLX LLM real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'llm'
    runs-on: [self-hosted, macOS, ARM64, rw-llm]
    timeout-minutes: 120
    env:
      MLX_LLM_TEST_MODEL: ${{ vars.MLX_LLM_TEST_MODEL }}
      MLX_LLM_QWEN3_MODEL: ${{ vars.MLX_LLM_QWEN3_MODEL }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          MLX_LLM_TEST_MODEL MLX_LLM_QWEN3_MODEL
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          MLX_LLM_TEST_MODEL MLX_LLM_QWEN3_MODEL
      - name: Materialize and verify immutable snapshots
        run: source scripts/ci/real-weights/mlx-llm/materialize-and-verify-immutable-snapshots.sh
      - name: Run representative conformance
        run: |
          cargo test --locked -p mlx-llm --test integration conformance::real_model_passes_core_llm_conformance -- --ignored --nocapture
          cargo test --locked -p mlx-llm --test integration conformance::real_qwen3_passes_core_llm_conformance -- --ignored --nocapture

  # sc-17250: the 16 GB JoyCaption snapshot was maintained on a runner for a year while NO workflow
  # ran the four `#[ignore]` tests it backs — golden-token VLM parity that was protecting nothing.
  # Its own job rather than a step on `mlx-llm` above, for the sc-16981 reason: this is a 16 GB
  # source that the prepare test quantizes to a second on-disk Q4 snapshot. A separate job releases
  # the box between them, isolates a failure, and makes the pair separately dispatchable.
  #
  # Budget: the four invocations are FAST once the snapshot is warm — 2.1 / 1.5 / 1.3 / 1.4 s
  # measured `--release` on an M5 Max dev box against this exact pinned revision. 180 minutes is not
  # sized for the tests; it is sized for the FIRST run on a box where `ensure_model_snapshot.py` has
  # to materialize all 16 GB from the Hub, plus the `--release` build of the mlx tree (2m17s here).
  # That build was cold every week until the workflow-level `CARGO_TARGET_DIR` above moved
  # artifacts out of the directory `clean: true` wipes; the 2m17s is now a first-run figure, and
  # this budget is loose by that margin until sc-17057 re-sizes it from a warm run.
  mlx-llm-joycaption:
    name: MLX JoyCaption VLM real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'llm' || inputs.profile == 'llm-joycaption'
    runs-on: [self-hosted, macOS, ARM64, rw-llm]
    timeout-minutes: 180
    env:
      MLX_LLM_JOYCAPTION_SNAPSHOT: ${{ vars.MLX_LLM_JOYCAPTION_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          MLX_LLM_JOYCAPTION_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # An unset repo variable would otherwise reach `ensure_model_snapshot.py` as an empty path and
      # fail as a confusing "revision mismatch" rather than "you did not configure this lane".
      - name: Require the operator-provisioned snapshot paths
        run: |
          for v in MLX_LLM_JOYCAPTION_SNAPSHOT; do
            if [[ -z "${!v}" ]]; then
              echo "Repository variable $v is unset; this lane cannot resolve its snapshot path" >&2
              exit 1
            fi
            if [[ "${!v}" != /* ]]; then
              echo "$v must be an absolute path, got: ${!v}" >&2
              exit 1
            fi
          done
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          MLX_LLM_JOYCAPTION_SNAPSHOT
      - name: Materialize and verify immutable snapshots
        run: source scripts/ci/real-weights/mlx-llm-joycaption/materialize-and-verify-immutable-snapshots.sh
      # `--exact` + a run-count assertion: selecting by bare name means a rename yields
      # "0 passed; N filtered out" and a GREEN step, silently deleting the only coverage these have.
      # `--exact` belongs AFTER the `--`; it is a libtest flag, and cargo rejects it in its own
      # argument position.
      - name: Run JoyCaption real-weight VLM gates
        env:
          # `prepared_q4_snapshot_runs_full_vlm` writes its Q4 snapshot under `std::env::temp_dir()`,
          # which on macOS is $TMPDIR (/var/folders/...) — NOT $RUNNER_TEMP. Actions cleans
          # RUNNER_TEMP between jobs and does not touch $TMPDIR, and the test's only cleanup is a
          # `Drop` impl that does not run if `timeout-minutes` SIGKILLs the process. Since the
          # directory name embeds the pid, every aborted run would leak another multi-GB quantized
          # Llama-3.1-8B onto rw-llm — on a lane whose whole point (sc-17250) is a disk budget.
          TMPDIR: ${{ runner.temp }}
        run: source scripts/ci/real-weights/mlx-llm-joycaption/run-joycaption-real-weight-vlm-gates.sh

  mlx-media:
    name: MLX media real weights (${{ matrix.mage_seed_slot }})
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The label is the live placement source of truth. Certification must mutate and re-verify
      # the seed on the one runner that actually claims the rw-mage job; inactive historical hosts
      # are not part of this run's evidence.
      matrix:
        mage_seed_slot: [single]
    env:
      ZIMAGE_SNAPSHOT: ${{ vars.ZIMAGE_SNAPSHOT }}
      MAGE_SNAPSHOT: ${{ vars.MAGE_SNAPSHOT }}
      MAGE_EDIT_SNAPSHOT: ${{ vars.MAGE_EDIT_SNAPSHOT }}
      MAGE_EDIT_BASE_SNAPSHOT: ${{ vars.MAGE_EDIT_BASE_SNAPSHOT }}
      MAGE_EDIT_TURBO_SNAPSHOT: ${{ vars.MAGE_EDIT_TURBO_SNAPSHOT }}
      # Operator-provisioned, runner-local bundle required on an exact cache miss. This keeps the
      # multi-hour frozen-Torch CPU producer out of the shared Actions queue; the normal fail-closed
      # verification below must accept every file before the bundle can be cached or consumed.
      MAGE_ORACLE_SEED_DIR: ${{ vars.MAGE_ORACLE_SEED_DIR }}
      # Explicit operator-provided models root for the mlx-gen real-weight resolvers that resolve a
      # repo-keyed snapshot (sc-13755); inference never self-fetches or derives a cache location.
      MLX_GEN_MODELS_ROOT: ${{ vars.MLX_GEN_MODELS_ROOT }}
      # sc-17739 — the Lens snapshot. `mlx-gen-lens` ships in the macOS catalog but had no real-weight
      # coverage at all until this lane; see the `lens-turbo` row in release/real-weight-models.toml.
      LENS_SNAPSHOT: ${{ vars.LENS_SNAPSHOT }}
      MAGE_REQUIRE_GOLDENS: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          ZIMAGE_SNAPSHOT MAGE_SNAPSHOT MAGE_EDIT_SNAPSHOT MAGE_EDIT_BASE_SNAPSHOT
          MAGE_EDIT_TURBO_SNAPSHOT MAGE_ORACLE_SEED_DIR MLX_GEN_MODELS_ROOT LENS_SNAPSHOT
      - name: Configure the immutable SDXL N1 VAE snapshot path
        run: >-
          python3.12 scripts/release/export_model_snapshot_paths.py
          --model sdxl-base-mlx-vae-bf16
      # actions/setup-python's Darwin package hard-codes /Users/runner during installation, which is
      # not writable on this self-hosted runner. uv installs the exact interpreter wholly in temp.
      - name: Install pinned reference Python
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/python-bin
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/python-install
        run: |
          command -v uv >/dev/null
          uv python install 3.12.10
          python_path="$(uv python find 3.12.10)"
          dirname "$python_path" >> "$GITHUB_PATH"
          "$python_path" --version
      - name: Configure runner-local Mage oracle path
        run: echo "MAGE_GOLDEN_DIR=$RUNNER_TEMP/mage-flow-oracles" >> "$GITHUB_ENV"
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Recover any interrupted persistent Mage seed promotion
        id: mage-seed-recovery
        run: |
          if [[ -z "$MAGE_ORACLE_SEED_DIR" || "$MAGE_ORACLE_SEED_DIR" != /* ]]; then
            echo "MAGE_ORACLE_SEED_DIR must resolve to an absolute path before recovery" >&2
            exit 1
          fi
          python3.12 scripts/release/promote_mage_oracle_seed.py \
            --seed "$MAGE_ORACLE_SEED_DIR" \
            --recover-only \
            --runner-name "$RUNNER_NAME" \
            --slot "${{ matrix.mage_seed_slot }}" \
            --revision "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/mage-seed-promotion-${{ matrix.mage_seed_slot }}.json"
          if [[ -f "$RUNNER_TEMP/mage-seed-promotion-${{ matrix.mage_seed_slot }}.json" ]]; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
          fi
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          ZIMAGE_SNAPSHOT MAGE_SNAPSHOT MAGE_EDIT_SNAPSHOT MAGE_EDIT_BASE_SNAPSHOT
          MAGE_EDIT_TURBO_SNAPSHOT MAGE_ORACLE_SEED_DIR MLX_GEN_MODELS_ROOT LENS_SNAPSHOT
      - name: Materialize and verify immutable snapshot
        run: source scripts/ci/real-weights/mlx-media/materialize-and-verify-immutable-snapshot.sh
      - name: Prove the SDXL native decode seam on real weights
        run: source scripts/ci/real-weights/mlx-media/prove-the-sdxl-native-decode-seam-on-real-weights.sh
      - name: Derive immutable Mage oracle cache key
        id: mage-oracle-key
        run: |
          snapshot_revision() {
            local snapshot="$1"
            local marker="$snapshot/.sceneworks-model-revision"
            local revision
            if [[ -f "$marker" ]]; then
              revision="$(tr -d '\r\n' < "$marker")"
            else
              revision="$(basename "$(cd "$snapshot" && pwd -P)")"
            fi
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Snapshot does not resolve to an immutable 40-hex revision: $snapshot" >&2
              return 1
            fi
            printf '%s' "$revision"
          }
          producer="${{ hashFiles('.github/workflows/real-weights.yml', 'scripts/ci/real-weights/mlx-media/**', 'crates/media/mlx-gen/_vendor/mage_flow/**', 'crates/media/mlx-gen/_vendor/mage_flow/assets/dog.jpg', 'crates/media/mlx-gen/_vendor/mage_flow/requirements-oracles.txt', 'crates/media/mlx-gen/tools/_paths.py', 'crates/media/mlx-gen/tools/dump_mage_flow_golden.py', 'crates/media/mlx-gen/tools/dump_mage_vae_sizes.py', 'scripts/release/mage_reference_environment.py', 'scripts/release/provision_mage_oracles.py', 'scripts/release/provision_mage_edit_variants.py', 'scripts/release/promote_mage_oracle_seed.py', 'scripts/release/verify_mage_candle_oracles.py', 'scripts/release/verify_mage_candle_transfer.py') }}"
          if [[ ! "$producer" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Oracle producer fingerprint is missing or malformed: $producer" >&2
            exit 1
          fi
          key="mage-oracles-v1-$(snapshot_revision "$MAGE_SNAPSHOT")-$(snapshot_revision "$MAGE_EDIT_SNAPSHOT")-$(snapshot_revision "$MAGE_EDIT_BASE_SNAPSHOT")-$(snapshot_revision "$MAGE_EDIT_TURBO_SNAPSHOT")-$producer"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore verified Mage oracle cache
        id: mage-oracle-cache
        # Certification must inspect the persistent seed on the runner that actually claimed each
        # matrix leg. A normal exact-head cache would bypass that seed and make retries impossible.
        if: github.event_name != 'workflow_dispatch' || inputs.profile != 'media' || inputs.migrate_mage_edit_variant_manifest != true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mage-flow-oracles
          key: ${{ steps.mage-oracle-key.outputs.key }}
      - name: Require operator-provisioned Mage oracle seed
        id: mage-oracle-seed
        if: steps.mage-oracle-cache.outputs.cache-hit != 'true'
        run: source scripts/ci/real-weights/mlx-media/require-operator-provisioned-mage-oracle-seed.sh
      - name: Require an uncached operator seed for durable Mage certification
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'media' && inputs.migrate_mage_edit_variant_manifest
        run: |
          if [[ "${{ steps.mage-oracle-cache.outputs.cache-hit }}" == "true" || \
                "${{ steps.mage-oracle-seed.outputs.imported }}" != "true" ]]; then
            echo "Durable Mage certification requires a cache miss copied from this runner's persistent operator seed" >&2
            exit 1
          fi
      - name: Prepare pinned Mage reference environment
        run: source scripts/ci/real-weights/mlx-media/prepare-pinned-mage-reference-environment.sh
      - name: Classify the copied Mage manifest pair
        id: mage-seed-state
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'media' && inputs.migrate_mage_edit_variant_manifest && steps.mage-seed-recovery.outputs.completed != 'true'
        run: source scripts/ci/real-weights/mlx-media/classify-the-copied-mage-manifest-pair.sh
      - name: Migrate only the copied Mage edit-variant manifest
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'media' && inputs.migrate_mage_edit_variant_manifest && steps.mage-seed-recovery.outputs.completed != 'true' && steps.mage-seed-state.outputs.current != 'true'
        run: source scripts/ci/real-weights/mlx-media/migrate-only-the-copied-mage-edit-variant-manifest.sh
      # sc-14051 Candle acceptance oracle: one frozen-Torch 1024²/20-step reference run emits
      # both the step-zero full-DiT boundary and the final e2e image. It is generated on a
      # different backend/process from the Candle implementation and transferred as an immutable
      # workflow artifact; Candle never blesses its own output. Cache misses require that
      # operator-generated bundle above instead of running the multi-hour producer in Actions.
      - name: Verify restored or operator-provisioned Mage oracle cache
        run: source scripts/ci/real-weights/mlx-media/verify-restored-or-operator-provisioned-mage-oracle-cache.sh
      - name: Run provider conformance
        run: >-
          cargo test --locked -p mlx-gen-z-image --test integration
          conformance::z_image_turbo_satisfies_gen_core_contract -- --ignored --nocapture
      # sc-17739 — the first real-weight gate `mlx-gen-lens` has ever had. Run as TWO cargo
      # invocations, deliberately: each conformance run holds a ~21 GiB model resident across ~8
      # renders, and running both ids in one process was SIGKILLed on the dev Mac. Separate processes
      # bound the peak to one model at a time. `lens_turbo` is the pointed arm — its default guidance
      # is 1.0, so sc-17418's `check_cfg_off_render` exercises the production default path; `lens`
      # covers the guided `[pos; neg]` path. Both resolve from the one snapshot.
      - name: Run Lens provider conformance (turbo — the CFG-off default path)
        run: >-
          cargo test --locked --release -p mlx-gen-lens --test integration
          conformance::lens_turbo_satisfies_gen_core_contract -- --ignored --nocapture
      - name: Run Lens provider conformance (base — the guided path)
        run: >-
          cargo test --locked --release -p mlx-gen-lens --test integration
          conformance::lens_base_satisfies_gen_core_contract -- --ignored --nocapture
      # sc-14038 DoD gate — the ONLY automatic run of the Qwen3-VL text-encoder parity suite. It
      # needs both the 8.875 GB `text_encoder/` component and the CPU-dumped boundary golden,
      # neither of which the PR lanes have. It also carries the self-invalidating assertion that
      # reports if the bf16 noise floor ever moves far enough to gate the QK-norm epsilon
      # numerically (today it cannot, so `verify_text_config` guards that instead).
      - name: Run Mage-Flow text-encoder parity
        run: >-
          cargo test --locked --release -p mlx-gen-mage --test integration te_parity_real_weights::
          -- --ignored --nocapture
      - name: Run Mage-VAE all-geometry parity
        run: >-
          cargo test --locked --release -p mlx-gen-mage --test integration vae_decode_real_weights::
          -- --ignored --nocapture
      # SC-15507: one loaded provider executes A -> B -> A request scopes, observes cancellation at
      # Mage's terminal post-trace check, injects an error outcome after real work, and proves both
      # cleanup paths permit follow-ups. SceneWorks owns selector/cache-state coverage; this workflow
      # has the Apple MLX hardware and complete snapshot needed for the provider half.
      - name: Run Mage request-memory lifecycle
        env:
          MAGE_REQUEST_SCOPE_SNAPSHOT: ${{ env.MAGE_SNAPSHOT }}
          MAGE_REQUEST_SCOPE_QUANT: bf16
        run: >-
          cargo test --locked --release -p mlx-gen-mage
          --test integration request_memory_scope_real_weights:: -- --ignored --nocapture
      - name: Run Mage-Flow instruction-edit parity
        run: source scripts/ci/real-weights/mlx-media/run-mage-flow-instruction-edit-parity.sh
      - name: Atomically promote the verified Mage manifests into this runner's operator seed
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'media' && inputs.migrate_mage_edit_variant_manifest && steps.mage-seed-recovery.outputs.completed != 'true'
        run: |
          python3.12 scripts/release/promote_mage_oracle_seed.py \
            --source "$MAGE_GOLDEN_DIR" \
            --seed "$MAGE_ORACLE_SEED_DIR" \
            --expected-old-edit-sha "${{ steps.mage-oracle-seed.outputs.edit-sha }}" \
            --expected-old-transfer-sha "${{ steps.mage-oracle-seed.outputs.transfer-sha }}" \
            --runner-name "$RUNNER_NAME" \
            --slot "${{ matrix.mage_seed_slot }}" \
            --revision "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/mage-seed-promotion-${{ matrix.mage_seed_slot }}.json" \
            --allow-already-current
      - name: Verify the promoted persistent Mage oracle seed
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'media' && inputs.migrate_mage_edit_variant_manifest
        run: source scripts/ci/real-weights/mlx-media/verify-the-promoted-persistent-mage-oracle-seed.sh
      - name: Upload persistent Mage seed promotion receipt
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'media' && inputs.migrate_mage_edit_variant_manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mage-seed-promotion-${{ matrix.mage_seed_slot }}-${{ github.sha }}
          path: ${{ runner.temp }}/mage-seed-promotion-${{ matrix.mage_seed_slot }}.json
          if-no-files-found: error
      - name: Save verified Mage oracle cache
        if: steps.mage-oracle-cache.outputs.cache-hit != 'true' && inputs.migrate_mage_edit_variant_manifest != true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mage-flow-oracles
          key: ${{ steps.mage-oracle-key.outputs.key }}
      - name: Upload verified Mage edit oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mage-flow-edit-oracle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_base_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_turbo_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_oracle_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_variants_manifest.json
          if-no-files-found: error
      - name: Upload Candle Mage acceptance oracles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mage-flow-candle-oracles-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_te_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_dit_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_vae_f32_1024.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_e2e_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_base_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_turbo_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_oracle_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_variants_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_candle_oracles_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_candle_transfer_manifest.json
          if-no-files-found: error

  mage-seed-promotion-gate:
    name: Mage seed promotion receipts
    if: always() && (github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media')
    needs: mlx-media
    runs-on: ubuntu-latest
    steps:
      - name: Require MLX media success
        run: |
          if [[ "${{ needs.mlx-media.result }}" != "success" ]]; then
            echo "MLX media did not complete successfully: ${{ needs.mlx-media.result }}" >&2
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'media' && inputs.migrate_mage_edit_variant_manifest
      - name: Download the persistent Mage seed receipt
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'media' && inputs.migrate_mage_edit_variant_manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mage-seed-promotion-*-${{ github.sha }}
          path: ${{ runner.temp }}/mage-seed-promotion-receipts
          merge-multiple: true
      - name: Require the exact-run Mage seed certification
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'media' && inputs.migrate_mage_edit_variant_manifest
        run: >-
          python3.12 scripts/release/promote_mage_oracle_seed.py
          --verify-receipts "$RUNNER_TEMP/mage-seed-promotion-receipts"
          --revision "$GITHUB_SHA"

  # sc-17284 — the FIRST CI lane for the mlx-gen-qwen-image real-weight surface.
  #
  # WHY THIS DID NOT EXIST, AND WHY IT COSTS NO DISK. All 45 `#[ignore]` tests in this crate read one
  # snapshot variable, and until this story that variable was spelled QWEN_IMAGE_SNAPSHOT — the same
  # name the CUDA residency A/B uses for `Qwen/Qwen-Image@75e0b4be`, an ~60 GB torch original that is
  # on neither runner. That collision is what made this surface look like a hardware-budget decision.
  # It is not. `mlx-gen-qwen-image` never loads the torch original: it loads a tier directory of the
  # SceneWorks MLX re-host `qwen-image-mlx@8080a417`, which the repo's own
  # `tools/adapter_parity_receipt.json` already recorded as the value those tests were actually fed.
  # The re-host is ALREADY RESIDENT on the box that carries `rw-mage`, so this lane transfers nothing
  # on a warm runner. The MLX half is now MLX_GEN_QWEN_SNAPSHOT with its own manifest row;
  # QWEN_IMAGE_SNAPSHOT keeps its exemption and still names the torch original for the CUDA half.
  #
  # WHAT THIS LANE DELIBERATELY DOES NOT COVER. 21 of the 41 tests these three variables gate
  # (e2e x7, img2img x6, adapter x6, text_encoder x2) compare against goldens under
  # `crates/media/mlx-gen/tools/golden/`. That directory is gitignored BY DESIGN (see its README) and
  # its contents are produced by the frozen Python `mflux` fork run against the torch original. A CI
  # checkout has none of them, so those 21 cannot be made to pass by wiring alone — they need the
  # Mage-shaped operator seed bundle (`MAGE_ORACLE_SEED_DIR`) plus the ~60 GB original to mint from.
  # That is a separate decision and is tracked separately; it is NOT resolved here. The 19 wired
  # tests need weights only.
  #
  # sc-17519 corrected both figures, which had drifted in opposite directions and disagreed with
  # `release/real-weight-models.toml` in the same repo. Denominator: 45 -> 41, because the old count
  # was enumerated per test FILE and per job STEP and so swept in four Edit-only tests that read
  # `QWEN_IMAGE_EDIT_SNAPSHOT` and none of this job's three variables (they are accounted for on the
  # `qwen-image-edit-2511-mlx` row). Numerator: 24 -> 21, because "adapter x9" counted the whole file
  # when three of its nine — `routing_map_covers_full_fork_surface`, `kohya_matches_peft_on_real_tree`,
  # `lightning_loras_apply_cleanly` — resolve no golden at all and are WIRED in the step below. A test
  # cannot be both wired and blocked on the bundle.
  #
  # ON `rw-mage`, NOT A NEW LABEL. The weight set is where the label already points, and the header
  # warns that a label no runner carries queues silently until the run is cancelled. Splitting this
  # set onto its own `rw-qwen` label is a one-line change here plus an org-settings change, and is
  # the right move the moment the disk budget wants these bytes on the other box.
  mlx-qwen-image:
    name: MLX Qwen-Image real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media' || inputs.profile == 'qwen-image'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    # MEASURED 2026-08-04 on an M5 Max with the weight set already resident, per test:
    #   control        3 + 3 + 3 + 15 =  24s      sampler       31 + 30       =  61s
    #   sequential   102 + 101 + 116 + 114 = 433s block residency             = 173s
    #   lightning     23 + 21        =  44s       adapter (golden-free) 0 + 1 =   1s
    #   preview fit (sc-17515, measured 2026-08-06, same box)           75-217s
    #   compiled-glue A/B (sc-17513, measured 2026-08-06, same box)    225-244s
    #   edit determinism (sc-17519, measured 2026-08-06, same box)       34-44s
    #                                             TOTAL COMPUTE   = 1070-1241s (17.8-20.7 min)
    # The cap is 90, not ~25, because only the 18-21 minutes above is compute: the rest is the
    # first-run materialization budget for the ~131 GiB of tiers and LoRAs this job consumes, on a
    # box that does not already hold them. It is deliberately well under GitHub's 360-minute ceiling — sc-16981 is one macOS job
    # sitting on that ceiling and head-of-line-blocking every other macOS real-weight lane.
    #
    # sc-17515 added the preview-fit row and did NOT raise the cap: it is among the most expensive
    # tests here (two 1024^2 8-step renders plus a VAE decode each), and it still only moves compute
    # from 12.3 to at most ~16 minutes against a cap that is a materialization budget. Its 75-217s
    # spread is THREE runs of the SAME command on nax-macos: 165s and 217s minutes apart while the
    # box was also running dev work, then 75s on an otherwise idle box. The row is therefore
    # dominated by contention rather than by the test, which is also why it is not ranked against
    # the rows above — those were measured 2026-08-04 under unknown load and the spread here is
    # wider than the gaps between them. nax-macos-2 measured a 4.4x spread on the producers job
    # (sc-17284), so 217s is not an upper bound a busier host cannot exceed.
    #
    # sc-17518 added a third test to the golden-free adapter step. MEASURED 2026-08-06 on nax-macos,
    # weights resident: `lightning_loras_apply_cleanly` 0.29-0.51s of libtest time over three runs
    # (it installs adapters onto a lazily-loaded tree and renders nothing), so the step is ~3s. The
    # table above does not carry it as its own row and does not need to: ~3s is inside the rounding
    # of the total and two orders of magnitude below the 142s contention spread on the preview-fit
    # row alone. The 90-minute cap is untouched: it is sized by the materialization budget, and this
    # test transfers no bytes the lane did not already pull.
    #
    # sc-17513 added the compiled-glue A/B row, which is NOT inside anyone's rounding: MEASURED
    # 2026-08-06 on nax-macos over three runs, weights resident — T2I 55-59s + Edit 170-185s =
    # 225-244s. The Edit arm dominates because it times 16 warm forwards over an 8192-token
    # dual-latent sequence. The cap stays 90 for the same reason every row above kept it there: it
    # is the materialization budget, and these two tests transfer no bytes this lane did not
    # already pull. Even at the top of the range, 90 minutes is ~4.5x the warm compute, which
    # leaves room for the contention that already dominates the preview-fit row.
    #
    # sc-17519 added the Edit determinism gate. MEASURED 2026-08-06 on nax-macos, weights resident:
    # `edit_generate_is_deterministic_rust` 34.19 / 35.80 / 44.11s of libtest time over three runs
    # (two 1024^2 2-step edits through the full LM + vision + transformer + VAE path, then a
    # byte-comparison of the two decoded images). Peak RSS 35.0 GiB, sampled at 2s. Like the
    # compiled-glue row it carries its own line in the table rather than a prose correction under it:
    # ~40s is not inside the rounding of an 800-1200s total, and a measured table a reader has to
    # scroll 28 lines to correct is the drift this whole lane is being audited for. The row states
    # the measured min-max (34-44s) as the preview-fit row does, so the ends move independently —
    # 34s onto the min, 44s onto the max — rather than one figure onto both. The cap stays 90 for the
    # same reason as every row above: it is a materialization budget, and this step reuses the q8
    # Edit tier the sequential-residency, Lightning and compiled-glue steps already pulled and
    # verified. Treat 44.11s as a floor, not a ceiling: it was measured on a box also running dev
    # work, and nax-macos-2 showed a 4.4x spread on the producers job (sc-17284). Even 4.4x is under
    # four minutes.
    timeout-minutes: 90
    env:
      # Repo-variable names are deliberately NOT the test-facing names. `vars.QWEN_IMAGE_SNAPSHOT`
      # already exists and holds a WINDOWS path for the CUDA operator A/B; a macOS job reading it
      # would resolve to `C:\Users\...`. These are separate variables holding the snapshot ROOT of
      # each re-host; the per-step assignments below point the tests one tier level in.
      QWEN_IMAGE_MLX_SNAPSHOT: ${{ vars.QWEN_IMAGE_MLX_SNAPSHOT }}
      QWEN_IMAGE_EDIT_MLX_SNAPSHOT: ${{ vars.QWEN_IMAGE_EDIT_MLX_SNAPSHOT }}
      QWEN_CONTROL_UNION_SNAPSHOT: ${{ vars.QWEN_CONTROL_UNION_SNAPSHOT }}
      # The Lightning suites resolve their LoRA from this root plus a hard-coded
      # `models--lightx2v--<repo>/snapshots/<rev>` layout, so the two paths below are DERIVED from
      # it rather than carried as their own repository variables — there is then no second place
      # for the pin to drift.
      MLX_GEN_MODELS_ROOT: ${{ vars.MLX_GEN_MODELS_ROOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          QWEN_IMAGE_MLX_SNAPSHOT QWEN_IMAGE_EDIT_MLX_SNAPSHOT QWEN_CONTROL_UNION_SNAPSHOT
          MLX_GEN_MODELS_ROOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # An unset repo variable would otherwise reach `ensure_model_snapshot.py` as an empty path and
      # fail as a confusing "revision mismatch" rather than "you did not configure this lane".
      - name: Require the operator-provisioned snapshot paths
        run: source scripts/ci/real-weights/mlx-qwen-image/require-the-operator-provisioned-snapshot-paths.sh
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          QWEN_IMAGE_MLX_SNAPSHOT QWEN_IMAGE_EDIT_MLX_SNAPSHOT QWEN_CONTROL_UNION_SNAPSHOT
          MLX_GEN_MODELS_ROOT
      - name: Materialize and verify immutable snapshots
        run: source scripts/ci/real-weights/mlx-qwen-image/materialize-and-verify-immutable-snapshots.sh
      - name: Prove the Qwen native decode seam on real weights
        run: source scripts/ci/real-weights/mlx-qwen-image/prove-the-qwen-native-decode-seam-on-real-weights.sh
      # EVERY step below selects by NAME with `--exact` and asserts the run count. All three halves of
      # that are load-bearing and were verified by direct execution for this story:
      #   1. `--exact` goes AFTER the `--`. It is a libtest flag; cargo rejects it in its own
      #      argument position ("error: unexpected argument '--exact' found", exit 1).
      #   2. With `--exact` accepted, a renamed or deleted test yields
      #      "test result: ok. 0 passed; N filtered out" and cargo EXITS 0 — a silent green gating
      #      nothing. Only the count assertion catches that (sc-17250).
      #   3. A run count still cannot see a test that reads an optional env var and returns early:
      #      that reports "1 passed" in 0.00s. Every test selected here was read for that shape
      #      first. None of them has it — each panics on a missing variable. `perf.rs` DID have it
      #      (`eprintln!("skip: ...")` + `return`); sc-17284 removed that, so they fail loudly.
      #      sc-17513 re-verified it by direct execution once they were wired: with
      #      MLX_GEN_QWEN_SNAPSHOT unset, `qwen_t2i_per_step_compiled_vs_eager` panics at
      #      perf.rs:45 and the step reports "test result: FAILED. 0 passed" and exits 1.
      #      This job now has exactly ONE exclusion, `edit_lightning_user_lora_reference_repro`,
      #      which needs a user LoRA and a reference PPM that exist nowhere. The three names that
      #      sat beside it are all wired in the steps below, and every one had been excluded on a
      #      number that measured the test rather than the code: `fit_preview_rgb_factors`
      #      (sc-17515) at R² = 0.0114, which was the test's own host readback rather than the fit;
      #      `lightning_loras_apply_cleanly` (sc-17518) at 840 per-block modules, which was the
      #      host map's target count and not a measured application; and `perf.rs` x2 (sc-17513) at
      #      `max|Δ| == 0`, which no 60-layer forward has ever satisfied. A lane that is red every
      #      week is ignored within a month, so each exclusion is still recorded with its
      #      measurement in the manifest — there is just one left.
      - name: Run Qwen-Image control-branch gates
        run: source scripts/ci/real-weights/mlx-qwen-image/run-qwen-image-control-branch-gates.sh
      - name: Run Qwen-Image unified-sampler smokes
        run: source scripts/ci/real-weights/mlx-qwen-image/run-qwen-image-unified-sampler-smokes.sh
      # The Edit arm takes `q8` and that is not a tuning choice: this re-host's `bf16/` tier is
      # metadata-only (~31 MB of configs and tokenizer files, no `vae/`, no transformer shards), so
      # pointing the Edit test at bf16 fails to load. The T2I and Control arms take the dense bf16.
      - name: Run Qwen-Image sequential component residency A/B
        run: source scripts/ci/real-weights/mlx-qwen-image/run-qwen-image-sequential-component-residency-a-b.sh
      # SC-16353 rung 4: a request-peak measurement against the PRE-QUANTIZED q8 tier, which is why
      # this step points at `/q8` rather than the dense bf16 the steps above use. `QWEN_RUNG4_TIER`
      # must agree with the directory — the test panics on an unknown value, not on a mismatch.
      - name: Run Qwen-Image rung-4 block residency (q8 tier)
        run: source scripts/ci/real-weights/mlx-qwen-image/run-qwen-image-rung-4-block-residency-q8-tier.sh
      # The only real-weight gate on LoRA application for this family: a published lightx2v
      # distillation LoRA must load through `LoadSpec::adapters` and still render a coherent image
      # at 8 steps. The third `#[ignore]` test in this file is NOT selected here —
      # `edit_lightning_user_lora_reference_repro` needs a user-supplied LoRA and a reference PPM
      # that exist in no repository and on no Hub. Selecting by name is what makes that exclusion
      # explicit; `--ignored` alone would have conscripted it.
      - name: Run Qwen-Image Lightning LoRA render gates
        run: source scripts/ci/real-weights/mlx-qwen-image/run-qwen-image-lightning-lora-render-gates.sh
      # sc-17519 — the ONE test of the 19 behind `QWEN_IMAGE_EDIT_SNAPSHOT` that resolves no golden.
      # That variable was wired by sc-17284 for the sequential-residency Edit arm, which satisfied the
      # per-VARIABLE manifest gate while `edit_real_weights.rs` (12) and `vision_real_weights.rs` (7)
      # still ran nowhere. All 19 were executed for the first time on 2026-08-06; 18 fail at
      # `Weights::from_file` with `SafeTensors(NotFile)` in 0.02s because `tools/golden/` is gitignored
      # by design and a CI checkout has none of the 10 artifacts they read (sc-17909 — a DIFFERENT
      # oracle bundle from sc-17503's, needing `Qwen/Qwen-Image-Edit-2511` rather than
      # `Qwen/Qwen-Image`). This one reads no golden: it renders the same edit twice through the
      # Generator and asserts the two decoded images are byte-identical, so it is a self-contained
      # determinism gate on the full LM + vision + transformer + VAE path.
      #
      # It is a STEP here rather than a sibling `mlx-qwen-image-edit` job, and the wall clock is why:
      # MEASURED 34.19 / 35.80 / 44.11 s of libtest time over three runs on nax-macos, weights
      # resident. A separate job would re-materialize the 36 GiB q8 tier — three orders of magnitude
      # more cost than the test — for 34-44 s of compute, and this job ALREADY materializes and
      # verifies that exact tier for the two steps above. `timeout-minutes` is therefore unchanged at
      # 90: the cap is a materialization budget, and this adds no bytes and under a minute of compute.
      #
      # Trap 3 was checked by reading, then proved by execution: neither file has the
      # `eprintln!("skip: …"); return;` shape anywhere — `edit_snapshot()` panics with the epic-13657
      # message on a missing variable. Running this name with QWEN_IMAGE_EDIT_SNAPSHOT unset yields
      # `0 passed; 1 failed` and exit 101, not a 0.00s green.
      - name: Run Qwen-Image-Edit determinism gate (golden-free)
        run: source scripts/ci/real-weights/mlx-qwen-image/run-qwen-image-edit-determinism-gate-golden-free.sh
      # Three of `adapter_real_weights.rs`'s nine tests resolve NO golden — they only need the real
      # 60-block tree — so they do not wait on the sc-17503 oracle bundle the other six do.
      # `routing_map_covers_full_fork_surface` proves the host LoRA map reaches all 60 x 14 fork
      # targets and refuses the paths it should; `kohya_matches_peft_on_real_tree` proves the two
      # adapter naming conventions produce byte-identical results across all 840 modules.
      #
      # `lightning_loras_apply_cleanly` joins them here as of sc-17518. It was excluded because it
      # asserted `applied == 840` — the HOST map's target count, never a measured application. Both
      # pinned lightx2v files carry 60 x 12 = 720 with zero unmatched (no img/txt modulation is
      # trained, in any published Lightning release), so the assertion now pins the FILE's surface
      # per module class. It is the only one of the three tests in this step that loads a LoRA file
      # (the Lightning render step above loads them too): it resolves both from the
      # QWEN_LIGHTNING_SNAPSHOT / QWEN_EDIT_LIGHTNING_SNAPSHOT dirs the materialize step derived
      # from the manifest pin and exported through $GITHUB_ENV — the SAME dirs
      # `ensure_model_snapshot.py` verified, so the gate cannot measure a revision merely cached
      # beside the pinned one (sc-17284). It asserts BOTH resolved, and fails loudly (never skips)
      # if either file is absent.
      - name: Run Qwen-Image adapter-surface gates (golden-free)
        run: source scripts/ci/real-weights/mlx-qwen-image/run-qwen-image-adapter-surface-gates-golden-free.sh
      # sc-17515 — WIRED. This was in the manifest's "EXCLUDED WITH A MEASUREMENT" block at
      # R² = 0.0114 against its own 0.90 floor; that number was a defect in the test's host readback
      # (`mlx-rs` `as_slice` returns physical storage for a transpose view, so it was regressing
      # latent channel 0 against the red channel). With the contiguity pass it measures
      # R² = 0.9521 (UNCLAMPED in-sample re-solve — the quantity the 0.90 floor gates).
      #
      # It is here rather than in `mlx-qwen-image-producers` because it is not only a producer. It
      # now also scores the SHIPPING `preview::RGB_FACTORS` unchanged on the corpus (measured
      # R² = 0.9450, mean |ΔRGB| 12.58/255, CLAMPED the way `project_latents` clamps before the
      # 8-bit round) and fails on the same floor — which makes it the only thing in the tree that
      # can catch a snapshot re-pin moving the VAE lineage out from under constants every live
      # preview reads. A drift gate belongs on the schedule; the printed paste-ready block is the
      # by-product.
      #
      # Do NOT subtract those two figures: they are scored differently and 0.9521 - 0.9450 is not a
      # gap between anything. The like-for-like comparison is the CLAMPED re-solve, 0.9633 / mean
      # |ΔRGB| 10.01/255, against the clamped committed 0.9450 / 12.58 — so the incumbent is 0.018
      # of R² behind a best-case in-sample refit, not 0.007. The test prints both pairs from one
      # run so no reader has to reconstruct this.
      #
      # Unlike every other step here it also needs QWEN_LIGHTNING_SNAPSHOT: the corpus renders
      # through the 8-step Lightning LoRA, because "8-step Lightning" is what the committed fit
      # documents and the schedule alone is only half of it. The materialization step above already
      # exports that variable at the manifest-pinned revision.
      - name: Run Qwen-Image preview-fit producer and drift gate
        run: source scripts/ci/real-weights/mlx-qwen-image/run-qwen-image-preview-fit-producer-and-drift-gate.sh
      # sc-17513 — the sc-2963 compiled-glue rollout's only real-weight gate. Both tests were
      # excluded from this lane when it was created because they asserted the compiled forward was
      # BIT-identical to eager on the real 60-layer transformer, which had never held. sc-17513
      # swept 18 shapes across both arms and two independent controls (compiled vs eager is exactly
      # `0.0` at 1 layer and 0.3 ULP at 2; a 1-ULP-f32 perturbation of the EAGER forward's own input
      # moves its output by the same 1e-4…2.5e-3 the whole gap does), so the residual is this
      # stack's amplification floor, not a fusion defect. The gate is now peak-RELATIVE and PER-ARM
      # — 1.0e-2 (T2I bf16) and 2.6e-3 (Edit q8) — each 4x that arm's own MEASURED conditioning
      # envelope, which is 3.9x smaller on Edit, so one shared constant cost that arm most of its
      # sensitivity. The evidence, the tables and the derivation live on
      # `perf.rs::COMPILED_GLUE_WHOLE_FWD_REL_TOL_T2I`, and the sweep that produced them is
      # committed as `mlx-gen-qwen-image/examples/qwen_compiled_glue_sweep.rs`. Re-measure with it
      # before touching either number here.
      #
      # The Edit arm takes `q8` for the same reason the residency step above does — this re-host's
      # `bf16/` tier is metadata-only. Each test loads its own transformer, so they are selected one
      # at a time rather than together: a single invocation of the `perf` binary would hold 38 GiB
      # (T2I bf16) and 20 GiB (Edit q8) of weights live in one process.
      #
      # MEASURED 2026-08-06 on nax-macos with both tiers resident, over three runs: T2I 55-59s, Edit
      # 170-185s = 225-244s of test time (peak RSS 40.8 GB and 21.7 GB respectively). That is +4 min
      # on the 811-953s this job carried before it, taking the header total to 1036-1197s;
      # `timeout-minutes: 90` is sized by the ~131 GiB first-run materialization budget, not by
      # compute, so it is unchanged — see the job header.
      - name: Run Qwen-Image compiled-glue vs eager per-step A/B
        run: source scripts/ci/real-weights/mlx-qwen-image/run-qwen-image-compiled-glue-vs-eager-per-step-a-b.sh

  # sc-17284 — the integrated PiD (progressive-in-decoder) super-resolution decode seam, for BOTH
  # engines that have one. Split from the job above because it is the only place `FLUX_DEV_DIR` and
  # the Gemma conditioner are needed, and a 31 GiB FLUX materialization should be able to fail
  # without taking the Qwen regression gates with it.
  #
  # Four of these five tests fall back to a GITIGNORED `tools/golden/pid/*.safetensors` when its
  # checkpoint variable is unset (`use_pid_without_loaded_pid_errors` never resolves one — it is
  # the negative arm). No CI checkout has those files, so the fallback is a guaranteed
  # failure, not a silent skip — but it is also why this lane must set PID_QWEN_SAFETENSORS and
  # PID_FLUX_SAFETENSORS explicitly at the published re-hosts rather than relying on any default.
  mlx-qwen-image-pid:
    name: MLX Qwen-Image / FLUX.1-dev PiD decode real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media' || inputs.profile == 'qwen-image-pid'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    # MEASURED 2026-08-04 on an M5 Max, weight set resident: Qwen 2s + 23s + 205s, FLUX 35s + 83s =
    # 348s wall clock. Same warm-cache caveat as the job above, and this one can additionally have to
    # transfer FLUX.1-dev (31.4 GiB measured) on a cold box.
    timeout-minutes: 60
    env:
      # `FLUX_DEV_DIR` is the test-facing name AND the manifest name for `flux-1-dev`, but the
      # repository variable behind it must be a different one: `vars.FLUX_DEV_DIR` holds the
      # nax-windows path (`E:\huggingface\hub\...`) that the CUDA operator A/B uses. Mapping a
      # macOS-side variable onto this name is what wires it — the manifest gate counts the name on
      # the LEFT of the mapping, never a bare `${{ vars.X }}`.
      FLUX_DEV_DIR: ${{ vars.FLUX_DEV_MLX_SNAPSHOT }}
      QWEN_IMAGE_MLX_SNAPSHOT: ${{ vars.QWEN_IMAGE_MLX_SNAPSHOT }}
      PID_QWEN_SNAPSHOT: ${{ vars.PID_QWEN_SNAPSHOT }}
      PID_FLUX_SNAPSHOT: ${{ vars.PID_FLUX_SNAPSHOT }}
      PID_GEMMA_SNAPSHOT: ${{ vars.PID_GEMMA_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          FLUX_DEV_DIR QWEN_IMAGE_MLX_SNAPSHOT PID_QWEN_SNAPSHOT PID_FLUX_SNAPSHOT PID_GEMMA_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Require the operator-provisioned snapshot paths
        run: source scripts/ci/real-weights/mlx-qwen-image-pid/require-the-operator-provisioned-snapshot-paths.sh
      - name: Report runner disk headroom
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          FLUX_DEV_DIR QWEN_IMAGE_MLX_SNAPSHOT PID_QWEN_SNAPSHOT PID_FLUX_SNAPSHOT PID_GEMMA_SNAPSHOT
      - name: Materialize and verify immutable snapshots
        run: source scripts/ci/real-weights/mlx-qwen-image-pid/materialize-and-verify-immutable-snapshots.sh
      # Same `--exact` + run-count contract as the job above, for the same three reasons.
      - name: Run Qwen-Image PiD decode seam
        run: source scripts/ci/real-weights/mlx-qwen-image-pid/run-qwen-image-pid-decode-seam.sh
      - name: Run FLUX.1-dev PiD decode seam
        run: source scripts/ci/real-weights/mlx-qwen-image-pid/run-flux-1-dev-pid-decode-seam.sh

  # sc-17284 — the Qwen-Image real-weight PRODUCERS, split out of the regression lane for the same
  # reason sc-17276 split the Krea S18 sweep out: they are not gates, and they are expensive.
  #
  # `dump_runb_latents` renders 1024² x 50 steps at true-CFG (measured 485s / 8.1 min) and writes
  # `tools/golden/pid/runb_*.safetensors` for the sc-7843 PiD "fair pair" analysis, which a human
  # reads. On the weekly schedule that is eight minutes of a shared Metal box spent producing a file
  # the run then throws away. Dispatch-only keeps it reachable and reproducible without paying for it
  # every week; what it still gates, when run, is that the 50-step pipeline completes end to end.
  #
  # `fit_preview_rgb_factors` is the other producer in this crate and is deliberately NOT here
  # either, but for the opposite reason to the one this comment used to give. It used to say the
  # test FAILS (R² = 0.0114 against its own 0.90 floor); sc-17515 traced that to the test's host
  # readback and it now measures 0.9521 (unclamped re-solve, the quantity that floor gates — the
  # shipping constants score 0.9450 clamped). It went to the WEEKLY `mlx-qwen-image` job rather than to
  # this dispatch-only one because it gained a second job: it scores the shipping
  # `preview::RGB_FACTORS` unchanged and fails on the same floor, so it is a drift gate on constants
  # every live preview reads, not just a producer of a paste-ready block.
  mlx-qwen-image-producers:
    name: MLX Qwen-Image real-weight producers (operator dispatch)
    if: inputs.profile == 'qwen-image-producers'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    # MEASURED IN CI TWICE, on different boxes, and the spread is the point:
    #   nax-macos    1618 s of test time / 32m32s job   (run 30959809619)
    #   nax-macos-2   370 s of test time /  6m43s job   (run 31050459516)
    # Same test, same tier, same resident weights — a 4.4x spread that is HOST variance, not cold
    # cache. `rw-mage` currently selects only nax-macos-2, but labels are movable and the slow-host
    # observation remains the conservative sizing datum. Size the cap against that host: 60 leaves
    # 1.8x headroom over 32m32s, the thinnest of the three jobs. If any of them ever brushes its cap,
    # raise this one first — it is a producer, so the cost of a generous cap here is low.
    timeout-minutes: 60
    env:
      QWEN_IMAGE_MLX_SNAPSHOT: ${{ vars.QWEN_IMAGE_MLX_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Resolve runner-local snapshot paths
        run: python3.12 scripts/release/resolve_snapshot_paths.py QWEN_IMAGE_MLX_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Require the operator-provisioned snapshot paths
        run: source scripts/ci/real-weights/mlx-qwen-image-producers/require-the-operator-provisioned-snapshot-paths.sh
      - name: Report runner disk headroom
        continue-on-error: true
        run: scripts/ci/report_runner_disk_headroom.sh QWEN_IMAGE_MLX_SNAPSHOT
      - name: Materialize and verify immutable snapshots
        run: source scripts/ci/real-weights/mlx-qwen-image-producers/materialize-and-verify-immutable-snapshots.sh
      - name: Run the PiD Run-B latent dump
        run: source scripts/ci/real-weights/mlx-qwen-image-producers/run-the-pid-run-b-latent-dump.sh
      # The whole point of a producer lane. `tools/golden/pid/` is gitignored, so without this the
      # next checkout's clean deletes the output and the run has produced nothing anyone can read —
      # the same "surrender your evidence" contract `mlx-krea-realtime-s18-sweep` is held to.
      - name: Upload the Run-B latents
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen-image-pid-runb-latents-${{ github.sha }}
          path: crates/media/mlx-gen/tools/golden/pid/runb_*.safetensors
          if-no-files-found: error

  # sc-8446 (epic 8431) — the FIRST real-weight video lane. Kept a separate job from `mlx-media`
  # because that one is entirely Mage-Flow oracle machinery (a pinned reference Python, a
  # multi-GB golden cache, an operator seed dir) that a video smoke needs none of, and because a 20 GB
  # tier fetch should be able to fail without taking the image lane's oracle work with it.
  mlx-krea-realtime:
    name: MLX Krea Realtime video real weights
    # `krea-realtime` is selectable on its own so the 20 GB tier fetch does not require running the
    # Mage-oracle job that shares the `media` profile. `krea-kv-cache` runs only the two count-pinned
    # KV acceptance tests below, so an unrelated blanket e2e or LoRA failure cannot hide their
    # verdict (sc-17894).
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media' || inputs.profile == 'krea-realtime' || inputs.profile == 'krea-kv-cache'
    runs-on: [self-hosted, macOS, ARM64, rw-krea]
    timeout-minutes: 120
    env:
      # The repo root of the pinned `SceneWorks/krea-realtime-14b-mlx` rehost. Each tier subdir is a
      # complete snapshot, so the tests are pointed one level in (`/q4`).
      KREA_REALTIME_SNAPSHOT: ${{ vars.KREA_REALTIME_SNAPSHOT }}
      KREA_STYLE_LORA_SNAPSHOT: ${{ vars.KREA_STYLE_LORA_SNAPSHOT }}
      KREA_DISTILL_LORA_SNAPSHOT: ${{ vars.KREA_DISTILL_LORA_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          KREA_REALTIME_SNAPSHOT KREA_STYLE_LORA_SNAPSHOT KREA_DISTILL_LORA_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # An unset repo variable would otherwise reach `ensure_model_snapshot.py` as an empty path and
      # fail as a confusing "revision mismatch" rather than "you did not configure this lane".
      - name: Require the operator-provisioned snapshot paths
        run: source scripts/ci/real-weights/mlx-krea-realtime/require-the-operator-provisioned-snapshot-paths.sh
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          KREA_REALTIME_SNAPSHOT KREA_STYLE_LORA_SNAPSHOT KREA_DISTILL_LORA_SNAPSHOT
      - name: Materialize and verify immutable snapshots
        run: source scripts/ci/real-weights/mlx-krea-realtime/materialize-and-verify-immutable-snapshots.sh
      # sc-17355 — start the GPU/memory evidence sampler. Placed AFTER the Hub transfer so the
      # window covers the render steps and nothing else; a `kIOGPUCommandBufferCallbackError…`
      # cascade names no cause, so the run that fails is the only chance to record one.
      # See the script header for why the story's `subsystem == "com.apple.gpu"` predicate is
      # not the one used (it matches zero events).
      - name: Start GPU fault evidence
        continue-on-error: true
        run: scripts/ci/gpu_fault_evidence.sh start
      # Coherence floor + per-chunk/whole-clip timing + the MLX memory ceiling, then the i2v
      # single-frame anchor, the v2v strength=0 paths, and the sc-15325 decode-tiling characterization.
      #
      # 33 frames, not 81, and that is required rather than incidental: the sc-15325 sweep compares
      # against a SINGLE-PASS decode, which is only valid below the z16 write cap of 56 output frames at
      # 832x480 (the sweep asserts this itself and would fail at 81). `KREA_SMOKE_FRAMES` is set PER
      # STEP so the one test that genuinely needs the production geometry -- the KV-cache residency,
      # whose 6-latent-frame window must fill -- can run at 81 in its own step below.
      #
      # `long_clip_coherence_under_the_bounded_window` is EXCLUDED here and runs in the dispatch-only
      # `mlx-krea-realtime-s18-sweep` job below (sc-17276). It is not a regression gate: it is the
      # sc-15127/sc-15571 research sweep — seven KV-window rows, six of them a full 45-latent-frame
      # clip — and it was 85.3 min of this step's 105 (81%) in run 30787887176, leaving ~20 min for
      # the six tests that ARE the regression gates and never got a verdict behind it. It also
      # cannot pass here: its verdict rule refuses to rank configs without a between-seed variance
      # estimate, and `KREA_S18_SEEDS` defaults to one seed, so every run ends UNDERPOWERED. Seeding
      # it does not fit either — n=2 is ~186 min against this job's 120-minute cap.
      #
      # Selection here is by `--ignored`, a BLANKET: every `#[ignore]` test in the file is conscripted
      # into this step, which is how an hours-long sweep joined a regression lane unannounced. Skip
      # both the real sweep and its two operator-only re-aggregation entry points explicitly. The
      # run-count assertion pins the six that belong here, so the next such addition fails loudly
      # instead of silently spending the budget. Adding an e2e test means bumping the count.
      - name: Run Krea Realtime real-weight e2e (Q4 tier)
        if: inputs.profile != 'krea-kv-cache'
        env:
          KREA_SMOKE_W: "832"
          KREA_SMOKE_H: "480"
          KREA_SMOKE_FRAMES: "33"
        run: source scripts/ci/real-weights/mlx-krea-realtime/run-krea-realtime-real-weight-e2e-q4-tier.sh
      # The KV-cache residency IS a production-geometry measurement (the 6-latent-frame window must be
      # full), so it runs at the real 81-frame clip.
      #
      # Run-count-asserted for the same reason as the LoRA step below (sc-17250). Moving `--exact`
      # after the `--` fixes a hard cargo rejection, but on its own it would REPLACE a loud failure
      # with a silent one: with the flag accepted, a rename now yields "0 passed; 1 filtered out" and
      # cargo exits 0, so the step would go green gating nothing. The name-selected form is only safe
      # with the count assertion attached.
      - name: Run Krea Realtime KV-cache residency (production geometry)
        env:
          KREA_SMOKE_W: "832"
          KREA_SMOKE_H: "480"
          KREA_SMOKE_FRAMES: "81"
        run: source scripts/ci/real-weights/mlx-krea-realtime/run-krea-realtime-kv-cache-residency-production-geometry.sh
      # A published Wan style LoRA must load through `LoadSpec::adapters` and measurably change the
      # render, with the scale-0 arm as the attribution control; and the step-distill file is the only
      # real-weight regression gate on the sc-8446 globals-surface decision.
      #
      # `--exact` + a run-count assertion: selecting by bare name means a rename yields
      # "0 passed; N filtered out" and a GREEN step, silently deleting the only coverage these have.
      # `--exact` belongs AFTER the `--`; it is a libtest flag, and cargo rejects it in its own
      # argument position ("error: unexpected argument '--exact' found", exit 1). Both call sites in
      # this job carried it before the `--` since sc-8446 (#287) and neither has ever run: in the one
      # scheduled run that reached this job (30787887176, 2026-08-03) the FIRST e2e step above failed
      # and both `--exact` steps were skipped behind it. That earlier failure is still open, so this
      # fix is not exercised end-to-end yet (sc-17250).
      - name: Run Krea Realtime real Wan LoRA gates
        if: inputs.profile != 'krea-kv-cache'
        env:
          KREA_LORA_W: "832"
          KREA_LORA_H: "480"
          KREA_LORA_FRAMES: "13"
        run: source scripts/ci/real-weights/mlx-krea-realtime/run-krea-realtime-real-wan-lora-gates.sh
      # sc-17355 — `if: always()`, not `if: failure()`. A clean run's trajectory is what makes a
      # failing one legible: the hypothesis under test is memory pressure, and "93 GiB peak" means
      # nothing without the passing runs to compare it against. It is also the only way to notice
      # that this record has quietly stopped being produced.
      - name: Report GPU fault evidence
        if: always()
        continue-on-error: true
        run: scripts/ci/gpu_fault_evidence.sh report
      # THIS is the lane that failed (run 30869410054), so it is the lane whose raw record has to
      # survive. The step above prints a summary; the full event list and the whole 1 Hz CSV are
      # what a diagnosis actually needs, and `$RUNNER_TEMP` is wiped when the job ends.
      #
      # `if-no-files-found: warn`, NOT `error`: these files are produced by a `continue-on-error`
      # step by design, so their absence is already a tolerated outcome — failing the upload on it
      # would hand a record-keeping path the power to red a real-weight lane, which is the one
      # thing this whole mechanism must not do.
      - name: Upload GPU fault evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: krea-realtime-gpu-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/gpu-fault-evidence/memory.csv
            ${{ runner.temp }}/gpu-fault-evidence/gpu-events.txt

  # SC-18315 — correctness-only characterization of the experimental Wan z16 terminal decoder for
  # Krea 2. This is operator-dispatch only: it runs no weekly cadence, does not join `all`, and does
  # not collect memory, latency, GPU-counter, or calibration evidence. The large Krea q4 base is
  # resident on `nax-macos`; its `rw-sa3` label selects that host, while the lane provisions the
  # exact manifest-pinned license and standalone Wan z16 donor. The second NAX box's `rw-krea` set
  # is the unrelated complete Krea Realtime video model and does not include the Krea 2 image
  # snapshot. The executable itself asserts output coherence and native/Wan distinctness. A 512 px
  # run covers the normal native-default seam and a 768 px run forces multiple 512/64 decode tiles;
  # the uploaded images remain available for the acceptance criterion's artifact inspection.
  mlx-krea-alternate-decoder:
    name: MLX Krea alternate decoder correctness (operator dispatch)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'krea-alternate-decoder'
    runs-on: [self-hosted, macOS, ARM64, nax, rw-sa3]
    timeout-minutes: 120
    env:
      MLX_GEN_MODELS_ROOT: ${{ vars.MLX_GEN_MODELS_ROOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Resolve runner-local snapshot paths
        run: python3.12 scripts/release/resolve_snapshot_paths.py MLX_GEN_MODELS_ROOT
      - name: Report runner disk headroom
        continue-on-error: true
        run: scripts/ci/report_runner_disk_headroom.sh MLX_GEN_MODELS_ROOT
      - name: Toolchain versions
        run: rustc --version && cargo --version && sw_vers
      - name: Bind the manifest-pinned q4 Krea tier
        run: |
          python3.12 scripts/release/export_model_snapshot_paths.py \
          --model krea-2-turbo-mlx-q4 \
          --model krea-realtime-14b-mlx-wan-z16-vae-q8
      - name: Install pinned model materializer
        run: |
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
      - name: Ensure manifest-required decoder inputs
        env:
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
        run: source scripts/ci/real-weights/mlx-krea-alternate-decoder/ensure-manifest-required-decoder-inputs.sh
      - name: Run fixed-seed native and Wan decoder correctness smoke
        env:
          KREA_ALTERNATE_DECODER_OUTPUT_DIR: ${{ runner.temp }}/krea-alternate-decoder
        run: scripts/ci/run_krea_alternate_decoder_smoke.sh
      - name: Upload fixed-seed correctness artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krea-alternate-decoder-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/krea-alternate-decoder

  # sc-17276 — the sc-15127/sc-15571 S18 coherence sweep, split out of the regression lane above.
  #
  # OPERATOR-DISPATCH ONLY, and deliberately not on the weekly schedule. Seven rows x three seeds is
  # twenty-one 832x480 clips, eighteen of them 45 latent frames; at the n=1 wall clock measured in run
  # 30787887176 (85.3 min for one seed of all seven rows) that is ~4.3 hours, and `rw-krea` shares nax-macos-2
  # with `rw-audio`, `rw-llm` and `rw-chroma`, which run one at a time. Putting this on the schedule
  # would head-of-line-block twelve jobs for half a night — the sc-16981 failure, again.
  #
  # THREE SEEDS IS THE POINT, not a tuning knob. The sweep's verdict rule refuses to rank configs
  # without a between-seed variance estimate, so at the default single seed it can only ever return
  # UNDERPOWERED. 7,11,23 are the seeds the recorded sc-15127 sweep used, so a run here is directly
  # comparable to the evidence pinned in `generate_smoke.rs`.
  #
  # This is a MEASUREMENT, not a regression gate. Its verdict is a narrative — "drift is real, and
  # here is the within-regime attribution" is a passing outcome, because the drift itself is
  # sc-15571's open question, not this lane's. What it does gate is that the sweep still runs, still
  # produces a resolvable verdict, and that no row freezes or blows highlights.
  #
  # STANDING CADENCE: dispatch-only, permanently. sc-17324 was asked to choose between this and "its
  # own cron on a night the weekly does not run", and settled it on two measurements — do not re-open
  # it without new ones.
  #
  #   1. A second `cron:` entry cannot be scoped to this job as the workflow is written. THIRTY-ONE
  #      jobs here gate on a bare `github.event_name == 'schedule'`, so any cron added to `on:` fires
  #      the entire real-weight suite, not the sweep. Scoping it would mean rewriting all thirty-one
  #      to `github.event.schedule == '0 2 * * 1'` — and the failure mode of missing one is a lane
  #      that silently stops running weekly, which is strictly worse than the gap being closed.
  #   2. A calendar is the wrong trigger anyway. These numbers move when the AR loop, the KV
  #      window/sink, the scheduler or the decode path moves — not when a week passes. Re-running an
  #      unchanged tree at 4.3 h a go buys a re-measurement of the same 21 cells.
  #
  # Point 1 is about THIS file, and there is an obvious way around it: lift the job into its own
  # workflow with its own `on: schedule`. That was considered and NOT taken, because point 2 does not
  # go away with it — a separate file still buys a scheduled re-measurement of an unchanged tree, at
  # 4.3 h of a box that runs four `rw-*` pools one at a time, and it splits one real-weight lane
  # across two files and two policy-test fixtures for that. If a cron is ever actually wanted, the
  # separate workflow is the right shape for it; the reason to want one is not "coverage is zero",
  # it is a specific question a scheduled run would answer that a triggered one would not.
  #
  # What actually holds the sweep together between dispatches is CI, not the clock: the decision rule
  # and the recorded evidence are covered by seven NON-ignored tests in `generate_smoke.rs` that need
  # no weights and run in every `cargo test` — `the_s18_verdict_rule_distinguishes_its_outcomes`,
  # `the_recorded_s18_sweep_is_what_the_docs_claim`, `the_withdrawn_s18_claims_do_not_survive_in_crate_prose`,
  # `the_s18_bounded_dose_ladder_spans_thirteen_ten_and_five_rolls`,
  # `an_s18_cell_retains_tail_motion_from_the_live_sweep`, and the two drift-metric shape gates. A
  # rename or a rule change goes red there, in minutes, without a runner.
  #
  # So: DISPATCH THIS when the thing it measures changes — the AR rollout, `local_attn_size`/`sink_size`,
  # the sigma schedule across chunks, the VAE decode path — or before closing sc-15571. Not on a date.
  mlx-krea-realtime-s18-sweep:
    name: MLX Krea Realtime S18 coherence sweep (operator dispatch)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'krea-s18-sweep'
    runs-on: [self-hosted, macOS, ARM64, rw-krea]
    # ~4.3 h of sweep plus the incremental `--release` build and the 19 GB snapshot verification.
    # Sized with headroom rather than to the estimate: the cap is what stops a hung row holding the
    # box until GitHub's 360-minute default kills it with no verdict (sc-16981).
    timeout-minutes: 480
    env:
      KREA_REALTIME_SNAPSHOT: ${{ vars.KREA_REALTIME_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Resolve runner-local snapshot paths
        run: python3.12 scripts/release/resolve_snapshot_paths.py KREA_REALTIME_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Require the operator-provisioned snapshot path
        run: source scripts/ci/real-weights/mlx-krea-realtime-s18-sweep/require-the-operator-provisioned-snapshot-path.sh
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. A 4.3 h sweep that finds no room after hour three is the
      # worst way to learn the box was full. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          KREA_REALTIME_SNAPSHOT
      - name: Materialize and verify the immutable snapshot
        run: source scripts/ci/real-weights/mlx-krea-realtime-s18-sweep/materialize-and-verify-the-immutable-snapshot.sh
      # sc-17355 — the same evidence sampler as the regression lane above. This job is the SAME
      # crate and the SAME box driven for ~4.3 hours instead of ~28 minutes, so if the cascade is
      # pressure-related this is where it is most likely to be seen; a four-hour run that dies
      # naming no cause is the most expensive possible place to have no record.
      #
      # 30000s, not the 7200s default: the default matches the regression lane's
      # `timeout-minutes: 120`, and using it here would stop recording ~2h into a run this job is
      # allowed 480 minutes for — silently, and in the half of the run where accumulated pressure
      # is most likely. The figure is over this job's own cap so the sampler cannot expire first.
      # sc-17324 — REFUSE a row this box cannot hold, before spending any GPU time on it.
      # Two runner deaths (30948568453, 31051413212) were both row F at 832x480: ~49 GiB of MLX
      # active peak on a ~101 GiB host, which is not a flake but arithmetic. A dying runner takes
      # the `always()` steps with it, so the cost of finding out the hard way is the whole run's
      # evidence, not just the row. Deliberately NOT `continue-on-error` — refusing is the point.
      - name: S18 memory preflight
        env:
          KREA_S18_GEOMETRY: ${{ inputs.krea_s18_geometry }}
          KREA_S18_ROWS: ${{ inputs.krea_s18_rows }}
        run: source scripts/ci/real-weights/mlx-krea-realtime-s18-sweep/s18-memory-preflight.sh
      - name: Start GPU fault evidence
        continue-on-error: true
        run: scripts/ci/gpu_fault_evidence.sh start 30000
      # `--exact` after the `--` (cargo rejects it in its own argument position, exit 1) plus the
      # run-count assertion: name-selection alone turns a rename into "0 passed; N filtered out" and
      # a green step, which on a four-hour job would be an expensive way to gate nothing (sc-17250).
      #
      # `KREA_S18_ROWS`/`KREA_S18_SEEDS` are set explicitly rather than left to the Rust-side defaults
      # because the cell-count assertion below is their product and this job must own both factors —
      # otherwise a change to the default row set silently turns the count into a false red (or, at a
      # wider default, a false green). Since sc-17655 they come from dispatch inputs, so the count is
      # DERIVED (`n_rows * n_seeds`) instead of the literal 21 that only held for the full sweep.
      - name: Run the S18 coherence sweep
        env:
          KREA_S18_GEOMETRY: ${{ inputs.krea_s18_geometry }}
          KREA_S18_ROWS: ${{ inputs.krea_s18_rows }}
          KREA_S18_SEEDS: ${{ inputs.krea_s18_seeds }}
        run: source scripts/ci/real-weights/mlx-krea-realtime-s18-sweep/run-the-s18-coherence-sweep.sh
      # sc-17355 — before the upload below, so the sampler is stopped and its CSV is final when the
      # artifact is collected.
      - name: Report GPU fault evidence
        if: always()
        continue-on-error: true
        run: scripts/ci/gpu_fault_evidence.sh report
      # The sweep's product is its per-cell evidence, not the green check: every (row, seed) emits one
      # `S18CELL` TSV line precisely so a run can be re-aggregated without the log. `always()` because
      # a long run that ends in an unresolvable verdict still measured real cells, and throwing
      # them away would mean paying for the sweep twice to read them.
      #
      # KNOWN LIMIT of that guarantee, measured — it covers a FAILING SWEEP, not a DYING RUNNER.
      # `always()` schedules these steps when the sweep step fails; it cannot schedule them when the
      # job itself stops existing. sc-17324's first powered dispatch (run 30948568453) lost
      # `nax-macos-2` 2 h 42 m in — "The self-hosted runner lost communication with the server" — and
      # because the runner died, these two steps never ran, no artifact was produced, and GitHub kept
      # no partial log (the run's log zip is empty). Every cell measured up to that point was lost.
      #
      # NOT row E's memory, which is the obvious suspect and was checked: at the per-row wall clock
      # measured in run 30787887176, three seeds each of A/B/C/D reach 146.8 min and row F ends at
      # 200.2, so 162 min of job wall (~154 of sweep, after the build and snapshot verify) puts the
      # death inside row F seed 7 — row E had not started and was ~46 min away. Row E's own peak at
      # this bucket is 63.32 GiB, measured, and it COMPLETED; see the correction on
      # `long_clip_coherence_under_the_bounded_window`.
      # MITIGATION, not a fix — sc-17655 made the sweep divisible rather than making one long run
      # survivable. Dispatch it in row-sized pieces (`krea_s18_rows`) and each piece uploads its own
      # cells when it finishes, so a runner loss costs one row instead of everything; re-aggregate
      # afterwards with `s18_verdict_from_accumulated_cells`. A single ABCDFEZ dispatch is still
      # all-or-nothing against a dying runner, and that is a deliberate trade: the alternative is
      # streaming uploads mid-step, which Actions does not do without a lot of machinery.
      #
      # The same limit applies to sc-17355's `Report GPU fault evidence` step above — it is `always()`
      # too, so it reports a fault the sweep survived, not one that took the runner with it. That is
      # the case worth knowing about here, so do not read its presence as coverage for this hole.
      - name: Extract the S18 cell evidence
        if: always()
        run: |
          touch "$RUNNER_TEMP/s18-sweep.log"
          grep -E "^(S18CELL|  VERDICT:)" "$RUNNER_TEMP/s18-sweep.log" > "$RUNNER_TEMP/s18-cells.tsv" || true
          echo "captured $(grep -c '^S18CELL' "$RUNNER_TEMP/s18-cells.tsv" || true) S18CELL rows"
      - name: Upload the S18 cell evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Rows and seeds in the NAME (sc-17655): every piece of a split sweep uploads from the
          # same sha and the file inside is always `s18-cells.tsv`, so without this the pieces are
          # indistinguishable — which is how the same piece ends up concatenated twice at
          # re-aggregation. The ingest rejects that now, but an artifact you cannot identify is
          # still evidence you cannot use.
          name: krea-s18-sweep-${{ github.sha }}-${{ inputs.krea_s18_geometry }}-${{ inputs.krea_s18_rows }}-s${{ inputs.krea_s18_seeds }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/s18-cells.tsv
            ${{ runner.temp }}/s18-sweep.log
            ${{ runner.temp }}/gpu-fault-evidence/memory.csv
            ${{ runner.temp }}/gpu-fault-evidence/gpu-events.txt

  # sc-18932 — the FIRST MiniMax-H3 lane in this repository, and what it fixes is narrower than
  # "missing coverage". `MINIMAX_H3_SNAPSHOT` is read by ~30 `#[ignore]`d tests across BOTH backends
  # and was referenced by no workflow at all, so not one of them could run anywhere except by hand on
  # a dev box. The tests themselves are correct — they ASSERT on the variable rather than returning
  # early, so an unset snapshot fails at exit 101 instead of printing `ok` in 0.00 s — which is why
  # this was invisible: there was never a vacuous green to notice, just silence.
  #
  # MEASURED ON nax-macos, release profile, warm weights. Re-measured 2026-08-15 for sc-19445 /
  # sc-19438, which took this lane from nine invocations to TWELVE: all twelve total ~9.4 s of test
  # time (the six header/config gates ~1.9 s, the three decodes 1.02 + 0.63 + 0.24 s, the VAE
  # decode parity 0.88 s, the VAE ENCODE parity 1.40 s, the conditioner parity 3.28 s — all six
  # figures are `cargo test` reported TEST time, not step wall clock). MLX mmaps and materializes
  # per tensor, so "load the 9.7 GB VAE" is 22 ms. The `timeout-minutes` below is therefore
  # ENTIRELY cold build (5m36s for the mlx-gen tree measured here) plus a possible **70.21 GB**
  # first transfer — the 11.638 GB `minimax-h3` slice plus the 58.568 GB `minimax-h3-text-encoder`
  # one — not test time. That transfer is why the budget is 150 minutes rather than 60.
  #
  # Both slice figures are byte sums over this pinned revision's own files, taken 2026-08-15
  # (`vae/` 10.4156 + `audio_vae/` 0.6054 + `FL2VA/audio_vae/` 0.6055 + `tokenizer/` 0.0115 + the TE
  # index; and shards 1-12 of `text_encoder/` at 4.932 + 11 x 4.876). An earlier revision of this
  # block said 63.1 GB, which reused 51.5 GB — a RESIDENCY figure (66.715 minus the 15.209 GB
  # trimmable tail) — as if it were a transfer figure. It is 7.1 GB short; do not reintroduce it.
  #
  # TIME IS NOT THE ONLY BUDGET, and this block recorded only the time one. The largest memory
  # consumer here is the LAST step — which since sc-19438 is the CONDITIONER parity, which maps
  # shards 1-12 of the dense Qwen3-VL-32B text encoder WHOLE (58.568 GB; the layer-0-49 tap's own
  # parameters are 50.316 GB of that), not the ~9.70 GiB VAE parity
  # that used to hold that title and is now second. Both figures below are still worth stating
  # plainly, because the reason the VAE one used to be overstated was a dtype error. MEASURED from
  # the published safetensors headers (snapshot 939557dc): **`vae/` ships F32 — all 703 tensors, 0
  # of them bf16, 9.7002 GiB / 10.4155 GB.** The sc-18740 decode parity gate and the sc-19445
  # encode parity gate both build at `Dtype::Float32` — the same cast on the same component, in
  # both cases carried deliberately to keep the comparison about layout rather than about bf16
  # rounding. That is a NO-OP CAST holding ~9.70 GiB, NOT the ~19.4 GB that a "9.7 GB bf16 `vae/`
  # materialized at f32" reading produces; there is no doubling because there is no bf16 to double. The bf16 component in this
  # checkpoint is `transformer/` (626 of 638 tensors BF16, 61.73 GiB / 66.28 GB), which this lane
  # does not load. The two video decode smokes cast the OTHER way — `Dtype::Bfloat16` downcasts that
  # same F32 component — so they materialize about half the parity gate, out of the same ~10 GB of
  # mapped source bytes their `#[ignore]` strings quote. `audio_vae/` is likewise all F32 (1087
  # tensors, 0.5637 GiB) and is loaded at f32 with nothing to cast, so its ~0.6 GB is right as
  # written. These are component sizes derived from the published headers, not peaks measured on
  # either runner.
  #
  # It matters because `rw-mage` is registered on BOTH Macs (below) and this lane has never run on
  # either. The only host figure this repository carries for `nax-macos-2` is the ~101 GiB in
  # `scripts/ci/s18_memory_preflight.py`, and that was inferred from `active+wired` sampling during
  # an S18 sweep rather than read off the box — and it is a physical-RAM-shaped number, which is not
  # the Metal working-set budget. `Record the macOS device inventory` below prints both, labelled
  # separately, so this lane's first run retires the constant instead of leaving it as an errand.
  #
  # `rw-mage` rather than a new label: a label no runner carries does not fail, it queues silently
  # until the run is cancelled (see this file's header), and `rw-mage` is registered on BOTH Macs.
  # The 11.638 GB `minimax-h3` slice and the 58.568 GB `minimax-h3-text-encoder` one both self-heal
  # from the Hub on either box. The three diffusers/conditioner reference artifacts do NOT — see
  # the steps that require them.
  mlx-minimax-h3:
    name: MLX MiniMax-H3 real weights
    # Selectable on its own so the 70.21 GB fetch does not require running the Mage-oracle job that
    # shares the `media` profile — the same split `krea-realtime` gets, for the same reason.
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media' || inputs.profile == 'minimax-h3'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    # 60 -> 150 (sc-19438). The 60 was sized for an 11.638 GB first transfer plus nine gates; this
    # lane now also materializes the 58.568 GB text-encoder row and runs two more, one of which maps
    # twelve shards and forwards 50 layers. A COLD first run on the second Mac is the case this has
    # to cover, and the transfer dominates it — the twelve gates together are ~9.4 s of test time
    # (header block above) against 70.21 GB of bytes.
    #
    # 150 RE-CHECKED against 70.21 GB rather than the 63.1 GB it was first sized on: 150 minus the
    # 5m36s measured cold build leaves ~144 min for the fetch, i.e. the lane survives any sustained
    # Hub throughput above ~8.1 MB/s. The correction moved that required floor from ~7.3 to
    # ~8.1 MB/s — an 11% tightening of a bound that was never close — which is why the number
    # stands rather than rising. No cold fetch has ever been timed on either Mac, so that floor is
    # the whole justification; if this lane does time out, record the first run's actual transfer
    # rate here rather than reflex-bumping the budget.
    timeout-minutes: 150
    env:
      # The snapshot ROOT — the directory holding `vae/`, not `vae/` itself. Every test in the family
      # joins its own component onto this (`vae/`, `audio_vae/`, `FL2VA/audio_vae/`, `tokenizer/`,
      # `text_encoder/`), so pointing it one level in silently breaks all of them at once.
      MINIMAX_H3_SNAPSHOT: ${{ vars.MINIMAX_H3_SNAPSHOT }}
      # An OPERATOR-PROVISIONED file, not a snapshot: the `(latent, decoded)` pair
      # `crates/media/mlx-gen/tools/dump_minimax_h3_video_vae_real.py` writes by running the official
      # diffusers `AutoencoderKLMiniMaxH3` over the real `vae/`. ~840 KB, deliberately uncommitted
      # (real-weight bytes). Same class as `MAGE_ORACLE_SEED_DIR`: it exists on no Hub, this workflow
      # deliberately refuses to regenerate it in Actions (that would need a pinned torch+diffusers
      # environment, and none of the four approved wheel locks is one), and it cannot self-heal.
      MINIMAX_H3_VIDEO_VAE_REFERENCE: ${{ vars.MINIMAX_H3_VIDEO_VAE_REFERENCE }}
      # sc-19445 — the ENCODE half's equivalent: the `(pixels, posterior mean, posterior std)`
      # triples `crates/media/mlx-gen/tools/dump_minimax_h3_video_vae_encode_real.py` writes from
      # the same official class over the same `vae/`. ~5.7 MB. Same class, same provenance rule and
      # the same inability to self-heal as the decode reference above; it is a SECOND artifact
      # because the encode half is the half `load_decode_only` never selects, and it carried no
      # real-weight gate at all between sc-17148 and sc-19445.
      MINIMAX_H3_VIDEO_VAE_ENCODE_REFERENCE: ${{ vars.MINIMAX_H3_VIDEO_VAE_ENCODE_REFERENCE }}
      # sc-19438 — the ~226 KB `(input_ids, context)` pair
      # `crates/media/mlx-gen/tools/dump_minimax_h3_te_real.py` writes by running the OFFICIAL
      # conditioner (`Qwen3VLForConditionalGeneration`, `hidden_states[50]`, `add_special_tokens=False`
      # and no chat template) over the real `text_encoder/`.
      #
      # Produced against the DENSE published component, never against sc-19120's packed tier. The
      # packed tier is this repository's own repack, so a golden built from it would share the
      # repack's layout and could only prove the two agree with each other — layout.rs Rule 3, and
      # the exact mechanism by which sc-18740 shipped green.
      #
      # THE PACKED TIER IS THEREFORE NOT COVERED BY ANY WORKFLOW. The chain that would cover it
      # exists in source — `te_tier_real_weights.rs`'s `the_packed_context_tracks_the_dense_one`
      # pins packed against dense, and the gate at the end of this job pins dense against the
      # official conditioner — but the first link is executed by NO job in this file, so packed is
      # covered only when someone runs it by hand. Wiring it needs the `minimax-h3-mlx-*` tier rows
      # materialized on this runner, which this lane does not do.
      MINIMAX_H3_TE_REFERENCE: ${{ vars.MINIMAX_H3_TE_REFERENCE }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      #
      # THIS IS ALSO THE ANSWER FOR THE THREE OPERATOR ARTIFACTS, not just for the snapshot.
      # `rw-mage` is registered on BOTH `nax-macos` and `nax-macos-2`, whose homes are
      # `/Users/michael` and `/Users/MTrefry`, and `runs-on` label matching deliberately does not
      # say which box claims a job — so a baked absolute `/Users/michael/...` value reds whichever
      # box did not. Set each of the three artifact variables to a `~/`-relative value and place a
      # copy at that location on both boxes. The require steps below still see an absolute path,
      # because this step has already expanded it.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          MINIMAX_H3_SNAPSHOT MINIMAX_H3_VIDEO_VAE_REFERENCE
          MINIMAX_H3_VIDEO_VAE_ENCODE_REFERENCE MINIMAX_H3_TE_REFERENCE
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # An unset repo variable would otherwise reach `ensure_model_snapshot.py` as an empty path and
      # fail as a confusing "revision mismatch" rather than "you did not configure this lane".
      - name: Require the operator-provisioned snapshot path
        run: source scripts/ci/real-weights/mlx-minimax-h3/require-the-operator-provisioned-snapshot-path.sh
      # Both variables, matching `Resolve runner-local snapshot paths` exactly — a lane that resolves
      # a path the report omits is silently exempt from the only disk accounting either Mac gets
      # (`test_every_resolving_lane_reports_what_it_costs`). The reference file is ~840 KB rather than
      # a snapshot, so what its line is worth here is PRESENCE, not bytes: it is the one asset in this
      # lane that cannot self-heal, and the run log is the only place its absence is visible before
      # the last step fails on it.
      - name: Report runner disk headroom
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          MINIMAX_H3_SNAPSHOT MINIMAX_H3_VIDEO_VAE_REFERENCE
          MINIMAX_H3_VIDEO_VAE_ENCODE_REFERENCE MINIMAX_H3_TE_REFERENCE
      # Report-only, and it exists to RETIRE an unmeasured constant rather than leave it as a human
      # errand — the same job `Record the CUDA device inventory` does for the Windows lane below,
      # in the shape that step uses: a presence guard, `continue-on-error: true`, and no assertion
      # of any kind. The step above measures DISK; this one measures the other axis. `rw-mage` is on
      # both Macs, this lane's parity gate holds ~9.70 GiB at f32 (the all-F32 `vae/` component, no
      # doubling — see the header; ~20 GB was the pre-sc-19414 misreading), and the only host figure
      # this repository carries for `nax-macos-2` is a ~101 GiB number inferred from sampling in
      # `scripts/ci/s18_memory_preflight.py`. One run puts a real one in the log, for ~1 s.
      #
      # THE TWO NUMBERS ARE DIFFERENT QUANTITIES and neither is derivable from the other, so both
      # are printed and both are labelled. `hw.memsize` is physical RAM. Metal's
      # `recommendedMaxWorkingSetSize` is the per-device working-set budget the driver advertises,
      # and it is the one an MLX allocation is actually sized against — on `nax-macos` (Mac17,6)
      # they read 128.00 GiB and 107.52 GiB respectively, measured on the box 2026-08-13. Sizing a
      # Metal workload against the RAM figure overstates the budget by ~20 GiB on that box alone.
      #
      # `swift` because there is no sysctl for the Metal figure: it comes from `MTLDevice`, and
      # `system_profiler SPDisplaysDataType` (used by the SA3 lanes here) does not report it. A
      # runner without the toolchain prints the RAM half and says so rather than failing.
      - name: Record the macOS device inventory
        continue-on-error: true
        run: source scripts/ci/real-weights/mlx-minimax-h3/record-the-macos-device-inventory.sh
      # Fetches the 11.638 GB `download_files` slice of the 196 GB repository, never the whole thing;
      # see the `minimax-h3` row in release/real-weight-models.toml for the per-component breakdown
      # and for which two components are deliberately left out.
      - name: Materialize and verify immutable snapshot
        run: source scripts/ci/real-weights/mlx-minimax-h3/materialize-and-verify-immutable-snapshot.sh
      # sc-19438 — a SECOND key against the same repository, revision and directory, carrying the
      # twelve shards production's `TE_SHARDS` maps (58.568 GB of the 66.715 GB component; the
      # layer-50 tap itself only reaches into the first eleven). It is a separate row precisely so
      # the Windows CUDA lane, which materializes `minimax-h3` by key and reads none of this, does
      # not pay for it. See its note in release/real-weight-models.toml for why twelve rather than
      # fourteen, and for the test that panics if any of the twelve is missing.
      - name: Materialize and verify the text-encoder shards the layer-50 tap reads
        run: |
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py --model minimax-h3-text-encoder --snapshot "$MINIMAX_H3_SNAPSHOT"
      # Name-selected with `--exact` AFTER the `--` plus a run-count assertion, never `--ignored` as a
      # blanket. `--exact` before the `--` is REJECTED by cargo, which reports the rejection as exit 0;
      # and with the flag accepted but no count assertion a rename yields "0 passed; N filtered out"
      # and still exits 0, so the step would go green gating nothing. Both halves are required.
      #
      # These five read safetensors HEADERS and JSON only — no weight I/O, no Metal — which is why
      # they run on every invocation of this lane rather than behind a dispatch profile.
      - name: Run MiniMax-H3 header and config gates
        run: source scripts/ci/real-weights/mlx-minimax-h3/run-minimax-h3-header-and-config-gates.sh
      # The decodes. ~10 GB resident for the video VAE and ~0.6 GB for the audio one on MLX — well
      # under the f32 candle figures in the crate docs, because these load the checkpoint's own bf16
      # lazily. That is true of THESE THREE only: the parity gate below is f32 and is this lane's
      # memory peak, so this is not the step to size the runner against.
      - name: Run MiniMax-H3 VAE decode smokes
        run: source scripts/ci/real-weights/mlx-minimax-h3/run-minimax-h3-vae-decode-smokes.sh
      # sc-17151's tripwire, and the ONLY two of its arms this lane's bytes can run. A tripwire no
      # job pulls is a tripwire for whoever remembers to run it, so the story's "fails if any phase
      # regresses" acceptance needs a selection here and not only a `#[ignore]` string.
      #
      # WHY NOT THE te/dit ARMS. `staged_residency.rs`'s `a_bounded_slab_handoff_leaves_nothing_
      # behind` and `a_held_component_trips_both_handoff_gates` are cheap in MEMORY (60 tensors each)
      # and not in DISK: `Weights::from_dir` opens the whole component directory, and this row's
      # `download_files` is a deliberate 11.638 GB slice carrying NO `transformer/` shards and NO
      # `text_encoder/` shards (only the TE index). They would fail at `from_dir`, before reaching a
      # gate. Provisioning them is +124 GB on both Macs and is a separate decision.
      #
      # The two below drive the identical `phase()` helper and the identical predicates over the
      # components the slice DOES carry whole — `vae/` (10.42 GB) and `audio_vae/` (0.605 GB) — so
      # the clean arm is the regression gate and the control arm proves it can come back false.
      # ~11 GB resident, under the parity gate below. Every OTHER arm of `staged_residency.rs`,
      # `ref2va_checkpoint.rs` and `te_tier_generate_stages.rs` is OPERATOR-ONLY: it needs the full
      # 196 GB snapshot and runs only where someone has one.
      - name: Run MiniMax-H3 staged-residency tripwires
        run: source scripts/ci/real-weights/mlx-minimax-h3/run-minimax-h3-staged-residency-tripwires.sh
      # LAST, and deliberately so. This is the only gate in either backend that can catch a LAYOUT
      # error against real weights — the sc-18740 class, where an FFN gate/value half-swap shipped
      # green because every self-generated number simply re-derived whatever the port did. It needs an
      # artifact this workflow cannot produce, so an operator who has not placed that file yet gets a
      # red AFTER the other eight gates have already reported, rather than instead of them.
      #
      # Produce it on a box that holds the full snapshot, from a torch+diffusers environment:
      #   MINIMAX_H3_SNAPSHOT=<root> python3 crates/media/mlx-gen/tools/dump_minimax_h3_video_vae_real.py \
      #     --out ~/minimax-h3-real-vae-reference.safetensors
      # then set the repository variable to `~/minimax-h3-real-vae-reference.safetensors` (the leading
      # `~/` is resolved per-runner above). EVERY box carrying `rw-mage` needs its own copy, exactly
      # as this file's header says of the Mage oracle bundle.
      - name: Require the operator-provisioned diffusers VAE reference
        run: source scripts/ci/real-weights/mlx-minimax-h3/require-the-operator-provisioned-diffusers-vae-reference.sh
      # THIS LANE'S MEMORY PEAK, and the reason the job header carries a memory budget at all. The
      # test builds the VAE at `Dtype::Float32` (`tests/real_weights.rs`, the `f32 to keep the
      # comparison about layout rather than about bf16 rounding` line). **The checkpoint is ALREADY
      # F32** — 703 of 703 `vae/` tensors, measured from the published headers — so that is a no-op
      # cast holding ~9.70 GiB / 10.42 GB of parameters, not the ~19.4 GB this comment used to
      # claim; `vae/` was never bf16, and nothing here doubles. It is still this lane's peak,
      # because the two video smokes above DOWNCAST the same component to bf16 and so materialize
      # about half of it. Casting this one down too would be cheaper and would also delete the gate:
      # at bf16 the residual it compares against diffusers is dominated by rounding, not by layout.
      #
      # DECLARED, not measured on a runner: `Record the macOS device inventory` above is what puts a
      # real capacity for the box that claimed this job in the log, and `hw.memsize` and the Metal
      # working-set budget are reported there as the two separate numbers they are.
      - name: Run MiniMax-H3 video VAE parity against official diffusers
        run: source scripts/ci/real-weights/mlx-minimax-h3/run-minimax-h3-video-vae-parity-against-official-diffusers.sh
      # sc-19445 — the ENCODE half's layout gate, and the same fail-closed shape as the decode one
      # above for the same reason: it needs an artifact this workflow cannot produce, so it must be
      # possible to tell "the operator has not staged the file" from "the port is wrong".
      #
      #   MINIMAX_H3_SNAPSHOT=<root> python3 crates/media/mlx-gen/tools/dump_minimax_h3_video_vae_encode_real.py \
      #     --out ~/minimax-h3-real-vae-encode-reference.safetensors
      #
      # then set the repository variable to `~/minimax-h3-real-vae-encode-reference.safetensors`
      # and place a copy at that path on BOTH `rw-mage` boxes (see the resolve step's note).
      - name: Require the operator-provisioned diffusers VAE ENCODE reference
        run: source scripts/ci/real-weights/mlx-minimax-h3/require-the-operator-provisioned-diffusers-vae-encode-refere.sh
      # Loads the full 703-tensor `vae/` at f32 (~9.70 GiB — the component ships all-F32, so f32 is
      # a no-op cast) and encodes the three probes the reference carries. Gated on relative
      # max-abs-diff against a measured 1.789e-3 floor; the cosine and the two norms it prints
      # beside that are deliberately NOT asserted on.
      - name: Run MiniMax-H3 video VAE ENCODE parity against official diffusers
        run: source scripts/ci/real-weights/mlx-minimax-h3/run-minimax-h3-video-vae-encode-parity-against-official-diff.sh
      # sc-19438 — the conditioner gate. LAST, and it is this lane's true memory peak: ~52 GB
      # resident for layers 0-49 of the dense Qwen3-VL-32B text encoder, against the ~9.70 GiB of
      # the VAE steps above.
      #
      #   MINIMAX_H3_SNAPSHOT=<root> python3 crates/media/mlx-gen/tools/dump_minimax_h3_te_real.py \
      #     --out ~/minimax-h3-real-te-reference.safetensors
      #
      # Run that on its own: the conditioner is ~62 GB on the torch side and does NOT release
      # inside a process on MPS. The artifact itself is ~226 KB. Set the repository variable to
      # `~/minimax-h3-real-te-reference.safetensors` and place a copy on both `rw-mage` boxes.
      - name: Require the operator-provisioned conditioner reference
        run: source scripts/ci/real-weights/mlx-minimax-h3/require-the-operator-provisioned-conditioner-reference.sh
      # Its own `cargo test` process, which is the point: the 58.568 GB of text-encoder shards this
      # maps (shards 1-12 in full; the tap's own parameters are 50.316 GB of that) must not be
      # resident alongside anything else, and a per-step process is what guarantees the previous
      # step's VAE has been reaped.
      - name: Run MiniMax-H3 conditioner parity against the official text encoder
        run: source scripts/ci/real-weights/mlx-minimax-h3/run-minimax-h3-conditioner-parity-against-the-official-text.sh

  # sc-16981: this was ONE `Candle audio real weights` job running 30 real-weight invocations back
  # to back. The 2026-08-02 weekly (run 30741567385) was the first time it actually executed since
  # the snapshot-path fix, and it consumed GitHub's 360-minute default WITHOUT hanging — 17 of 30
  # invocations finished, all passing, and it was 21 s into #18 when the cap killed it. For six
  # hours it head-of-line-blocked the single self-hosted Metal runner, and with it every other
  # macOS real-weights job plus the app repo's `nax-worker` PR lane, which shares this machine
  # (SceneWorks/SceneWorks and SceneWorks/inference compete for one `nax-macos` since the
  # 2026-07-25 org promotion).
  #
  # Split per provider family, matching how the Stable Audio 3 lane is already split: the runner is
  # released between families so queued PR work can interleave, a failure isolates to one family
  # instead of taking every result behind it, each family carries a budget sized to its own cost,
  # and each is separately dispatchable. Every job also materializes ONLY the snapshots its own
  # tests read (derived from the `env::var` calls in each crate's tests/).
  #
  # Measured wall times from run 30741567385, per family — DEBUG PROFILE, and therefore SUPERSEDED
  # as a sizing basis: since sc-17004 every invocation below runs `--release`.
  #   kokoro 3.0m · moss-sfx 233.8m · acestep 79.9m · voice 2.7m · chatterbox ~40m (8 of 11 done)
  # `asr` and `moss-tts` never got to run before the 360-minute cancel, so their budgets were
  # provisional even in debug. Budgets are ~1.5-2x those debug numbers, except moss-sfx.
  #
  # The budgets below are deliberately UNCHANGED by sc-17004 and are now loose by an unknown factor
  # rather than a measured one. Only two families have been measured in release, both on nax-macos
  # itself: `kokoro` (3 invocations, ~42 s of tests, plus a 2m13s cold optimized build of its crate
  # tree — versus 2m38s cold for the debug build, so switching profile costs no extra build time
  # because `[profile.dev.package."*"]` already compiled every registry dependency optimized) and
  # `asr` (all 4 invocations, ~24 s, including the greedy-argmax `..._within_cer` gate, which is the
  # one place a numerically-shifted logit could have flipped a discrete decision — it did not).
  # The other five families have NOT been run in release. Re-sizing all seven from the first weekly
  # run that executes this lane is sc-17057; a smaller number guessed here is exactly the sc-16981
  # defect. Note that these figures also carried a full cold build: `actions/checkout` defaults to
  # `clean: true`, so `target/` did not survive between jobs and every job rebuilt the candle tree
  # from nothing, in either profile. The workflow-level `CARGO_TARGET_DIR` above ends that, so the
  # budgets here are loose by one cold build on top of the debug-vs-release margin already noted.
  candle-audio-kokoro:
    name: Candle audio real weights (Kokoro TTS)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'audio-kokoro'
    runs-on: [self-hosted, macOS, ARM64, rw-audio]
    timeout-minutes: 30
    env:
      KOKORO_SNAPSHOT: ${{ vars.KOKORO_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          KOKORO_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          KOKORO_SNAPSHOT
      - name: Materialize and verify immutable snapshots
        run: source scripts/ci/real-weights/candle-audio-kokoro/materialize-and-verify-immutable-snapshots.sh
      - name: Run provider conformance
        run: |
          cargo test --locked --release -p candle-audio-kokoro --test conformance kokoro_conformance -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-kokoro --test conformance kokoro_wav_conformance -- --ignored --nocapture
      # Regression fixture (sc-12854): the validation harness's committed metric envelope +
      # PCM repeatability hash; this runner IS the fixture's canonical platform
      # (macos/aarch64), so the exact-hash check gates here. Since sc-17004 the fixture commits one
      # hash per opt-level and the test asserts the one matching its build, so the `--release`
      # below gates against `pcm_sha256_opt3` — the gate did not go quiet when the profile changed.
      # `metal` stays off (CPU-first, docs/architecture/audio-backend-strategy.md), which is what
      # keeps the exact-hash check live at all: on a GPU build it degrades to envelope-only.
      - name: Run regression fixture
        run: cargo test --locked --release -p candle-audio-kokoro --test regression kokoro_regression_fixture -- --ignored --nocapture

  # The outlier, and the reason the 2026-08-02 run never finished: these two invocations alone cost
  # 233.8 min of the 360 (moss_sfx_conformance 57.4m, moss_sfx_wav_conformance 176.4m) — despite
  # the conformance profile requesting only 2 solver steps, because the gen-core suite loads the
  # ~11 GB model and re-generates several times per section.
  #
  # sc-17004 unblocked `--release` for this whole lane (every invocation above and below now carries
  # it). The blocker was that `kokoro_82m_regression.json` pinned ONE PCM hash whose gate keyed on
  # `cpu_build && macos && aarch64` and ignored build profile; the hash does move with opt-level, so
  # the fixture now commits one per opt-level instead of the gate silently changing meaning.
  #
  # The budget below is UNCHANGED and still deliberately generous. Kokoro measured ~3x on its test
  # body on this runner, but that multiplier is unlikely to carry here: Kokoro's win is in this
  # workspace's OWN crates, whereas this lane's cost is ~11 GB of model loading plus candle ops that
  # were ALREADY opt-level 3 in both profiles via `[profile.dev.package."*"]` (which covers registry
  # dependencies, not workspace members). This family has never been run in release at all.
  # Re-tightening every audio budget on the first release-mode weekly run is sc-17057; guessing a
  # smaller number here is precisely the sc-16981 mistake (a 120-min cap that would have failed a
  # slow-but-passing job every week).
  candle-audio-moss-sfx:
    name: Candle audio real weights (MOSS SoundEffect)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'audio-moss-sfx'
    runs-on: [self-hosted, macOS, ARM64, rw-audio]
    timeout-minutes: 300
    env:
      MOSS_SFX_SNAPSHOT: ${{ vars.MOSS_SFX_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          MOSS_SFX_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          MOSS_SFX_SNAPSHOT
      - name: Materialize and verify immutable snapshots
        run: source scripts/ci/real-weights/candle-audio-moss-sfx/materialize-and-verify-immutable-snapshots.sh
      - name: Run provider conformance
        run: |
          cargo test --locked --release -p candle-audio-moss-sfx --test conformance moss_sfx_conformance -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-moss-sfx --test conformance moss_sfx_wav_conformance -- --ignored --nocapture

