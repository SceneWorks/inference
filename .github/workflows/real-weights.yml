  sa3-small-music-metal:
    name: Stable Audio 3 small-music provider (Metal)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'sa3-small-music'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      SA3_TEST_METAL: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Configure immutable small-music snapshot path
        run: echo "SA3_SMALL_MUSIC_SNAPSHOT=$RUNNER_TEMP/sa3-small-music/0fef1392cd842149a2b6d445e181c97608faac06" >> "$GITHUB_ENV"
      - name: Toolchain and hardware versions
        run: |
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType |
            grep -E 'Model Name|Model Identifier|Chip|Total Number of Cores|Memory|Chipset Model|Metal Support'
          rustc --version
          cargo --version
      - name: Materialize and verify immutable small-music snapshot
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-music --snapshot "$SA3_SMALL_MUSIC_SNAPSHOT"
      - name: Run registered provider conformance and concurrent RNG isolation on Metal
        run: |
          # Named tests: the shared `conformance` binary also carries the sc-14544 small-sfx cases,
          # which need their own snapshot and run in the sa3-small-sfx job.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test conformance registered_provider_passes_full_audio_conformance -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test conformance concurrent_requests_are_deterministic_and_do_not_share_rng_state -- --ignored --nocapture
      - name: Match the frozen-torch provider oracle end to end (CPU-pinned, does not certify Metal)
        run: |
          # sc-14543's end-to-end parity oracle against the vendored
          # `docs/migration/sa3-small-music-provider-reference` artifact. It ran in no lane until
          # sc-14545, which is how its `from_layout` call site could be re-pointed from a bare
          # `HUB_REPO` string to `Variant::SmallMusic.geometry()` with nothing but a compile check
          # behind it. `validate_layout` rejects a wrong variant before a tensor is read, so this is
          # the executable proof that the rename kept the checkpoint binding. Deterministic
          # (`Device::Cpu`, portable LCG noise, fixed seed) and measured at 20.6 s on an M-series
          # Mac against this exact pinned snapshot.
          #
          # This job sets `SA3_TEST_METAL`, but this step deliberately ignores it and every other
          # `SA3_TEST_*` selector: its bounds are exact-reproduction-grade against a frozen Torch
          # CPU-f32 artifact and are calibrated on CPU, so this step certifies frozen-Torch parity
          # and **not** the Metal backend. The reasoning is on the test itself
          # (`tests/provider_oracle.rs`). Metal small-music coverage comes from this job's
          # conformance, stereo-width and render steps, which resolve their device through
          # `candle_audio::default_device()`. This is why there is no CUDA counterpart.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test provider_oracle -- --ignored --nocapture
      - name: Re-calibrate the music stereo-width floor across prompts and seeds
        run: |
          # sc-14544 added a per-window-median side-ratio assertion to the shared `assert_real_audio`
          # helper, which the render step below enforces on this variant too. This sweep is the
          # measurement behind it, at the render's own 30 s / 8 steps.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test provider music_stereo_width_floor_is_calibrated_across_prompts_and_seeds \
            -- --ignored --nocapture
      - name: Render a real 30-second eight-step Metal WAV
        run: |
          SA3_TEST_DURATION=30 SA3_TEST_STEPS=8 \
          SA3_SMALL_MUSIC_WAV_OUT="$RUNNER_TEMP/sa3-small-music-metal.wav" \
            cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
              --test provider connected_short_generation_is_stereo_finite_and_exact_length \
              -- --ignored --nocapture
          shasum -a 256 "$RUNNER_TEMP/sa3-small-music-metal.wav"

  sa3-small-sfx-metal:
    name: Stable Audio 3 small-sfx provider (Metal)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'sa3-small-sfx'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      SA3_TEST_METAL: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Configure immutable small-sfx and small-music snapshot paths
        run: |
          # sc-14544's identity and divergence gates compare the two checkpoints against each other,
          # so both snapshots are required on this runner.
          echo "SA3_SMALL_SFX_SNAPSHOT=$RUNNER_TEMP/sa3-small-sfx/ae12755283df9d62ca39a9b050a39a0b607b8c20" >> "$GITHUB_ENV"
          echo "SA3_SMALL_MUSIC_SNAPSHOT=$RUNNER_TEMP/sa3-small-music/0fef1392cd842149a2b6d445e181c97608faac06" >> "$GITHUB_ENV"
      - name: Toolchain and hardware versions
        run: |
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType |
            grep -E 'Model Name|Model Identifier|Chip|Total Number of Cores|Memory|Chipset Model|Metal Support'
          rustc --version
          cargo --version
      - name: Materialize and verify both immutable small snapshots
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-sfx --snapshot "$SA3_SMALL_SFX_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-music --snapshot "$SA3_SMALL_MUSIC_SNAPSHOT"
      # sc-14546 moved `--test variant_binding` to the `sa3-base-identity-metal` job. Every gate in
      # that target now needs all six pinned snapshots — `every_post_trained_base_pair_...` and
      # `sibling_root_weights_under_the_other_config_...` compare each post-trained checkpoint
      # against its `-base` sibling in both directions — and this job provisions two. Running the
      # target here would fail on a missing snapshot rather than skip, which is the correct failure
      # but the wrong job.
      - name: Prove music and SFX actually diverge
        run: |
          # sc-14546: both cases in this target now run on the lane's device. The runtime half
          # always did (it goes through `provider_registry().load(…)` ->
          # `candle_audio::default_device()`); the single-step DiT half hardcoded `Device::Cpu` and
          # now honours the shared `SA3_TEST_METAL`/`SA3_TEST_CUDA` selector. Its ±0.02 absolute
          # cosine band sits far above accelerator reduced-precision noise, so nothing in it was
          # CPU-calibrated.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test variant_divergence -- --ignored --nocapture
      - name: Run registered SFX provider conformance and concurrent RNG isolation on Metal
        run: |
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test conformance registered_sfx_provider_passes_full_audio_conformance -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test conformance concurrent_sfx_requests_are_deterministic_and_do_not_share_rng_state -- --ignored --nocapture
      - name: Re-calibrate the SFX stereo-width floor across prompts and seeds
        run: |
          # The floor the render step below enforces is derived from this 25-sample sweep, so the
          # calibration is re-checked rather than trusted. The sweep's own defaults are 30 s /
          # 8 steps — the same duration and step count the render enforces at — so calibration and
          # enforcement cannot drift apart. The CUDA job runs the identical sweep before its own
          # render for the same reason: a floor measured on one backend and enforced on another is
          # not a calibrated gate.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test provider sfx_stereo_width_floor_is_calibrated_across_prompts_and_seeds \
            -- --ignored --nocapture
      - name: Render a real 30-second eight-step SFX Metal WAV
        run: |
          SA3_TEST_DURATION=30 SA3_TEST_STEPS=8 \
          SA3_SMALL_SFX_WAV_OUT="$RUNNER_TEMP/sa3-small-sfx-metal.wav" \
            cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
              --test provider connected_sfx_generation_is_stereo_finite_and_exact_length \
              -- --ignored --nocapture
          shasum -a 256 "$RUNNER_TEMP/sa3-small-sfx-metal.wav"

  sa3-medium-metal:
    name: Stable Audio 3 medium provider (Metal)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'sa3-medium'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      SA3_TEST_METAL: "1"
      # No SA3_REQUIRE_ALL_SNAPSHOTS here: `variant_binding` is the only target that reads it, and
      # sc-14546 moved that target to `sa3-base-identity-metal`, the one job with all six snapshots.
      # The embedded-SAME-L oracle case. `same-l-metal` pins `standalone`, so before sc-14545 the
      # embedded branch of `same_l_short_standalone_and_embedded_match_every_band_layer` and
      # `same_l_long_durations_match_compact_band_boundaries` had never executed in CI despite both
      # tests reading SA3_MEDIUM_SNAPSHOT. Medium is the only registered provider that decodes
      # through SAME-L, so this is where that case belongs.
      SA3_SAME_L_CASE: embedded
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Configure immutable medium, medium-base and small snapshot paths
        run: |
          # The cross-variant mutation gates compare medium against both smalls and against its own
          # base sibling, and the two-domain comparison renders medium beside each specialist, so
          # every snapshot they read has to be on this runner.
          echo "SA3_MEDIUM_SNAPSHOT=$RUNNER_TEMP/sa3-medium/27b5a21b791b1b033d193a9e1e3ce78493f102f9" >> "$GITHUB_ENV"
          echo "SA3_MEDIUM_BASE_SNAPSHOT=$RUNNER_TEMP/sa3-medium-base/b32993f73c3bdc3864043a72d8032606bba737c8" >> "$GITHUB_ENV"
          echo "SA3_SMALL_MUSIC_SNAPSHOT=$RUNNER_TEMP/sa3-small-music/0fef1392cd842149a2b6d445e181c97608faac06" >> "$GITHUB_ENV"
          echo "SA3_SMALL_SFX_SNAPSHOT=$RUNNER_TEMP/sa3-small-sfx/ae12755283df9d62ca39a9b050a39a0b607b8c20" >> "$GITHUB_ENV"
          echo "SA3_SAME_L_SNAPSHOT=$RUNNER_TEMP/sa3-same-l/41acf79dd242877d6499a1108ca5dba5d5eecfc5" >> "$GITHUB_ENV"
      - name: Toolchain and hardware versions
        run: |
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType |
            grep -E 'Model Name|Model Identifier|Chip|Total Number of Cores|Memory|Chipset Model|Metal Support'
          rustc --version
          cargo --version
      - name: Run the crate unit tests against real Metal
        # Weight-free, seconds long, and the only lane where the device-dependent unit tests execute
        # on an accelerator: `zero_element_tensors_load_on_the_target_device` is a no-op on the CPU
        # lane but is the regression gate for the zero-byte `noise_scaling_factor` buffer that broke
        # the embedded SAME-L case below. Runs before the 10.4 GB downloads so it fails fast.
        run: cargo test --locked --release -p candle-audio-stable-audio-3 --features metal --lib
      - name: Materialize and verify the immutable snapshots
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model stable-audio-3-medium --snapshot "$SA3_MEDIUM_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model stable-audio-3-medium-base --snapshot "$SA3_MEDIUM_BASE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-music --snapshot "$SA3_SMALL_MUSIC_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-sfx --snapshot "$SA3_SMALL_SFX_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model same-l --snapshot "$SA3_SAME_L_SNAPSHOT"
      - name: Verify the embedded SAME-L band boundaries on Metal
        run: |
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            same_l_short_standalone_and_embedded_match_every_band_layer -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            same_l_long_durations_match_compact_band_boundaries -- --ignored --nocapture
      # sc-14546 moved `--test variant_binding` to `sa3-base-identity-metal`, which provisions all
      # six pinned snapshots. This job carries five.
      - name: Run registered medium conformance and concurrent RNG isolation on Metal
        run: |
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test conformance registered_medium_provider_passes_full_audio_conformance -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test conformance concurrent_medium_requests_are_deterministic_and_do_not_share_rng_state -- --ignored --nocapture
      - name: Re-calibrate the medium stereo-width floor across both domains
        run: |
          # Medium's floor is derived from a 25-sample sweep that deliberately mixes music and SFX
          # prompts, because medium is the only SA3 checkpoint registered for both. The sweep's
          # defaults are the render's own 30 s / 8 steps.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test provider medium_stereo_width_floor_is_calibrated_across_prompts_and_seeds \
            -- --ignored --nocapture
      - name: Run registered medium-base conformance and its calibrated render on Metal
        run: |
          # sc-14546. This job already provisions `stable-audio-3-medium-base` for the identity
          # gates, so the registered `stable_audio_3_medium_base` provider is validated here rather
          # than in a job that would have to download the same 10.4 GB again.
          #
          # The render deliberately omits `steps`, `sampler` and `guidance` so the provider resolves
          # this variant's own operating point — Euler / 50 / 7.0 — which is ~12.5x the example-work
          # of the post-trained 8-step Pingpong default at the same duration. The sweep behind the
          # enforced side-ratio floor runs at the render's own 10 s, so calibration and enforcement
          # cannot drift apart.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test conformance registered_medium_base_provider_passes_full_audio_conformance -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test conformance concurrent_medium_base_requests_are_deterministic_and_do_not_share_rng_state -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test provider medium_base_stereo_width_floor_is_calibrated_across_prompts_and_seeds \
            -- --ignored --nocapture
          SA3_MEDIUM_BASE_WAV_OUT="$RUNNER_TEMP/sa3-medium-base-metal.wav" \
            cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
              --test provider connected_medium_base_generation_at_its_own_defaults_is_stereo_finite_and_exact_length \
              -- --ignored --nocapture
          shasum -a 256 "$RUNNER_TEMP/sa3-medium-base-metal.wav"
      - name: Prove medium serves both domains and diverges from each specialist
        run: |
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test variant_quality -- --ignored --nocapture
      - name: Measure the F16-vs-F32 compute policy on real weights
        run: |
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test dtype_policy -- --ignored --nocapture
      - name: Measure the long-form 120 s, 300 s and 380 s renders with peak memory
        run: |
          # The 380 s published cap is included: it is the only configuration that exercises the
          # full 4,096-latent adapted geometry and the 43-chunk SAME-L decode plan, which is the
          # entire reason this variant is registered separately from the smalls.
          #
          # `/usr/bin/time -l` reports `ru_maxrss` over the timed process *and its whole reaped
          # child tree*, so timing `cargo test` conflates the release build — rustc and the linker
          # peak in the multi-GB range on their own — with the render. Build first with `--no-run`,
          # resolve the target's own executable from the JSON artifact stream, then time only that
          # binary. The reported peak is then the render's, and nothing else's.
          cargo test --locked --release --no-run -p candle-audio-stable-audio-3 --features metal \
            --test provider
          binary="$(
            cargo test --locked --release --no-run --message-format=json \
              -p candle-audio-stable-audio-3 --features metal --test provider |
              python3 -c "import json, sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m.get('target', {}).get('name') == 'provider'][-1])"
          )"
          test -x "$binary" || { echo "could not resolve the provider test binary"; exit 1; }
          echo "timing $binary"
          SA3_MEDIUM_LONG_SECONDS=120,300,380 \
          SA3_MEDIUM_LONG_WAV_DIR="$RUNNER_TEMP" \
            /usr/bin/time -l "$binary" medium_long_form_renders_are_exact_and_timed \
              --exact --ignored --nocapture
          for seconds in 120 300 380; do
            shasum -a 256 "$RUNNER_TEMP/sa3-medium-${seconds}s.wav"
          done
      - name: Render a real 30-second eight-step medium Metal WAV
        run: |
          SA3_TEST_DURATION=30 SA3_TEST_STEPS=8 \
          SA3_MEDIUM_WAV_OUT="$RUNNER_TEMP/sa3-medium-metal.wav" \
            cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
              --test provider connected_medium_generation_is_stereo_finite_and_exact_length \
              -- --ignored --nocapture
          shasum -a 256 "$RUNNER_TEMP/sa3-medium-metal.wav"

  sa3-base-identity-metal:
    name: Stable Audio 3 base/post-trained identity matrix (Metal)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'sa3-base-identity'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      SA3_TEST_METAL: "1"
      # Every skip branch in `variant_binding` becomes a failure. That matters more here than
      # anywhere: this job exists precisely to be the one place all six snapshots are present, so a
      # silently skipped gate here is a gate that runs nowhere at all.
      SA3_REQUIRE_ALL_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Configure all six immutable Stable Audio 3 snapshot paths
        run: |
          # sc-14546 made `variant_binding` a six-way matrix: each post-trained checkpoint against
          # its `-base` sibling in both directions, plus the two small bases against each other and
          # against medium-base. Every one of those needs both sides materialized, so this job owns
          # the full set and the per-variant jobs no longer run the target.
          echo "SA3_SMALL_MUSIC_SNAPSHOT=$RUNNER_TEMP/sa3-small-music/0fef1392cd842149a2b6d445e181c97608faac06" >> "$GITHUB_ENV"
          echo "SA3_SMALL_SFX_SNAPSHOT=$RUNNER_TEMP/sa3-small-sfx/ae12755283df9d62ca39a9b050a39a0b607b8c20" >> "$GITHUB_ENV"
          echo "SA3_MEDIUM_SNAPSHOT=$RUNNER_TEMP/sa3-medium/27b5a21b791b1b033d193a9e1e3ce78493f102f9" >> "$GITHUB_ENV"
          echo "SA3_SMALL_MUSIC_BASE_SNAPSHOT=$RUNNER_TEMP/sa3-small-music-base/eab5ceee5ad9c1ed38800aff30a8e49d1161c539" >> "$GITHUB_ENV"
          echo "SA3_SMALL_SFX_BASE_SNAPSHOT=$RUNNER_TEMP/sa3-small-sfx-base/cc5ddb990e30daa68336ac61c140c37c7033ab7c" >> "$GITHUB_ENV"
          echo "SA3_MEDIUM_BASE_SNAPSHOT=$RUNNER_TEMP/sa3-medium-base/b32993f73c3bdc3864043a72d8032606bba737c8" >> "$GITHUB_ENV"
          echo "SA3_SAME_L_SNAPSHOT=$RUNNER_TEMP/sa3-same-l/41acf79dd242877d6499a1108ca5dba5d5eecfc5" >> "$GITHUB_ENV"
      - name: Toolchain and hardware versions
        run: |
          sw_vers
          rustc --version
          cargo --version
      - name: Materialize and verify all six immutable snapshots
        run: |
          # The three `-base` entries carry `download_files` allow-lists, so `svd_bases.pt` — 1.27 GB
          # per small base and 3.84 GB for medium-base, 6.4 GB in total, and unreachable from
          # `SnapshotLayout::from_dir` — is not fetched.
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          for model in stable-audio-3-small-music stable-audio-3-small-sfx stable-audio-3-medium \
                       stable-audio-3-small-music-base stable-audio-3-small-sfx-base \
                       stable-audio-3-medium-base same-l; do
            case "$model" in
              stable-audio-3-small-music) path="$SA3_SMALL_MUSIC_SNAPSHOT" ;;
              stable-audio-3-small-sfx) path="$SA3_SMALL_SFX_SNAPSHOT" ;;
              stable-audio-3-medium) path="$SA3_MEDIUM_SNAPSHOT" ;;
              stable-audio-3-small-music-base) path="$SA3_SMALL_MUSIC_BASE_SNAPSHOT" ;;
              stable-audio-3-small-sfx-base) path="$SA3_SMALL_SFX_BASE_SNAPSHOT" ;;
              stable-audio-3-medium-base) path="$SA3_MEDIUM_BASE_SNAPSHOT" ;;
              same-l) path="$SA3_SAME_L_SNAPSHOT" ;;
            esac
            PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model "$model" --snapshot "$path"
          done
      - name: Reject every cross-variant weight path (full mutation matrix)
        run: |
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test variant_binding -- --ignored --nocapture
      - name: Match the frozen-Torch sampler oracles on all six checkpoints
        run: |
          # Both cases ran in **no** lane before sc-14546. `all_six_real_p0_pingpong_trajectories`
          # needs every snapshot, and `real_sampler_cfg_apg_scale_phi` is the hard fixed-guidance
          # parity gate this story's own CFG acceptance rests on — it replays vanilla CFG, APG and
          # blended+rescaled guidance at `cfg_scale = 2.5` against
          # `docs/migration/sa3-sampler-reference/guidance.safetensors` on `small-music` **and**
          # `small-music-base`.
          #
          # Named rather than `--test sampler_oracle -- --ignored`: the third ignored case in that
          # target, `real_default_sampler_resource_probe`, is an operator probe that requires
          # SA3_RESOURCE_SNAPSHOT / SA3_RESOURCE_P0 / SA3_RESOURCE_SECONDS and fails without them.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test sampler_oracle all_six_real_p0_pingpong_trajectories_match_stepwise -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test sampler_oracle real_sampler_cfg_apg_scale_phi_matches_frozen_upstream -- --ignored --nocapture
      - name: Prove real CFG and the negative prompt on a base checkpoint
        run: |
          # The divergence floor is not a chosen tolerance: the test measures this implementation's
          # own largest per-element disagreement with the frozen-Torch guidance oracle on this exact
          # checkpoint, device and dtype, and then requires the negative-prompt divergence to exceed
          # it. It also asserts the honest control — at `cfg_scale = 1.0` the negative prompt must be
          # a bit-for-bit no-op, because that is the one value at which the DiT skips the negative
          # branch entirely. Also pins the shipped 50/7.0 defaults against each snapshot's own
          # `training.demo` block.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test base_guidance -- --ignored --nocapture
      - name: Certify the explicit-negative conditioning path itself
        run: |
          # `base_guidance`'s divergence assertion proves the negative prompt reaches the model; it
          # cannot prove the batch-2 path is wired *correctly*, because a swapped-halves or masked-
          # wrong negative branch diverges from the no-negative render just as loudly. Two gates
          # close that, and neither ran in any lane before sc-14546:
          #
          #   * `real_weights_detect_conditioning_mutations_and_exercise_cfg_apg` (dit_oracle) is
          #     the only case that separates absent negative conditioning — which zeroes the whole
          #     cross context — from an explicit all-invalid negative prompt, which keeps its
          #     conditioned duration row. It is a pure self-comparison, so it runs on this backend.
          #   * `the_guided_latents_are_exactly_the_cfg_recomposition_of_their_own_two_branches`
          #     (base_guidance, above) pins the guided latents to `L(N) + g*(L(P) - L(N))` and
          #     rejects three named mis-wirings of the same two branches.
          #
          # Named rather than `--test dit_oracle -- --ignored`: the other ignored cases in that
          # target need all six snapshots on CPU (multi-gigabyte) or an explicit SA3_DIT_CASE_ENV /
          # SA3_DIT_RESOURCE_LENGTH selection. Wiring the rest of `dit_oracle` is sc-15235.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test dit_oracle real_weights_detect_conditioning_mutations_and_exercise_cfg_apg \
            -- --ignored --nocapture
      - name: Prove the audio-to-audio restyle path on all six checkpoints
        run: |
          # sc-14547. This job is the only lane that provisions all six snapshots, and the story's
          # acceptance is explicitly "every registered variant", so the target lands here rather
          # than on a per-variant job.
          #
          # Both ignored cases in the target run, and both are wanted:
          #
          #   * `real_reference_restyle_is_bounded_and_ordered_on_all_six_variants` asserts *both*
          #     bounds the story requires — measurable retained structure at full retention and a
          #     divergence floor at zero retention — and, in the same sweep, the strength
          #     *direction* through the full graph. The weight-free sign gate named in `ci.yml`
          #     proves the mapping; this proves the mapping is the one the model responds to.
          #   * `real_initial_sampler_noise_precedes_the_source_encode` is the only observation that
          #     separates "initial noise first, then the source encode" from the reverse. Encoding
          #     first would move every later draw, so the same seed would sound different merely for
          #     having a clip attached.
          #
          # `--nocapture` keeps the measured per-variant correlations in the log, so the floors are
          # auditable from the run rather than only from the source.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test reference_audio -- --ignored --nocapture
      - name: Prove inpaint, repaint and extend on all six checkpoints
        run: |
          # sc-14548. Same reasoning as the restyle step above: this job and its CUDA twin are the
          # only lanes provisioning all six snapshots, and the story's acceptance is every
          # registered variant.
          #
          # All four ignored cases in the target run, and each covers something the others cannot:
          #
          #   * `real_inpaint_preserves_the_outside_exactly_and_changes_the_inside` asserts BOTH
          #     halves. Preservation alone is satisfied by a no-op, so the interior divergence is
          #     measured in the same pass, against the source's own energy rather than an absolute.
          #     Outside the region the assertion is exact equality, not a bound — that span is
          #     written by `stitch_outside_region` from a buffer the test prepares itself, so a
          #     tolerance would pass a stitch that had slipped a frame.
          #   * `real_repaint_is_byte_identical_to_inpaint` pins the alias. gen-core documents the
          #     two modes as different (that text is written against ACE-Step); Stable Audio 3 has
          #     one inpaint mechanism, so any divergence is a bug.
          #   * `real_extend_keeps_the_source_prefix_and_bridges_the_seam` is the story's pinned
          #     10 s -> 18 s case: exact 441_000-frame prefix, a non-silent tail, and a seam step
          #     bounded by the material's own 99.9th-percentile step rather than by a chosen number.
          #   * `real_edit_initial_sampler_noise_precedes_the_source_encode` pins the draw order.
          #     Only `medium` / `medium_base` can falsify it — SAME-S consumes zero draws on encode
          #     — which is why it runs all six and separately requires at least one drawing encode.
          #
          # These four are also the ONLY lane for three weights-only edit sites the PR lane cannot
          # reach: the stitch invocation, the local-conditioning handoff into `sample`, and the
          # `conditioning_is_forwarded` call in `generate`. See
          # `docs/migration/SC_14548_AUDIO_EDIT_INPAINT.md`.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test audio_edit -- --ignored --nocapture
      - name: Prove the load-time adapter fold on all six checkpoints
        run: |
          # sc-14550. This job and its CUDA twin are the only lanes provisioning all six snapshots.
          #
          # ⚠ These cases do NOT validate a real adapter artifact. **None exists** — there is no
          # Stable Audio 3 adapter of any type in any cache, and no published community one
          # (sc-15347). Every adapter here is synthesized by the test against the real checkpoint's
          # own safetensors header, in the format `src/adapters.rs` declares. What they prove is
          # that the resolved plan reaches the real backend — including Metal's packed-buffer
          # `SimpleBackend`, which is a different object from CPU/CUDA's mmap and is exercised in no
          # other lane — and that the fold changes the rendered audio.
          #
          # The gates are the two exactly-signed ones, never a threshold:
          #   * a `scale == 0.0` request renders **byte-identical** audio to a request with no
          #     adapters at all. Exactly zero difference; a fold that ran at all breaks it.
          #   * two adapters differing only in their factor values render **different** audio.
          # "Adapted differs from un-adapted" appears only as a liveness check, because a
          # *misapplied* adapter differs too — that is sc-14548's wrong-sign lesson applied up front.
          #
          # `real_lora_xs_folds_through_the_host_svd` is deliberately scoped to the conditioner's
          # single [768, 256] Linear. Candle has no `linalg.svd`, so the `-xs` family computes one on
          # the host in f64 (never on the accelerator, which is what makes it cross-platform
          # deterministic by construction). Measured: ~1.9 s for [768, 256], ~113 s for
          # [1024, 1024]. Covering the DiT's attention stack would be a multi-hour cold start; the
          # math is identical at either scale and only the wall clock is not.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test adapters -- --ignored --nocapture

  sa3-small-base-metal:
    name: Stable Audio 3 small base providers (Metal)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'sa3-small-base'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      SA3_TEST_METAL: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Configure both immutable small-base snapshot paths
        run: |
          echo "SA3_SMALL_MUSIC_BASE_SNAPSHOT=$RUNNER_TEMP/sa3-small-music-base/eab5ceee5ad9c1ed38800aff30a8e49d1161c539" >> "$GITHUB_ENV"
          echo "SA3_SMALL_SFX_BASE_SNAPSHOT=$RUNNER_TEMP/sa3-small-sfx-base/cc5ddb990e30daa68336ac61c140c37c7033ab7c" >> "$GITHUB_ENV"
      - name: Toolchain and hardware versions
        run: |
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType |
            grep -E 'Model Name|Model Identifier|Chip|Total Number of Cores|Memory|Chipset Model|Metal Support'
          rustc --version
          cargo --version
      - name: Materialize and verify both immutable small-base snapshots
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-music-base --snapshot "$SA3_SMALL_MUSIC_BASE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-sfx-base --snapshot "$SA3_SMALL_SFX_BASE_SNAPSHOT"
      - name: Run registered base provider conformance and concurrent RNG isolation on Metal
        run: |
          for test in registered_music_base_provider_passes_full_audio_conformance \
                      concurrent_music_base_requests_are_deterministic_and_do_not_share_rng_state \
                      registered_sfx_base_provider_passes_full_audio_conformance \
                      concurrent_sfx_base_requests_are_deterministic_and_do_not_share_rng_state; do
            cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
              --test conformance "$test" -- --ignored --nocapture
          done
      - name: Re-calibrate both base stereo-width floors at the variant defaults
        run: |
          # The sweeps render at the variant's own resolved operating point — Euler / 50 / 7.0 — and
          # at the same 10 s the render steps below enforce at, so calibration and enforcement cannot
          # drift apart. `small-sfx-base` deliberately sweeps the *post-trained* SFX prompt list:
          # its own shipped `demo_cond` is the music-base list, copy-pasted, and calibrating a Foley
          # checkpoint on "Amen break 174 BPM" would measure the wrong distribution.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test provider music_base_stereo_width_floor_is_calibrated_across_prompts_and_seeds \
            -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
            --test provider sfx_base_stereo_width_floor_is_calibrated_across_prompts_and_seeds \
            -- --ignored --nocapture
      - name: Render both base WAVs at the variants' own defaults
        run: |
          # No `SA3_TEST_STEPS` and no sampler: the request omits `steps`, `sampler` and `guidance`
          # so the provider resolves them, and the test asserts the resolved step count against the
          # progress callbacks and proves the resolved sampler is Euler by rendering the same seed
          # under both solvers.
          SA3_SMALL_MUSIC_BASE_WAV_OUT="$RUNNER_TEMP/sa3-small-music-base-metal.wav" \
            cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
              --test provider connected_music_base_generation_at_its_own_defaults_is_stereo_finite_and_exact_length \
              -- --ignored --nocapture
          SA3_SMALL_SFX_BASE_WAV_OUT="$RUNNER_TEMP/sa3-small-sfx-base-metal.wav" \
            cargo test --locked --release -p candle-audio-stable-audio-3 --features metal \
              --test provider connected_sfx_base_generation_at_its_own_defaults_is_stereo_finite_and_exact_length \
              -- --ignored --nocapture
          shasum -a 256 "$RUNNER_TEMP/sa3-small-music-base-metal.wav" "$RUNNER_TEMP/sa3-small-sfx-base-metal.wav"

  same-l-cuda:
    name: SAME-L real weights (CUDA)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'same-l'
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 120
    env:
      SA3_SAME_L_CASE: standalone
      SA3_TEST_CUDA: "1"
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Configure immutable SAME-L snapshot path
        shell: cmd
        run: echo SA3_SAME_L_SNAPSHOT=%RUNNER_TEMP%\sa3-same-l\41acf79dd242877d6499a1108ca5dba5d5eecfc5>>"%GITHUB_ENV%"
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Toolchain and hardware versions
        shell: cmd
        run: |
          call "%VCVARS%"
          rustc --version
          cargo --version
          nvidia-smi
      - name: Materialize and verify immutable SAME-L snapshot
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --target "%RUNNER_TEMP%\huggingface-hub" "huggingface_hub==1.20.1"
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          python scripts/release/ensure_model_snapshot.py --model same-l --snapshot "%SA3_SAME_L_SNAPSHOT%" || exit /b 1
      - name: Verify SAME-L short and long band boundaries on CUDA
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda same_l_short_standalone_and_embedded_match_every_band_layer -- --ignored --nocapture || exit /b 1
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda same_l_long_durations_match_compact_band_boundaries -- --ignored --nocapture || exit /b 1
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda same_l_variable_stride_padding_gather_and_noise_order_match_upstream -- --ignored --nocapture || exit /b 1
      - name: Measure literal 380-second and exact-max SAME-L roundtrips and peak CUDA allocation
        shell: powershell
        run: |
          cmd /c "call `"$env:VCVARS`" && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") { Set-Item -Force "env:$($matches[1])" $matches[2] }
            }
          function Invoke-SameLProbe([string]$label, [string]$samples) {
            if ($samples) {
              $env:SA3_SAME_L_RESOURCE_SAMPLES = $samples
            } else {
              Remove-Item env:SA3_SAME_L_RESOURCE_SAMPLES -ErrorAction SilentlyContinue
            }
            $stdout = Join-Path $env:RUNNER_TEMP "same-l-resource-$label.stdout"
            $stderr = Join-Path $env:RUNNER_TEMP "same-l-resource-$label.stderr"
            $stop = Join-Path $env:RUNNER_TEMP "same-l-resource-$label.stop"
            Remove-Item $stop -ErrorAction SilentlyContinue
            $arguments = @(
              "test", "--locked", "--release",
              "-p", "candle-audio-stable-audio-3", "--features", "cuda",
              "same_l_long_duration_roundtrip_resource_probe", "--", "--ignored", "--nocapture"
            )
            $baselineOutput = @(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits)
            if ($LASTEXITCODE -ne 0) {
              throw "nvidia-smi baseline query failed with exit code $LASTEXITCODE"
            }
            $baselineMiB = 0
            $baselineText = [string]($baselineOutput | Select-Object -First 1)
            if (-not [int]::TryParse($baselineText.Trim(), [ref]$baselineMiB)) {
              throw "nvidia-smi baseline query returned an invalid value: '$baselineText'"
            }
            $sampler = Start-Job -ArgumentList $stop, $baselineMiB -ScriptBlock {
              param([string]$stopPath, [int]$peakMiB)
              while (-not (Test-Path $stopPath)) {
                $sampleOutput = @(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits)
                if ($LASTEXITCODE -ne 0) {
                  throw "nvidia-smi sampler query failed with exit code $LASTEXITCODE"
                }
                $usedMiB = 0
                $sampleText = [string]($sampleOutput | Select-Object -First 1)
                if (-not [int]::TryParse($sampleText.Trim(), [ref]$usedMiB)) {
                  throw "nvidia-smi sampler query returned an invalid value: '$sampleText'"
                }
                $peakMiB = [Math]::Max($peakMiB, $usedMiB)
                Start-Sleep -Milliseconds 250
              }
              $peakMiB
            }
            try {
              $process = Start-Process cargo -ArgumentList $arguments -Wait -PassThru `
                -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            } finally {
              New-Item $stop -ItemType File -Force | Out-Null
            }
            Wait-Job $sampler | Out-Null
            $samplerState = $sampler.State
            try {
              $samplerOutput = @(Receive-Job $sampler -ErrorAction Stop)
            } finally {
              Remove-Job $sampler -Force
            }
            if ($samplerState -ne "Completed") {
              throw "nvidia-smi sampler job ended in state $samplerState"
            }
            if ($samplerOutput.Count -ne 1) {
              throw "nvidia-smi sampler returned $($samplerOutput.Count) values; expected one"
            }
            $peakMiB = 0
            if (-not [int]::TryParse(([string]$samplerOutput[0]).Trim(), [ref]$peakMiB)) {
              throw "nvidia-smi sampler returned an invalid peak: '$($samplerOutput[0])'"
            }
            Get-Content $stdout
            Get-Content $stderr
            Write-Host "SA3_SAME_L_CUDA_MEMORY case=$label baseline_total_mib=$baselineMiB peak_total_mib=$peakMiB peak_delta_mib=$($peakMiB - $baselineMiB)"
            if ($process.ExitCode -ne 0) { throw "SAME-L resource probe $label failed with exit code $($process.ExitCode)" }
          }
          Invoke-SameLProbe "literal-380s" ""
          Invoke-SameLProbe "exact-max" "16777216"
          # Start-Process does not update LASTEXITCODE. The vcvars bootstrap can
          # leave it non-zero even after both foreground probes succeed, and
          # GitHub's PowerShell wrapper propagates that stale value.
          exit 0

