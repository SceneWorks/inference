name: Real-weight validation

on:
  schedule:
    - cron: "17 7 * * 0"
  workflow_dispatch:
    inputs:
      profile:
        description: Real-weight profile to run
        type: choice
        required: true
        default: all
        options: [all, llm, media, audio, same-l, same-chunked, sa3-small-music, sa3-small-sfx]

permissions:
  contents: read

concurrency:
  group: inference-real-weights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mlx-llm:
    name: MLX LLM real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'llm'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    env:
      MLX_LLM_TEST_MODEL: ${{ vars.MLX_LLM_TEST_MODEL }}
      MLX_LLM_QWEN3_MODEL: ${{ vars.MLX_LLM_QWEN3_MODEL }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Materialize and verify immutable snapshots
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model smollm2-135m-instruct --snapshot "$MLX_LLM_TEST_MODEL"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model qwen3-0.6b --snapshot "$MLX_LLM_QWEN3_MODEL"
      - name: Run representative conformance
        run: |
          cargo test --locked -p mlx-llm --test conformance real_model_passes_core_llm_conformance -- --ignored --nocapture
          cargo test --locked -p mlx-llm --test conformance real_qwen3_passes_core_llm_conformance -- --ignored --nocapture

  mlx-media:
    name: MLX media real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    env:
      ZIMAGE_SNAPSHOT: ${{ vars.ZIMAGE_SNAPSHOT }}
      MAGE_SNAPSHOT: ${{ vars.MAGE_SNAPSHOT }}
      MAGE_EDIT_SNAPSHOT: ${{ vars.MAGE_EDIT_SNAPSHOT }}
      MAGE_EDIT_BASE_SNAPSHOT: ${{ vars.MAGE_EDIT_BASE_SNAPSHOT }}
      MAGE_EDIT_TURBO_SNAPSHOT: ${{ vars.MAGE_EDIT_TURBO_SNAPSHOT }}
      # Operator-provisioned, runner-local bundle required on an exact cache miss. This keeps the
      # multi-hour frozen-Torch CPU producer out of the shared Actions queue; the normal fail-closed
      # verification below must accept every file before the bundle can be cached or consumed.
      MAGE_ORACLE_SEED_DIR: ${{ vars.MAGE_ORACLE_SEED_DIR }}
      # Explicit operator-provided models root for the mlx-gen real-weight resolvers that resolve a
      # repo-keyed snapshot (sc-13755); inference never self-fetches or derives a cache location.
      MLX_GEN_MODELS_ROOT: ${{ vars.MLX_GEN_MODELS_ROOT }}
      MAGE_REQUIRE_GOLDENS: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # actions/setup-python's Darwin package hard-codes /Users/runner during installation, which is
      # not writable on this self-hosted runner. uv installs the exact interpreter wholly in temp.
      - name: Install pinned reference Python
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/python-bin
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/python-install
        run: |
          command -v uv >/dev/null
          uv python install 3.12.10
          python_path="$(uv python find 3.12.10)"
          dirname "$python_path" >> "$GITHUB_PATH"
          "$python_path" --version
      - name: Configure runner-local Mage oracle path
        run: echo "MAGE_GOLDEN_DIR=$RUNNER_TEMP/mage-flow-oracles" >> "$GITHUB_ENV"
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Materialize and verify immutable snapshot
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model z-image-turbo --snapshot "$ZIMAGE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model mage-flow --snapshot "$MAGE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model mage-flow-edit --snapshot "$MAGE_EDIT_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model mage-flow-edit-base --snapshot "$MAGE_EDIT_BASE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model mage-flow-edit-turbo --snapshot "$MAGE_EDIT_TURBO_SNAPSHOT"
      - name: Derive immutable Mage oracle cache key
        id: mage-oracle-key
        run: |
          snapshot_revision() {
            local snapshot="$1"
            local marker="$snapshot/.sceneworks-model-revision"
            local revision
            if [[ -f "$marker" ]]; then
              revision="$(tr -d '\r\n' < "$marker")"
            else
              revision="$(basename "$(cd "$snapshot" && pwd -P)")"
            fi
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Snapshot does not resolve to an immutable 40-hex revision: $snapshot" >&2
              return 1
            fi
            printf '%s' "$revision"
          }
          producer="${{ hashFiles('.github/workflows/real-weights.yml', 'crates/media/mlx-gen/_vendor/mage_flow/**', 'crates/media/mlx-gen/_vendor/mage_flow/assets/dog.jpg', 'crates/media/mlx-gen/_vendor/mage_flow/requirements-oracles.txt', 'crates/media/mlx-gen/tools/_paths.py', 'crates/media/mlx-gen/tools/dump_mage_flow_golden.py', 'crates/media/mlx-gen/tools/dump_mage_vae_sizes.py', 'scripts/release/provision_mage_oracles.py', 'scripts/release/provision_mage_edit_variants.py', 'scripts/release/verify_mage_candle_oracles.py', 'scripts/release/verify_mage_candle_transfer.py') }}"
          if [[ ! "$producer" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Oracle producer fingerprint is missing or malformed: $producer" >&2
            exit 1
          fi
          key="mage-oracles-v1-$(snapshot_revision "$MAGE_SNAPSHOT")-$(snapshot_revision "$MAGE_EDIT_SNAPSHOT")-$(snapshot_revision "$MAGE_EDIT_BASE_SNAPSHOT")-$(snapshot_revision "$MAGE_EDIT_TURBO_SNAPSHOT")-$producer"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore verified Mage oracle cache
        id: mage-oracle-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mage-flow-oracles
          key: ${{ steps.mage-oracle-key.outputs.key }}
      - name: Require operator-provisioned Mage oracle seed
        id: mage-oracle-seed
        if: steps.mage-oracle-cache.outputs.cache-hit != 'true'
        run: |
          if [[ -z "$MAGE_ORACLE_SEED_DIR" ]]; then
            echo "Mage oracle cache missed and MAGE_ORACLE_SEED_DIR is unset; refusing to run the multi-hour CPU producer on the shared Actions runner" >&2
            exit 1
          fi
          if [[ "$MAGE_ORACLE_SEED_DIR" != /* || ! -d "$MAGE_ORACLE_SEED_DIR" ]]; then
            echo "MAGE_ORACLE_SEED_DIR must be an existing absolute directory" >&2
            exit 1
          fi
          files=(
            mage_flow_te_golden.safetensors
            mage_flow_edit_golden.safetensors
            mage_flow_edit_base_golden.safetensors
            mage_flow_edit_turbo_golden.safetensors
            mage_flow_vae_f32_256.safetensors
            mage_flow_vae_f32_992.safetensors
            mage_flow_vae_f32_1024.safetensors
            mage_flow_vae_f32_2048.safetensors
            mage_flow_vae_f32_512x2048.safetensors
            mage_flow_vae_f32_768x1280.safetensors
            mage_flow_vae_f32_768x1152.safetensors
            mage_flow_dit_golden.safetensors
            mage_flow_e2e_golden.safetensors
            mage_oracles_manifest.json
            mage_edit_oracle_manifest.json
            mage_edit_variants_manifest.json
            mage_candle_oracles_manifest.json
            mage_candle_transfer_manifest.json
          )
          mkdir -p "$MAGE_GOLDEN_DIR"
          for file in "${files[@]}"; do
            source="$MAGE_ORACLE_SEED_DIR/$file"
            if [[ ! -f "$source" || -L "$source" ]]; then
              echo "Operator Mage oracle seed is missing a regular, non-symlink file: $source" >&2
              exit 1
            fi
            install -m 0644 "$source" "$MAGE_GOLDEN_DIR/$file"
          done
          echo "imported=true" >> "$GITHUB_OUTPUT"
      # sc-14051 Candle acceptance oracle: one frozen-Torch 1024²/20-step reference run emits
      # both the step-zero full-DiT boundary and the final e2e image. It is generated on a
      # different backend/process from the Candle implementation and transferred as an immutable
      # workflow artifact; Candle never blesses its own output. Cache misses require that
      # operator-generated bundle above instead of running the multi-hour producer in Actions.
      - name: Verify restored or operator-provisioned Mage oracle cache
        run: |
          if [[ ! -x "$RUNNER_TEMP/mage-reference/bin/python" ]]; then
            python -m venv "$RUNNER_TEMP/mage-reference"
            "$RUNNER_TEMP/mage-reference/bin/python" -m pip install \
              --disable-pip-version-check --only-binary=:all: --require-hashes \
              -r crates/media/mlx-gen/_vendor/mage_flow/requirements-oracles.txt
          fi
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/provision_mage_oracles.py \
            --snapshot "$MAGE_SNAPSHOT" \
            --edit-snapshot "$MAGE_EDIT_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR" \
            --verify-only
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/provision_mage_oracles.py \
            --snapshot "$MAGE_SNAPSHOT" \
            --edit-snapshot "$MAGE_EDIT_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR" \
            --verify-edit-artifact
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/provision_mage_edit_variants.py \
            --gen "$MAGE_SNAPSHOT" \
            --edit "$MAGE_EDIT_SNAPSHOT" \
            --edit-base "$MAGE_EDIT_BASE_SNAPSHOT" \
            --edit-turbo "$MAGE_EDIT_TURBO_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR" \
            --verify-only
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/verify_mage_candle_oracles.py \
            --snapshot "$MAGE_SNAPSHOT" \
            --edit-snapshot "$MAGE_EDIT_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR"
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/verify_mage_candle_transfer.py \
            --gen "$MAGE_SNAPSHOT" \
            --edit "$MAGE_EDIT_SNAPSHOT" \
            --edit-base "$MAGE_EDIT_BASE_SNAPSHOT" \
            --edit-turbo "$MAGE_EDIT_TURBO_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR"
          echo "MAGE_FLOW_TE_GOLDEN=$MAGE_GOLDEN_DIR/mage_flow_te_golden.safetensors" >> "$GITHUB_ENV"
      - name: Save verified Mage oracle cache
        if: steps.mage-oracle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mage-flow-oracles
          key: ${{ steps.mage-oracle-key.outputs.key }}
      - name: Run provider conformance
        run: >-
          cargo test --locked -p mlx-gen-z-image --test conformance
          z_image_turbo_satisfies_gen_core_contract -- --ignored --nocapture
      # sc-14038 DoD gate — the ONLY automatic run of the Qwen3-VL text-encoder parity suite. It
      # needs both the 8.875 GB `text_encoder/` component and the CPU-dumped boundary golden,
      # neither of which the PR lanes have. It also carries the self-invalidating assertion that
      # reports if the bf16 noise floor ever moves far enough to gate the QK-norm epsilon
      # numerically (today it cannot, so `verify_text_config` guards that instead).
      - name: Run Mage-Flow text-encoder parity
        run: >-
          cargo test --locked --release -p mlx-gen-mage --test te_parity_real_weights
          -- --ignored --nocapture
      - name: Run Mage-VAE all-geometry parity
        run: >-
          cargo test --locked --release -p mlx-gen-mage --test vae_decode_real_weights
          -- --ignored --nocapture
      - name: Run Mage-Flow instruction-edit parity
        run: |
          status=0
          MAGE_EDIT_GOLDEN_NAME=mage_flow_edit_golden.safetensors \
            cargo test --locked --release -p mlx-gen-mage --test edit_real_weights \
            -- --ignored --nocapture || status=$?
          MAGE_EDIT_SNAPSHOT="$MAGE_EDIT_BASE_SNAPSHOT" \
            MAGE_EDIT_GOLDEN_NAME=mage_flow_edit_base_golden.safetensors \
            cargo test --locked --release -p mlx-gen-mage --test edit_real_weights \
            fixed_instruction_edit_matches_the_torch_reference -- --ignored --nocapture || status=$?
          MAGE_EDIT_SNAPSHOT="$MAGE_EDIT_TURBO_SNAPSHOT" \
            MAGE_EDIT_GOLDEN_NAME=mage_flow_edit_turbo_golden.safetensors \
            cargo test --locked --release -p mlx-gen-mage --test edit_real_weights \
            fixed_instruction_edit_matches_the_torch_reference -- --ignored --nocapture || status=$?
          exit "$status"
      - name: Upload verified Mage edit oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mage-flow-edit-oracle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_base_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_turbo_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_oracle_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_variants_manifest.json
          if-no-files-found: error
      - name: Upload Candle Mage acceptance oracles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mage-flow-candle-oracles-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_te_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_dit_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_vae_f32_1024.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_e2e_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_base_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_turbo_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_oracle_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_variants_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_candle_oracles_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_candle_transfer_manifest.json
          if-no-files-found: error

  candle-audio:
    name: Candle audio real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    env:
      KOKORO_SNAPSHOT: ${{ vars.KOKORO_SNAPSHOT }}
      MOSS_SFX_SNAPSHOT: ${{ vars.MOSS_SFX_SNAPSHOT }}
      ACESTEP_SNAPSHOT: ${{ vars.ACESTEP_SNAPSHOT }}
      CHATTERBOX_VE_SNAPSHOT: ${{ vars.CHATTERBOX_VE_SNAPSHOT }}
      CHATTERBOX_SNAPSHOT: ${{ vars.CHATTERBOX_SNAPSHOT }}
      CHATTERBOX_PERTH_SNAPSHOT: ${{ vars.CHATTERBOX_PERTH_SNAPSHOT }}
      OPENVOICE_V2_SNAPSHOT: ${{ vars.OPENVOICE_V2_SNAPSHOT }}
      WHISPER_SNAPSHOT: ${{ vars.WHISPER_SNAPSHOT }}
      CLAP_SNAPSHOT: ${{ vars.CLAP_SNAPSHOT }}
      MOSS_TTS_REALTIME_SNAPSHOT: ${{ vars.MOSS_TTS_REALTIME_SNAPSHOT }}
      MOSS_TTSD_SNAPSHOT: ${{ vars.MOSS_TTSD_SNAPSHOT }}
      MOSS_XY_TOKENIZER_SNAPSHOT: ${{ vars.MOSS_XY_TOKENIZER_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Materialize and verify immutable snapshots
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model kokoro-82m --snapshot "$KOKORO_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model moss-soundeffect-v2 --snapshot "$MOSS_SFX_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model acestep-v15-turbo --snapshot "$ACESTEP_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model chatterbox-ve --snapshot "$CHATTERBOX_VE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model chatterbox --snapshot "$CHATTERBOX_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model chatterbox-perth --snapshot "$CHATTERBOX_PERTH_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model openvoice-v2 --snapshot "$OPENVOICE_V2_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model whisper-base --snapshot "$WHISPER_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model clap-htsat-unfused --snapshot "$CLAP_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model moss-tts-realtime --snapshot "$MOSS_TTS_REALTIME_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model moss-ttsd-v05 --snapshot "$MOSS_TTSD_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model xy-tokenizer-ttsd --snapshot "$MOSS_XY_TOKENIZER_SNAPSHOT"
      - name: Run provider conformance
        run: |
          cargo test --locked -p candle-audio-kokoro --test conformance kokoro_conformance -- --ignored --nocapture
          cargo test --locked -p candle-audio-kokoro --test conformance kokoro_wav_conformance -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-sfx --test conformance moss_sfx_conformance -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-sfx --test conformance moss_sfx_wav_conformance -- --ignored --nocapture
          # ACE-Step 1.5 music/song (sc-12842): the flow-matching DiT + Oobleck VAE producing a
          # non-degenerate, rhythmic stereo mix (frame-energy variation, broadband spectrum, beat).
          cargo test --locked -p candle-audio-acestep --test conformance acestep_conformance -- --ignored --nocapture
          cargo test --locked -p candle-audio-acestep --test conformance acestep_music_wav_conformance -- --ignored --nocapture
          # Chatterbox voice embedder (sc-12844): the sc-12838 release gate. Uses the Kokoro
          # snapshot above for the distinct reference voices it embeds.
          cargo test --locked -p candle-audio-chatterbox-ve --test conformance chatterbox_ve_discriminates_speakers -- --ignored --nocapture
          cargo test --locked -p candle-audio-chatterbox-ve --test conformance chatterbox_ve_wav_conformance -- --ignored --nocapture
          # OpenVoice V2 voice conversion (sc-13223): the sc-12839 release gate. Converts a Kokoro
          # source clip toward a DIFFERENT Kokoro target voice; the timbre shift is measured with
          # chatterbox_ve above. sc-13233 adds a content-preservation gate: whisper_base (snapshot
          # below) transcribes the converted clip and asserts its CER vs the known source script
          # stays small — catching linguistic garbling the duration+timbre gate is blind to.
          cargo test --locked -p candle-audio-openvoice --test conformance openvoice_v2_converts_toward_the_target_voice -- --ignored --nocapture
          cargo test --locked -p candle-audio-openvoice --test conformance openvoice_v2_is_deterministic -- --ignored --nocapture
          # Chatterbox clone-TTS (sc-13222): the T3 speech-token LM stage on real t3_cfg.safetensors
          # weights — a valid, non-degenerate, voice-responsive token sequence, plus the honest
          # VoiceEmbedding-only boundary (a full clone WAV requires ReferenceAudio; sc-13239).
          cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_t3_produces_valid_speech_tokens -- --ignored --nocapture
          cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_t3_responds_to_the_reference_voice -- --ignored --nocapture
          cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_generate_requires_reference_audio_for_a_full_clone -- --ignored --nocapture
          # s3tokenizer (sc-13235) + T3 prompt-token wiring: the Whisper-v2 FSMN encoder + FSQ head
          # tokenizes a reference at ≈25 Hz into valid FSQ codes, deterministically and content-
          # responsively, and fills T3's reference conditioning prompt (previously orphaned — sc-13394).
          cargo test --locked -p candle-audio-chatterbox --test conformance s3tokenizer_encodes_a_reference_at_25hz -- --ignored --nocapture
          cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_reference_audio_fills_the_t3_prompt_tokens -- --ignored --nocapture
          # s3tokenizer long-audio (>30s) sliding-window segmentation + merge_tokenized_segments
          # (sc-13380): 30 s windows hopped by 26 s (4 s overlap), each tokenized independently and
          # stitched so the overlap is counted once — a real >30 s clip tokenizes at 25 Hz across the
          # seams and matches single-pass tokens over the non-boundary interior (continuity).
          cargo test --locked -p candle-audio-chatterbox --test conformance s3tokenizer_windows_audio_longer_than_30s -- --ignored --nocapture
          # CAMPPlus speaker encoder (sc-13236): the D-TDNN x-vector network derives DISCRIMINATIVE
          # 192-d / 80-d flow speaker embeddings on real speaker_encoder.* weights (previously
          # orphaned — sc-13394).
          cargo test --locked -p candle-audio-chatterbox --test conformance campplus_derives_discriminative_x_vectors -- --ignored --nocapture
          # S3Gen flow token->mel decoder (sc-13237): the UpsampleConformerEncoder + CausalConditionalCFM
          # + ConditionalDecoder on real flow.* weights render a sane 80-bin log-mel (shape [80, ~2*n_tokens],
          # finite, non-degenerate range) from real conditioning (s3tokenizer tokens + CAMPPlus 80-d spk +
          # 24 kHz prompt mel) and are deterministic. Needs the full CHATTERBOX_SNAPSHOT (s3gen.safetensors).
          cargo test --locked -p candle-audio-chatterbox --test conformance flow_synthesizes_a_sane_mel_from_speech_tokens -- --ignored --nocapture
          # S3Gen HiFTNet vocoder (sc-13238): the NSF/iSTFT mel->waveform generator vocodes a real 24 kHz
          # log-mel into a non-silent, finite, 480-samples/frame waveform, deterministically.
          cargo test --locked -p candle-audio-chatterbox --test conformance hift_vocodes_a_real_mel_to_nonsilent_waveform -- --ignored --nocapture
          # PerTh provenance watermarker (sc-13240): the natively-ported implicit watermarker on real
          # weights (MIT; resolved from the SceneWorks/perth-implicit hub pin — sc-13443) embeds a
          # RECOVERABLE (≈100% detection, clean≈0) and IMPERCEPTIBLE (psychoacoustically masked;
          # SNR ≈16 dB) watermark, at both the model's native 32 kHz rate and Chatterbox's 24 kHz
          # output path. Wired into generate() (sc-13239).
          cargo test --locked -p candle-audio-chatterbox --test conformance perth_watermark_roundtrips_and_is_imperceptible -- --ignored --nocapture
          # THE sc-12838 clone-WAV DoD (sc-13239): the epic-releasing gate. The full registry path
          # (generate()) renders a real 24 kHz cloned-voice WAV from a reference clip + text that is
          # non-silent, finite, token-proportional, speech-shaped, watermarked, AND voice-similar to
          # the reference (cos(ve(out),ve(ref)) > cos(ve(out),ve(control)) by a material margin — it
          # FAILS if the clone ignores the reference). Needs the full CHATTERBOX_SNAPSHOT; PerTh
          # resolves from the SceneWorks/perth-implicit hub pin.
          CHATTERBOX_WAV_OUT="$RUNNER_TEMP/chatterbox_clone_demo.wav" cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_clones_a_reference_voice_end_to_end -- --ignored --nocapture
          # Whisper ASR (sc-12850): the first real Transcriber (audio→text, the Captioner-analog).
          # Kokoro TTS → Whisper ASR round-trip — known text synthesized by kokoro_82m (snapshot
          # above) transcribes back within a small CER, with monotonic segment timestamps.
          cargo test --locked -p candle-audio-whisper --test conformance whisper_transcribes_kokoro_roundtrip_within_cer -- --ignored --nocapture
          cargo test --locked -p candle-audio-whisper --test conformance whisper_greedy_transcription_is_deterministic -- --ignored --nocapture
          # LAION CLAP audio embedder (sc-12851): the first real AudioEmbedder (semantic audio-text
          # joint-space retrieval). Embeds a set of real clips spanning categories (a Kokoro speech
          # clip from the snapshot above, a tone, and white noise) and asserts a TEXT query ranks its
          # matching clip highest by cosine — the cross-modal ranking DoD — plus embedding determinism.
          cargo test --locked -p candle-audio-clap --test conformance cross_modal_query_ranks_matching_clip_highest -- --ignored --nocapture
          cargo test --locked -p candle-audio-clap --test conformance embedding_is_deterministic -- --ignored --nocapture
          # MOSS-TTSD-v0.5 multi-speaker dialogue TTS (sc-13360 AR brain + sc-13518 XY_Tokenizer
          # codec). The Qwen3 backbone + 8-channel delay-pattern loop emits real, deterministic RVQ
          # frames; a 2-speaker [S1]/[S2] script shapes the token stream vs a single-voice control;
          # and the ported XY_Tokenizer codec renders those frames into one 24 kHz AudioTrack whose two
          # speakers are acoustically distinct (measured via chatterbox_ve — cross-segment cosine below
          # same-segment self-similarity), with a single-voice control and byte-identical re-synth. The
          # non-English gate (task 12906) checks a Chinese prompt renders distinct real audio.
          cargo test --locked -p candle-audio-moss-tts --test conformance moss_ttsd_emits_valid_delay_pattern_rvq_frames -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-tts --test conformance moss_ttsd_two_speaker_script_shapes_the_token_stream -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-tts --test conformance moss_ttsd_renders_multi_speaker_audio -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-tts --test conformance moss_ttsd_renders_non_english -- --ignored --nocapture
      # Regression fixture (sc-12854): the validation harness's committed metric envelope +
      # PCM repeatability hash; this runner IS the fixture's canonical platform
      # (macos/aarch64), so the exact-hash check gates here.
      - name: Run regression fixture
        run: cargo test --locked -p candle-audio-kokoro --test regression kokoro_regression_fixture -- --ignored --nocapture

