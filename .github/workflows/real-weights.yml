      SA3_TEST_CUDA: "1"
      SA3_REQUIRE_ALL_SNAPSHOTS: "1"
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Configure all six immutable Stable Audio 3 snapshot paths
        shell: cmd
        run: |
          echo SA3_SMALL_MUSIC_SNAPSHOT=%RUNNER_TEMP%\sa3-small-music\0fef1392cd842149a2b6d445e181c97608faac06>>"%GITHUB_ENV%"
          echo SA3_SMALL_SFX_SNAPSHOT=%RUNNER_TEMP%\sa3-small-sfx\ae12755283df9d62ca39a9b050a39a0b607b8c20>>"%GITHUB_ENV%"
          echo SA3_MEDIUM_SNAPSHOT=%RUNNER_TEMP%\sa3-medium\27b5a21b791b1b033d193a9e1e3ce78493f102f9>>"%GITHUB_ENV%"
          echo SA3_SMALL_MUSIC_BASE_SNAPSHOT=%RUNNER_TEMP%\sa3-small-music-base\eab5ceee5ad9c1ed38800aff30a8e49d1161c539>>"%GITHUB_ENV%"
          echo SA3_SMALL_SFX_BASE_SNAPSHOT=%RUNNER_TEMP%\sa3-small-sfx-base\cc5ddb990e30daa68336ac61c140c37c7033ab7c>>"%GITHUB_ENV%"
          echo SA3_MEDIUM_BASE_SNAPSHOT=%RUNNER_TEMP%\sa3-medium-base\b32993f73c3bdc3864043a72d8032606bba737c8>>"%GITHUB_ENV%"
          echo SA3_SAME_L_SNAPSHOT=%RUNNER_TEMP%\sa3-same-l\41acf79dd242877d6499a1108ca5dba5d5eecfc5>>"%GITHUB_ENV%"
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Toolchain and hardware versions
        shell: cmd
        run: |
          call "%VCVARS%"
          rustc --version
          cargo --version
          nvidia-smi
      - name: Materialize and verify all six immutable snapshots
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --target "%RUNNER_TEMP%\huggingface-hub" "huggingface_hub==1.20.1"
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          rem The three `-base` entries carry `download_files` allow-lists, so the 6.4 GB of
          rem `svd_bases.pt` training pickles across them are not fetched.
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-music --snapshot "%SA3_SMALL_MUSIC_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-sfx --snapshot "%SA3_SMALL_SFX_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-medium --snapshot "%SA3_MEDIUM_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-music-base --snapshot "%SA3_SMALL_MUSIC_BASE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-sfx-base --snapshot "%SA3_SMALL_SFX_BASE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-medium-base --snapshot "%SA3_MEDIUM_BASE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model same-l --snapshot "%SA3_SAME_L_SNAPSHOT%" || exit /b 1
      - name: Reject every cross-variant weight path and match the frozen-Torch sampler oracles
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test variant_binding -- --ignored --nocapture || exit /b 1
          rem Named rather than `--test sampler_oracle -- --ignored`: the third ignored case in that
          rem target is an operator resource probe that requires SA3_RESOURCE_* and fails without it.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test sampler_oracle all_six_real_p0_pingpong_trajectories_match_stepwise -- --ignored --nocapture || exit /b 1
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test sampler_oracle real_sampler_cfg_apg_scale_phi_matches_frozen_upstream -- --ignored --nocapture || exit /b 1
      - name: Prove real CFG and the negative prompt on a base checkpoint
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test base_guidance -- --ignored --nocapture || exit /b 1
      - name: Certify the explicit-negative conditioning path itself
        shell: cmd
        run: |
          call "%VCVARS%"
          rem `base_guidance`'s divergence assertion proves the negative prompt reaches the model,
          rem not that the batch-2 path is wired correctly. This case is the only one that separates
          rem absent negative conditioning — which zeroes the whole cross context — from an explicit
          rem all-invalid negative prompt, which keeps its conditioned duration row. It ran in no
          rem lane before sc-14546. Named rather than `--test dit_oracle -- --ignored`: the other
          rem ignored cases need all six snapshots on CPU or an explicit SA3_DIT_CASE_ENV selection,
          rem and wiring the rest of `dit_oracle` is sc-15235.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test dit_oracle real_weights_detect_conditioning_mutations_and_exercise_cfg_apg -- --ignored --nocapture || exit /b 1
      - name: Prove the audio-to-audio restyle path on all six checkpoints
        shell: cmd
        run: |
          call "%VCVARS%"
          rem sc-14547. This job and its Metal twin are the only lanes provisioning all six
          rem snapshots, and the story's acceptance is "every registered variant". Both ignored
          rem cases run: the sweep asserts retained structure, a divergence floor, and the strength
          rem direction through the full graph, and the draw-order case is the only observation that
          rem separates "initial noise first, then the source encode" from the reverse.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test reference_audio -- --ignored --nocapture || exit /b 1
      - name: Prove inpaint, repaint and extend on all six checkpoints
        shell: cmd
        run: |
          call "%VCVARS%"
          rem sc-14548. This job and its Metal twin are the only lanes provisioning all six
          rem snapshots. All four ignored cases run: exact outside-region preservation plus a
          rem measured interior divergence (preservation alone passes for a no-op), Repaint/Inpaint
          rem byte equality, the pinned 10s -> 18s extend with an exact prefix and a seam bound
          rem derived from the material, and the draw order — which only medium/medium-base can
          rem falsify, since SAME-S consumes zero draws on encode. This is also the only lane that
          rem reaches the three weights-only edit sites named in
          rem docs/migration/SC_14548_AUDIO_EDIT_INPAINT.md.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test audio_edit -- --ignored --nocapture || exit /b 1
      - name: Prove the load-time adapter fold on all six checkpoints
        shell: cmd
        run: |
          call "%VCVARS%"
          rem sc-14550. This job and its Metal twin are the only lanes provisioning all six
          rem snapshots. These cases do NOT validate a real adapter artifact -- none exists
          rem (sc-15347); every adapter is synthesized by the test against the real checkpoint's own
          rem safetensors header. What they prove is that the resolved plan reaches the real backend
          rem and that the fold changes the rendered audio. The two gates are exactly signed: a
          rem scale-0.0 request renders byte-identical audio to a request with no adapters, and two
          rem adapters differing only in their factors render different audio. "Adapted differs from
          rem un-adapted" is liveness only, because a misapplied adapter differs too.
          rem The -xs case is scoped to the conditioner's [768, 256] Linear: the deterministic host
          rem f64 SVD costs ~1.9 s there and ~113 s at [1024, 1024].
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test adapters -- --ignored --nocapture || exit /b 1

