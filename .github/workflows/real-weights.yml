  same-l-cuda:
    name: SAME-L real weights (CUDA)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'same-l'
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 120
    env:
      SA3_SAME_L_CASE: standalone
      SA3_TEST_CUDA: "1"
      # 80 IS CORRECT ON A BLACKWELL BOX, AND RAISING IT TO 120 IS A REGRESSION (sc-19545). This
      # is the first of thirteen sites in this file; the full reasoning is on the same declaration
      # in `ci.yml`. In one paragraph: `CUDA_COMPUTE_CAP` names the BOTTOM RUNG of an architecture
      # ladder, not the hardware. It seeds one cudaforge `-gencode`, and
      # `vendor/candle-kernels/build.rs` appends sm_90, sm_120 and `compute_120` PTX above it
      # (sc-7544), so `libmoe.a` is a fatbin covering Ampere -> Blackwell from one binary. Setting
      # this to the runner's own 120 deletes the Ampere rung and lifts the dense PTX floor with it.
      # NOTHING ENFORCES THIS. sc-19545 verified all 15 sites (13 here, 2 in `ci.yml`) by hand and
      # a drift guard was deliberately scoped out, so the value is load-bearing but unguarded: an
      # edit here surfaces as black renders on customer GPUs, never as a red build.
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: call scripts\ci\real-weights\same-l-cuda\install-reviewed-cpython-3-12.cmd
      - name: Configure immutable SAME-L snapshot path
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" scripts/release/export_model_snapshot_paths.py --model same-l
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Toolchain and hardware versions
        shell: cmd
        run: |
          call "%VCVARS%"
          rustc --version
          cargo --version
          nvidia-smi
      - name: Materialize and verify immutable SAME-L snapshot
        shell: cmd
        run: call scripts\ci\real-weights\same-l-cuda\materialize-and-verify-immutable-same-l-snapshot.cmd
      - name: Verify SAME-L short and long band boundaries on CUDA
        shell: cmd
        run: call scripts\ci\real-weights\same-l-cuda\verify-same-l-short-and-long-band-boundaries-on-cuda.cmd
      - name: Measure literal 380-second and exact-max SAME-L roundtrips and peak CUDA allocation
        shell: powershell
        run: . ./scripts/ci/real-weights/same-l-cuda/measure-literal-380-second-and-exact-max-same-l-roundtrips-a.ps1

