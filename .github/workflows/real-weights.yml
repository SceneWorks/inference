name: Mac-2 read-only Qwen host census

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc-24163-mac2-readonly-census-v1
  cancel-in-progress: false

jobs:
  host-census:
    name: Mac-2 read-only Qwen host census
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 5
    steps:
      - name: Collect the exact model-free host census on Mac-2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3.12 - <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          def utc():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()

          if os.environ.get("RUNNER_NAME") != "nax-macos-2":
              raise SystemExit("refused: this census requires runner nax-macos-2")
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          if not run_id.isdecimal() or not attempt.isdecimal():
              raise SystemExit("refused: numeric run identity required")
          temporary = Path(os.environ["RUNNER_TEMP"])
          if not temporary.is_absolute():
              raise SystemExit("refused: absolute runner temporary directory required")
          output = temporary / f"sc-24163-mac2-census-{run_id}-{attempt}"
          output.mkdir(exist_ok=False)
          blob_sha = "efaa1dd5e84b57839952ddde28004f27b6662e28"
          script_sha256 = "5b0320daf12f24cc3a10e16c3918278bef742117f6b74e0aefff5223650355ca"
          identity = {
              "kind": "HOST_DIAGNOSTIC_ONLY", "modelFree": True,
              "acceptanceEvidence": False, "admissionEvidence": False,
              "trainingSteps": 0, "renderCount": 0, "buildCount": 0,
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "sourceSha": "eb0d625ae581f4862474e88ddab528efec0392fd",
              "scriptBlobSha": blob_sha, "scriptSha256": script_sha256,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": run_id, "runAttempt": attempt,
              "job": os.environ["GITHUB_JOB"], "runnerName": os.environ["RUNNER_NAME"],
              "startedUtc": utc(), "status": "INITIALIZED",
          }
          identity_path = output / "control-identity.json"
          identity_path.write_text(json.dumps(identity, indent=2) + "\n", encoding="utf-8")
          try:
              request = urllib.request.Request(
                  "https://api.github.com/repos/SceneWorks/inference/git/blobs/" + blob_sha,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "sc-24163-mac2-readonly-census"})
              limit = 2 * 1024 * 1024
              with urllib.request.urlopen(request, timeout=10) as response:
                  raw = response.read(limit + 1)
              if len(raw) > limit:
                  raise ValueError("script response exceeded 2 MiB bound")
              body = json.loads(raw)
              if body.get("sha") != blob_sha or body.get("encoding") != "base64":
                  raise ValueError("script blob identity or encoding mismatch")
              script = base64.b64decode("".join(body["content"].split()), validate=True)
              if hashlib.sha256(script).hexdigest() != script_sha256:
                  raise ValueError("script SHA-256 mismatch")
              if hashlib.sha1(b"blob " + str(len(script)).encode("ascii") + b"\0" + script).hexdigest() != blob_sha:
                  raise ValueError("script Git blob SHA mismatch")
              script_path = output / "qwen21_host_census.py"
              script_path.write_bytes(script)
              census = output / "census"
              subprocess.run([sys.executable, str(script_path), "--out", str(census)],
                             check=True, timeout=45)
              receipt = json.loads((census / "HOST_DIAGNOSTIC_ONLY.json").read_text(encoding="utf-8"))
              hardware = {}
              for line in receipt.get("hardware", "").splitlines():
                  if ":" in line:
                      key, value = line.split(":", 1)
                      hardware[key.strip()] = value.strip()
              expected = {"hw.model": "Mac17,6", "hw.memsize": "137438953472",
                          "machdep.cpu.brand_string": "Apple M5 Max"}
              qualification = {
                  "kind": "CONDITIONAL_HOST_EVIDENCE_ONLY", "admissionEvidence": False,
                  "expectedHardware": expected, "observedHardware": hardware,
                  "hardwareMatches": all(hardware.get(key) == value for key, value in expected.items()),
                  "queryErrors": receipt.get("errors", {}),
                  "pressureLevel": receipt.get("pressureLevel"),
                  "nativeBaselineKnown": False,
                  "scope": "Fresh hardware and raw counters only; native admission remains unproven.",
              }
              (output / "hardware-qualification.json").write_text(
                  json.dumps(qualification, indent=2) + "\n", encoding="utf-8")
              if not qualification["hardwareMatches"]:
                  raise ValueError("Mac-2 hardware qualification failed; receipt preserved")
              if qualification["queryErrors"]:
                  raise ValueError("host census query incomplete; receipt preserved")
              identity["status"] = "CENSUS_COMPLETED"
          except Exception as error:
              identity["status"] = "CENSUS_FAILED"
              identity["errorType"] = type(error).__name__
              raise
          finally:
              identity["finishedUtc"] = utc()
              identity_path.write_text(json.dumps(identity, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Preserve this run's host diagnostic receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc-24163-mac2-readonly-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sc-24163-mac2-census-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
