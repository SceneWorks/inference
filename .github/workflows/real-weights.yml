# Isolated manual campaign ref; registered workflow312370029. No product-main transport merge.
name: '[Mac2] SC-24163 uniform120 recipe campaign'
'on':
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        required: true
        default: qwen-image-2-1-lora-mlx
        options:
        - qwen-image-2-1-lora-mlx
      qwen_image_2_1_lora_runner:
        type: choice
        required: true
        default: rw-mage
        options:
        - rw-mage
      qwen_image_2_1_lora_phase:
        type: choice
        required: true
        default: edit
        options:
        - edit
      qwen_image_2_1_third_party_lora:
        type: choice
        required: true
        default: prithivMLmods/Qwen-Image-2.1-Natural-Exposure-LoRA@382d066d079854a86c9513f3c5a4026ada21ddbe:Qwen-Image-2.1-Natural-Exposure-LoRA-4000.safetensors
        options:
        - prithivMLmods/Qwen-Image-2.1-Natural-Exposure-LoRA@382d066d079854a86c9513f3c5a4026ada21ddbe:Qwen-Image-2.1-Natural-Exposure-LoRA-4000.safetensors
permissions:
  contents: read
  actions: read
concurrency:
  group: sc24163-uniform120-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mlx-qwen-image-2-1:
    name: '[Mac2] SC-24163 uniform120 dense BF16 campaign'
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'qwen-image-2-1-lora-mlx' && inputs.qwen_image_2_1_lora_runner
      == 'rw-mage' && inputs.qwen_image_2_1_lora_phase == 'edit'
    runs-on:
    - self-hosted
    - macOS
    - ARM64
    - rw-mage
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
    env:
      MLX_GEN_MODELS_ROOT: ${{ vars.MLX_GEN_MODELS_ROOT }}
      MLX_GEN_QWEN_IMAGE_2_1_SNAPSHOT: ${{ vars.MLX_GEN_MODELS_ROOT }}/models--Qwen--Qwen-Image-2.1/snapshots/790c92633540aa0cb11d9abf19eb46d861714758
      MLX_GEN_QWEN_IMAGE_2_1_TIER_SNAPSHOT: ${{ vars.MLX_GEN_MODELS_ROOT }}/models--SceneWorks--qwen-image-2-1-mlx/snapshots/1691de01c24a070131e0a28bf4c065fd027f4fe9
      QWEN_IMAGE_2_1_THIRD_PARTY_LORA_SPEC: ${{ inputs.qwen_image_2_1_third_party_lora }}
      QWEN_IMAGE_2_1_LORA_PHASE: ${{ inputs.qwen_image_2_1_lora_phase }}
      CARGO_PROFILE_RELEASE_STRIP: none
      QWEN_IMAGE_2_1_FOOTPRINT_CEILING_GB: '100'
      QWEN_IMAGE_2_1_LORA_EDIT_STEPS: '120'
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        fetch-depth: 1
    - name: Require the one-shot Mac2 edit campaign owner
      shell: bash
      run: |
        [[ "$RUNNER_NAME" == nax-macos-2 && "$GITHUB_RUN_ATTEMPT" == 1 ]]
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && -z "$(git status --porcelain)" ]]
    - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      with:
        toolchain: 1.96.0
    - name: Initialize isolated Qwen-Image 2.1 Cargo target
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RUNNER_TEMP" = /* ]]
        [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
        [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        target="$RUNNER_TEMP/qwen-image-2-1-cargo-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        [[ ! -e "$target" ]]
        mkdir "$target"
        printf 'CARGO_TARGET_DIR=%s\n' "$target" >> "$GITHUB_ENV"
    - name: Resolve runner-local snapshot paths
      run: python3.12 scripts/release/resolve_snapshot_paths.py MLX_GEN_MODELS_ROOT MLX_GEN_QWEN_IMAGE_2_1_SNAPSHOT MLX_GEN_QWEN_IMAGE_2_1_TIER_SNAPSHOT
    - name: Toolchain versions
      run: rustc --version && cargo --version
    - name: Require the resolved snapshot paths and initialize evidence
      run: source scripts/ci/real-weights/mlx-qwen-image-2-1/require-the-resolved-snapshot-paths-and-initialize-evidence.sh
    - name: Report runner disk headroom
      continue-on-error: true
      run: scripts/ci/report_runner_disk_headroom.sh MLX_GEN_MODELS_ROOT MLX_GEN_QWEN_IMAGE_2_1_SNAPSHOT MLX_GEN_QWEN_IMAGE_2_1_TIER_SNAPSHOT
    - name: Record the macOS device inventory
      continue-on-error: true
      run: |
        sysctl -n hw.model hw.memsize machdep.cpu.brand_string | tee "$QWEN_IMAGE_2_1_RENDER_OUT/device-inventory.txt"
        python3.12 scripts/ci/qwen21_host_census.py --out "$QWEN_IMAGE_2_1_RENDER_OUT/host-census"
    - name: Build the Qwen-Image 2.1 MLX test binary
      run: source scripts/ci/real-weights/mlx-qwen-image-2-1/build-and-record-mlx-library-identity.sh
    - name: Prove the actual uniform120 configuration binding
      shell: bash
      run: |
        set -euo pipefail
        cargo test --locked --release -p mlx-gen-qwen-image-2-1 --test integration \
          lora_real_weights::uniform_edit_training_recipe_rejects_config_and_sampler_label_drift \
          -- --exact --nocapture --test-threads 1 2>&1 | tee "$QWEN_IMAGE_2_1_RENDER_OUT/uniform-recipe-guard.log"
        grep -qE 'test result: ok\. 1 passed' "$QWEN_IMAGE_2_1_RENDER_OUT/uniform-recipe-guard.log"
    - name: Prove trained velocity survives adapter save and reload
      if: inputs.qwen_image_2_1_lora_phase != 'current-diagnostic' && inputs.qwen_image_2_1_lora_phase != 'current-trajectory'
      run: source scripts/ci/real-weights/mlx-qwen-image-2-1/prove-trained-velocity-survives-save-and-reload.sh
    - name: Materialize and verify immutable snapshots
      run: source scripts/ci/real-weights/mlx-qwen-image-2-1/materialize-and-verify-immutable-snapshots.sh
    - name: Verify the approved transferred-adapter cache
      id: qwen21_transfer_cache
      if: inputs.qwen_image_2_1_lora_runner == 'rw-mage' && inputs.qwen_image_2_1_lora_phase != 'probe' && inputs.qwen_image_2_1_lora_phase
        != 'current-diagnostic' && inputs.qwen_image_2_1_lora_phase != 'current-trajectory'
      shell: bash
      run: |
        [[ "$RUNNER_NAME" == "nax-macos-2" ]]
        cache_base="$HOME/sceneworks-rw-weights"
        [[ "$cache_base" == /* && -d "$cache_base" && ! -L "$cache_base" ]]
        status="$(python3.12 scripts/ci/qwen21_adapter_imports.py \
          --manifest scripts/ci/qwen21_adapter_imports.json \
          --cache-status --source-cache-root "$cache_base")"
        printf '%s\n' "$status" >> "$GITHUB_OUTPUT"
        if [[ "$status" == "hit=true" ]]; then
          printf 'QWEN21_TRANSFER_CACHE_BASE=%s\n' "$cache_base" >> "$GITHUB_ENV"
        fi
    - name: Verify the approved transferred-adapter artifact identity
      if: inputs.qwen_image_2_1_lora_runner == 'rw-mage' && inputs.qwen_image_2_1_lora_phase != 'probe' && inputs.qwen_image_2_1_lora_phase
        != 'current-diagnostic' && inputs.qwen_image_2_1_lora_phase != 'current-trajectory' && steps.qwen21_transfer_cache.outputs.hit
        == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        metadata="$RUNNER_TEMP/qwen21-transfer-source-37392084691.metadata.json"
        [[ ! -e "$metadata" ]]
        gh api --method GET repos/SceneWorks/inference/actions/artifacts/11383988900 > "$metadata"
        python3.12 scripts/ci/qwen21_adapter_imports.py \
          --manifest scripts/ci/qwen21_adapter_imports.json \
          --verify-source-artifact --source-artifact-metadata "$metadata"
    - name: Download and verify the approved transferred-adapter source
      if: inputs.qwen_image_2_1_lora_runner == 'rw-mage' && inputs.qwen_image_2_1_lora_phase != 'probe' && inputs.qwen_image_2_1_lora_phase
        != 'current-diagnostic' && inputs.qwen_image_2_1_lora_phase != 'current-trajectory' && steps.qwen21_transfer_cache.outputs.hit
        == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        archive="$RUNNER_TEMP/qwen21-transfer-source-37392084691.zip"
        source_root="$RUNNER_TEMP/qwen21-transfer-source-37392084691"
        [[ ! -e "$archive" && ! -e "$source_root" ]]
        partial="$(mktemp "$RUNNER_TEMP/qwen21-transfer-source-37392084691.XXXXXX.zip")"
        trap 'rm -f "$partial"' EXIT
        gh api --method GET repos/SceneWorks/inference/actions/artifacts/11383988900/zip > "$partial"
        mv "$partial" "$archive"
        python3.12 scripts/ci/qwen21_adapter_imports.py \
          --manifest scripts/ci/qwen21_adapter_imports.json \
          --extract-source-archive "$archive" --archive-destination "$source_root" \
          --source-artifact-metadata "$RUNNER_TEMP/qwen21-transfer-source-37392084691.metadata.json"
    - name: Atomically stage the approved transferred-adapter cache
      if: inputs.qwen_image_2_1_lora_runner == 'rw-mage' && inputs.qwen_image_2_1_lora_phase != 'probe' && inputs.qwen_image_2_1_lora_phase
        != 'current-diagnostic' && inputs.qwen_image_2_1_lora_phase != 'current-trajectory' && steps.qwen21_transfer_cache.outputs.hit
        == 'false'
      shell: bash
      run: |
        [[ "$RUNNER_NAME" == "nax-macos-2" ]]
        cache_base="$HOME/sceneworks-rw-weights"
        python3.12 scripts/ci/qwen21_adapter_imports.py \
          --manifest scripts/ci/qwen21_adapter_imports.json \
          --stage-source "$RUNNER_TEMP/qwen21-transfer-source-37392084691/imports/adapters" \
          --source-cache-root "$cache_base" \
          --source-artifact-metadata "$RUNNER_TEMP/qwen21-transfer-source-37392084691.metadata.json"
        printf 'QWEN21_TRANSFER_CACHE_BASE=%s\n' "$cache_base" >> "$GITHUB_ENV"
    - name: Materialize hash-pinned transferred adapters
      if: inputs.qwen_image_2_1_lora_phase != 'probe' && inputs.qwen_image_2_1_lora_phase != 'current-diagnostic' && inputs.qwen_image_2_1_lora_phase
        != 'current-trajectory'
      env:
        GH_TOKEN: ${{ github.token }}
      run: source scripts/ci/real-weights/mlx-qwen-image-2-1/materialize-hash-pinned-transferred-adapters.sh
    - name: Run the Qwen-Image 2.1 LoRA/LoKr real-weight gates
      run: source scripts/ci/real-weights/mlx-qwen-image-2-1/run-the-qwen-image-2-1-lora-real-weight-gates.sh
    - name: Keep the Qwen-Image 2.1 MLX evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qwen-image-2-1-mlx-evidence
        path: ${{ runner.temp }}/qwen-image-2-1-mlx-evidence
        if-no-files-found: error
        retention-days: 30
