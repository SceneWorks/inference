name: Real-weight validation

# STEP BODIES OVER ~300 BYTES LIVE IN scripts/ci/real-weights/<job>/<step>.{sh,cmd,ps1}.
#
# GitHub refuses a workflow file over 512,000 bytes (every run then startup-fails), and this file
# reached 509,886. A step runs its body in its own shell process -- `source` (bash), `call` (cmd),
# `. ./` (powershell) -- so options, variables and exit status are exactly as if it were inline.
# Bodies that interpolate `${{ }}` stay inline. `scripts/ci/real_weights_workflow.py` restores the
# inline view for policy tests; `WorkflowFileSizeTests` keeps every workflow under 450,000 bytes.

# RUNNER LABELS NAME WEIGHT SETS, NOT MACHINES.
#
# Each macOS job selects the label of the weight set it needs, and a box carries the labels for
# the sets it actually stores. Moving a family between Macs is then a runner-label change with no
# edit here — which is the point, because the placement below is a disk-budget decision that will
# keep moving, and it should not cost a workflow PR each time.
#
#   LABEL       WEIGHT SET                                          ON DISK   HOST
#   rw-mage     Mage-Flow x4 + Z-Image + the Mage oracle bundle      ~96 GiB   nax-macos-2
#   rw-mage     Qwen-Image + Qwen-Image-Edit + Fun-Controlnet-Union  ~170 GiB  nax-macos-2
#               MLX re-hosts, both PiD students, Gemma-2-2B,
#               FLUX.1-dev, two lightx2v Lightning LoRAs  (sc-17284)
#   rw-mage     MiniMax-H3 upstream slice: vae/ + audio_vae/ +        ~10.8 GiB BOTH boxes
#               FL2VA/audio_vae/ + tokenizer/ + the TE shard index,
#               PLUS the ~840 KB operator diffusers VAE reference
#               (`MINIMAX_H3_VIDEO_VAE_REFERENCE`)  (sc-18932)
#   rw-sa3      Stable Audio 3 / SAME + F3 Krea q4 base cache        pinned    nax-macos
#   rw-krea     Krea Realtime 14B + Wan style/distill LoRAs          ~20 GiB   nax-macos-2
#   rw-audio    Kokoro, MOSS SFX/TTSD/TTS-Realtime, ACE-Step, ...    ~42 GiB   nax-macos-2
#   rw-llm      SmolLM2-135M + Qwen3-0.6B + JoyCaption               ~19 GiB   nax-macos-2
#   rw-chroma   none stored; materializes from the Hub per run       ~0        BOTH boxes
#   rw-starvector StarVector 1B + 8B terminal snapshots              ~19 GiB   nax-macos
#
# `qwen38-bonsai-mlx` is the one campaign-local exception to this reusable weight-set scheme.
# It is dispatch-only, selects the exact `nax` runner capability, verifies `runner.name ==
# 'nax-macos'`, and then binds two SC-23935 preserved snapshot aliases before qualification. Those
# frozen campaign paths are not a portable weight set, so assigning them a permanent `rw-*` label
# would misrepresent their lifecycle. StarVector remains on `rw-starvector` because its terminal
# snapshots are a reusable provisioned set. The workflow-policy tests pin every part of this
# exception and continue to reject `real-weights` on every other macOS job.
#
# `rw-chroma` carries no stored bytes, so it is registered on both boxes and its jobs land on
# whichever is free — verified 2026-08-04 by mapping `runner_name` across the last 40 runs, where
# all three `Chroma packed auxiliaries` matrix legs are observed on `nax-macos` AND `nax-macos-2`.
# This row read `nax-macos-2` until then, which understated the contention it adds to that box.
#
# ON DISK is GiB as `du -sh` reports it, summed over each set's `models--*` repo directories.
# MEASURED 2026-08-03 (sc-17271); previously these were arithmetic, and rw-audio was carrying a
# ~3 GiB overstatement from being derived as 34 + 11 rather than measured. If you edit a row,
# measure it — and say which unit, because 42 GiB and 45 GB are the same number of bytes.
#
# `rw-mage` is currently registered only on `nax-macos-2`, verified from the live org runner
# inventory on 2026-08-11. It had previously been registered on both boxes, so do not infer the
# current pool from historical job placement. The label remains the placement mechanism; moving it
# is an operator action and does not require a workflow edit.
#
# The invariant that makes such a move safe is the oracle bundle. `MAGE_ORACLE_SEED_DIR` is
# `~/Library/Application Support/SceneWorks/oracles/sc-14052-mage-flow` — a `~/`-relative value
# resolved per-runner by `resolve_snapshot_paths.py`, so it is ONE setting naming a DIFFERENT
# directory on each box. It exists on no Hub and this workflow deliberately refuses to regenerate it
# in Actions, so it cannot self-heal. Therefore: **every box carrying `rw-mage` must have the bundle
# provisioned by hand, and adding the label to a box without it is what actually breaks `mlx-media`
# — not moving the label around.**
#
# sc-18932 added a SECOND asset in that class, and it is a per-box requirement for the same reason:
# `MINIMAX_H3_VIDEO_VAE_REFERENCE`, the ~840 KB `(latent, decoded)` pair produced by running the
# official diffusers `AutoencoderKLMiniMaxH3` over the real `vae/`. It exists on no Hub, this
# workflow refuses to regenerate it (no approved wheel lock is a torch environment), and without it
# `mlx-minimax-h3` fails closed on its last step — deliberately, because that step is the only gate
# in either backend that can catch a layout error against real weights. Producer command and the
# variable convention are in that job.
#
# Both boxes had the bundle when checked on 2026-08-05, but that historical fact is not a current
# label or filesystem guarantee. `Require operator-provisioned Mage oracle seed` remains the live
# enforcement: it fails closed with a named error on a cache miss, so a box that quietly loses its
# copy surfaces as a red `mlx-media`, never a wrong oracle.

# `rw-sa3` materializes its SA3/SAME rows into `RUNNER_TEMP`, but SC-18315 also uses that label to
# select `nax-macos`, where the large F3 Krea q4 base is operator-provisioned. The lane materializes
# the manifest-pinned Krea license and standalone Wan z16 donor itself, then verifies the donor's
# fixed SHA-256. Moving the label requires moving the q4 base and preserving Hub access. It also
# needs the runner-local Hugging Face credential for the six gated `stabilityai/*` repos.
#
# The sc-17284 Qwen/FLUX set is the largest row here and it transferred almost nothing: all of it
# but the two ~0.85 GB Lightning LoRAs was already resident. "Already there" is still not "free" —
# these were opportunistic app/dev cache that could be reclaimed, and wiring them makes them
# CI-REQUIRED; the 31.4 GiB FLUX.1-dev snapshot in particular changes status because `flux-1-dev`
# gains `media-macos`. Measured 2026-08-04 with `du -sh` over the nine `models--*` repo dirs on
# `nax-macos`; the two scheduled jobs consume ~131 GiB of that (`q4` is stored, no wired test
# selects it).
#
# THE TWO BOXES ARE NOT EQUALLY TIGHT, so read that cost per host. `nax-macos` is the 98% box
# (sc-17271). `nax-macos-2` reported 1.0 TiB free at 45% capacity on 2026-08-05, with the 85 GiB
# `qwen-image-mlx` re-host already resident there too — measured by this lane's own
# `report_runner_disk_headroom.sh` step, which is what that step is for. The other six models in
# the set are NOT confirmed on `nax-macos-2`; a job landing there materializes whatever is missing.
#
# A LABEL NO RUNNER CARRIES DOES NOT FAIL — IT QUEUES, SILENTLY, UNTIL THE RUN IS CANCELLED.
# Retiring a box means moving its labels first.
#
# EVERY macOS STEP NAMES `python3.12`, NEVER BARE `python3`.
#
# The macOS wheel lock is a reviewed CPython 3.12 set (its header resolves with `--abi cp312`) and
# every pin in it floors at 3.10. Bare `python3` is not that interpreter — it is whatever the
# runner's launchd `.path` resolves first, and on a box where /usr/bin precedes Homebrew that is
# Apple's system Python 3.9. pip on 3.9 does not report the mismatch as a version problem: it
# filters the whole reviewed set out of the candidate list and calls the pin nonexistent
# ("No matching distribution found for anyio==4.14.2", or click==8.4.2 against an older lock).
# That took out every rw-* job on nax-macos-2 on 2026-08-03, hours after the split above first
# routed twelve jobs onto a box whose `python3` is 3.9.6.
#
# The `PYTHONPATH=… python3.12 scripts/release/…` lines are load-bearing for the same reason one
# stage later: they import the tree the pip step installed, so they must be the same interpreter
# that installed it. scripts/tests/test_ci_workflow_policy.py enforces both halves; a bare
# `python3` anywhere in a macOS job fails that gate.
#
# EVERY WINDOWS PYTHON CONSUMER USES THE EXACT UV-MANAGED 3.12.10 PATH.
#
# A 2026-08-12 runner restart changed the registered `py` default to 3.14, then setup-python's
# attempt to restore 3.12 blocked behind an operator-observed Windows elevation prompt. A prompt can
# never be satisfied by unattended CI. Each Windows job therefore installs pinned uv, asks it for a
# managed 3.12.10 with both registry and launcher mutation disabled, and exports the absolute
# interpreter path. The workflow policy rejects setup-python, bare launchers, version drift, or any
# Python consumer that runs before that path is resolved.

on:
  schedule:
    # 02:00 UTC Monday = 22:00 EDT Sunday. The macOS jobs are split across two self-hosted Metal
    # runners by the labels above, but each box still runs its own share one at a time, so this run
    # wants a whole night rather than a Sunday-morning start that bleeds into the working day.
    # Cron is always UTC and does not
    # follow US daylight time, so this lands at 21:00 EST once the clocks go back — still Sunday
    # night, which is what matters. GitHub's scheduler also drifts under load (2026-08-02 the old
    # cron fired ~2h late), so treat the start time as approximate.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Real-weight profile to run
        type: choice
        required: true
        default: all
        # `audio` still runs every audio family. The `audio-*` entries are the per-family split
        # (sc-16981) — dispatch one provider family without taking the Metal runner for the rest.
        options: [all, llm, llm-joycaption, starvector-terminal, qwen38-bonsai, media, mage-memory-ladder, chroma-auxiliary, chroma-memory-ladder, decode-quality-kolors, decode-quality-sdxl, decode-quality-chroma, qwen-image, qwen-image-pid, qwen-image-producers, request-memory-scope, memory-evidence-v1, sana-drift-ceiling, krea-realtime, krea-kv-cache, krea-alternate-decoder, krea-s18-sweep, minimax-h3, scail2, audio, audio-kokoro, audio-moss-sfx, audio-acestep, audio-voice, audio-chatterbox, audio-asr, audio-moss-tts, audio-moss-tts-realtime, same-l, same-chunked, sa3-small-music, sa3-small-sfx, sa3-medium, sa3-base-identity, sa3-small-base, qwen-image-2-1]
      qwen38_bonsai_preflight_only:
        description: Qualify Qwen/Bonsai host capacity and CUDA operators without provisioning or loading models
        type: boolean
        required: false
        default: false
      qwen38_bonsai_provision_only:
        description: Provision admitted pinned Qwen/Bonsai assets and verify publisher hashes without model execution
        type: boolean
        required: false
        default: false
      sceneworks_revision:
        description: Exact lowercase SceneWorks commit paired with memory-evidence-v1
        type: string
        required: false
        default: ""
      migrate_mage_edit_variant_manifest:
        description: Converge and durably certify the exact Mage manifest pair on the active rw-mage seed after full validation (media only)
        type: boolean
        required: false
        default: false
      # sc-17156 — OFF by default and deliberately not a `profile` option, so it can never ride a
      # bulk `all` sweep. The two reasons are in the step itself; the short version is that the box
      # behind `[self-hosted, windows, cuda, real-weights]` is ONE machine (`MICHAEL-TRX50`) with two
      # listeners, `default_device()` hardcodes `cuda:0`, and the probe's own idle-baseline guard
      # turns a co-tenant into a red rather than a wrong number — so a multi-hour render must be
      # dispatched alone rather than raced against whatever else the sweep put on the card.
      minimax_h3_vram_probe:
        description: Measure MiniMax-H3 candle vramGbByTier (minimax-h3 profile; needs the FULL snapshot and an idle card)
        type: boolean
        required: false
        default: false
      publish_chroma_artifacts:
        description: Publish validated Chroma q4/q8 artifacts (chroma-auxiliary profile only)
        type: boolean
        required: false
        default: false
      chroma_publish_confirmation:
        description: Type sc-16462 to authorize Chroma artifact publication
        type: string
        required: false
        default: ""
      chroma_model:
        description: Chroma model to validate; publication always requires all
        type: choice
        required: false
        default: all
        options: [all, chroma1_base, chroma1_hd, chroma1_flash]
      # sc-15520 — the memory ladder in dispatchable pieces, for the same reason `krea_s18_rows`
      # exists: `rw-chroma` shares nax-macos-2 with `rw-krea`, `rw-audio` and `rw-llm` one at a
      # time, and the whole 16-test ladder at the 28-step production schedule is multi-hour per
      # entry, so an indivisible run head-of-line-blocks the box for a night. `chroma_model`
      # already splits by entry; this splits within one.
      #
      # Space-separated test names, each validated against the ladder's own list before anything
      # runs — an unknown or renamed name is a HARD ERROR at dispatch rather than a filter that
      # quietly matches nothing. Empty (the default) is the whole ladder.
      chroma_ladder_tests:
        description: "Ladder tests (chroma-memory-ladder only): space-separated subset, empty = all 16"
        type: string
        required: false
        default: ""
      # The ladder measures `q4` (`DEFAULT_TIER`) for every asserted row; the other two tiers are
      # swept only by the per-cell coverage test, which reports absentees rather than demanding
      # them. Downloading all three roughly quadruples the transfer for evidence nothing asserts,
      # so widening this is opt-in.
      chroma_ladder_tiers:
        description: "Ladder tiers (chroma-memory-ladder only): space-separated subset of q4 q8 bf16"
        type: string
        required: false
        default: "q4"
      # sc-17655 — the S18 sweep in row-sized pieces. The whole seven-row sweep is ~4.3 h and
      # `rw-krea` shares nax-macos-2 with `rw-audio`, `rw-llm` and `rw-chroma` one at a time, so an
      # indivisible run head-of-line-blocks them for half a night (sc-16981). sc-17324 needed TWO
      # powered dispatches to learn this: run 30948568453 lost the runner outright 2h42m in, and its
      # replacement 30964561686 was cancelled by hand at 54m precisely because it was blocking the
      # box. One row is 3-53 min. The defaults are the full sweep, so an
      # operator who ignores these gets exactly the previous behaviour.
      #
      # A subset that is not the whole A/D/F dose ladder measures its cells and DELIBERATELY prints no
      # verdict — re-aggregate the uploaded `s18-cells.tsv` files afterwards with
      # `s18_verdict_from_accumulated_cells`, which applies the same rule to the assembled evidence.
      krea_s18_rows:
        description: "S18 sweep rows (krea-s18-sweep only): subset of ABCDFEZ, e.g. AD for one dispatch"
        type: string
        required: false
        # NOT ABCDFEZ — F and E do not fit on this lane's runner at the pinned 832x480, and the
        # preflight refuses them, so a default of all seven would be a default that always fails.
        # sc-17324, from measurement:
        #   * F (30-frame window, 46,800 tokens, ~49 GiB) killed nax-macos-2 twice. Run it at
        #     KREA_SMOKE_W=640 KREA_SMOKE_H=384, where it needs ~34 GiB — the bucket the recorded
        #     sc-15127 sweep already used for it.
        #   * E (global window, 70,200 tokens, ~63-69 GiB) is UNMEASURABLE on this infrastructure.
        #     It fit the 128 GiB dev Mac by 0.3 GiB and fills a boot volume with swap even at
        #     640x384 (sc-15571). It is a reference row the verdict rule explicitly refuses to use
        #     as attribution evidence, so nothing downstream depends on having it.
        default: ABCDZ
      krea_s18_seeds:
        description: "S18 sweep seeds (krea-s18-sweep only): comma-separated; 2+ for a between-seed spread"
        type: string
        required: false
        default: "7,11,23"
      # WxH as one input because `workflow_dispatch` is capped at 10 and this dispatcher already
      # carries 8. Needed because row F does not fit at the default 832x480 on this lane's runner
      # (~49 GiB, two dead runners) but does at 640x384 (~34 GiB) — without this the fallback bucket
      # is unreachable and row F is simply unrunnable, which is not the same thing as unmeasurable.
      # The optional `@q<bits>` suffix selects the sc-17807 KV cache tier. It rides this input for
      # the same reason WxH does: the dispatcher is already at the input cap, and a separate
      # `krea_s18_kv_bits` would push it over. Omitted = the shipped bf16 cache, so an unchanged
      # dispatch measures exactly what it measured before. A quantized dispatch is a SEPARATE arm —
      # its cells carry the tier in a 16th S18CELL field and the re-aggregator refuses to pool them
      # with the bf16 baseline.
      #
      # Group size is MLX's default 64 here and is not dispatchable: it would need a `/` in the
      # value, which is not a legal character in the artifact name this input now feeds. The Rust
      # knob (`KreaArConfig::kv_cache_quant`) still carries an arbitrary group size for a caller who
      # wants one; only this shorthand is fixed.
      krea_s18_geometry:
        description: "S18 sweep geometry (krea-s18-sweep only), WxH[@q<bits>] — 640x384 for row F, e.g. 640x384@q8"
        type: string
        required: false
        default: 832x480

permissions:
  contents: read

concurrency:
  group: inference-real-weights-physical-host
  cancel-in-progress: false

# BUILD ARTIFACTS OUTSIDE THE DIRECTORY `actions/checkout` CLEANS.
#
# `actions/checkout` defaults to `clean: true`, which is `git clean -ffdx` in the repo directory.
# `target/` is gitignored (.gitignore:79), so `-x` deletes it, and every job on a persistent box
# therefore paid a full cold build. Measured on `nax-macos` 2026-08-04: the whole of
# `target/debug/deps` carried a single job's timestamps (CACHEDIR.TAG 21:58, newest artifact
# 22:16) — 13 GB rebuilt from nothing, per job, on the scarcest hardware in the fleet.
#
# `github.workspace` is `_work/<repo>/<repo>`; its parent is the runner's per-repo work directory,
# which checkout does not touch and the runner does not recreate between jobs (only `_temp` is).
# So `../cargo-target` survives the clean while staying scoped per repo and per box. The `github`
# context is one of the three available to a workflow-level `env` (with `vars` and `inputs`) —
# `runner.workspace` would read better here but the `runner` context is step-level only, and a
# job-level twin would have to be repeated across all 37 jobs.
#
# Deliberately workflow-level, so the Windows CUDA real-weight jobs get the same treatment: the
# mechanism is `clean: true` plus a persistent runner, which is exactly their situation too.
# The two Chroma jobs keep their own `${{ runner.temp }}` target dirs — those are per-run by
# design (sc-16462 builds a tier from source and must not see a previous run's artifacts).
#
# Cargo keys artifacts by profile and features, so the weekly `--release` lane and any debug
# build coexist here rather than evicting each other. The cost is a persistent tens-of-GB
# directory per box; `nax-macos` was at 247 GiB free when this landed. If a box ever runs short,
# delete the directory — it is a cache, and the next job rebuilds it exactly as before.
#
# NB the `timeout-minutes` rationale on several jobs below still cites "the cold build that
# `clean: true` forces every week" as part of its sizing. Those budgets are now loose by that
# margin; re-sizing them from the first weekly run that executes with a warm target directory is
# sc-17057's scope, and they stay unchanged here rather than being guessed down (sc-16981).
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target

jobs:
  # SC-16462: build the complete packed Chroma tier from the exact currently-shipped bf16 source,
  # then prove progressive T5/VAE packed-vs-load-time identity, component quality, T5 residency,
  # and a coherent end-to-end render for base/HD/Flash at q4 and q8. Publication is a separate,
  # explicit mode of the same green lane; it fails closed on the expected current Hub revision and
  # runner-local HF auth.
  mlx-chroma-auxiliary:
    name: Chroma packed auxiliaries (${{ matrix.model }})
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'chroma-auxiliary'
    runs-on: [self-hosted, macOS, ARM64, rw-chroma]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - model: chroma1_base
            repository: SceneWorks/chroma1-base-mlx
            source_revision: e7330dda29d00ffdeeb719b28e92ee74cff0884c
          - model: chroma1_hd
            repository: SceneWorks/chroma1-hd-mlx
            source_revision: 9d99afe1ebca67032476756bc70d4a7152bc1bd5
          - model: chroma1_flash
            repository: SceneWorks/chroma1-flash-mlx
            source_revision: 6a9cb6178709559461506bf247f708d0d1008d00
    env:
      CHROMA_MODEL: ${{ matrix.model }}
      CHROMA_REPOSITORY: ${{ matrix.repository }}
      CHROMA_SOURCE_REVISION: ${{ matrix.source_revision }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Validate publication authorization
        if: inputs.publish_chroma_artifacts && (inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model)
        run: |
          if [[ "${{ inputs.chroma_publish_confirmation }}" != "sc-16462" ]]; then
            echo "Publishing requires chroma_publish_confirmation=sc-16462" >&2
            exit 1
          fi
      - name: Materialize the exact shipped bf16 source
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        env:
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
          CHROMA_SNAPSHOT: ${{ runner.temp }}/chroma-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
        run: source scripts/ci/real-weights/mlx-chroma-auxiliary/materialize-the-exact-shipped-bf16-source.sh
      - name: Build and validate packed q4/q8 tiers
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        env:
          SC16462_MODEL: ${{ matrix.model }}
          SC16462_OUT: ${{ runner.temp }}/chroma-packed-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_PACKED_ROOT: ${{ runner.temp }}/chroma-packed-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_PAYLOAD_MANIFEST: ${{ runner.temp }}/chroma-sc16462-payload-sha256.json
          CHROMA_SNAPSHOT: ${{ runner.temp }}/chroma-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-chroma-sc16462
        run: source scripts/ci/real-weights/mlx-chroma-auxiliary/build-and-validate-packed-q4-q8-tiers.sh

      - name: Upload Chroma calibration evidence
        if: always() && (inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chroma-sc16462-${{ matrix.model }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/chroma-sc16462-identity.jsonl
            ${{ runner.temp }}/chroma-sc16462-comparison.jsonl
            ${{ runner.temp }}/chroma-sc16462-payload-sha256.json

  # Publication cannot begin until every Base/HD/Flash validation leg above is green. Each repo
  # receives q4+q8 in one parent-guarded commit. A retry explicitly verifies an already-published
  # repo byte-for-byte and treats it as success, making a cross-repository partial run resumable.
  mlx-chroma-publish:
    name: Publish Chroma packed auxiliaries (${{ matrix.model }})
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'chroma-auxiliary' && inputs.publish_chroma_artifacts && inputs.chroma_model == 'all'
    needs: mlx-chroma-auxiliary
    runs-on: [self-hosted, macOS, ARM64, rw-chroma]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - model: chroma1_base
            repository: SceneWorks/chroma1-base-mlx
            source_revision: e7330dda29d00ffdeeb719b28e92ee74cff0884c
          - model: chroma1_hd
            repository: SceneWorks/chroma1-hd-mlx
            source_revision: 9d99afe1ebca67032476756bc70d4a7152bc1bd5
          - model: chroma1_flash
            repository: SceneWorks/chroma1-flash-mlx
            source_revision: 6a9cb6178709559461506bf247f708d0d1008d00
    env:
      CHROMA_MODEL: ${{ matrix.model }}
      CHROMA_REPOSITORY: ${{ matrix.repository }}
      CHROMA_SOURCE_REVISION: ${{ matrix.source_revision }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate publication authorization
        run: |
          if [[ "${{ inputs.chroma_publish_confirmation }}" != "sc-16462" ]]; then
            echo "Publishing requires chroma_publish_confirmation=sc-16462" >&2
            exit 1
          fi
      - name: Download the validated payload manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chroma-sc16462-${{ matrix.model }}
          path: ${{ runner.temp }}/chroma-sc16462-validated-${{ matrix.model }}
