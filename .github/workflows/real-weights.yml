name: Mac-2 local pinned Qwen model provisioning

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # bind this model-only run to its exact live Mac-2 job

concurrency:
  group: sc-24163-mac2-local-model-provision-v1
  cancel-in-progress: false

jobs:
  model-provision:
    name: Mac-2 model-only pinned snapshot provisioning
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 60
    steps:
      - name: Verify or provision only the two frozen model snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3.12 - <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import subprocess
          import sys
          import tempfile
          import urllib.request

          def utc():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()

          if os.environ.get("RUNNER_NAME") != "nax-macos-2":
              raise SystemExit("refused: runner nax-macos-2 required")
          if os.environ.get("GITHUB_REPOSITORY") != "SceneWorks/inference":
              raise SystemExit("refused: exact repository required")
          run_id, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          if not run_id.isdecimal() or not attempt.isdecimal():
              raise SystemExit("refused: numeric run identity required")
          temporary = Path(os.environ["RUNNER_TEMP"])
          if not temporary.is_absolute() or temporary.is_symlink():
              raise SystemExit("refused: absolute nonsymlink runner temporary directory required")
          output = temporary / f"sc-24163-mac2-model-provision-{run_id}-{attempt}"
          output.mkdir(exist_ok=False)
          source = output / "source"
          source.mkdir()
          closure = [['scripts/release/ensure_model_snapshot.py', '7dbe031914a2b1c2451772f8f10e467f0dc78e9a', '7c95cb5bc69dfa238c638362c91cde4175b9067477c4bef6bfd0b94970ffd234'], ['scripts/release/verify_model_snapshot.py', 'c5b661296fea6679de65ad11e9c0537eb8445f5f', 'c3258dea95b3615a2d141a2204ea7089cd8c90becc61c842afbe91ed818724c4'], ['scripts/ci/qwen21_weights_root.py', '30ddab6eead179725810b7bb69d4f41d1d78df78', '5daa3d64ae0324fa3262a8b93edb54c876513ea006e416fb0430a76b7f05b374'], ['release/real-weight-models.toml', '9b58e48e5735266b31b30e475294c9692435ec84', '55a6a46439d2e325b481d07f99ef92aec692c534dbd48686f0be616b658f4fc9'], ['.github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt', '8ba48dafce0761be60afd97df48900c2493776cd', 'd423ea4de26af47cbcb274c3bc12a9ddb4b59ae815963efec12555b4e09e62cf']]
          receipt = {
              "kind": "MODEL_PROVISION_DIAGNOSTIC_ONLY", "modelOnly": True,
              "nativeAcceptance": False, "acceptanceEvidence": False,
              "trainingSteps": 0, "renderCount": 0, "replayCount": 0, "buildCount": 0,
              "sourceSha": "eb0d625ae581f4862474e88ddab528efec0392fd",
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": run_id, "runAttempt": attempt, "job": os.environ["GITHUB_JOB"],
              "runnerName": os.environ["RUNNER_NAME"], "expectedRunnerId": 5281,
              "priorCensus": {"runId": 37768823736, "runAttempt": 1, "jobId": 113283005478},
              "hostCensusAcceptanceSha256": "b95fefd280c2679542ce36e3b16b342e095cddd0a136ec35fedd8c06fcc0bb94",
              "startedUtc": utc(), "status": "INITIALIZED", "sourceClosure": [],
              "models": [], "modelDownloadCalls": 0, "modelDownloadBytes": 0,
              "dependencyInstallPerformed": False,
          }
          identity_path = output / "MODEL_PROVISION_DIAGNOSTIC_ONLY.json"
          def save():
              identity_path.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          save()
          try:
              live_request = urllib.request.Request(
                  f"https://api.github.com/repos/SceneWorks/inference/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "sc-24163-mac2-model-provision"})
              with urllib.request.urlopen(live_request, timeout=20) as response:
                  live_raw = response.read(2 * 1024 * 1024 + 1)
              if len(live_raw) > 2 * 1024 * 1024:
                  raise ValueError("live job response exceeds 2 MiB bound")
              jobs = json.loads(live_raw)
              matches = [job for job in jobs.get("jobs", [])
                         if job.get("name") == "Mac-2 model-only pinned snapshot provisioning"]
              if jobs.get("total_count") != 1 or len(matches) != 1:
                  raise ValueError("exact unique provisioning job required")
              live = matches[0]
              if (live.get("runner_id") != 5281 or live.get("runner_name") != "nax-macos-2"
                      or live.get("run_id") != int(run_id) or live.get("status") != "in_progress"
                      or live.get("head_sha") != os.environ["GITHUB_SHA"]):
                  raise ValueError("live job/source/Mac-2 identity mismatch")
              receipt["jobId"] = live["id"]
              receipt["runnerId"] = live["runner_id"]
              receipt["runnerLabels"] = live.get("labels", [])
              home = Path.home().resolve(strict=True)
              root = home / "sceneworks-rw-weights"
              hub, xet = root / "hub", root / "xet"
              for directory in (root, hub, xet):
                  if directory.is_symlink() or not directory.is_dir():
                      raise ValueError("existing nonsymlink protocol directory required: " + str(directory))
                  if directory.resolve(strict=True) != directory or directory.stat().st_dev != home.stat().st_dev:
                      raise ValueError("protocol cache must remain on the home Data volume")
              receipt["diskQueries"] = {}
              def bounded_disk_query(label, command):
                  with tempfile.TemporaryFile() as stdout, tempfile.TemporaryFile() as stderr:
                      timed_out = False
                      try:
                          result = subprocess.run(command, stdout=stdout, stderr=stderr,
                                                  check=False, timeout=10)
                          returncode = result.returncode
                      except subprocess.TimeoutExpired:
                          timed_out, returncode = True, None
                      stdout.seek(0)
                      stderr.seek(0)
                      raw_stdout, raw_stderr = stdout.read(65537), stderr.read(65537)
                  truncated = len(raw_stdout) > 65536 or len(raw_stderr) > 65536
                  receipt["diskQueries"][label] = {
                      "argv": command, "returncode": returncode, "timedOut": timed_out,
                      "truncated": truncated, "outputLimitBytesPerStream": 65536,
                      "stdoutBase64": base64.b64encode(raw_stdout[:65536]).decode("ascii"),
                      "stderrBase64": base64.b64encode(raw_stderr[:65536]).decode("ascii"),
                  }
                  save()
                  if timed_out or truncated or returncode != 0:
                      raise ValueError("disk query refused or failed: " + label)
                  return raw_stdout
              df_output = bounded_disk_query("df", ["/bin/df", "-kP", str(root)])
              df_lines = df_output.decode("utf-8", errors="strict").splitlines()
              if len(df_lines) != 2:
                  raise ValueError("exact single cache filesystem row required")
              df_row = df_lines[1].split(None, 5)
              if len(df_row) != 6 or not re.fullmatch(r"/dev/disk[0-9]+(?:s[0-9]+)*", df_row[0]):
                  raise ValueError("cache filesystem must name a numeric local disk device")
              device = df_row[0]
              receipt["cacheFilesystemDevice"] = device
              volume = plistlib.loads(bounded_disk_query(
                  "diskutil", ["/usr/sbin/diskutil", "info", "-plist", device]))
              if volume.get("DeviceIdentifier") != device.removeprefix("/dev/") or volume.get("MountPoint") != df_row[5]:
                  raise ValueError("df/diskutil device or mountpoint mismatch")
              if volume.get("Internal") is not True or volume.get("FilesystemType") != "apfs":
                  raise ValueError("internal APFS cache volume required")
              receipt["localVolume"] = {key: volume.get(key) for key in
                  ("DeviceIdentifier", "Internal", "FilesystemType", "MountPoint", "VolumeName")}
              def disk_facts():
                  stats = os.statvfs(root)
                  block = stats.f_frsize or stats.f_bsize
                  return {"utc": utc(), "deviceId": root.stat().st_dev,
                          "availableBytes": stats.f_bavail * block,
                          "freeBytes": stats.f_bfree * block, "totalBytes": stats.f_blocks * block}
              receipt["diskPre"] = disk_facts()
              receipt["cache"] = {"home": str(home), "root": str(root), "resolvedRoot": str(root.resolve()),
                                  "hub": str(hub), "xet": str(xet), "sameHomeDevice": True}
              # Bind every HF cache before importing the locked client; no shared cache is used.
              bindings = {"HF_HOME": str(root), "HF_HUB_CACHE": str(hub),
                          "HUGGINGFACE_HUB_CACHE": str(hub), "HF_XET_CACHE": str(xet),
                          "MLX_GEN_MODELS_ROOT": str(hub), "PIP_NO_CACHE_DIR": "1"}
              os.environ.update(bindings)
              receipt["cacheEnvironment"] = bindings
              for path, blob, sha256 in closure:
                  request = urllib.request.Request(
                      "https://api.github.com/repos/SceneWorks/inference/git/blobs/" + blob,
                      headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                               "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                               "User-Agent": "sc-24163-mac2-model-provision"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read(2 * 1024 * 1024 + 1)
                  if len(raw) > 2 * 1024 * 1024:
                      raise ValueError("source blob response exceeds 2 MiB bound")
                  body = json.loads(raw)
                  if body.get("sha") != blob or body.get("encoding") != "base64":
                      raise ValueError("source blob identity/encoding mismatch")
                  data = base64.b64decode("".join(body["content"].split()), validate=True)
                  actual_git = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
                  if actual_git != blob or hashlib.sha256(data).hexdigest() != sha256:
                      raise ValueError("source Git/SHA-256 digest mismatch")
                  destination = source / path
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  receipt["sourceClosure"].append({"path": path, "gitBlobSha": blob, "sha256": sha256})
              sys.path[:0] = [str(source / "scripts/release"), str(source / "scripts/ci")]
              from verify_model_snapshot import load_model, verify_snapshot, MATERIALIZATION_INCOMPLETE, MATERIALIZATION_RECEIPT
              from ensure_model_snapshot import ensure_snapshot, hf_cache_location, download_snapshot
              from qwen21_weights_root import verify_root
              verify_root(root)
              pinned = (
                  ("qwen-image-2-1", "Qwen/Qwen-Image-2.1", "790c92633540aa0cb11d9abf19eb46d861714758"),
                  ("qwen-image-2-1-mlx-tiers", "SceneWorks/qwen-image-2-1-mlx", "1691de01c24a070131e0a28bf4c065fd027f4fe9"),
              )
              pending = []
              def safe_cache_target(snapshot, model):
                  if hf_cache_location(snapshot) != (hub, "models--" + model["repository"].replace("/", "--"), model["revision"]):
                      raise ValueError("only canonical pinned task-cache targets permitted")
                  # The frozen helper would retire these markers by deletion. Refuse that repair.
                  for name in (MATERIALIZATION_INCOMPLETE, MATERIALIZATION_RECEIPT):
                      marker = snapshot / name
                      if marker.exists() or marker.is_symlink():
                          raise ValueError("refused: provenance repair would delete existing marker: " + str(marker))
                  for ancestor in (snapshot, snapshot.parent, snapshot.parent.parent):
                      if ancestor.is_symlink() or (ancestor.exists() and not ancestor.is_dir()):
                          raise ValueError("unsafe snapshot ancestor: " + str(ancestor))
              # Verify BOTH snapshots read-only before installing dependencies or making any HF request.
              for key, repository, revision in pinned:
                  model = load_model(source / "release/real-weight-models.toml", key)
                  if model["repository"] != repository or model["revision"] != revision:
                      raise ValueError("frozen model pin mismatch")
                  if model.get("materialization_repository") or model.get("requires_auth", False):
                      raise ValueError("only the two canonical anonymous pinned repositories permitted")
                  snapshot = hub / ("models--" + repository.replace("/", "--")) / "snapshots" / revision
                  safe_cache_target(snapshot, model)
                  row = {"key": key, "repository": repository, "revision": revision, "snapshot": str(snapshot),
                         "initialVerification": "PENDING", "downloadRequested": False, "finalVerification": "PENDING",
                         "verificationScope": "frozen revision/provenance/required files and indexed shard closure; no native execution"}
                  receipt["models"].append(row)
                  try:
                      verify_snapshot(model, snapshot)
                      row.update(initialVerification="COMPLETE", finalVerification="COMPLETE")
                  except RuntimeError as error:
                      row.update(initialVerification="MISSING_OR_INCOMPLETE", initialVerificationDetail=str(error))
                      pending.append((model, snapshot, row))
                  save()
              if pending:
                  if receipt["diskPre"]["availableBytes"] < 100 * 1024**3:
                      raise ValueError("refused: at least 100 GiB local download headroom required")
                  venv = output / "venv"
                  subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True, timeout=90)
                  dependencies = output / "dependencies"
                  with (output / "dependency-install.log").open("w", encoding="utf-8") as log:
                      subprocess.run([str(venv / "bin/python"), "-m", "pip", "install", "--no-cache-dir",
                                      "--disable-pip-version-check", "--only-binary=:all:", "--require-hashes",
                                      "--target", str(dependencies), "-r",
                                      str(source / ".github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt")],
                                     stdout=log, stderr=subprocess.STDOUT, check=True, timeout=300)
                  sys.path.insert(0, str(dependencies))
                  receipt["dependencyInstallPerformed"] = True
                  for model, snapshot, row in pending:
                      verify_root(root)
                      safe_cache_target(snapshot, model)
                      if disk_facts()["availableBytes"] < 100 * 1024**3:
                          raise ValueError("refused: local disk headroom changed before download")
                      def download(**kwargs):
                          expected = {"repo_id": model["repository"], "revision": model["revision"],
                                      "token": False, "cache_dir": str(hub)}
                          if kwargs != expected:
                              raise ValueError("refused: materializer attempted an unapproved download route")
                          row["downloadRequested"] = True
                          receipt["modelDownloadCalls"] += 1
                          receipt["modelDownloadBytes"] = None
                          receipt["downloadBytesScope"] = "SDK transfer bytes not measured; complete cached path reports zero calls/bytes"
                          save()
                          return download_snapshot(**kwargs)
                      fetched = ensure_snapshot(model, snapshot, download)
                      verify_root(root)
                      verify_snapshot(model, snapshot)
                      row.update(materializerDownloaded=fetched, finalVerification="COMPLETE")
                      save()
              receipt["status"] = "MODELS_VERIFIED"
          except Exception as error:
              receipt.update(status="PROVISION_REFUSED_OR_FAILED", errorType=type(error).__name__, error=str(error))
              raise
          finally:
              if "disk_facts" in locals():
                  receipt["diskPost"] = disk_facts()
              receipt["finishedUtc"] = utc()
              save()
              print(json.dumps({"status": receipt["status"], "modelDownloadCalls": receipt["modelDownloadCalls"],
                                "nativeAcceptance": False}))
          PY
      - name: Preserve the model-only provisioning receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc-24163-mac2-model-provision-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sc-24163-mac2-model-provision-${{ github.run_id }}-${{ github.run_attempt }}/MODEL_PROVISION_DIAGNOSTIC_ONLY.json
            ${{ runner.temp }}/sc-24163-mac2-model-provision-${{ github.run_id }}-${{ github.run_attempt }}/dependency-install.log
          if-no-files-found: error
          retention-days: 30
