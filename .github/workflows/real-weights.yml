  candle-mmaudio:
    name: Candle mmaudio real weights (CUDA)
    # mmaudio video->audio runs under the `audio` profile (on the CUDA runner — candle is CUDA/CPU).
    # The MMAudio DiT/VAE (CC-BY-NC-4.0) + DFN5B-CLIP (Apple ML Research License) are research/non-
    # commercial; SceneWorks is non-commercial and surfaces these licenses to the user (epic-12833
    # decision), so running them in the regression guard is in-policy.
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio'
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 120
    env:
      # Three per-repo snapshot dirs the video->audio harness resolves the 5 components from
      # (tests/common/mod.rs): hkchengrex/MMAudio (synchformer + dit 16k/44k + vae 16k/44k + 16k
      # vocoder), canonical apple/DFN5B-CLIP-ViT-H-14-378 (clip), nvidia/bigvgan (44k vocoder).
      MMAUDIO_MMAUDIO_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      MMAUDIO_CLIP_SNAPSHOT: ${{ vars.MMAUDIO_CLIP_SNAPSHOT }}
      # The nvidia 44k vocoder repo. The repository VARIABLE is still named MMAUDIO_BIGVGAN_SNAPSHOT
      # (renaming it is an out-of-band action on the box); the env var the crate reads is
      # MMAUDIO_BIGVGAN_V2_SNAPSHOT, because MMAUDIO_BIGVGAN_SNAPSHOT means hkchengrex/MMAudio's
      # *16k* best_netG.pt everywhere else (manifest + conformance_output.rs) — sc-17266.
      MMAUDIO_BIGVGAN_V2_SNAPSHOT: ${{ vars.MMAUDIO_BIGVGAN_SNAPSHOT }}
      # Standalone encoder conformance (sc-13474): the Synchformer + DFN5B-CLIP encoder tests read
      # their OWN env vars. Point them at the SAME snapshots the video->audio provider tests already
      # materialize above (no extra materialize step needed): synchformer resolves under
      # <MMAUDIO_MMAUDIO_SNAPSHOT>/ext_weights/synchformer_state_dict.pth (model.rs::load), and the CLIP
      # tower at <MMAUDIO_CLIP_SNAPSHOT>/open_clip_pytorch_model.bin (clip.rs::load).
      SYNCHFORMER_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      DFN_CLIP_SNAPSHOT: ${{ vars.MMAUDIO_CLIP_SNAPSHOT }}
      # Standalone component conformance (sc-17266): the MM-DiT / 16k-decoder / 44k-decoder tests
      # each read their own per-component var, all four of which resolve INSIDE the hkchengrex
      # snapshot already materialized above (vae 16k -> ext_weights/v1-16.pth, 16k vocoder ->
      # ext_weights/best_netG.pt, vae 44k -> ext_weights/v1-44.pth, dit 16k ->
      # weights/mmaudio_small_16k.pth). These were declared in release/real-weight-models.toml but
      # exported by no job, so the three test binaries below had never run anywhere.
      MMAUDIO_DIT_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      MMAUDIO_VAE_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      MMAUDIO_BIGVGAN_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      MMAUDIO_VAE_44K_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      # 80 on the Ampere runner; set 120 on a Blackwell runner (matches the other CUDA jobs here).
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: call scripts\ci\real-weights\candle-mmaudio\install-reviewed-cpython-3-12.cmd
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Configure runner-local MMAudio output paths
        shell: cmd
        run: |
          echo MMAUDIO_WAV_OUT=%RUNNER_TEMP%\mmaudio_foley_16k.wav>>"%GITHUB_ENV%"
          echo MMAUDIO_WAV_OUT_44K=%RUNNER_TEMP%\mmaudio_foley_44k.wav>>"%GITHUB_ENV%"
      - name: Materialize and verify immutable snapshots
        shell: cmd
        run: call scripts\ci\real-weights\candle-mmaudio\materialize-and-verify-immutable-snapshots.cmd
      - name: Run mmaudio real-weight renders
        shell: cmd
        run: |
          call "%VCVARS%"
          rem Standalone encoder conformance (sc-13474): the Synchformer sync encoder and the DFN5B-CLIP
          rem visual+text tower — the two component encoders the video->audio pipeline below composes.
          cargo test --locked -p candle-audio-mmaudio --features cuda --release --test conformance -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-audio-mmaudio --features cuda --release --test clip_conformance -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-audio-mmaudio --features cuda --release --test conformance_video_to_audio -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-audio-mmaudio --features cuda --release --test conformance_video_to_audio_44k -- --ignored --nocapture || exit /b 1
      # Standalone component conformance (sc-17266). These three binaries were never invoked by any
      # lane, so the MM-DiT flow/sampler and both decoder stages had ZERO automated coverage even
      # though the manifest declared and pinned their checkpoints.
      #
      # Selected by name with `--exact` + a run-count assertion, NOT by whole test binary: an
      # `#[ignore]` test that stops matching reports "0 passed; N filtered out" and cargo exits 0, so
      # a rename would silently delete the only coverage these have. `--exact` must come AFTER `--`;
      # before it, cargo rejects the argument outright and the step never runs at all.
      #
      # The last five entries are the torch-parity gates (sc-17285) — the strongest correctness
      # evidence this port has. The conformance tests above prove shape, finiteness, range and
      # determinism; only these compare the candle numbers against the PyTorch reference, so only
      # these would catch a subtly wrong weight mapping that still produces plausible audio.
      #
      # All five were unreachable until sc-17285: each read a dump path from an environment variable
      # that no workflow set and no committed script produced. Two of them —
      # conformance_output::output_16k_matches_reference (then `output_parity_dump`) and
      # mmdit_conformance::mmdit_matches_reference — additionally `return`ed early to a PASSING
      # result when their variable was unset, which is why sc-17266 had to exclude them by name
      # here rather than inherit a vacuous green. Their references are now committed fixtures under
      # tests/fixtures/, resolved from CARGO_MANIFEST_DIR by
      # `scripts/reference/mmaudio_reference.py`, so there is no unset case and no exclusion left.
      - name: Run mmaudio standalone component and torch-parity conformance
        shell: cmd
        run: call scripts\ci\real-weights\candle-mmaudio\run-mmaudio-standalone-component-and-torch-parity-conformanc.cmd

  # sc-18932 — the candle half of the MiniMax-H3 wiring. Same defect as `mlx-minimax-h3` above:
  # `candle-gen-minimax-h3/tests/real_weights.rs` (sc-17154) reads `MINIMAX_H3_SNAPSHOT` and no
  # workflow set it, so its eight tests ran nowhere. This is NOT sc-18677 — that story provisioned
  # the weights on this runner and generalized `windows-candle.yml`, which lives in the SceneWorks
  # repository; the inference-side inventory row and this lane are what was left over.
  #
  # WHAT THIS RUNS:
  #   * the five gates that read safetensors headers, published JSON, and four 12-tap filter
  #     buffers. Measured 2026-08-13 on nax-macos (same code, CPU device, release): 0.00 s each for
  #     the four that existed then; `declared_encoder_shapes_match_the_published_checkpoint` landed
  #     later (sc-19008, 2026-08-14) and is the same shape — `shard_shapes` reads the `vae/` headers
  #     and nothing else, so it touches no device and needs no component this row does not fetch.
  #     `--features cuda` is carried anyway because compiling this crate on the CUDA lane is itself
  #     coverage nothing else provides — no existing job builds `candle-gen-minimax-h3` with it.
  #   * the three f32 decode smokes (sc-19414). They were held out of the original wiring for one
  #     stated reason — no VRAM figure for this box existed anywhere — and that reason is now
  #     retired by measurement rather than by assumption or by a guessed constant.
  #
  # THE VRAM DECISION (sc-19414). Two independent numbers, and BOTH had to be measured; the first
  # version of this paragraph measured only the supply side and inherited the demand side from a
  # pre-existing comment that was wrong.
  #
  # SUPPLY. `CUDA_COMPUTE_CAP` names an architecture, never a capacity, so the number had to come
  # off the hardware. It did, from `nvidia-smi` in the "Toolchain and hardware versions" step of
  # OTHER jobs in this same `[self-hosted, windows, cuda, real-weights]` pool, in run 31353865709
  # (the 2026-08-10 weekly): job 93349696046 on `cuda-windows` and job 93349696033 on
  # `cuda-windows-2`. Both report `Machine name: 'MICHAEL-TRX50'` — the two `real-weights` CUDA
  # listeners are two agents on ONE physical box, sharing one pair of GPUs:
  #
  #   GPU 0  NVIDIA RTX PRO 6000 Blackwell     19 MiB / 97887 MiB
  #   GPU 1  NVIDIA RTX PRO 6000 Blackwell   1370 MiB / 97887 MiB     driver 596.36, CUDA 13.2
  #
  # 97887 MiB is 95.59 GiB per card, and `candle_gen::default_device()` is compile-time
  # `Device::new_cuda(0)`, so every decode here lands on GPU 0 — the card with 19 MiB in use.
  #
  # DEMAND, measured from the published safetensors HEADERS of snapshot 939557dc (no weights read):
  # **`vae/` is entirely F32** — 703 tensors, 0 of them bf16, 9.7002 GiB / 10.4155 GB. Loading it at
  # f32 is therefore a NO-OP CAST, not a doubling. The bf16 component in this checkpoint is
  # `transformer/` (626 of 638 tensors BF16, 61.73 GiB / 66.28 GB), which this row does not fetch.
  # The two video decodes call `MiniMaxH3VideoVae::load_decode_only`, whose
  # `["decoder.", "post_quant_conv."]` filter selects 585 of the 703 — **9.03 GiB / 9.69 GB** of
  # parameters, not the ~19.4 GB the old comment claimed. `audio_vae/` is likewise all F32 (1087
  # tensors, 0.5637 GiB); the audio test's `["dec_in_proj.", "decoder."]` filter selects 914 —
  # **0.242 GiB / 0.26 GB**, not ~1.2 GB. `crates/.../candle-gen-minimax-h3/src/vae.rs` states the
  # same split in its `load_decode_only` doc; the old figures contradicted the crate they described.
  #
  # AGAINST THE CARD, then: a video decode is 9.03 GiB of 95.59 GiB — **9.4% occupancy, 10.6x
  # headroom** — and the audio decode is 0.242 GiB, 0.25%. Activations sit on top of those and are
  # not included: the smokes decode a 2x3 latent grid to 17 frames at 32x48 px and a 12-token grid
  # to 39 frames at 32x32 px, which is why the parameter figure is the one that governs here. Each
  # selection runs in its own `cargo test` process, so the peak is one decode and not their sum, and
  # even the pathological case — both listeners on this box driving a video decode at GPU 0 at the
  # same time — is 18.1 GiB of 95.59 GiB. All three fit, with more room than the first sizing
  # claimed; there was no partial-win tradeoff left to make.
  #
  # `Record the CUDA device inventory` below is KEPT, and is now a RECORD against the paragraph
  # above rather than the errand that produces it. Read what it is and is not: it prints
  # `memory.total` for whichever box claims this job, and NOTHING compares that against the 95.59
  # GiB assumed here, so a shrunk or re-pointed pool yields the log line AND the OOM — it explains a
  # failure after the fact, it does not prevent one. It has never fired — but the reason recorded
  # here is now OUT OF DATE and the blocker it names is gone (sc-19455). This used to read that
  # `Require operator-provided MiniMax-H3 snapshot` sits ABOVE it and exits 1 when
  # `CANDLE_MINIMAX_H3_SNAPSHOT` is unset, "which it currently is (the variable does not exist on
  # this repository)". It DOES exist: it was set 2026-08-15 to
  # `E:\huggingface\hub\models--MiniMaxAI--MiniMax-H3\snapshots\939557dc319dd91227e30195a763f272ba7f8765`.
  # So that step would now PASS, and a dispatch of this workflow at `profile: minimax-h3` on this
  # ref would reach the inventory step. Dispatching on a non-default ref is likewise routine — 176
  # of the 204 `workflow_dispatch` runs on record used one, `feature/*` included — so the ref was
  # never the obstacle either. Neither is now: the step has simply not fired because no dispatch
  # selecting this job has been made (checked across the 40 most recent runs of this workflow, in
  # none of which does this job appear at all). (The weekly `schedule` is a separate matter: that
  # genuinely only fires from the default branch, so it cannot reach this lane until the epic
  # merges.) The figures above come from jobs that DO exist on `main`, on the
  # same pool, which is the only reason a number exists to read at all.
  #
  # WHAT THIS DOES NOT RUN. Seven of the fifteen `#[ignore]`d tests in `tests/real_weights.rs` (the
  # other eight are selected by the two steps below), all seven named so none is rediscovered as an
  # oversight:
  #   * `real_weight_decode_matches_the_official_diffusers_vae` — needs the operator reference
  #     artifact the macOS lane requires, which has never been placed on this box. It is the only
  #     gate in either backend that can catch a LAYOUT error against real weights; its MLX twin IS
  #     wired and green, so the sc-18740 class is covered — just not on candle.
  #   * `real_weight_encode_matches_the_official_diffusers_vae` and `real_weight_tiling_changes_the_encode`
  #     — same class, blocked on a second operator artifact (`MINIMAX_H3_VIDEO_VAE_ENCODE_REFERENCE`).
  #   * `real_weight_tiled_decode_matches_the_official_diffusers_vae` and
  #     `real_weight_tiling_is_inert_below_one_tile` — same class again, blocked on a third
  #     (`MINIMAX_H3_VIDEO_VAE_TILING_REFERENCE`). All four are cheap in memory and unreachable here
  #     only because the artifacts have only ever been produced on `nax-macos`.
  #   * `declared_dit_tensor_names_match_the_published_checkpoint` and
  #     `the_adaln_projections_are_the_documented_twenty_six_gigabytes` — header-only, but they need
  #     the 62 GB `transformer/` component, which the `minimax-h3` row deliberately does not fetch.
  candle-minimax-h3:
    name: Candle MiniMax-H3 real weights (CUDA)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media' || inputs.profile == 'minimax-h3'
    runs-on: [self-hosted, windows, cuda, real-weights]
    # There is no "house value" to appeal to and an earlier version of this comment invented one:
    # of the 42 jobs in this file, 26 carry 120 and 16 do not (2x30, 4x60, 90, 150, 2x180, 300,
    # 4x360, 480). 120 is the plurality, not the rule, so it has to be argued rather than cited.
    #
    # The argument is the observed cost of THIS pool, since this lane has never executed. Across the
    # five scheduled runs on record, the largest CUDA real-weight job on this box is 52.0 min
    # (`sa3-base-identity-cuda`, run 30787887176, 2026-08-03; the same job took 42.0 min in
    # 30741567385 and failed at 23.2 min in 31353865709), and the closest analogue by shape —
    # `candle-media`, a candle crate built with `--features cuda` on the same runner — is 15.3 min
    # (run 30196371019; it was skipped in 31353865709, so that run yields no figure for it).
    #
    # The nearest sibling is `mlx-minimax-h3`, same model and same three decode names, and it
    # carries 60. That is NOT the value to copy: its 60 was sized on a 5m36s cold Metal build plus
    # ~3.0 s of measured test time, whereas this lane pays an nvcc/MSVC cold build for
    # `candle-gen-minimax-h3` that has never been timed anywhere, on a box where a real-weight job
    # has already been observed at 52.0 min. 60 would leave 1.15x over that observation; 120 leaves
    # 2.3x. For a never-executed lane a `timeout-minutes` is a runaway guard, not a budget, so the
    # slack is the point. Re-size it DOWN from the first run that actually completes here.
    timeout-minutes: 120
    env:
      # Repository variables hold runner-local absolute paths, so the Windows box needs its own value
      # — `vars.MINIMAX_H3_SNAPSHOT` is the macOS `~/`-relative one. The name on the LEFT is what the
      # crate reads and what the manifest wiring gate counts; a bare `${{ vars.X }}` would not wire it.
      # sc-18677 provisioned the snapshot here at
      # `E:\huggingface\hub\models--MiniMaxAI--MiniMax-H3\snapshots\939557dc319dd91227e30195a763f272ba7f8765`.
      MINIMAX_H3_SNAPSHOT: ${{ vars.CANDLE_MINIMAX_H3_SNAPSHOT }}
      # sm_80 is Ampere, and MEASURED 2026-08-10 this pool's box is 2x RTX PRO 6000 Blackwell —
      # sm_120 — so the old "80 on the Ampere runner" reading of this value described hardware that
      # is not here (see the VRAM paragraph above). The value is left at "80" deliberately: it is
      # what every CUDA job in this repository sets, and the jobs that set it pass on this exact
      # hardware today. Raising it is a repo-wide change owed its own measurement on this box, not
      # something for one lane to do unilaterally as a side effect of wiring three tests.
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: call scripts\ci\real-weights\candle-minimax-h3\install-reviewed-cpython-3-12.cmd
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Require operator-provided MiniMax-H3 snapshot
        shell: cmd
        run: |
          if "%MINIMAX_H3_SNAPSHOT%"=="" (
            echo Missing repository variable CANDLE_MINIMAX_H3_SNAPSHOT for the Windows CUDA runner.
            exit /b 1
          )
      # Report-only, and report-only is the whole of it. It was added (sc-18932) to RETIRE the
      # "unmeasured constant" that kept the decode smokes out; sc-19414 retired it from the pool's
      # existing run logs instead, so what is left is a RECORD next to the sizing paragraph above:
      # it prints `memory.total` for whichever box claims this job. It does NOT compare that against
      # the 95.59 GiB that paragraph assumes, and it could not act on the comparison if it did —
      # `continue-on-error: true` means this step cannot red the lane. A pool change that breaks the
      # assumption therefore produces this log line AND, later, a mid-decode OOM; the line explains
      # the OOM after the fact rather than heading it off. That is deliberate: a threshold here
      # would be a Windows-`cmd` assertion on a lane that has never run, unexercisable anywhere it
      # could be proven to fire, and an unverified guard is worth less than an honest record.
      # `continue-on-error` because a step that only produces a record must never red a lane, and
      # `where` first because `nvidia-smi` is not on PATH on every CUDA host.
      - name: Record the CUDA device inventory
        continue-on-error: true
        shell: cmd
        run: |
          where nvidia-smi >nul 2>&1 || (echo nvidia-smi not on PATH; exit /b 0)
          nvidia-smi --query-gpu=index,name,memory.total,memory.free --format=csv
      - name: Materialize and verify immutable snapshot
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt || exit /b 1
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          rem MiniMaxAI/MiniMax-H3 is a ~196 GB repo; the `minimax-h3` row carries a `download_files`
          rem allow-list so only the 11.638 GB the tests below read is fetched.
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model minimax-h3 --snapshot "%MINIMAX_H3_SNAPSHOT%" || exit /b 1
          rem sc-19558 — the DiT component, on its OWN key so the shared row above stays 11.640 GB
          rem for every lane that does not read it. 132.6 GB for both partitions on a cold box;
          rem sc-18677 provisioned the full upstream snapshot on THIS runner, so here it verifies
          rem rather than fetches. It is what makes the two DiT header gates below reachable at all —
          rem they read headers only, and were unreachable purely because the bytes were in no row.
          "%REVIEWED_PYTHON%" scripts/release/ensure_model_snapshot.py --model minimax-h3-dit --snapshot "%MINIMAX_H3_SNAPSHOT%" || exit /b 1
      # Name-selected with `--exact` AFTER the `--` plus a run-count assertion, for the reasons the
      # `candle-mmaudio` job above spells out: `--exact` before the `--` is rejected by cargo and the
      # rejection is reported as exit 0, and without the count a rename yields "0 passed; N filtered
      # out" and still exits 0.
      - name: Run MiniMax-H3 header and config gates
        shell: cmd
        run: |
          call "%VCVARS%"
          call :run_one declared_tensor_names_match_the_published_checkpoint || exit /b 1
          call :run_one declared_encoder_shapes_match_the_published_checkpoint || exit /b 1
          call :run_one declared_audio_tensor_names_match_the_published_checkpoint || exit /b 1
          call :run_one published_audio_configs_reproduce_the_declared_geometry || exit /b 1
          call :run_one stored_kaiser_filters_match_the_derivation_on_real_weights || exit /b 1
          rem sc-19558 — the two DiT header gates. Header-only and device-free, so they cost the
          rem materialize step above and nothing else; they were listed as NOT COVERED for exactly
          rem one reason, that `transformer/` was in no row, and `minimax-h3-dit` is that row.
          call :run_one declared_dit_tensor_names_match_the_published_checkpoint || exit /b 1
          call :run_one the_adaln_projections_are_the_documented_twenty_six_gigabytes || exit /b 1
          exit /b 0

          :run_one
          set "log=%RUNNER_TEMP%\minimax-h3-%~1.log"
          cargo test --locked -p candle-gen-minimax-h3 --features cuda --release --test integration real_weights::%~1 -- --ignored --exact --nocapture > "%log%" 2>&1 || (type "%log%" & exit /b 1)
          type "%log%"
          findstr /C:"test result: ok. 1 passed" "%log%" >nul || (echo ::error::%~1 did not run exactly one passing test - a rename would make this step vacuously green & exit /b 1)
          exit /b 0

      # sc-19414 — the f32 decodes, wired on the VRAM measurement recorded in this job's header.
      # A SEPARATE step from the header gates above, for two reasons: a decode failure then reads as
      # a decode failure rather than as one entry in a list of eight, and an operator gets the five
      # cheap verdicts before the expensive ones start (the same ordering `mlx-minimax-h3` uses).
      #
      # Same `run_one` shape and the same traps: `--exact` AFTER the `--`, because cargo rejects it
      # in its own argument position and reports the rejection as exit 0; plus the run-count
      # assertion, because a renamed test yields "0 passed; N filtered out" and cargo exits 0 for
      # that too. One `cargo test` invocation and one `findstr` per selection is also what
      # `test_minimax_h3_lanes_select_tests_that_exist_and_pin_their_run_count` counts.
      #
      # WHAT THESE ACTUALLY COST (headers of snapshot 939557dc, measured — see the job header). The
      # `vae/` component ships **F32, all 703 tensors**, so asking for `DType::F32` here is a no-op
      # cast and NOT the doubling an earlier version of this comment described: the two video
      # decodes load the 585-tensor decode half, 9.03 GiB / 9.69 GB, and the audio decode loads the
      # 914-tensor half of the likewise-all-F32 `audio_vae/`, 0.242 GiB / 0.26 GB. With
      # `--features cuda` that is device memory on GPU 0, against 95.59 GiB — 9.4% for a video
      # decode. f32 is still the deliberate choice, because it is the dtype the committed-fixture
      # lane compares against; it is simply free here rather than expensive. NEVER EXECUTED ANYWHERE
      # YET on candle: the twin numbers quoted on sc-18932 (289 ms video, 73 ms audio) are the MLX
      # lane's, on Metal.
      - name: Run MiniMax-H3 VAE decode smokes
        shell: cmd
        run: call scripts\ci\real-weights\candle-minimax-h3\run-minimax-h3-vae-decode-smokes.cmd
      # ---------------------------------------------------------------------------------------
      # sc-17156 — THE MEASURED `vramGbByTier` DATUM.
      #
      # Everything above this line reads HEADERS. This runs a real render, and the story's
      # acceptance criterion is a MEASURED number, so it is wired here rather than left to be
      # produced by hand on someone's desk.
      #
      # WHY IT IS GATED ON ITS OWN INPUT AND NOT ON A `profile`:
      #   1. The pool `[self-hosted, windows, cuda, real-weights]` is ONE physical box
      #      (`MICHAEL-TRX50`, 2x RTX PRO 6000 Blackwell @ 95.6 GiB) exposed as TWO listeners,
      #      `cuda-windows` and `cuda-windows-2`. `candle_gen::default_device()` hardcodes
      #      `cuda:0`, so both listeners contend on the SAME card while GPU 1 idles. This render
      #      sequentially stages a 66.7 GB conditioner and a 66.3 GB DiT; a co-tenant job would
      #      contaminate the high-water. `VramProbe::assert_trustworthy(1.0)` makes that a RED
      #      rather than a quiet lie, but a red costs the whole multi-hour render.
      #   2. The shipped 1344x768 canvas at the 124-frame lattice floor and `DEFAULT_STEPS = 50` is
      #      measured in HOURS. That has no business inside a weekly sweep.
      #
      # ⚠️ THIS INPUT GATE IS A NARROWING, NOT EXCLUSIVITY, and the difference is load-bearing.
      # It guarantees the probe never rides a bulk `all` / `media` sweep — the likeliest in-workflow
      # co-tenant — and nothing more. It does NOT hold the box:
      #   * this workflow's `concurrency` group is keyed on `${{ inputs.profile }}`, so a dispatch of
      #     a DIFFERENT profile is a different group and runs concurrently; and
      #   * it does not scope `ci.yml` at all, whose `Candle CUDA compile check (Windows)` lands on
      #     the same two listeners. On 2026-08-14 two such compile jobs (PRs #608 and #610) running
      #     together CRASHED THE COMPILER on this box, which is the proof that "the card is big
      #     enough" is not the same claim as "the box is free".
      # So this lane must be dispatched when the box is known idle, and a run that reds on
      # `assert_trustworthy` should be read as contention rather than as a model fact. Giving it real
      # exclusivity means one concurrency group shared by EVERY CUDA-consuming job across `ci.yml`
      # and this file, or a dedicated listener/label for the probe. Both serialize CUDA CI
      # repo-wide, which is a throughput decision for the box owner and is deliberately NOT taken
      # here as a side effect of landing a probe.
      #
      # THE WEEKLY CANNOT REACH THIS STEP. GitHub runs `schedule:` only from the DEFAULT branch, so
      # while epic 17137 lives on `feature/sc-17137-minimax-h3` the entire job is dispatch-only.
      # Stated here so nobody waits on a Monday run that cannot fire.
      #
      # THE COMPUTE CAP IS NOT A HAZARD FOR THIS NUMBER, and sc-19545 has now established WHY --
      # the earlier wording here ("a known latent hazard") was reasoning from the number's name and
      # was wrong. `CUDA_COMPUTE_CAP: "80"` does not describe the hardware and is not supposed to:
      # it is the bottom rung of the arch ladder, and `vendor/candle-kernels/build.rs` appends
      # sm_90, sm_120 and `compute_120` PTX above it (sc-7544), so the Blackwell card IS covered.
      # The silent-zeros class was retired then, not merely deferred.
      #
      # The q4 and q8 probes below now exercise the packed kernels too. Their `spec.quantize`
      # assertions reject a mis-staged tier before rendering, and the probe's
      # `DEGENERATE_STD_FLOOR` middle-frame check rejects an all-zeros render. sc-19545 deliberately
      # added no general CUDA-quant smoke gate, so that broader check remains only in
      # `candle-gen/tests/cuda_quant_smoke.rs`; the three real-weight records here are specifically
      # the MiniMax-H3 shipped-geometry measurements.
      - name: Require real MiniMax-H3 files and staged tier inputs before measuring
        if: inputs.minimax_h3_vram_probe
        shell: cmd
        run: |
          rem Validate every index-resolved file before Cargo creates a CUDA context. The live
          rem CANDLE_MINIMAX_H3_SNAPSHOT is an HF cache tree, whose reparse-point blob links candle
          rem cannot memmap; this requires hardlink/copy-staged real files instead.
          "%REVIEWED_PYTHON%" scripts/ci/validate_h3_vram_staging.py --root "%MINIMAX_H3_SNAPSHOT%" --tier q4 --dit "${{ vars.CANDLE_MINIMAX_H3_Q4_DIT_DIR }}" --te "${{ vars.CANDLE_MINIMAX_H3_Q4_TE_DIR }}" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/ci/validate_h3_vram_staging.py --root "%MINIMAX_H3_SNAPSHOT%" --tier q8 --dit "${{ vars.CANDLE_MINIMAX_H3_Q8_DIT_DIR }}" --te "${{ vars.CANDLE_MINIMAX_H3_Q8_TE_DIR }}" || exit /b 1
          "%REVIEWED_PYTHON%" scripts/ci/validate_h3_vram_staging.py --root "%MINIMAX_H3_SNAPSHOT%" --tier bf16 --dit "%MINIMAX_H3_SNAPSHOT%\transformer" --te "%MINIMAX_H3_SNAPSHOT%\text_encoder" || exit /b 1
      - name: Measure candle vramGbByTier (q4, shipped geometry)
        if: inputs.minimax_h3_vram_probe
        shell: cmd
        env:
          MINIMAX_H3_VRAM_DIR: ${{ vars.CANDLE_MINIMAX_H3_SNAPSHOT }}
          MINIMAX_H3_VRAM_DIT_DIR: ${{ vars.CANDLE_MINIMAX_H3_Q4_DIT_DIR }}
          MINIMAX_H3_VRAM_TE_DIR: ${{ vars.CANDLE_MINIMAX_H3_Q4_TE_DIR }}
          CANDLE_GEN_OFFLOAD: sequential
        run: call scripts\ci\real-weights\candle-minimax-h3\measure-candle-vramgbbytier-q4-shipped-geometry.cmd
      - name: Measure candle vramGbByTier (q8, shipped geometry)
        if: inputs.minimax_h3_vram_probe
        shell: cmd
        env:
          MINIMAX_H3_VRAM_DIR: ${{ vars.CANDLE_MINIMAX_H3_SNAPSHOT }}
          MINIMAX_H3_VRAM_DIT_DIR: ${{ vars.CANDLE_MINIMAX_H3_Q8_DIT_DIR }}
          MINIMAX_H3_VRAM_TE_DIR: ${{ vars.CANDLE_MINIMAX_H3_Q8_TE_DIR }}
          CANDLE_GEN_OFFLOAD: sequential
        run: call scripts\ci\real-weights\candle-minimax-h3\measure-candle-vramgbbytier-q8-shipped-geometry.cmd
      - name: Measure candle vramGbByTier (bf16, shipped geometry)
        if: inputs.minimax_h3_vram_probe
        shell: cmd
        env:
          MINIMAX_H3_VRAM_DIR: ${{ vars.CANDLE_MINIMAX_H3_SNAPSHOT }}
          MINIMAX_H3_VRAM_DIT_DIR: ${{ vars.CANDLE_MINIMAX_H3_SNAPSHOT }}\transformer
          MINIMAX_H3_VRAM_TE_DIR: ${{ vars.CANDLE_MINIMAX_H3_SNAPSHOT }}\text_encoder
          # Belt-and-braces: the provider FORCES `OffloadPolicy::Sequential` regardless (pinned by
          # `the_offload_policy_is_forced_sequential_even_when_resident_is_requested`). Set anyway so
          # the invocation matches the Wan runbook line for line.
          CANDLE_GEN_OFFLOAD: sequential
        run: call scripts\ci\real-weights\candle-minimax-h3\measure-candle-vramgbbytier-bf16-shipped-geometry.cmd
      - name: Keep the VRAM evidence
        if: inputs.minimax_h3_vram_probe && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minimax-h3-candle-vram-bf16
          path: |
            ${{ runner.temp }}/minimax-h3-vram-q4.log
            ${{ runner.temp }}/minimax-h3-vram-q4.json
            ${{ runner.temp }}/minimax-h3-vram-q8.log
            ${{ runner.temp }}/minimax-h3-vram-q8.json
            ${{ runner.temp }}/minimax-h3-vram-bf16.log
            ${{ runner.temp }}/minimax-h3-vram-bf16.json
          if-no-files-found: error

  # sc-24114 — Qwen-Image 2.1 real-weight evidence on candle/CUDA. DISPATCH-ONLY (`qwen-image-2-1`
  # profile; never `all`, never the schedule): it renders at the upstream 2048² / 40-step default and
  # loads ~33 GB five times, which has no business inside a weekly sweep.
  #
  # WHAT IT PROVISIONS. Two pinned snapshots, each through `ensure_model_snapshot.py`, INTO the
  # runner's persistent hub cache (`vars.CANDLE_GEN_MODELS_ROOT`, the root `candle-media` already
  # reads), so the ~66 GB is fetched once and every later dispatch only verifies it. Both paths are
  # cache-shaped (`models--*/snapshots/<rev>`), so a miss is healed THROUGH the cache (`cache_dir`,
  # no `local_dir`) and a mispointed root fails closed with a named error before a byte moves.
  #   * `qwen-image-2-1-cuda`  Qwen/Qwen-Image-2.1 @ 790c9263…            bf16, ~33 GB
  #   * `qwen-image-2-1-mlx`   SceneWorks/qwen-image-2-1-mlx @ 1691de01…  q8/ + q4/, ~33 GB
  #
  # WHAT IT RUNS. Every `#[ignore]`d test in `candle-gen-qwen-image-2-1/tests/e2e_real_weights.rs`,
  # one `cargo test` per name with `--exact` AFTER the `--` and a run-count assertion (a rename is a
  # red, not "0 passed; N filtered out" + exit 0). A failing test does not stop the rest: the lane
  # collects all five verdicts and all their evidence, then reds at the end.
  #
  # WHY THE REFERENCE-EDIT TEST NEEDS NO `QWEN_IMAGE_2_1_EDIT_REFS`. Unset, the test synthesizes its
  # deterministic references (2, 10, and the refused 11) itself; that variable exists for a
  # user-provided evaluation set, which CI deliberately does not fabricate.
  #
  # THE BOX. `[self-hosted, windows, cuda, real-weights]` is ONE machine (`MICHAEL-TRX50`, 2x RTX PRO
  # 6000 Blackwell @ 95.6 GiB) with two listeners, and `default_device()` hardcodes `cuda:0`. This
  # workflow's `concurrency` group serializes it against every other real-weight job, but NOT against
  # `ci.yml`'s CUDA compile check, so dispatch it when the box is otherwise idle. The resident set
  # here is ~33 GB of 95.6, so a co-tenant costs time, not correctness — no VRAM number is asserted.
  #
  # `timeout-minutes: 240` is a runaway guard for a lane that has never executed, not a budget. A
  # first dispatch pays a cold `--features cuda` release build (unmeasured for this crate; the
  # closest observed CUDA real-weight job on this box is 52 min end to end) PLUS the one-time ~66 GB
  # fetch; the renders themselves should be minutes each on this card (the 2048² T2I is ~16k image
  # tokens x 40 steps; the ten-reference edit recomputes a ~41k-token prefix per step, which is why
  # it runs two). Re-size it DOWN from the first run that completes.
  candle-qwen-image-2-1:
    name: Candle Qwen-Image 2.1 real weights (CUDA)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'qwen-image-2-1'
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 240
    env:
      # Runner-local hub-cache paths composed from the ONE repository variable the Windows candle
      # lanes already share. The names on the LEFT are what the crate reads and what the manifest
      # wiring gate counts.
      CANDLE_GEN_MODELS_ROOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
      CANDLE_GEN_QWEN_IMAGE_2_1_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--Qwen--Qwen-Image-2.1\snapshots\790c92633540aa0cb11d9abf19eb46d861714758
      CANDLE_GEN_QWEN_IMAGE_2_1_TIER_SNAPSHOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}\models--SceneWorks--qwen-image-2-1-mlx\snapshots\1691de01c24a070131e0a28bf4c065fd027f4fe9
      # The bottom rung of the arch ladder, not the hardware — see the note on `same-l-cuda`.
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install reviewed CPython 3.12
        shell: cmd
        run: call scripts\ci\real-weights\candle-qwen-image-2-1\install-reviewed-cpython-3-12.cmd
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      # The runner service exports RUSTC_WRAPPER=sccache globally (it appears nowhere in this repo);
      # its daemon resets mid-build on heavy Candle/CUDA graphs ("An existing connection was forcibly
      # closed by the remote host (os error 10054)" with zero rustc diagnostics -- run 35898072912
      # lost this lane to it 4 minutes in). Same step as SceneWorks' windows-candle.yml heavy lane:
      # clear the wrapper for this job only; registry/git/target caches stay intact.
      - name: Disable unstable sccache wrapper for the heavy Candle lane
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value 'RUSTC_WRAPPER='
          Remove-Item Env:RUSTC_WRAPPER -ErrorAction SilentlyContinue
      - name: Require operator-provided models root and initialize evidence
        shell: cmd
        run: call scripts\ci\real-weights\candle-qwen-image-2-1\require-operator-provided-models-root-and-initialize-evidenc.cmd
      # Report-only, like the same step on `candle-minimax-h3`: `continue-on-error` because a step
      # that only produces a record must never red a lane, and `where` first because `nvidia-smi` is
      # not on PATH on every CUDA host. The card state before the renders explains a slow or OOM run
      # after the fact.
      - name: Record the CUDA device inventory
        continue-on-error: true
        shell: cmd
        run: |
          where nvidia-smi >nul 2>&1 || (echo nvidia-smi not on PATH; exit /b 0)
          nvidia-smi --query-gpu=index,name,memory.total,memory.used,memory.free --format=csv > "%QWEN_IMAGE_2_1_RENDER_OUT%\cuda-device-inventory.csv"
          type "%QWEN_IMAGE_2_1_RENDER_OUT%\cuda-device-inventory.csv"
      - name: Materialize and verify immutable snapshots
        shell: cmd
        run: call scripts\ci\real-weights\candle-qwen-image-2-1\materialize-and-verify-immutable-snapshots.cmd
      # Its own step so the cold nvcc/MSVC build reads as build time in the run's step timings,
      # rather than being folded into the first render's.
      - name: Build the Qwen-Image 2.1 CUDA test binary
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-gen-qwen-image-2-1 --features cuda --test integration --no-run || exit /b 1
      - name: Run the Qwen-Image 2.1 real-weight renders
        shell: cmd
        run: call scripts\ci\real-weights\candle-qwen-image-2-1\run-the-qwen-image-2-1-real-weight-renders.cmd
      - name: Keep the Qwen-Image 2.1 CUDA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qwen-image-2-1-cuda-evidence
          path: ${{ runner.temp }}/qwen-image-2-1-cuda-evidence
          if-no-files-found: error
          retention-days: 30
