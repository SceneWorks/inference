name: Real-weight validation

on:
  schedule:
    # 02:00 UTC Monday = 22:00 EDT Sunday. Every macOS job below targets the single self-hosted
    # Metal runner and they run strictly one at a time, so this run needs a whole night rather than
    # a Sunday-morning start that bleeds into the working day. Cron is always UTC and does not
    # follow US daylight time, so this lands at 21:00 EST once the clocks go back — still Sunday
    # night, which is what matters. GitHub's scheduler also drifts under load (2026-08-02 the old
    # cron fired ~2h late), so treat the start time as approximate.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Real-weight profile to run
        type: choice
        required: true
        default: all
        options: [all, llm, media, chroma-auxiliary, chroma-t5-sensitivity, request-memory-scope, memory-evidence-v1, krea-realtime, audio, same-l, same-chunked, sa3-small-music, sa3-small-sfx, sa3-medium, sa3-base-identity, sa3-small-base]
      sceneworks_revision:
        description: Exact lowercase SceneWorks commit paired with memory-evidence-v1
        type: string
        required: false
        default: ""
      publish_chroma_artifacts:
        description: Publish validated Chroma q4/q8 artifacts (chroma-auxiliary profile only)
        type: boolean
        required: false
        default: false
      chroma_publish_confirmation:
        description: Type sc-16462 to authorize Chroma artifact publication
        type: string
        required: false
        default: ""
      chroma_model:
        description: Chroma model to validate; publication always requires all
        type: choice
        required: false
        default: all
        options: [all, chroma1_base, chroma1_hd, chroma1_flash]

permissions:
  contents: read

concurrency:
  group: inference-real-weights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # SC-16462: build the complete packed Chroma tier from the exact currently-shipped bf16 source,
  # then prove progressive T5/VAE packed-vs-load-time identity, component quality, T5 residency,
  # and a coherent end-to-end render for base/HD/Flash at q4 and q8. Publication is a separate,
  # explicit mode of the same green lane; it fails closed on the expected current Hub revision and
  # runner-local HF auth.
  mlx-chroma-auxiliary:
    name: Chroma packed auxiliaries (${{ matrix.model }})
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'chroma-auxiliary'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - model: chroma1_base
            repository: SceneWorks/chroma1-base-mlx
            source_revision: e7330dda29d00ffdeeb719b28e92ee74cff0884c
          - model: chroma1_hd
            repository: SceneWorks/chroma1-hd-mlx
            source_revision: 9d99afe1ebca67032476756bc70d4a7152bc1bd5
          - model: chroma1_flash
            repository: SceneWorks/chroma1-flash-mlx
            source_revision: 6a9cb6178709559461506bf247f708d0d1008d00
    env:
      CHROMA_MODEL: ${{ matrix.model }}
      CHROMA_REPOSITORY: ${{ matrix.repository }}
      CHROMA_SOURCE_REVISION: ${{ matrix.source_revision }}
      SC16462_T5_GROUP_SIZE: "32"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Validate publication authorization
        if: inputs.publish_chroma_artifacts && (inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model)
        run: |
          if [[ "${{ inputs.chroma_publish_confirmation }}" != "sc-16462" ]]; then
            echo "Publishing requires chroma_publish_confirmation=sc-16462" >&2
            exit 1
          fi
          test "$SC16462_T5_GROUP_SIZE" = "32"
      - name: Materialize the exact shipped bf16 source
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        env:
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
          CHROMA_SNAPSHOT: ${{ runner.temp }}/chroma-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
        run: |
          python3 -m pip install --disable-pip-version-check --target "$PYTHONPATH" "huggingface_hub==1.20.1"
          python3 - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["CHROMA_REPOSITORY"],
              revision=os.environ["CHROMA_SOURCE_REVISION"],
              allow_patterns=["bf16/**", "q4/**", "q8/**"],
              local_dir=os.environ["CHROMA_SNAPSHOT"],
              token=False,
          )
          PY
          test -d "$CHROMA_SNAPSHOT/bf16/transformer"
          test -d "$CHROMA_SNAPSHOT/bf16/text_encoder"
          test -d "$CHROMA_SNAPSHOT/bf16/vae"
          test -d "$CHROMA_SNAPSHOT/q4/transformer"
          test -d "$CHROMA_SNAPSHOT/q8/transformer"
      - name: Build and validate packed q4/q8 tiers
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        env:
          SC8777_SRC: ${{ runner.temp }}/chroma-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}/bf16
          SC8777_MODEL: ${{ matrix.model }}
          SC8777_KEEP: "1"
          CHROMA_PACKED_ROOT: ${{ runner.temp }}/chroma-packed-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_PAYLOAD_MANIFEST: ${{ runner.temp }}/chroma-sc16462-payload-sha256.json
          CHROMA_RESIDENCY_RAW: ${{ runner.temp }}/chroma-sc16462-residency.jsonl
          CHROMA_RESIDENCY_SUMMARY: ${{ runner.temp }}/chroma-sc16462-residency-summary.jsonl
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-chroma-sc16462
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/chroma-sc16462-calibration.jsonl"
          : > "$RUNNER_TEMP/chroma-sc16462-component.jsonl"
          : > "$CHROMA_RESIDENCY_RAW"
          : > "$CHROMA_RESIDENCY_SUMMARY"
          for bits in 4 8; do
            export SC8777_BITS="$bits"
            export SC8777_OUT="$CHROMA_PACKED_ROOT/q$bits"
            export SC16462_BUILT="$CHROMA_PACKED_ROOT/.built-q$bits"
            export SC16462_BASELINE="$SC8777_SRC/../q$bits"
            SC8777_BITS="$bits" SC8777_OUT="$SC16462_BUILT" \
              cargo test --locked --release -p mlx-gen-chroma --test prequantize_real_weights \
              build_tier_only -- --ignored --exact --nocapture --test-threads=1
            # Compose from the exact shipped tier and replace only the two auxiliary directories.
            # This preserves transformer/config/tokenizer/scheduler/top-level bytes verbatim.
            cp -R "$SC16462_BASELINE" "$SC8777_OUT"
            rm -rf "$SC8777_OUT/text_encoder" "$SC8777_OUT/vae"
            cp -R "$SC16462_BUILT/text_encoder" "$SC8777_OUT/text_encoder"
            cp -R "$SC16462_BUILT/vae" "$SC8777_OUT/vae"
            diff -qr -x text_encoder -x vae "$SC16462_BASELINE" "$SC8777_OUT"
            cargo test --locked --release -p mlx-gen-chroma --test prequantize_real_weights \
              packed_auxiliaries_match_load_time_quantization -- --ignored --exact --nocapture \
              --test-threads=1 | tee "$RUNNER_TEMP/chroma-q$bits.log"
            sed -n 's/^.*SC16462_COMPONENT //p' "$RUNNER_TEMP/chroma-q$bits.log" \
              >> "$RUNNER_TEMP/chroma-sc16462-component.jsonl"
            : > "$RUNNER_TEMP/chroma-q$bits-residency.log"
            for component in t5 vae; do
              for mode in dense load-time packed; do
                for repetition in 1 2 3; do
                  SC16462_RESIDENCY_COMPONENT="$component" \
                  SC16462_RESIDENCY_MODE="$mode" \
                  SC16462_RESIDENCY_REPETITION="$repetition" \
                    cargo test --locked --release -p mlx-gen-chroma \
                      --test prequantize_real_weights component_residency_probe -- --ignored \
                      --exact --nocapture --test-threads=1 \
                      | tee -a "$RUNNER_TEMP/chroma-q$bits-residency.log"
                done
              done
            done
            sed -n 's/^.*SC16462_RESIDENCY //p' "$RUNNER_TEMP/chroma-q$bits-residency.log" \
              >> "$CHROMA_RESIDENCY_RAW"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from statistics import median

          tier = f"q{os.environ['SC8777_BITS']}"
          rows = [
              json.loads(line)
              for line in Path(os.environ["CHROMA_RESIDENCY_RAW"]).read_text().splitlines()
          ]
          rows = [row for row in rows if row["tier"] == tier]
          if len(rows) != 18:
              raise SystemExit(f"{tier}: expected 18 fresh-process residency rows, got {len(rows)}")
          peaks = {}
          for component in ("t5", "vae"):
              peaks[component] = {}
              for mode in ("dense", "load-time", "packed"):
                  values = [
                      row["peakBytes"]
                      for row in rows
                      if row["component"] == component and row["mode"] == mode
                  ]
                  if len(values) != 3:
                      raise SystemExit(
                          f"{tier}/{component}/{mode}: expected 3 measurements, got {len(values)}"
                      )
                  peaks[component][mode] = {
                      "median": int(median(values)),
                      "samples": values,
                  }
              packed = peaks[component]["packed"]["median"]
              load_time = peaks[component]["load-time"]["median"]
              if packed >= load_time:
                  raise SystemExit(
                      f"{tier}/{component}: packed median {packed} must be below load-time {load_time}"
                  )
          summary = {
              "model": os.environ["CHROMA_MODEL"],
              "tier": tier,
              "auxiliaryBits": 8,
              "groupSize": int(os.environ["SC16462_T5_GROUP_SIZE"]),
              "freshProcessMedianPeakBytes": peaks,
          }
          with Path(os.environ["CHROMA_RESIDENCY_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(json.dumps(summary, sort_keys=True) + "\n")
          print("SC16462_RESIDENCY_SUMMARY " + json.dumps(summary, sort_keys=True))
          PY
            cargo test --locked --release -p mlx-gen-chroma --test prequantize_real_weights \
              packed_auxiliaries_preserve_full_pipeline_quality_and_reduce_peak -- --ignored \
              --exact --nocapture --test-threads=1 | tee "$RUNNER_TEMP/chroma-q$bits-calibration.log"
            sed -n 's/^.*SC16462_CALIBRATION //p' "$RUNNER_TEMP/chroma-q$bits-calibration.log" \
              >> "$RUNNER_TEMP/chroma-sc16462-calibration.jsonl"
            cargo test --locked --release -p mlx-gen-chroma --test prequantize_real_weights \
              prequantize_turnkey_loads_packed_and_renders -- --ignored --exact --nocapture \
              --test-threads=1
          done
          test "$(wc -l < "$RUNNER_TEMP/chroma-sc16462-calibration.jsonl" | tr -d ' ')" = 2
          test "$(wc -l < "$RUNNER_TEMP/chroma-sc16462-component.jsonl" | tr -d ' ')" = 2
          test "$(wc -l < "$CHROMA_RESIDENCY_RAW" | tr -d ' ')" = 36
          test "$(wc -l < "$CHROMA_RESIDENCY_SUMMARY" | tr -d ' ')" = 2
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHROMA_PACKED_ROOT"])
          t5_quantization = json.loads(
              (root / "q4/text_encoder/config.json").read_text(encoding="utf-8")
          )["quantization"]
          q8_t5_quantization = json.loads(
              (root / "q8/text_encoder/config.json").read_text(encoding="utf-8")
          )["quantization"]
          if q8_t5_quantization != t5_quantization:
              raise SystemExit("q4/q8 T5 quantization policies differ")
          expected_t5_policy = {
              "bits": 8,
              "group_size": 32,
              "residual_bits": 4,
              "sensitive_residual_bits": 8,
              "sensitive_residual_bases": [
                  "shared",
                  "encoder.block.0.layer.0.SelfAttention.relative_attention_bias",
                  "encoder.block.4.layer.0.SelfAttention.q",
                  "encoder.block.4.layer.0.SelfAttention.k",
                  "encoder.block.4.layer.0.SelfAttention.v",
                  "encoder.block.4.layer.0.SelfAttention.o",
                  "encoder.block.1.layer.1.DenseReluDense.wi_0",
                  "encoder.block.1.layer.1.DenseReluDense.wi_1",
                  "encoder.block.1.layer.1.DenseReluDense.wo",
              ],
          }
          for key, value in expected_t5_policy.items():
              if t5_quantization.get(key) != value:
                  raise SystemExit(
                      f"unsupported T5 quantization {key}: {t5_quantization.get(key)!r} != {value!r}"
                  )
          files = {}
          for tier in ("q4", "q8"):
              tier_root = root / tier
              for path in sorted(tier_root.rglob("*")):
                  if path.is_file() and ".cache" not in path.parts:
                      digest = hashlib.sha256()
                      with path.open("rb") as handle:
                          for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                              digest.update(chunk)
                      relative = f"{tier}/{path.relative_to(tier_root).as_posix()}"
                      files[relative] = {
                          "size": path.stat().st_size,
                          "sha256": digest.hexdigest(),
                      }
          manifest = {
              "model": os.environ["CHROMA_MODEL"],
              "inferenceRevision": os.environ["GITHUB_SHA"],
              "sourceRevision": os.environ["CHROMA_SOURCE_REVISION"],
              "t5GroupSize": int(os.environ["SC16462_T5_GROUP_SIZE"]),
              "t5Quantization": t5_quantization,
              "files": files,
          }
          Path(os.environ["CHROMA_PAYLOAD_MANIFEST"]).write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload Chroma calibration evidence
        if: always() && (inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chroma-sc16462-${{ matrix.model }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/chroma-sc16462-calibration.jsonl
            ${{ runner.temp }}/chroma-sc16462-component.jsonl
            ${{ runner.temp }}/chroma-sc16462-payload-sha256.json
            ${{ runner.temp }}/chroma-sc16462-residency.jsonl
            ${{ runner.temp }}/chroma-sc16462-residency-summary.jsonl

  # SC-16462 diagnostic lane: rank fully packed progressive precision policies at Chroma's
  # production sequence length before spending another Base or Base/HD/Flash render matrix. This
  # lane never publishes and deliberately materializes only Base's immutable bf16 text encoder.
  mlx-chroma-t5-sensitivity:
    name: Chroma T5 precision sensitivity
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'chroma-t5-sensitivity'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      CHROMA_REPOSITORY: SceneWorks/chroma1-base-mlx
      CHROMA_SOURCE_REVISION: e7330dda29d00ffdeeb719b28e92ee74cff0884c
      SC8777_MODEL: chroma1_base
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Materialize the immutable Base T5 source
        env:
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
          CHROMA_SNAPSHOT: ${{ runner.temp }}/chroma-t5-sensitivity-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 -m pip install --disable-pip-version-check --target "$PYTHONPATH" "huggingface_hub==1.20.1"
          python3 - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["CHROMA_REPOSITORY"],
              revision=os.environ["CHROMA_SOURCE_REVISION"],
              allow_patterns=["bf16/text_encoder/**"],
              local_dir=os.environ["CHROMA_SNAPSHOT"],
              token=False,
          )
          PY
          test -d "$CHROMA_SNAPSHOT/bf16/text_encoder"
          echo "SC8777_SRC=$CHROMA_SNAPSHOT/bf16" >> "$GITHUB_ENV"
      - name: Rank fully packed T5 precision policies
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-chroma-sc16462-t5-sensitivity
        run: |
          set -o pipefail
          cargo test --locked --release -p mlx-gen-chroma --test prequantize_real_weights \
            t5_precision_sensitivity_sweep -- --ignored --exact --nocapture --test-threads=1 \
            | tee "$RUNNER_TEMP/chroma-sc16462-t5-sensitivity.log"
          grep 'SC16462_T5_SENSITIVITY ' "$RUNNER_TEMP/chroma-sc16462-t5-sensitivity.log"
      - name: Upload T5 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chroma-sc16462-t5-sensitivity
          if-no-files-found: error
          path: ${{ runner.temp }}/chroma-sc16462-t5-sensitivity.log

  # Publication cannot begin until every Base/HD/Flash validation leg above is green. Each repo
  # receives q4+q8 in one parent-guarded commit. A retry explicitly verifies an already-published
  # repo byte-for-byte and treats it as success, making a cross-repository partial run resumable.
  mlx-chroma-publish:
    name: Publish Chroma packed auxiliaries (${{ matrix.model }})
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'chroma-auxiliary' && inputs.publish_chroma_artifacts && inputs.chroma_model == 'all'
    needs: mlx-chroma-auxiliary
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - model: chroma1_base
            repository: SceneWorks/chroma1-base-mlx
            source_revision: e7330dda29d00ffdeeb719b28e92ee74cff0884c
          - model: chroma1_hd
            repository: SceneWorks/chroma1-hd-mlx
            source_revision: 9d99afe1ebca67032476756bc70d4a7152bc1bd5
          - model: chroma1_flash
            repository: SceneWorks/chroma1-flash-mlx
            source_revision: 6a9cb6178709559461506bf247f708d0d1008d00
    env:
      CHROMA_MODEL: ${{ matrix.model }}
      CHROMA_REPOSITORY: ${{ matrix.repository }}
      CHROMA_SOURCE_REVISION: ${{ matrix.source_revision }}
      SC16462_T5_GROUP_SIZE: "32"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate publication authorization
        run: |
          if [[ "${{ inputs.chroma_publish_confirmation }}" != "sc-16462" ]]; then
            echo "Publishing requires chroma_publish_confirmation=sc-16462" >&2
            exit 1
          fi
          test "$SC16462_T5_GROUP_SIZE" = "32"
      - name: Download the validated payload manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chroma-sc16462-${{ matrix.model }}
          path: ${{ runner.temp }}/chroma-sc16462-validated-${{ matrix.model }}
      - name: Rebuild the validated payload from the immutable source
        env:
          CHROMA_SNAPSHOT: ${{ runner.temp }}/chroma-publish-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_BUILT: ${{ runner.temp }}/chroma-publish-built-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_PACKED: ${{ runner.temp }}/chroma-publish-packed-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_VALIDATED_MANIFEST: ${{ runner.temp }}/chroma-sc16462-validated-${{ matrix.model }}/chroma-sc16462-payload-sha256.json
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-chroma-sc16462-publish
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
        run: |
          python3 -m pip install --disable-pip-version-check --target "$PYTHONPATH" "huggingface_hub==1.20.1"
          python3 - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["CHROMA_REPOSITORY"],
              revision=os.environ["CHROMA_SOURCE_REVISION"],
              allow_patterns=["bf16/**", "q4/**", "q8/**"],
              local_dir=os.environ["CHROMA_SNAPSHOT"],
              token=False,
          )
          PY
          mkdir -p "$CHROMA_PACKED"
          for bits in 4 8; do
            SC8777_SRC="$CHROMA_SNAPSHOT/bf16" \
            SC8777_MODEL="$CHROMA_MODEL" \
            SC8777_BITS="$bits" \
            SC8777_OUT="$CHROMA_BUILT/q$bits" \
              cargo test --locked --release -p mlx-gen-chroma --test prequantize_real_weights \
                build_tier_only -- --ignored --exact --nocapture --test-threads=1
            cp -R "$CHROMA_SNAPSHOT/q$bits" "$CHROMA_PACKED/q$bits"
            rm -rf "$CHROMA_PACKED/q$bits/text_encoder" "$CHROMA_PACKED/q$bits/vae"
            cp -R "$CHROMA_BUILT/q$bits/text_encoder" "$CHROMA_PACKED/q$bits/text_encoder"
            cp -R "$CHROMA_BUILT/q$bits/vae" "$CHROMA_PACKED/q$bits/vae"
            diff -qr -x text_encoder -x vae "$CHROMA_SNAPSHOT/q$bits" "$CHROMA_PACKED/q$bits"
          done
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHROMA_PACKED"])
          expected = json.loads(Path(os.environ["CHROMA_VALIDATED_MANIFEST"]).read_text())
          t5_quantization = json.loads(
              (root / "q4/text_encoder/config.json").read_text(encoding="utf-8")
          )["quantization"]
          q8_t5_quantization = json.loads(
              (root / "q8/text_encoder/config.json").read_text(encoding="utf-8")
          )["quantization"]
          if q8_t5_quantization != t5_quantization:
              raise SystemExit("rebuilt q4/q8 T5 quantization policies differ")
          expected_t5_policy = {
              "bits": 8,
              "group_size": 32,
              "residual_bits": 4,
              "sensitive_residual_bits": 8,
              "sensitive_residual_bases": [
                  "shared",
                  "encoder.block.0.layer.0.SelfAttention.relative_attention_bias",
                  "encoder.block.4.layer.0.SelfAttention.q",
                  "encoder.block.4.layer.0.SelfAttention.k",
                  "encoder.block.4.layer.0.SelfAttention.v",
                  "encoder.block.4.layer.0.SelfAttention.o",
                  "encoder.block.1.layer.1.DenseReluDense.wi_0",
                  "encoder.block.1.layer.1.DenseReluDense.wi_1",
                  "encoder.block.1.layer.1.DenseReluDense.wo",
              ],
          }
          for key, value in expected_t5_policy.items():
              if t5_quantization.get(key) != value:
                  raise SystemExit(
                      f"unsupported rebuilt T5 quantization {key}: {t5_quantization.get(key)!r} != {value!r}"
                  )
          identity = {
              "model": os.environ["CHROMA_MODEL"],
              "inferenceRevision": os.environ["GITHUB_SHA"],
              "sourceRevision": os.environ["CHROMA_SOURCE_REVISION"],
              "t5GroupSize": int(os.environ["SC16462_T5_GROUP_SIZE"]),
              "t5Quantization": t5_quantization,
          }
          for key, value in identity.items():
              if expected.get(key) != value:
                  raise SystemExit(
                      f"validated payload {key} mismatch: {expected.get(key)!r} != {value!r}"
                  )
          files = {}
          for tier in ("q4", "q8"):
              tier_root = root / tier
              for path in sorted(tier_root.rglob("*")):
                  if path.is_file() and ".cache" not in path.parts:
                      digest = hashlib.sha256()
                      with path.open("rb") as handle:
                          for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                              digest.update(chunk)
                      relative = f"{tier}/{path.relative_to(tier_root).as_posix()}"
                      files[relative] = {
                          "size": path.stat().st_size,
                          "sha256": digest.hexdigest(),
                      }
          if files != expected.get("files"):
              missing = sorted(set(expected.get("files", {})) - set(files))
              extra = sorted(set(files) - set(expected.get("files", {})))
              changed = sorted(
                  key
                  for key in set(files) & set(expected.get("files", {}))
                  if files[key] != expected["files"][key]
              )
              raise SystemExit(
                  f"rebuilt payload differs from validation: missing={missing}, extra={extra}, changed={changed}"
              )
          print(f"verified {len(files)} rebuilt files against validation SHA-256 manifest")
          PY
      - name: Publish or verify the complete q4/q8 replacement
        env:
          CHROMA_PACKED: ${{ runner.temp }}/chroma-publish-packed-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
          CHROMA_REPORT: ${{ runner.temp }}/chroma-sc16462-artifact-${{ matrix.model }}.json
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from huggingface_hub import (
              CommitOperationAdd,
              CommitOperationDelete,
              HfApi,
              hf_hub_download,
          )

          api = HfApi()
          identity = api.whoami()
          if not identity.get("name"):
              raise SystemExit("authenticated Hugging Face identity is required for publication")

          repository = os.environ["CHROMA_REPOSITORY"]
          expected = os.environ["CHROMA_SOURCE_REVISION"]
          expected_model = api.model_info(repository, revision=expected, files_metadata=True)
          current = api.model_info(repository).sha
          current_model = api.model_info(repository, revision=current, files_metadata=True)
          packed_root = Path(os.environ["CHROMA_PACKED"])
          additions = {}
          for tier in ("q4", "q8"):
              tier_root = packed_root / tier
              for path in tier_root.rglob("*"):
                  if path.is_file() and ".cache" not in path.parts:
                      additions[f"{tier}/{path.relative_to(tier_root).as_posix()}"] = path

          def lfs_sha(sibling):
              lfs = getattr(sibling, "lfs", None)
              if lfs is None:
                  return None
              return getattr(lfs, "sha256", None) or (
                  lfs.get("sha256") if isinstance(lfs, dict) else None
              )

          def remote_signature(model, prefix):
              return {
                  sibling.rfilename: (
                      sibling.size,
                      lfs_sha(sibling),
                      getattr(sibling, "blob_id", None),
                  )
                  for sibling in model.siblings
                  if sibling.rfilename.startswith(prefix)
              }

          if remote_signature(current_model, "bf16/") != remote_signature(expected_model, "bf16/"):
              raise SystemExit(f"{repository} bf16 tree moved from immutable source; refusing")

          def published_payload_matches(model):
              siblings = {
                  sibling.rfilename: sibling
                  for sibling in model.siblings
                  if sibling.rfilename.startswith(("q4/", "q8/"))
              }
              if siblings.keys() != additions.keys():
                  return False
              for remote_path, local_path in additions.items():
                  sibling = siblings[remote_path]
                  if sibling.size != local_path.stat().st_size:
                      return False
                  remote_sha = lfs_sha(sibling)
                  if remote_sha:
                      digest = hashlib.sha256()
                      with local_path.open("rb") as handle:
                          for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                              digest.update(chunk)
                      if digest.hexdigest() != remote_sha:
                          return False
                  else:
                      downloaded = Path(hf_hub_download(
                          repo_id=repository,
                          filename=remote_path,
                          revision=model.sha,
                      ))
                      if downloaded.read_bytes() != local_path.read_bytes():
                          return False
              return True

          idempotent = current != expected
          if idempotent:
              if not published_payload_matches(current_model):
                  raise SystemExit(
                      f"{repository} main moved to {current} but is not the verified SC-16462 payload"
                  )
              commit_url = f"https://huggingface.co/{repository}/commit/{current}"
          else:
              existing_paths = {
                  sibling.rfilename
                  for sibling in current_model.siblings
                  if sibling.rfilename.startswith(("q4/", "q8/"))
              }
              operations = [
                  CommitOperationDelete(path_in_repo=path)
                  for path in sorted(existing_paths - additions.keys())
              ]
              operations.extend(
                  CommitOperationAdd(path_in_repo=path, path_or_fileobj=local_path)
                  for path, local_path in sorted(additions.items())
              )
              info = api.create_commit(
                  repo_id=repository,
                  operations=operations,
                  commit_message="sc-16462: publish complete packed q4/q8 tiers",
                  parent_commit=current,
              )
              current = info.oid
              commit_url = str(info.commit_url)
              current_model = api.model_info(repository, revision=current, files_metadata=True)
              if not published_payload_matches(current_model):
                  raise SystemExit(f"{repository}@{current} failed post-publish verification")

          sizes = {
              tier: sum(
                  sibling.size or 0
                  for sibling in current_model.siblings
                  if sibling.rfilename.startswith(f"{tier}/")
              )
              for tier in ("q4", "q8", "bf16")
          }
          report = {
              "repository": repository,
              "sourceRevision": expected,
              "resolvedRevision": current,
              "sizes": sizes,
              "commit": {"oid": current, "url": commit_url},
              "publishedBy": identity["name"],
              "idempotentVerification": idempotent,
          }
          Path(os.environ["CHROMA_REPORT"]).write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY
      - name: Upload immutable artifact report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chroma-sc16462-artifact-${{ matrix.model }}
          if-no-files-found: error
          path: ${{ runner.temp }}/chroma-sc16462-artifact-${{ matrix.model }}.json

  # SC-15507: a narrow, independently dispatchable acceptance lane for the request-scoped
  # MLX lifecycle. The broader `media` profile also runs this test, but it requires the complete
  # frozen-Torch Mage oracle bundle before reaching it. This lane intentionally needs only the
  # immutable Mage snapshot consumed by the lifecycle test itself, so an unrelated oracle-cache
  # miss cannot suppress the real-Apple seam gate.
  mlx-request-memory-scope:
    name: MLX request-memory scope real weights
    if: inputs.profile == 'request-memory-scope'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      MAGE_REQUEST_SCOPE_SNAPSHOT: ${{ vars.MAGE_SNAPSHOT }}
      MAGE_REQUEST_SCOPE_QUANT: bf16
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Materialize and verify immutable Mage snapshot
        run: |
          if [[ -z "$MAGE_REQUEST_SCOPE_SNAPSHOT" || "$MAGE_REQUEST_SCOPE_SNAPSHOT" != /* ]]; then
            echo "MAGE_SNAPSHOT must be an operator-provided absolute path" >&2
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py \
            --model mage-flow \
            --snapshot "$MAGE_REQUEST_SCOPE_SNAPSHOT"
      - name: Run Mage request-memory lifecycle
        run: >-
          cargo test --locked --release -p mlx-gen-mage
          --test request_memory_scope_real_weights -- --ignored --nocapture

  mlx-memory-evidence-v1:
    name: MLX memory evidence V1 real weights
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'memory-evidence-v1'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 180
    env:
      ZIMAGE_SNAPSHOT: ${{ vars.ZIMAGE_SNAPSHOT }}
      # Keep this A/B below the VAE tiling threshold so residency is the only mechanism that differs.
      ZIMAGE_SEQ_SIZE: 512
      INFERENCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Verify exact clean inference provenance
        run: |
          test "$(git rev-parse HEAD)" = "$INFERENCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Resolve and bind exact SceneWorks provenance outside the inference worktree
        env:
          SCENEWORKS_PROVENANCE_ROOT: ${{ runner.temp }}/sceneworks-provenance
        run: |
          git init "$SCENEWORKS_PROVENANCE_ROOT"
          git -C "$SCENEWORKS_PROVENANCE_ROOT" remote add origin https://github.com/SceneWorks/SceneWorks.git
          git -C "$SCENEWORKS_PROVENANCE_ROOT" fetch --depth=1 origin "${{ inputs.sceneworks_revision }}"
          git -C "$SCENEWORKS_PROVENANCE_ROOT" checkout --detach FETCH_HEAD
          resolved="$(git -C "$SCENEWORKS_PROVENANCE_ROOT" rev-parse HEAD)"
          if [[ ! "$resolved" =~ ^[0-9a-f]{40}$ || "$resolved" != "${{ inputs.sceneworks_revision }}" ]]; then
            echo "sceneworks_revision did not resolve to the exact requested commit" >&2
            exit 1
          fi
          test -z "$(git -C "$SCENEWORKS_PROVENANCE_ROOT" status --porcelain --untracked-files=normal)"
          echo "SCENEWORKS_REVISION=$resolved" >> "$GITHUB_ENV"
      - name: Toolchain versions
        run: rustc --version && cargo --version && python3 --version
      - name: Materialize and verify immutable Z-Image snapshot
        env:
          MEMORY_MODEL_INVENTORY: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory.json
        run: |
          if [[ -z "$ZIMAGE_SNAPSHOT" || "$ZIMAGE_SNAPSHOT" != /* ]]; then
            echo "ZIMAGE_SNAPSHOT must be an operator-provided absolute path" >&2
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py \
            --model z-image-turbo \
            --snapshot "$ZIMAGE_SNAPSHOT"
          python3 scripts/release/verify_model_snapshot.py \
            --model z-image-turbo \
            --snapshot "$ZIMAGE_SNAPSHOT" \
            --inventory-output "$MEMORY_MODEL_INVENTORY"
          inventory_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["inventory_sha256"])' "$MEMORY_MODEL_INVENTORY")"
          model_revision="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["revision"])' "$MEMORY_MODEL_INVENTORY")"
          if [[ ! "$inventory_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "model inventory did not produce an exact SHA-256" >&2
            exit 1
          fi
          if [[ ! "$model_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "model inventory did not bind an exact revision" >&2
            exit 1
          fi
          echo "MEMORY_MODEL_INVENTORY_SHA256=$inventory_sha" >> "$GITHUB_ENV"
          echo "MEMORY_MODEL_REVISION=$model_revision" >> "$GITHUB_ENV"
      - name: Run and verify Z-Image resident versus staged evidence
        env:
          MEMORY_EVIDENCE_OUTPUT_DIR: ${{ runner.temp }}/memory-evidence-v1
          MEMORY_EVIDENCE_LOG: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo.log
          MEMORY_MODEL_INVENTORY: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory.json
          MEMORY_MODEL_INVENTORY_AFTER: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory-after.json
        run: |
          test "$(git rev-parse HEAD)" = "$INFERENCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$MEMORY_EVIDENCE_OUTPUT_DIR"
          set -o pipefail
          cargo test --locked --release -p mlx-gen-z-image \
            --test sequential_residency_real_weights \
            sequential_bounds_peak_and_is_byte_identical -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee "$MEMORY_EVIDENCE_LOG"
          python3 scripts/release/verify_model_snapshot.py \
            --model z-image-turbo \
            --snapshot "$ZIMAGE_SNAPSHOT" \
            --inventory-output "$MEMORY_MODEL_INVENTORY_AFTER"
          if ! cmp -s "$MEMORY_MODEL_INVENTORY" "$MEMORY_MODEL_INVENTORY_AFTER"; then
            echo "Z-Image snapshot content changed during the evidence run" >&2
            exit 1
          fi
          python3 scripts/release/verify_residency_ab.py \
            --model z_image_turbo \
            --resident "$MEMORY_EVIDENCE_LOG" \
            --sequential "$MEMORY_EVIDENCE_LOG" \
            --min-reduction-mib 512 \
            --expected-fingerprint z-image-mlx-independent-materialization-v3 \
            --expected-abi 3 \
            --expected-model-revision "$MEMORY_MODEL_REVISION" \
            --expected-model-inventory-sha256 "$MEMORY_MODEL_INVENTORY_SHA256" \
            --resident-output "$MEMORY_EVIDENCE_OUTPUT_DIR/z_image_turbo-resident.rgb" \
            --sequential-output "$MEMORY_EVIDENCE_OUTPUT_DIR/z_image_turbo-staged.rgb" \
            | tee "$MEMORY_EVIDENCE_OUTPUT_DIR/verifier-result.txt"
      - name: Upload evidence log and bound output artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-evidence-v1-z-image-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/memory-evidence-v1/z-image-turbo.log
            ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory.json
            ${{ runner.temp }}/memory-evidence-v1/z_image_turbo-resident.rgb
            ${{ runner.temp }}/memory-evidence-v1/z_image_turbo-staged.rgb
            ${{ runner.temp }}/memory-evidence-v1/verifier-result.txt

  mlx-llm:
    name: MLX LLM real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'llm'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      MLX_LLM_TEST_MODEL: ${{ vars.MLX_LLM_TEST_MODEL }}
      MLX_LLM_QWEN3_MODEL: ${{ vars.MLX_LLM_QWEN3_MODEL }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Materialize and verify immutable snapshots
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model smollm2-135m-instruct --snapshot "$MLX_LLM_TEST_MODEL"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model qwen3-0.6b --snapshot "$MLX_LLM_QWEN3_MODEL"
      - name: Run representative conformance
        run: |
          cargo test --locked -p mlx-llm --test conformance real_model_passes_core_llm_conformance -- --ignored --nocapture
          cargo test --locked -p mlx-llm --test conformance real_qwen3_passes_core_llm_conformance -- --ignored --nocapture

  mlx-media:
    name: MLX media real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      ZIMAGE_SNAPSHOT: ${{ vars.ZIMAGE_SNAPSHOT }}
      MAGE_SNAPSHOT: ${{ vars.MAGE_SNAPSHOT }}
      MAGE_EDIT_SNAPSHOT: ${{ vars.MAGE_EDIT_SNAPSHOT }}
      MAGE_EDIT_BASE_SNAPSHOT: ${{ vars.MAGE_EDIT_BASE_SNAPSHOT }}
      MAGE_EDIT_TURBO_SNAPSHOT: ${{ vars.MAGE_EDIT_TURBO_SNAPSHOT }}
      # Operator-provisioned, runner-local bundle required on an exact cache miss. This keeps the
      # multi-hour frozen-Torch CPU producer out of the shared Actions queue; the normal fail-closed
      # verification below must accept every file before the bundle can be cached or consumed.
      MAGE_ORACLE_SEED_DIR: ${{ vars.MAGE_ORACLE_SEED_DIR }}
      # Explicit operator-provided models root for the mlx-gen real-weight resolvers that resolve a
      # repo-keyed snapshot (sc-13755); inference never self-fetches or derives a cache location.
      MLX_GEN_MODELS_ROOT: ${{ vars.MLX_GEN_MODELS_ROOT }}
      MAGE_REQUIRE_GOLDENS: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # actions/setup-python's Darwin package hard-codes /Users/runner during installation, which is
      # not writable on this self-hosted runner. uv installs the exact interpreter wholly in temp.
      - name: Install pinned reference Python
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/python-bin
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/python-install
        run: |
          command -v uv >/dev/null
          uv python install 3.12.10
          python_path="$(uv python find 3.12.10)"
          dirname "$python_path" >> "$GITHUB_PATH"
          "$python_path" --version
      - name: Configure runner-local Mage oracle path
        run: echo "MAGE_GOLDEN_DIR=$RUNNER_TEMP/mage-flow-oracles" >> "$GITHUB_ENV"
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Materialize and verify immutable snapshot
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model z-image-turbo --snapshot "$ZIMAGE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model mage-flow --snapshot "$MAGE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model mage-flow-edit --snapshot "$MAGE_EDIT_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model mage-flow-edit-base --snapshot "$MAGE_EDIT_BASE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model mage-flow-edit-turbo --snapshot "$MAGE_EDIT_TURBO_SNAPSHOT"
      - name: Derive immutable Mage oracle cache key
        id: mage-oracle-key
        run: |
          snapshot_revision() {
            local snapshot="$1"
            local marker="$snapshot/.sceneworks-model-revision"
            local revision
            if [[ -f "$marker" ]]; then
              revision="$(tr -d '\r\n' < "$marker")"
            else
              revision="$(basename "$(cd "$snapshot" && pwd -P)")"
            fi
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Snapshot does not resolve to an immutable 40-hex revision: $snapshot" >&2
              return 1
            fi
            printf '%s' "$revision"
          }
          producer="${{ hashFiles('.github/workflows/real-weights.yml', 'crates/media/mlx-gen/_vendor/mage_flow/**', 'crates/media/mlx-gen/_vendor/mage_flow/assets/dog.jpg', 'crates/media/mlx-gen/_vendor/mage_flow/requirements-oracles.txt', 'crates/media/mlx-gen/tools/_paths.py', 'crates/media/mlx-gen/tools/dump_mage_flow_golden.py', 'crates/media/mlx-gen/tools/dump_mage_vae_sizes.py', 'scripts/release/provision_mage_oracles.py', 'scripts/release/provision_mage_edit_variants.py', 'scripts/release/verify_mage_candle_oracles.py', 'scripts/release/verify_mage_candle_transfer.py') }}"
          if [[ ! "$producer" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Oracle producer fingerprint is missing or malformed: $producer" >&2
            exit 1
          fi
          key="mage-oracles-v1-$(snapshot_revision "$MAGE_SNAPSHOT")-$(snapshot_revision "$MAGE_EDIT_SNAPSHOT")-$(snapshot_revision "$MAGE_EDIT_BASE_SNAPSHOT")-$(snapshot_revision "$MAGE_EDIT_TURBO_SNAPSHOT")-$producer"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore verified Mage oracle cache
        id: mage-oracle-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mage-flow-oracles
          key: ${{ steps.mage-oracle-key.outputs.key }}
      - name: Require operator-provisioned Mage oracle seed
        id: mage-oracle-seed
        if: steps.mage-oracle-cache.outputs.cache-hit != 'true'
        run: |
          if [[ -z "$MAGE_ORACLE_SEED_DIR" ]]; then
            echo "Mage oracle cache missed and MAGE_ORACLE_SEED_DIR is unset; refusing to run the multi-hour CPU producer on the shared Actions runner" >&2
            exit 1
          fi
          if [[ "$MAGE_ORACLE_SEED_DIR" != /* || ! -d "$MAGE_ORACLE_SEED_DIR" ]]; then
            echo "MAGE_ORACLE_SEED_DIR must be an existing absolute directory" >&2
            exit 1
          fi
          files=(
            mage_flow_te_golden.safetensors
            mage_flow_edit_golden.safetensors
            mage_flow_edit_base_golden.safetensors
            mage_flow_edit_turbo_golden.safetensors
            mage_flow_vae_f32_256.safetensors
            mage_flow_vae_f32_992.safetensors
            mage_flow_vae_f32_1024.safetensors
            mage_flow_vae_f32_2048.safetensors
            mage_flow_vae_f32_512x2048.safetensors
            mage_flow_vae_f32_768x1280.safetensors
            mage_flow_vae_f32_768x1152.safetensors
            mage_flow_dit_golden.safetensors
            mage_flow_e2e_golden.safetensors
            mage_oracles_manifest.json
            mage_edit_oracle_manifest.json
            mage_edit_variants_manifest.json
            mage_candle_oracles_manifest.json
            mage_candle_transfer_manifest.json
          )
          mkdir -p "$MAGE_GOLDEN_DIR"
          for file in "${files[@]}"; do
            source="$MAGE_ORACLE_SEED_DIR/$file"
            if [[ ! -f "$source" || -L "$source" ]]; then
              echo "Operator Mage oracle seed is missing a regular, non-symlink file: $source" >&2
              exit 1
            fi
            install -m 0644 "$source" "$MAGE_GOLDEN_DIR/$file"
          done
          echo "imported=true" >> "$GITHUB_OUTPUT"
      # sc-14051 Candle acceptance oracle: one frozen-Torch 1024²/20-step reference run emits
      # both the step-zero full-DiT boundary and the final e2e image. It is generated on a
      # different backend/process from the Candle implementation and transferred as an immutable
      # workflow artifact; Candle never blesses its own output. Cache misses require that
      # operator-generated bundle above instead of running the multi-hour producer in Actions.
      - name: Verify restored or operator-provisioned Mage oracle cache
        run: |
          if [[ ! -x "$RUNNER_TEMP/mage-reference/bin/python" ]]; then
            python -m venv "$RUNNER_TEMP/mage-reference"
            "$RUNNER_TEMP/mage-reference/bin/python" -m pip install \
              --disable-pip-version-check --only-binary=:all: --require-hashes \
              -r crates/media/mlx-gen/_vendor/mage_flow/requirements-oracles.txt
          fi
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/provision_mage_oracles.py \
            --snapshot "$MAGE_SNAPSHOT" \
            --edit-snapshot "$MAGE_EDIT_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR" \
            --verify-only
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/provision_mage_oracles.py \
            --snapshot "$MAGE_SNAPSHOT" \
            --edit-snapshot "$MAGE_EDIT_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR" \
            --verify-edit-artifact
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/provision_mage_edit_variants.py \
            --gen "$MAGE_SNAPSHOT" \
            --edit "$MAGE_EDIT_SNAPSHOT" \
            --edit-base "$MAGE_EDIT_BASE_SNAPSHOT" \
            --edit-turbo "$MAGE_EDIT_TURBO_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR" \
            --verify-only
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/verify_mage_candle_oracles.py \
            --snapshot "$MAGE_SNAPSHOT" \
            --edit-snapshot "$MAGE_EDIT_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR"
          "$RUNNER_TEMP/mage-reference/bin/python" \
            scripts/release/verify_mage_candle_transfer.py \
            --gen "$MAGE_SNAPSHOT" \
            --edit "$MAGE_EDIT_SNAPSHOT" \
            --edit-base "$MAGE_EDIT_BASE_SNAPSHOT" \
            --edit-turbo "$MAGE_EDIT_TURBO_SNAPSHOT" \
            --output "$MAGE_GOLDEN_DIR"
          echo "MAGE_FLOW_TE_GOLDEN=$MAGE_GOLDEN_DIR/mage_flow_te_golden.safetensors" >> "$GITHUB_ENV"
      - name: Save verified Mage oracle cache
        if: steps.mage-oracle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mage-flow-oracles
          key: ${{ steps.mage-oracle-key.outputs.key }}
      - name: Run provider conformance
        run: >-
          cargo test --locked -p mlx-gen-z-image --test conformance
          z_image_turbo_satisfies_gen_core_contract -- --ignored --nocapture
      # sc-14038 DoD gate — the ONLY automatic run of the Qwen3-VL text-encoder parity suite. It
      # needs both the 8.875 GB `text_encoder/` component and the CPU-dumped boundary golden,
      # neither of which the PR lanes have. It also carries the self-invalidating assertion that
      # reports if the bf16 noise floor ever moves far enough to gate the QK-norm epsilon
      # numerically (today it cannot, so `verify_text_config` guards that instead).
      - name: Run Mage-Flow text-encoder parity
        run: >-
          cargo test --locked --release -p mlx-gen-mage --test te_parity_real_weights
          -- --ignored --nocapture
      - name: Run Mage-VAE all-geometry parity
        run: >-
          cargo test --locked --release -p mlx-gen-mage --test vae_decode_real_weights
          -- --ignored --nocapture
      # SC-15507: one loaded provider executes A -> B -> A request scopes, observes cancellation at
      # Mage's terminal post-trace check, injects an error outcome after real work, and proves both
      # cleanup paths permit follow-ups. SceneWorks owns selector/cache-state coverage; this workflow
      # has the Apple MLX hardware and complete snapshot needed for the provider half.
      - name: Run Mage request-memory lifecycle
        env:
          MAGE_REQUEST_SCOPE_SNAPSHOT: ${{ env.MAGE_SNAPSHOT }}
          MAGE_REQUEST_SCOPE_QUANT: bf16
        run: >-
          cargo test --locked --release -p mlx-gen-mage
          --test request_memory_scope_real_weights -- --ignored --nocapture
      - name: Run Mage-Flow instruction-edit parity
        run: |
          status=0
          MAGE_EDIT_GOLDEN_NAME=mage_flow_edit_golden.safetensors \
            cargo test --locked --release -p mlx-gen-mage --test edit_real_weights \
            -- --ignored --nocapture || status=$?
          MAGE_EDIT_SNAPSHOT="$MAGE_EDIT_BASE_SNAPSHOT" \
            MAGE_EDIT_GOLDEN_NAME=mage_flow_edit_base_golden.safetensors \
            cargo test --locked --release -p mlx-gen-mage --test edit_real_weights \
            fixed_instruction_edit_matches_the_torch_reference -- --ignored --nocapture || status=$?
          MAGE_EDIT_SNAPSHOT="$MAGE_EDIT_TURBO_SNAPSHOT" \
            MAGE_EDIT_GOLDEN_NAME=mage_flow_edit_turbo_golden.safetensors \
            cargo test --locked --release -p mlx-gen-mage --test edit_real_weights \
            fixed_instruction_edit_matches_the_torch_reference -- --ignored --nocapture || status=$?
          exit "$status"
      - name: Upload verified Mage edit oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mage-flow-edit-oracle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_base_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_turbo_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_oracle_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_variants_manifest.json
          if-no-files-found: error
      - name: Upload Candle Mage acceptance oracles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mage-flow-candle-oracles-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_te_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_dit_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_vae_f32_1024.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_e2e_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_base_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_flow_edit_turbo_golden.safetensors
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_oracle_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_edit_variants_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_candle_oracles_manifest.json
            ${{ runner.temp }}/mage-flow-oracles/mage_candle_transfer_manifest.json
          if-no-files-found: error

  # sc-8446 (epic 8431) — the FIRST real-weight video lane. Kept a separate job from `mlx-media`
  # because that one is entirely Mage-Flow oracle machinery (a pinned reference Python, a
  # multi-GB golden cache, an operator seed dir) that a video smoke needs none of, and because a 20 GB
  # tier fetch should be able to fail without taking the image lane's oracle work with it.
  mlx-krea-realtime:
    name: MLX Krea Realtime video real weights
    # `krea-realtime` is selectable on its own so the 20 GB tier fetch does not require running the
    # Mage-oracle job that shares the `media` profile.
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media' || inputs.profile == 'krea-realtime'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      # The repo root of the pinned `SceneWorks/krea-realtime-14b-mlx` rehost. Each tier subdir is a
      # complete snapshot, so the tests are pointed one level in (`/q4`).
      KREA_REALTIME_SNAPSHOT: ${{ vars.KREA_REALTIME_SNAPSHOT }}
      KREA_STYLE_LORA_SNAPSHOT: ${{ vars.KREA_STYLE_LORA_SNAPSHOT }}
      KREA_DISTILL_LORA_SNAPSHOT: ${{ vars.KREA_DISTILL_LORA_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # An unset repo variable would otherwise reach `ensure_model_snapshot.py` as an empty path and
      # fail as a confusing "revision mismatch" rather than "you did not configure this lane".
      - name: Require the operator-provisioned snapshot paths
        run: |
          for v in KREA_REALTIME_SNAPSHOT KREA_STYLE_LORA_SNAPSHOT KREA_DISTILL_LORA_SNAPSHOT; do
            if [[ -z "${!v}" ]]; then
              echo "Repository variable $v is unset; this lane cannot resolve its snapshot path" >&2
              exit 1
            fi
            if [[ "${!v}" != /* ]]; then
              echo "$v must be an absolute path, got: ${!v}" >&2
              exit 1
            fi
          done
      - name: Materialize and verify immutable snapshots
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model krea-realtime-14b-mlx --snapshot "$KREA_REALTIME_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model wan-origami-style-lora --snapshot "$KREA_STYLE_LORA_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model wan-lightx2v-step-distill-lora --snapshot "$KREA_DISTILL_LORA_SNAPSHOT"
      # Coherence floor + per-chunk/whole-clip timing + the MLX memory ceiling, then the i2v
      # single-frame anchor, the v2v strength=0 paths, and the sc-15325 decode-tiling characterization.
      #
      # 33 frames, not 81, and that is required rather than incidental: the sc-15325 sweep compares
      # against a SINGLE-PASS decode, which is only valid below the z16 write cap of 56 output frames at
      # 832x480 (the sweep asserts this itself and would fail at 81). `KREA_SMOKE_FRAMES` is set PER
      # STEP so the one test that genuinely needs the production geometry -- the KV-cache residency,
      # whose 6-latent-frame window must fill -- can run at 81 in its own step below.
      - name: Run Krea Realtime real-weight e2e (Q4 tier)
        env:
          KREA_SMOKE_W: "832"
          KREA_SMOKE_H: "480"
          KREA_SMOKE_FRAMES: "33"
        run: >-
          KREA_REALTIME_SNAPSHOT_DIR="$KREA_REALTIME_SNAPSHOT/q4"
          cargo test --locked --release -p mlx-gen-krea-realtime --test generate_smoke
          -- --ignored --nocapture --test-threads 1
          --skip kv_cache_residency_at_the_production_geometry
      # The KV-cache residency IS a production-geometry measurement (the 6-latent-frame window must be
      # full), so it runs at the real 81-frame clip.
      - name: Run Krea Realtime KV-cache residency (production geometry)
        env:
          KREA_SMOKE_W: "832"
          KREA_SMOKE_H: "480"
          KREA_SMOKE_FRAMES: "81"
        run: >-
          KREA_REALTIME_SNAPSHOT_DIR="$KREA_REALTIME_SNAPSHOT/q4"
          cargo test --locked --release -p mlx-gen-krea-realtime --test generate_smoke
          kv_cache_residency_at_the_production_geometry --exact
          -- --ignored --nocapture
      # A published Wan style LoRA must load through `LoadSpec::adapters` and measurably change the
      # render, with the scale-0 arm as the attribution control; and the step-distill file is the only
      # real-weight regression gate on the sc-8446 globals-surface decision.
      #
      # `--exact` + a run-count assertion: selecting by bare name means a rename yields
      # "0 passed; N filtered out" and a GREEN step, silently deleting the only coverage these have.
      - name: Run Krea Realtime real Wan LoRA gates
        env:
          KREA_LORA_W: "832"
          KREA_LORA_H: "480"
          KREA_LORA_FRAMES: "13"
        run: |
          set -o pipefail
          run_one() {
            local name="$1"
            local out
            out="$(KREA_REALTIME_SNAPSHOT_DIR="$KREA_REALTIME_SNAPSHOT/q4" \
              KREA_STYLE_LORA="$KREA_STYLE_LORA_SNAPSHOT/origami_000000500.safetensors" \
              KREA_DISTILL_LORA="$KREA_DISTILL_LORA_SNAPSHOT/Lightx2v/lightx2v_T2V_14B_cfg_step_distill_v2_lora_rank64_bf16.safetensors" \
              cargo test --locked --release -p mlx-gen-krea-realtime --test style_lora_real_weights \
              "$name" --exact -- --ignored --nocapture 2>&1 | tee /dev/stderr)"
            if ! grep -qE "test result: ok\. 1 passed" <<<"$out"; then
              echo "::error::'$name' did not run exactly one passing test — a rename would make this step vacuously green" >&2
              return 1
            fi
          }
          run_one real_wan_style_lora_loads_and_changes_the_render
          run_one real_wan_step_distill_lora_installs_over_the_widened_globals

  candle-audio:
    name: Candle audio real weights
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio'
    runs-on: [self-hosted, macOS, ARM64, real-weights]
    timeout-minutes: 120
    env:
      KOKORO_SNAPSHOT: ${{ vars.KOKORO_SNAPSHOT }}
      MOSS_SFX_SNAPSHOT: ${{ vars.MOSS_SFX_SNAPSHOT }}
      ACESTEP_SNAPSHOT: ${{ vars.ACESTEP_SNAPSHOT }}
      CHATTERBOX_VE_SNAPSHOT: ${{ vars.CHATTERBOX_VE_SNAPSHOT }}
      CHATTERBOX_SNAPSHOT: ${{ vars.CHATTERBOX_SNAPSHOT }}
      CHATTERBOX_PERTH_SNAPSHOT: ${{ vars.CHATTERBOX_PERTH_SNAPSHOT }}
      OPENVOICE_V2_SNAPSHOT: ${{ vars.OPENVOICE_V2_SNAPSHOT }}
      WHISPER_SNAPSHOT: ${{ vars.WHISPER_SNAPSHOT }}
      CLAP_SNAPSHOT: ${{ vars.CLAP_SNAPSHOT }}
      MOSS_TTS_REALTIME_SNAPSHOT: ${{ vars.MOSS_TTS_REALTIME_SNAPSHOT }}
      MOSS_TTSD_SNAPSHOT: ${{ vars.MOSS_TTSD_SNAPSHOT }}
      MOSS_XY_TOKENIZER_SNAPSHOT: ${{ vars.MOSS_XY_TOKENIZER_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Materialize and verify immutable snapshots
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/huggingface-hub" "huggingface_hub==1.20.1"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model kokoro-82m --snapshot "$KOKORO_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model moss-soundeffect-v2 --snapshot "$MOSS_SFX_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model acestep-v15-turbo --snapshot "$ACESTEP_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model chatterbox-ve --snapshot "$CHATTERBOX_VE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model chatterbox --snapshot "$CHATTERBOX_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model chatterbox-perth --snapshot "$CHATTERBOX_PERTH_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model openvoice-v2 --snapshot "$OPENVOICE_V2_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model whisper-base --snapshot "$WHISPER_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model clap-htsat-unfused --snapshot "$CLAP_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model moss-tts-realtime --snapshot "$MOSS_TTS_REALTIME_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model moss-ttsd-v05 --snapshot "$MOSS_TTSD_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3 scripts/release/ensure_model_snapshot.py --model xy-tokenizer-ttsd --snapshot "$MOSS_XY_TOKENIZER_SNAPSHOT"
      - name: Run provider conformance
        run: |
          cargo test --locked -p candle-audio-kokoro --test conformance kokoro_conformance -- --ignored --nocapture
          cargo test --locked -p candle-audio-kokoro --test conformance kokoro_wav_conformance -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-sfx --test conformance moss_sfx_conformance -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-sfx --test conformance moss_sfx_wav_conformance -- --ignored --nocapture
          # ACE-Step 1.5 music/song (sc-12842): the flow-matching DiT + Oobleck VAE producing a
          # non-degenerate, rhythmic stereo mix (frame-energy variation, broadband spectrum, beat).
          cargo test --locked -p candle-audio-acestep --test conformance acestep_conformance -- --ignored --nocapture
          cargo test --locked -p candle-audio-acestep --test conformance acestep_music_wav_conformance -- --ignored --nocapture
          # Chatterbox voice embedder (sc-12844): the sc-12838 release gate. Uses the Kokoro
          # snapshot above for the distinct reference voices it embeds.
          cargo test --locked -p candle-audio-chatterbox-ve --test conformance chatterbox_ve_discriminates_speakers -- --ignored --nocapture
          cargo test --locked -p candle-audio-chatterbox-ve --test conformance chatterbox_ve_wav_conformance -- --ignored --nocapture
          # OpenVoice V2 voice conversion (sc-13223): the sc-12839 release gate. Converts a Kokoro
          # source clip toward a DIFFERENT Kokoro target voice; the timbre shift is measured with
          # chatterbox_ve above. sc-13233 adds a content-preservation gate: whisper_base (snapshot
          # below) transcribes the converted clip and asserts its CER vs the known source script
          # stays small — catching linguistic garbling the duration+timbre gate is blind to.
          cargo test --locked -p candle-audio-openvoice --test conformance openvoice_v2_converts_toward_the_target_voice -- --ignored --nocapture
          cargo test --locked -p candle-audio-openvoice --test conformance openvoice_v2_is_deterministic -- --ignored --nocapture
          # Chatterbox clone-TTS (sc-13222): the T3 speech-token LM stage on real t3_cfg.safetensors
          # weights — a valid, non-degenerate, voice-responsive token sequence, plus the honest
          # VoiceEmbedding-only boundary (a full clone WAV requires ReferenceAudio; sc-13239).
          cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_t3_produces_valid_speech_tokens -- --ignored --nocapture
          cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_t3_responds_to_the_reference_voice -- --ignored --nocapture
          cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_generate_requires_reference_audio_for_a_full_clone -- --ignored --nocapture
          # s3tokenizer (sc-13235) + T3 prompt-token wiring: the Whisper-v2 FSMN encoder + FSQ head
          # tokenizes a reference at ≈25 Hz into valid FSQ codes, deterministically and content-
          # responsively, and fills T3's reference conditioning prompt (previously orphaned — sc-13394).
          cargo test --locked -p candle-audio-chatterbox --test conformance s3tokenizer_encodes_a_reference_at_25hz -- --ignored --nocapture
          cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_reference_audio_fills_the_t3_prompt_tokens -- --ignored --nocapture
          # s3tokenizer long-audio (>30s) sliding-window segmentation + merge_tokenized_segments
          # (sc-13380): 30 s windows hopped by 26 s (4 s overlap), each tokenized independently and
          # stitched so the overlap is counted once — a real >30 s clip tokenizes at 25 Hz across the
          # seams and matches single-pass tokens over the non-boundary interior (continuity).
          cargo test --locked -p candle-audio-chatterbox --test conformance s3tokenizer_windows_audio_longer_than_30s -- --ignored --nocapture
          # CAMPPlus speaker encoder (sc-13236): the D-TDNN x-vector network derives DISCRIMINATIVE
          # 192-d / 80-d flow speaker embeddings on real speaker_encoder.* weights (previously
          # orphaned — sc-13394).
          cargo test --locked -p candle-audio-chatterbox --test conformance campplus_derives_discriminative_x_vectors -- --ignored --nocapture
          # S3Gen flow token->mel decoder (sc-13237): the UpsampleConformerEncoder + CausalConditionalCFM
          # + ConditionalDecoder on real flow.* weights render a sane 80-bin log-mel (shape [80, ~2*n_tokens],
          # finite, non-degenerate range) from real conditioning (s3tokenizer tokens + CAMPPlus 80-d spk +
          # 24 kHz prompt mel) and are deterministic. Needs the full CHATTERBOX_SNAPSHOT (s3gen.safetensors).
          cargo test --locked -p candle-audio-chatterbox --test conformance flow_synthesizes_a_sane_mel_from_speech_tokens -- --ignored --nocapture
          # S3Gen HiFTNet vocoder (sc-13238): the NSF/iSTFT mel->waveform generator vocodes a real 24 kHz
          # log-mel into a non-silent, finite, 480-samples/frame waveform, deterministically.
          cargo test --locked -p candle-audio-chatterbox --test conformance hift_vocodes_a_real_mel_to_nonsilent_waveform -- --ignored --nocapture
          # PerTh provenance watermarker (sc-13240): the natively-ported implicit watermarker on real
          # weights (MIT; resolved from the SceneWorks/perth-implicit hub pin — sc-13443) embeds a
          # RECOVERABLE (≈100% detection, clean≈0) and IMPERCEPTIBLE (psychoacoustically masked;
          # SNR ≈16 dB) watermark, at both the model's native 32 kHz rate and Chatterbox's 24 kHz
          # output path. Wired into generate() (sc-13239).
          cargo test --locked -p candle-audio-chatterbox --test conformance perth_watermark_roundtrips_and_is_imperceptible -- --ignored --nocapture
          # THE sc-12838 clone-WAV DoD (sc-13239): the epic-releasing gate. The full registry path
          # (generate()) renders a real 24 kHz cloned-voice WAV from a reference clip + text that is
          # non-silent, finite, token-proportional, speech-shaped, watermarked, AND voice-similar to
          # the reference (cos(ve(out),ve(ref)) > cos(ve(out),ve(control)) by a material margin — it
          # FAILS if the clone ignores the reference). Needs the full CHATTERBOX_SNAPSHOT; PerTh
          # resolves from the SceneWorks/perth-implicit hub pin.
          CHATTERBOX_WAV_OUT="$RUNNER_TEMP/chatterbox_clone_demo.wav" cargo test --locked -p candle-audio-chatterbox --test conformance chatterbox_clones_a_reference_voice_end_to_end -- --ignored --nocapture
          # Whisper ASR (sc-12850): the first real Transcriber (audio→text, the Captioner-analog).
          # Kokoro TTS → Whisper ASR round-trip — known text synthesized by kokoro_82m (snapshot
          # above) transcribes back within a small CER, with monotonic segment timestamps.
          cargo test --locked -p candle-audio-whisper --test conformance whisper_transcribes_kokoro_roundtrip_within_cer -- --ignored --nocapture
          cargo test --locked -p candle-audio-whisper --test conformance whisper_greedy_transcription_is_deterministic -- --ignored --nocapture
          # LAION CLAP audio embedder (sc-12851): the first real AudioEmbedder (semantic audio-text
          # joint-space retrieval). Embeds a set of real clips spanning categories (a Kokoro speech
          # clip from the snapshot above, a tone, and white noise) and asserts a TEXT query ranks its
          # matching clip highest by cosine — the cross-modal ranking DoD — plus embedding determinism.
          cargo test --locked -p candle-audio-clap --test conformance cross_modal_query_ranks_matching_clip_highest -- --ignored --nocapture
          cargo test --locked -p candle-audio-clap --test conformance embedding_is_deterministic -- --ignored --nocapture
          # MOSS-TTSD-v0.5 multi-speaker dialogue TTS (sc-13360 AR brain + sc-13518 XY_Tokenizer
          # codec). The Qwen3 backbone + 8-channel delay-pattern loop emits real, deterministic RVQ
          # frames; a 2-speaker [S1]/[S2] script shapes the token stream vs a single-voice control;
          # and the ported XY_Tokenizer codec renders those frames into one 24 kHz AudioTrack whose two
          # speakers are acoustically distinct (measured via chatterbox_ve — cross-segment cosine below
          # same-segment self-similarity), with a single-voice control and byte-identical re-synth. The
          # non-English gate (task 12906) checks a Chinese prompt renders distinct real audio.
          cargo test --locked -p candle-audio-moss-tts --test conformance moss_ttsd_emits_valid_delay_pattern_rvq_frames -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-tts --test conformance moss_ttsd_two_speaker_script_shapes_the_token_stream -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-tts --test conformance moss_ttsd_renders_multi_speaker_audio -- --ignored --nocapture
          cargo test --locked -p candle-audio-moss-tts --test conformance moss_ttsd_renders_non_english -- --ignored --nocapture
      # Regression fixture (sc-12854): the validation harness's committed metric envelope +
      # PCM repeatability hash; this runner IS the fixture's canonical platform
      # (macos/aarch64), so the exact-hash check gates here.
      - name: Run regression fixture
        run: cargo test --locked -p candle-audio-kokoro --test regression kokoro_regression_fixture -- --ignored --nocapture

