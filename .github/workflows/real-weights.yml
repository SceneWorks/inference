  candle-media:
    name: Candle media real weights (CUDA)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'media'
    runs-on: [self-hosted, windows, cuda, real-weights]
    needs: mlx-media
    env:
      Z_IMAGE_SNAPSHOT: ${{ vars.Z_IMAGE_SNAPSHOT }}
      # This is intentionally distinct from the macOS MAGE_SNAPSHOT path: repository variables
      # contain runner-local absolute paths, so the Windows CUDA runner needs its own snapshot.
      CANDLE_MAGE_SNAPSHOT: ${{ vars.CANDLE_MAGE_SNAPSHOT }}
      MAGE_SNAPSHOT: ${{ vars.CANDLE_MAGE_SNAPSHOT }}
      CANDLE_MAGE_EDIT_SNAPSHOT: ${{ vars.CANDLE_MAGE_EDIT_SNAPSHOT }}
      CANDLE_MAGE_EDIT_BASE_SNAPSHOT: ${{ vars.CANDLE_MAGE_EDIT_BASE_SNAPSHOT }}
      CANDLE_MAGE_EDIT_TURBO_SNAPSHOT: ${{ vars.CANDLE_MAGE_EDIT_TURBO_SNAPSHOT }}
      MAGE_EDIT_SNAPSHOT: ${{ vars.CANDLE_MAGE_EDIT_SNAPSHOT }}
      MAGE_EDIT_BASE_SNAPSHOT: ${{ vars.CANDLE_MAGE_EDIT_BASE_SNAPSHOT }}
      MAGE_EDIT_TURBO_SNAPSHOT: ${{ vars.CANDLE_MAGE_EDIT_TURBO_SNAPSHOT }}
      # Explicit operator-provided models root for the candle-gen real-weight resolvers that resolve
      # a repo-keyed snapshot (sc-13755); inference never self-fetches or derives a cache location.
      CANDLE_GEN_MODELS_ROOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Download independent Candle Mage acceptance oracles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mage-flow-candle-oracles-${{ github.sha }}
          path: ${{ runner.temp }}\mage-flow-oracles
      - name: Require operator-provided Candle Mage snapshot
        shell: cmd
        run: |
          if "%CANDLE_MAGE_SNAPSHOT%"=="" (
            echo Missing repository variable CANDLE_MAGE_SNAPSHOT for the Windows CUDA runner.
            exit /b 1
          )
          if "%CANDLE_MAGE_EDIT_SNAPSHOT%"=="" exit /b 1
          if "%CANDLE_MAGE_EDIT_BASE_SNAPSHOT%"=="" exit /b 1
          if "%CANDLE_MAGE_EDIT_TURBO_SNAPSHOT%"=="" exit /b 1
          echo MAGE_GOLDEN_DIR=%RUNNER_TEMP%\mage-flow-oracles>>"%GITHUB_ENV%"
      - name: Materialize and verify immutable snapshot
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --target "%RUNNER_TEMP%\huggingface-hub" "huggingface_hub==1.20.1"
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          python scripts/release/ensure_model_snapshot.py --model z-image-turbo --snapshot "%Z_IMAGE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model mage-flow --snapshot "%CANDLE_MAGE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model mage-flow-edit --snapshot "%CANDLE_MAGE_EDIT_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model mage-flow-edit-base --snapshot "%CANDLE_MAGE_EDIT_BASE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model mage-flow-edit-turbo --snapshot "%CANDLE_MAGE_EDIT_TURBO_SNAPSHOT%" || exit /b 1
      - name: Verify transferred Candle Mage acceptance oracles
        shell: cmd
        run: |
          python scripts/release/verify_mage_candle_transfer.py --gen "%CANDLE_MAGE_SNAPSHOT%" --edit "%CANDLE_MAGE_EDIT_SNAPSHOT%" --edit-base "%CANDLE_MAGE_EDIT_BASE_SNAPSHOT%" --edit-turbo "%CANDLE_MAGE_EDIT_TURBO_SNAPSHOT%" --output "%MAGE_GOLDEN_DIR%" || exit /b 1
          python -m pip install --disable-pip-version-check --only-binary=:all: --target "%RUNNER_TEMP%\mage-oracle-verify" "numpy==2.4.3" "safetensors==0.8.0" || exit /b 1
          set "PYTHONPATH=%RUNNER_TEMP%\mage-oracle-verify"
          python scripts/release/provision_mage_oracles.py --snapshot "%CANDLE_MAGE_SNAPSHOT%" --edit-snapshot "%CANDLE_MAGE_EDIT_SNAPSHOT%" --output "%MAGE_GOLDEN_DIR%" --verify-edit-artifact || exit /b 1
          python scripts/release/provision_mage_edit_variants.py --gen "%CANDLE_MAGE_SNAPSHOT%" --edit "%CANDLE_MAGE_EDIT_SNAPSHOT%" --edit-base "%CANDLE_MAGE_EDIT_BASE_SNAPSHOT%" --edit-turbo "%CANDLE_MAGE_EDIT_TURBO_SNAPSHOT%" --output "%MAGE_GOLDEN_DIR%" --verify-only || exit /b 1
          python scripts/release/verify_mage_candle_oracles.py --snapshot "%CANDLE_MAGE_SNAPSHOT%" --edit-snapshot "%CANDLE_MAGE_EDIT_SNAPSHOT%" --output "%MAGE_GOLDEN_DIR%" || exit /b 1
      - name: Run provider conformance
        shell: cmd
        run: |
          call "%VCVARS%"
          set "MAGE_CONFORMANCE_FAILED=0"
          cargo test --locked -p candle-gen-z-image --features cuda --test conformance z_image_conformance -- --ignored --nocapture || set "MAGE_CONFORMANCE_FAILED=1"
          cargo test --locked --release -p candle-gen-mage --features cuda --test real_parity -- --ignored --nocapture || set "MAGE_CONFORMANCE_FAILED=1"
          cargo test --locked --release -p candle-gen-mage --features cuda --test cuda_1024 -- --ignored --nocapture || set "MAGE_CONFORMANCE_FAILED=1"
          cargo test --locked --release -p candle-gen-mage --features cuda --test edit_parity -- --ignored --nocapture || set "MAGE_CONFORMANCE_FAILED=1"
          for %%T in (q4 q8 bf16) do (
            set "MAGE_QUANT_TIER=%%T"
            cargo test --locked --release -p candle-gen-mage --features cuda --test quant_real_weights registered_tier_matches_independent_oracle_and_vram_budget -- --ignored --nocapture || set "MAGE_CONFORMANCE_FAILED=1"
          )
          if not "%MAGE_CONFORMANCE_FAILED%"=="0" exit /b 1

