      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_VERBOSITY: "error"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Initialize exact SCAIL CUDA evidence
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP "scail2-shared-cuda.log"
          @(
            "inference_head=${{ github.sha }}"
            "repository=$env:SCAIL2_REPOSITORY"
            "revision=$env:SCAIL2_REVISION"
            "provision_status=validating_python"
          ) | Set-Content -LiteralPath $log -Encoding utf8
          where.exe python 2>&1 | Tee-Object -FilePath $log -Append
          python --version 2>&1 | Tee-Object -FilePath $log -Append
      - name: Validate runner-provisioned CPython 3.14 x64
        shell: powershell
        run: . ./scripts/ci/real-weights/candle-scail2-shared/validate-runner-provisioned-cpython-3-14-x64.ps1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Provision the exact public shared bf16 package
        shell: powershell
        run: . ./scripts/ci/real-weights/candle-scail2-shared/provision-the-exact-public-shared-bf16-package.ps1
      - name: Build the exact CUDA real-weight gate
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release --no-run -p candle-gen-scail2 --features cuda || exit /b 1
      - name: Load through the production provider, minimally render, and measure the shared package
        shell: bash
        run: |
          set -o pipefail
          evidence_log="$(cygpath -u "$RUNNER_TEMP")/scail2-shared-cuda.log"
          export PATH="$(cygpath -u "$CUDA_PATH")/bin:$PATH"
          profile_gpu="${CUDA_VISIBLE_DEVICES%%,*}"
          profile_gpu="${profile_gpu:-0}"
          [[ "$profile_gpu" =~ ^[0-9]+$ ]] || {
            echo "CUDA_VISIBLE_DEVICES must start with a physical GPU ordinal, got ${CUDA_VISIBLE_DEVICES:-<unset>}" >&2
            exit 1
          }
          {
            echo "[[CUDA_IDLE_RAW]] profileGpu=$profile_gpu visibleDevices=${CUDA_VISIBLE_DEVICES:-<unset>}"
            nvidia-smi -i "$profile_gpu" \
              --query-gpu=index,name,driver_version,pstate,utilization.gpu,memory.used,memory.total \
              --format=csv,noheader
            for _ in 1 2 3 4 5 6; do
              nvidia-smi -i "$profile_gpu" --query-gpu=index,memory.used \
                --format=csv,noheader,nounits
              sleep 0.2
            done
            nvidia-smi pmon -i "$profile_gpu" -c 1 -s um
          } 2>&1 | tee -a "$evidence_log"
          cargo test --locked --release -p candle-gen-scail2 --features cuda \
            pipeline::tests::shared_bf16_real_weights_cuda_loads_and_renders_with_measured_peak \
            -- --ignored --exact --nocapture 2>&1 | tee -a "$evidence_log"
          grep -Fq '[[SCAIL2_CUDA_VRAM]]' "$evidence_log" || {
            echo 'the real-weight test passed without emitting its machine-readable VRAM record' >&2
            exit 1
          }
      - name: Upload exact SCAIL CUDA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scail2-shared-cuda-${{ github.sha }}
          path: ${{ runner.temp }}\scail2-shared-cuda.log
          if-no-files-found: error

