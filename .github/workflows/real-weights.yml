name: "[Mac2] SC-24163 single-linear diagnostic transport"
# Isolated diagnostic ref only. Reuses registered workflow312370029; never product main.
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        required: true
        default: qwen-image-2-1-lora-mlx
        options: [qwen-image-2-1-lora-mlx]
      qwen_image_2_1_lora_runner:
        type: choice
        required: true
        default: rw-mage
        options: [rw-mage]
      qwen_image_2_1_lora_phase:
        type: choice
        required: true
        default: current-diagnostic
        options: [current-diagnostic]
permissions:
  contents: read
concurrency:
  group: sc24163-single-linear-${{ github.ref }}
  cancel-in-progress: false
jobs:
  single-linear:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'qwen-image-2-1-lora-mlx' && inputs.qwen_image_2_1_lora_runner == 'rw-mage' && inputs.qwen_image_2_1_lora_phase == 'current-diagnostic'
    name: "[Mac2] One captured-input linear; diagnostic only"
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      QWEN_SINGLE_LINEAR_ROOT: ${{ runner.temp }}/sc24163-single-linear-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: ${{ runner.temp }}/sc24163-single-linear-target-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0
      - name: Compile, bind exact operands, execute two serial typed processes
        shell: bash
        run: bash scripts/ci/real-weights/mlx-qwen-image-2-1/run-single-linear.sh
      - name: Retain complete diagnostic packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sc24163-single-linear-diagnostic
          path: ${{ env.QWEN_SINGLE_LINEAR_ROOT }}
          if-no-files-found: error
          retention-days: 30
