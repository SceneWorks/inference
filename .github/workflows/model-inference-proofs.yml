name: Explicit model inference proofs

# Model execution is NEVER a PR/push CI step. Dispatch only an approved source/case/resource plan.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Fixed compatible execution route; actual test devices are recorded separately
        type: choice
        required: true
        default: mlx
        options: [mlx, candle-cpu, candle-metal, candle-cuda]
      flux1_pair:
        description: Compare the FLUX.1 batch against its pre-migration source in this same job
        type: choice
        options: [none, tier1, tier2, conditional-tier1, eng4b-tier1, eng4b-tier2, eng4b-conditional-tier1]
        default: none
      request:
        description: 'JSON with registered selection and explicit supervisor policy; optional runner="nax" for provisioned assets'
        type: string
        required: true
      stage_pinned_assets:
        description: 'Asset inventory only: stage absent product-pinned files into the runner cache. A request with cases limits staging to those sealed Windows FLUX.1 cases.'
        type: boolean
        default: false

env:
  FLUX1_PAIR_TIER: ${{ inputs.flux1_pair }}
  # rust-lang/rust#157750: a fresh macOS build strips host proc-macro dylibs into E0463
  # ("can't find crate for `*_derive`"), so keep every profile and its build overrides unstripped.
  CARGO_PROFILE_DEV_STRIP: none
  CARGO_PROFILE_TEST_STRIP: none
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_STRIP: none
  CARGO_PROFILE_TEST_BUILD_OVERRIDE_STRIP: none
  CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: none
  MODEL_PROOF_SCRIPT: >-
    ${{ inputs.flux1_pair == 'none' && fromJSON(inputs.request).selection == 'sga-terminal-tier2' && 'sga_terminal_comparison.py'
    || inputs.flux1_pair == 'none' && fromJSON(inputs.request).selection == 'sga-adapter-tier1' && 'sga_adapter_comparison.py'
    || inputs.flux1_pair == 'none' && fromJSON(inputs.request).selection == 'flux1-asset-inventory' && 'flux1_conditional_asset_inventory.py'
    || (inputs.flux1_pair == 'conditional-tier1' || inputs.flux1_pair == 'eng4b-conditional-tier1') && 'flux1_conditional_comparison.py'
    || (inputs.flux1_pair == 'tier1' || inputs.flux1_pair == 'tier2' || inputs.flux1_pair == 'eng4b-tier1' || inputs.flux1_pair == 'eng4b-tier2') && 'flux1_comparison.py'
    || 'model_inference_proofs.py' }}

permissions:
  contents: read

# No workflow-level concurrency group: GitHub replaces older PENDING members even cancel:false.
# Compatible registered runner queues / existing physical execution coordination do the queuing.
jobs:
  plan:
    name: Validate exact model-proof request (no model execution)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          # The adapter pair verifies the exact ENG-4a ancestor with bounded candidate history.
          fetch-depth: ${{ (env.MODEL_PROOF_SCRIPT == 'sga_adapter_comparison.py' || env.MODEL_PROOF_SCRIPT == 'sga_terminal_comparison.py') && '128' || '1' }}
          persist-credentials: false
      - name: Install pinned uv on Linux
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Install managed CPython 3.12 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv python install 3.12.10 --managed-python --no-bin --no-config
          PYTHON="$(uv python find 3.12.10 --managed-python --no-project --no-config)"
          "$PYTHON" -c 'import sys; assert sys.version_info[:3] == (3,12,10), sys.version'
          printf 'REVIEWED_PYTHON=%s\n' "$PYTHON" >> "$GITHUB_ENV"
      - name: Validate registered cases and explicit resource policy
        id: plan
        env:
          MODEL_PROOF_BACKEND: ${{ inputs.backend }}
          MODEL_PROOF_REQUEST: ${{ inputs.request }}
        run: |
          "$REVIEWED_PYTHON" -I "scripts/ci/$MODEL_PROOF_SCRIPT" --plan \
            --backend "$MODEL_PROOF_BACKEND" --request-env MODEL_PROOF_REQUEST \
            --expected-sha "$GITHUB_SHA" > "$RUNNER_TEMP/model-proof-plan.json"
          "$REVIEWED_PYTHON" -I -c 'import json,os; p=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"model-proof-plan.json"),encoding="utf-8")); matrix={"include":[{"runner":p["runner"],"asset_setup":p["asset_setup"]}]}; open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8").write("matrix="+json.dumps(matrix,separators=(",",":"))+"\n")'

  prove:
    name: Explicit ${{ inputs.backend }} model tests
    needs: plan
    if: ${{ fromJSON(inputs.request).selection != 'flux1-asset-inventory' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FLUX1_HUB: ${{ inputs.backend == 'mlx' && vars.MLX_GEN_MODELS_ROOT || vars.CANDLE_GEN_MODELS_ROOT }}
      MODEL_PROOF_BACKEND: ${{ inputs.backend }}
      MODEL_PROOF_REQUEST: ${{ inputs.request }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: 'false'
      CARGO_PROFILE_TEST_STRIP: 'false'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_STRIP: none
      CARGO_PROFILE_TEST_BUILD_OVERRIDE_STRIP: none
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ (env.MODEL_PROOF_SCRIPT == 'sga_adapter_comparison.py' || env.MODEL_PROOF_SCRIPT == 'sga_terminal_comparison.py') && '128' || '1' }}
          persist-credentials: false
      - name: Check out the exact pre-migration engine for the paired proof
        if: matrix.asset_setup == 'flux1-comparison'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: 2b09938e33370915d4f853389961709b8bbf8bf9
          path: flux1-baseline
          persist-credentials: false
      - name: Check out the exact adapter comparison baseline
        if: matrix.asset_setup == 'sga-adapter-comparison'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: e86b8d5fc493c16b2d9d852e0c9ecbdefee58294
          path: sga-adapter-baseline
          persist-credentials: false
      - name: Check out the exact terminal comparison baseline
        if: matrix.asset_setup == 'sga-terminal-comparison'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: 481a982db44b58937c15c2d3f0cbf918b116d04d
          path: sga-terminal-baseline
          persist-credentials: false
      - name: Check out the merged ENG-4a engine for the FLUX.1 ENG-4b proof
        if: matrix.asset_setup == 'flux1-eng4b-comparison'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: e86b8d5fc493c16b2d9d852e0c9ecbdefee58294
          path: flux1-baseline
          persist-credentials: false
      - name: Select Git Bash on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Install pinned uv on Windows
        if: runner.os == 'Windows'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Install reviewed CPython 3.12 on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\ci\real-weights\candle-llm\install-reviewed-cpython-3-12.cmd
      - name: Install pinned uv on Linux
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Install managed CPython 3.12 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv python install 3.12.10 --managed-python --no-bin --no-config
          PYTHON="$(uv python find 3.12.10 --managed-python --no-project --no-config)"
          "$PYTHON" -c 'import sys; assert sys.version_info[:3] == (3,12,10), sys.version'
          printf 'REVIEWED_PYTHON=%s\n' "$PYTHON" >> "$GITHUB_ENV"
      - name: Set owned proof paths and actual runner environment
        shell: bash
        env:
          OWNED_PROOF_EVIDENCE: ${{ runner.temp }}/model-proof-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          printf 'MODEL_PROOF_EVIDENCE=%s\n' "$OWNED_PROOF_EVIDENCE" >> "$GITHUB_ENV"
          printf 'MODEL_PROOF_RUNNER_ENVIRONMENT=%s\n' "$ACTUAL_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - name: Select Rustup proxies on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: source scripts/ci/real-weights/model-proof-execute/posix-rust.sh
      - name: Select real pinned Rust toolchain on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: . ./scripts/ci/real-weights/model-proof-execute/windows-rust.ps1
      - name: Report actual host and pinned toolchain (no model execution)
        shell: bash
        run: source scripts/ci/real-weights/model-proof-execute/host.sh
      - name: Require Python 3.12 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: command -v python3.12
      - name: Verify pinned Iris quant snapshots on macOS
        if: matrix.asset_setup == 'iris-quant' && runner.os == 'macOS'
        shell: bash
        run: |
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          IRIS_PROOF_HF_HUB_PATH="$RUNNER_TEMP/huggingface-hub" python3.12 -I scripts/ci/prepare_iris_quant_proof_assets.py --backend mlx
      - name: Verify pinned Iris quant snapshots on Windows
        if: matrix.asset_setup == 'iris-quant' && runner.os == 'Windows'
        shell: cmd
        env:
          CANDLE_GEN_MODELS_ROOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
        run: |
          "%REVIEWED_PYTHON%" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt || exit /b 1
          set "IRIS_PROOF_HF_HUB_PATH=%RUNNER_TEMP%\huggingface-hub"
          "%REVIEWED_PYTHON%" -I scripts\ci\prepare_iris_quant_proof_assets.py --backend candle-cuda
      - name: Bind pinned provisioned bounded MLX training inputs
        if: matrix.asset_setup == 'mlx-training' && runner.os == 'macOS'
        shell: bash
        env:
          MLX_GEN_MODELS_ROOT: ${{ vars.MLX_GEN_MODELS_ROOT }}
        run: |
          python3.12 -I scripts/ci/model_inference_proofs.py --plan --backend "$MODEL_PROOF_BACKEND" --request-env MODEL_PROOF_REQUEST --expected-sha "$GITHUB_SHA" > "$RUNNER_TEMP/model-proof-plan.json"
          # Default (unless the request sets "download_missing": false): the hash-pinned huggingface_hub
          # the MLX real-weight lanes use, so a pin no root holds is fetched whole into the runner's hub cache.
          if python3.12 -I -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["request"].get("download_missing", True) is True else 1)' "$RUNNER_TEMP/model-proof-plan.json"; then
            python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
            export MLX_PROOF_HF_HUB_PATH="$RUNNER_TEMP/huggingface-hub"
          fi
          python3.12 -I scripts/ci/prepare_mlx_training_proof_assets.py --plan "$RUNNER_TEMP/model-proof-plan.json"
      - name: Bind pinned installed bespoke bounded training inputs
        if: matrix.asset_setup == 'bespoke-training' && runner.os == 'Windows'
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" -I scripts\ci\model_inference_proofs.py --plan --backend candle-cuda --request-env MODEL_PROOF_REQUEST --expected-sha "%GITHUB_SHA%" > "%RUNNER_TEMP%\model-proof-plan.json"
          if errorlevel 1 exit /b %ERRORLEVEL%
          "%REVIEWED_PYTHON%" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt || exit /b 1
          set "PROOF_HF_HUB_PATH=%RUNNER_TEMP%\huggingface-hub"
          "%REVIEWED_PYTHON%" -I scripts\ci\prepare_bespoke_training_proof_assets.py --plan "%RUNNER_TEMP%\model-proof-plan.json"
      - name: Bind installed native NVFP4 Krea pose inputs
        if: matrix.asset_setup == 'krea-native-nvfp4-pose' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:REVIEWED_PYTHON -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$env:RUNNER_TEMP\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt
          if ($LASTEXITCODE -ne 0) { throw 'huggingface_hub install failed' }
          $env:PROOF_HF_HUB_PATH = Join-Path $env:RUNNER_TEMP 'huggingface-hub'
          # Binds KREA_IMPORTED_DIT, KREA_BASE_SNAPSHOT and KREA_CONTROL_BRANCH, downloading a missing one.
          & $env:REVIEWED_PYTHON -I scripts/ci/prepare_krea_proof_assets.py --setup krea-native-nvfp4-pose
          if ($LASTEXITCODE -ne 0) { throw 'Missing native pose inputs' }
          $pose = Join-Path $env:GITHUB_WORKSPACE 'crates/media/candle-gen/candle-gen-krea/tests/fixtures/native-pose.png'
          if (-not (Test-Path -LiteralPath $pose)) { throw 'Missing native pose input: KREA_IMPORTED_POSE_IMAGE' }
          "KREA_IMPORTED_POSE_IMAGE=$pose" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # These bindings only select installed inputs; source-owned readers record consumed bytes.
      - name: Bind provisioned Raw snapshot for bounded Krea training
        if: matrix.asset_setup == 'krea-training' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:REVIEWED_PYTHON -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$env:RUNNER_TEMP\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt
          if ($LASTEXITCODE -ne 0) { throw 'huggingface_hub install failed' }
          $env:PROOF_HF_HUB_PATH = Join-Path $env:RUNNER_TEMP 'huggingface-hub'
          # Binds KREA_RAW_DIR after verifying (or downloading) the manifest's files, the three transformer
          # shards its index names included. Layout availability only: the source-owned input witnesses
          # record the actual files consumed; this path is not a substitute for those receipts.
          & $env:REVIEWED_PYTHON -I scripts/ci/prepare_krea_proof_assets.py --setup krea-training
          if ($LASTEXITCODE -ne 0) { throw 'Missing Krea Raw training inputs' }
      - name: Bind installed pinned assets for exact bounded cohort CUDA proof
        if: matrix.asset_setup == 'cohort-training' && runner.os == 'Windows'
        shell: cmd
        run: |
          "%REVIEWED_PYTHON%" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt || exit /b 1
          set "PROOF_HF_HUB_PATH=%RUNNER_TEMP%\huggingface-hub"
          "%REVIEWED_PYTHON%" -I scripts\ci\prepare_cohort_training_proof_assets.py
      - name: Stage and bind declared pinned Hub snapshots (Linux/macOS)
        if: matrix.asset_setup == 'hub-snapshots' && runner.os != 'Windows'
        shell: bash
        env:
          MODEL_PROOF_HUB_ROOT: ${{ inputs.backend == 'mlx' && vars.MLX_GEN_MODELS_ROOT || vars.CANDLE_GEN_MODELS_ROOT }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then PYTHON=python3.12; else PYTHON="$REVIEWED_PYTHON"; fi
          "$PYTHON" -I scripts/ci/model_inference_proofs.py --plan --backend "$MODEL_PROOF_BACKEND" --request-env MODEL_PROOF_REQUEST --expected-sha "$GITHUB_SHA" > "$RUNNER_TEMP/model-proof-plan.json"
          "$PYTHON" -I scripts/ci/stage_pinned_hub_snapshots.py --plan "$RUNNER_TEMP/model-proof-plan.json"
      - name: Stage and bind declared pinned Hub snapshots (Windows)
        if: matrix.asset_setup == 'hub-snapshots' && runner.os == 'Windows'
        shell: cmd
        env:
          MODEL_PROOF_HUB_ROOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
        run: |
          "%REVIEWED_PYTHON%" -I scripts\ci\model_inference_proofs.py --plan --backend candle-cuda --request-env MODEL_PROOF_REQUEST --expected-sha "%GITHUB_SHA%" > "%RUNNER_TEMP%\model-proof-plan.json"
          if errorlevel 1 exit /b %ERRORLEVEL%
          "%REVIEWED_PYTHON%" -I scripts\ci\stage_pinned_hub_snapshots.py --plan "%RUNNER_TEMP%\model-proof-plan.json"
      - name: Run exact registered model tests under external guards (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MODEL_PROOF_HUB_ROOT: ${{ vars.MLX_GEN_MODELS_ROOT }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then PYTHON=python3.12; else PYTHON="$REVIEWED_PYTHON"; fi
          "$PYTHON" -I "scripts/ci/$MODEL_PROOF_SCRIPT" \
            --backend "$MODEL_PROOF_BACKEND" --request-env MODEL_PROOF_REQUEST \
            --expected-sha "$GITHUB_SHA" --output "$MODEL_PROOF_EVIDENCE"
      - name: Run exact registered model tests under external guards (Windows CUDA)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MODEL_PROOF_HUB_ROOT: ${{ vars.CANDLE_GEN_MODELS_ROOT }}
          LTX25_PROOF_HUB_ROOT: ${{ vars.CANDLE_LTX25_HF_CACHE_ROOT }}
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %ERRORLEVEL%
          if not defined REVIEWED_PYTHON (
            echo A reviewed absolute Python 3.12 interpreter must be provisioned.
            exit /b 1
          )
          set "RUSTC_WRAPPER="
          set "TEMP=%RUNNER_TEMP%"
          set "TMP=%RUNNER_TEMP%"
          "%REVIEWED_PYTHON%" -I "scripts\ci\%MODEL_PROOF_SCRIPT%" --backend candle-cuda --request-env MODEL_PROOF_REQUEST --expected-sha "%GITHUB_SHA%" --output "%MODEL_PROOF_EVIDENCE%"
      - name: Validate owned evidence tree before any upload
        id: evidence
        if: always()
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then PYTHON=python3.12; elif [[ "$RUNNER_OS" == Windows ]]; then PYTHON="$REVIEWED_PYTHON"; else PYTHON="$REVIEWED_PYTHON"; fi
          "$PYTHON" -I "scripts/ci/$MODEL_PROOF_SCRIPT" --verify-artifacts \
            --backend "$MODEL_PROOF_BACKEND" --request-env MODEL_PROOF_REQUEST \
            --expected-sha "$GITHUB_SHA" --output "$MODEL_PROOF_EVIDENCE"
      - name: Upload exact case evidence, safe generated outputs, logs and summary
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-proof-${{ github.sha }}-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MODEL_PROOF_EVIDENCE }}
          if-no-files-found: error

  inventory:
    name: Manual CPU-only FLUX.1 asset inventory
    needs: plan
    if: ${{ fromJSON(inputs.request).selection == 'flux1-asset-inventory' }}
    runs-on: ${{ matrix.runner }}
    # Staging pinned assets downloads up to ~15 GB before the inventory runs.
    timeout-minutes: ${{ inputs.stage_pinned_assets && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Always non-empty: an empty variable is undefined in cmd, where %STAGE_FLAG% would stay literal.
      STAGE_FLAG: ${{ inputs.stage_pinned_assets && '--stage-pinned-assets' || '--no-stage-pinned-assets' }}
      FLUX1_HUB: ${{ inputs.backend == 'mlx' && vars.MLX_GEN_MODELS_ROOT || vars.CANDLE_GEN_MODELS_ROOT }}
      INVENTORY_RUNNER: ${{ fromJSON(inputs.request).runner }}
      MODEL_PROOF_REQUEST: ${{ inputs.request }}
      FLUX1_PAIR_TIER: ${{ inputs.flux1_pair }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Require exact selected Windows runner before scanning
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not "%RUNNER_NAME%"=="%INVENTORY_RUNNER%" (
            echo ::error::Selected runner differs from actual runner
            exit /b 1
          )
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require existing reviewed CPython 3.12 on Windows (no provisioning)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\ci\real-weights\moss-edit-cuda\locate-existing-reviewed-python-without-installation.cmd
      - name: Inventory installed assets on macOS (no model load)
        if: runner.os == 'macOS'
        shell: bash
        env:
          INVENTORY_OUTPUT: ${{ runner.temp }}/flux1-conditional-asset-inventory.json
        run: python3.12 -u -I scripts/ci/flux1_conditional_asset_inventory.py "$STAGE_FLAG" --backend mlx --request-env MODEL_PROOF_REQUEST --expected-sha "$GITHUB_SHA" --output "$INVENTORY_OUTPUT"
      - name: Inventory installed assets on Windows (no model load)
        id: windows_inventory
        if: runner.os == 'Windows'
        shell: cmd
        env:
          INVENTORY_OUTPUT: ${{ runner.temp }}/flux1-conditional-asset-inventory.json
        run: '"%REVIEWED_PYTHON%" -u -I scripts\ci\flux1_conditional_asset_inventory.py %STAGE_FLAG% --backend candle-cuda --request-env MODEL_PROOF_REQUEST --expected-sha "%GITHUB_SHA%" --output "%INVENTORY_OUTPUT%"'
      - name: Upload candidate paths and hashes only
        if: success() || (failure() && steps.windows_inventory.outcome == 'failure' && fromJSON(inputs.request).cases != null)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flux1-conditional-asset-inventory-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flux1-conditional-asset-inventory.json
          if-no-files-found: error
