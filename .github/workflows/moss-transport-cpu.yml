name: MOSS transport CPU self-test
on:
  push:
    branches: ['**']
    paths:
      - .github/workflows/moss-transport-cpu.yml
      - scripts/ci/moss-native-terminal.ps1
  pull_request:
    paths:
      - .github/workflows/moss-transport-cpu.yml
      - scripts/ci/moss-native-terminal.ps1
permissions:
  contents: read
concurrency:
  group: moss-transport-cpu-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  moss-transport-selftest:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Windows PowerShell and already-installed Cargo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($PSVersionTable.PSEdition -cne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          Get-Command rustup,cargo -CommandType Application -ErrorAction Stop|Select-Object Name,Source
          # Read installed state before invoking a rustup proxy inside the checkout.
          # Explicitly use the already-installed default, avoiding rust-toolchain.toml.
          $defaults=@(& rustup default)
          if ($LASTEXITCODE -ne 0 -or $defaults.Count -ne 1) { throw 'Installed default toolchain required' }
          $toolchain=($defaults[0] -split '\s+')[0]
          $installed=@(& rustup toolchain list)
          if ($LASTEXITCODE -ne 0 -or @($installed|Where-Object { ($_ -split '\s+')[0] -ceq $toolchain }).Count -ne 1) { throw 'Default toolchain is not installed; refusing installation' }
          $env:RUSTUP_TOOLCHAIN=$toolchain
          & cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Cargo unavailable' }
          'RUSTUP_TOOLCHAIN='+$toolchain|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          $evidence=Join-Path $env:RUNNER_TEMP ('moss-transport-cpu-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $evidence|Out-Null
          'MOSS_CPU_EVIDENCE='+$evidence|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          @{source=(git rev-parse HEAD);controller_sha256=(Get-FileHash scripts/ci/moss-native-terminal.ps1 -Algorithm SHA256).Hash.ToLowerInvariant();powershell=$PSVersionTable.PSVersion.ToString();cargo=(& cargo --version)}|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $evidence 'source.json') -Encoding UTF8
      - name: Capture immediate-child handle and exit state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $temp=Join-Path $env:MOSS_CPU_EVIDENCE 'preflight'
          New-Item -ItemType Directory -Path $temp|Out-Null
          try {
            foreach ($code in @(0,7)) {
              $p=$null
              try {
                $p=Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c',('exit '+$code)) -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $temp ($code+'.stdout')) -RedirectStandardError (Join-Path $temp ($code+'.stderr'))
                $row=[ordered]@{requested_exit=$code;pid=$p.Id;handle_before_wait=$null;handle_error=$null;waited=$false;has_exited=$null;exit_property=$null;exit_getter=$null;exit_getter_error=$null}
                try { $row.handle_before_wait=$p.Handle } catch { $row.handle_error=$_.Exception.Message }
                $row.waited=$p.WaitForExit(5000)
                $row.has_exited=$p.HasExited
                if ($row.waited) {
                  $row.exit_property=$p.ExitCode
                  try { $row.exit_getter=$p.get_ExitCode() } catch { $row.exit_getter_error=$_.Exception.Message }
                }
                $json=$row|ConvertTo-Json -Compress
                $json|Write-Output
                $json|Set-Content -LiteralPath (Join-Path $temp ($code+'.json')) -Encoding UTF8
                if (-not $row.waited) { throw 'Immediate child did not exit within five seconds' }
                # Diagnostic observations cannot turn missing status into success;
                # actual success/failure assertions remain in the full self-test below.
              } finally {
                if ($null -ne $p) {
                  try {
                    if (-not $p.HasExited) { $p.Kill();if (-not $p.WaitForExit(5000)) { throw 'Preflight owned child cleanup timed out' } }
                  } finally { $p.Dispose() }
                }
              }
            }
          } finally { Write-Output ('Preflight evidence: '+$temp) }
      - name: Run complete existing CPU-only native transport self-test
        shell: powershell
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          # A separate 5.1 host keeps the helper's exit statement local and preserves
          # expected negative-test stderr without making it a parent terminating error.
          $log=Join-Path $env:MOSS_CPU_EVIDENCE 'selftest.log'
          $ErrorActionPreference='Continue'
          & (Join-Path $PSHOME 'powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/ci/moss-native-terminal.ps1 -SelfTest *> $log
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          Get-Content -LiteralPath $log
          if ($null -eq $code -or $code -ne 0) { throw "Native CPU self-test failed: exit=$code" }
      - name: Preserve CPU reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moss-transport-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/moss-transport-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 3
